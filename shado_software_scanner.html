<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SHADO Software Scanner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#1c1a17;
    --paper:#f6f3ec;
    --paper-dim:#ece7da;
    --line:#d8d0bd;
    --accent:#b5502f;
    --accent-dark:#8a3a21;
    --ok:#3f6b4a;
    --mono: 'SF Mono', 'Consolas', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Georgia', 'Iowan Old Style', serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  header{
    padding:14px 16px;
    border-bottom:2px solid var(--ink);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand .logo{
    width:36px;
    height:36px;
    border-radius:50%;
    flex-shrink:0;
    display:block;
  }
  header h1{
    font-size:18px;
    margin:0;
    letter-spacing:0.3px;
    font-weight:700;
    line-height:1.1;
  }
  header .tag{
    font-family:var(--mono);
    font-size:10.5px;
    color:#7a7468;
    text-transform:uppercase;
    letter-spacing:1px;
  }
  main{
    max-width:900px;
    margin:0 auto;
    padding:16px;
  }
  .capture-row{
    display:flex;
    gap:10px;
    margin-bottom:14px;
  }
  .btn{
    font-family:var(--mono);
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.6px;
    border:2px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    padding:13px 16px;
    border-radius:3px;
    cursor:pointer;
    flex:1;
    text-align:center;
    transition:transform 0.08s ease, opacity 0.15s ease;
  }
  .btn:active{ transform:scale(0.98); }
  .btn.secondary{
    background:transparent;
    color:var(--ink);
  }
  .btn.accent{
    background:var(--accent);
    border-color:var(--accent-dark);
    color:#fff;
  }
  .btn:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }
  input[type=file]{ display:none; }

  #status{
    font-family:var(--mono);
    font-size:12px;
    color:var(--accent-dark);
    min-height:18px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .spinner{
    width:11px;height:11px;
    border:2px solid var(--line);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin 0.7s linear infinite;
    display:none;
  }
  .spinner.show{ display:inline-block; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .table-wrap{
    border:2px solid var(--ink);
    border-radius:3px;
    overflow-x:auto;
    background:#fff;
    margin-bottom:16px;
  }
  table{
    border-collapse:collapse;
    width:100%;
    font-size:13px;
    min-width:600px;
  }
  thead th{
    background:var(--ink);
    color:var(--paper);
    font-family:var(--mono);
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    padding:9px 10px;
    text-align:left;
    white-space:nowrap;
    position:sticky;
    top:0;
  }
  tbody td{
    padding:8px 10px;
    border-bottom:1px solid var(--line);
    vertical-align:top;
  }
  tbody tr:hover{ background:var(--paper-dim); }
  tbody td[contenteditable="true"]{
    cursor:text;
    min-width:70px;
  }
  tbody td[contenteditable="true"]:focus{
    outline:2px solid var(--accent);
    outline-offset:-2px;
    background:#fff8ef;
  }
  .thumb-cell{ width:46px; }
  .thumb-cell img{
    width:38px; height:38px;
    object-fit:cover;
    border-radius:3px;
    border:1px solid var(--line);
    display:block;
  }
  .del-btn{
    font-family:var(--mono);
    font-size:11px;
    color:#a33;
    border:1px solid #a33;
    background:none;
    border-radius:3px;
    padding:3px 7px;
    cursor:pointer;
  }
  .empty-row td{
    padding:30px 10px;
    text-align:center;
    color:#9a948640;
    font-family:var(--mono);
    font-size:12px;
    color:#9a9486;
  }
  .footer-actions{
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
  }
  .count{
    font-family:var(--mono);
    font-size:11.5px;
    color:#7a7468;
    margin-left:auto;
  }
  .field-note{
    font-family:var(--mono);
    font-size:10.5px;
    color:#9a9486;
    margin:-6px 0 14px;
    line-height:1.5;
  }
</style>
</head>

    <h1>Escáner de Documentos</h1>
  </div>
  <span class="tag">SHADO · Local</span>
</header>

<main>
  <div class="capture-row">
    <button class="btn accent" id="btnCapture">📷 Escanear documento</button>
  </div>
  <input type="file" id="fileInput" accept="image/*" capture="environment" multiple>

  <div id="status"><span class="spinner" id="spinner"></span><span id="statusText"></span></div>

  <p class="field-note">Cada documento se lee con IA y los campos detectados se agregan como columnas. Toca cualquier celda para corregirla antes de exportar.</p>

  <div class="table-wrap">
    <table id="dataTable">
      <thead id="tableHead"><tr><th style="width:46px"></th><th>No.</th></tr></thead>
      <tbody id="tableBody">
        <tr class="empty-row" id="emptyRow"><td colspan="2">Aún no hay documentos escaneados. Toca "Escanear documento" para empezar.</td></tr>
      </tbody>
    </table>
  </div>

  <div class="footer-actions">
    <button class="btn secondary" id="btnExport" disabled>⬇ Exportar a Excel</button>
    <button class="btn secondary" id="btnClear" disabled>🗑 Limpiar todo</button>
    <span class="count" id="countLabel"></span>
  </div>
</main>

<script>
const fileInput = document.getElementById('fileInput');
const btnCapture = document.getElementById('btnCapture');
const btnExport = document.getElementById('btnExport');
const btnClear = document.getElementById('btnClear');
const statusText = document.getElementById('statusText');
const spinner = document.getElementById('spinner');
const tableHead = document.getElementById('tableHead');
const tableBody = document.getElementById('tableBody');
const emptyRow = document.getElementById('emptyRow');
const countLabel = document.getElementById('countLabel');

// Cada documento: { id, thumb (dataURL), fields: {nombreCampo: valor, ...} }
let documentos = [];
let columnas = []; // orden de columnas detectadas dinámicamente (además de thumb/no.)
let idCounter = 1;

btnCapture.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  fileInput.value = ''; // reset para permitir re-captura
  if (!files.length) return;

  for (const file of files) {
    await procesarDocumento(file);
  }
});

function setStatus(msg, loading) {
  statusText.textContent = msg || '';
  spinner.classList.toggle('show', !!loading);
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function procesarDocumento(file) {
  setStatus('Leyendo documento con IA...', true);
  btnCapture.disabled = true;

  try {
    const [base64, thumb] = await Promise.all([fileToBase64(file), fileToDataURL(file)]);
    const mediaType = file.type || 'image/jpeg';

    const prompt = `Eres un asistente de extracción de datos de documentos (facturas, recibos, cheques, cartas, cualquier tipo). Analiza la imagen y extrae TODOS los campos relevantes que veas, con sus valores. Usa nombres de campo cortos y claros en español (ej: "fecha", "monto", "proveedor", "rnc", "concepto", "numero_factura", "remitente", "destinatario", etc.) — el nombre exacto depende de lo que el documento realmente contenga, tú decides según lo que veas.

También incluye siempre un campo "tipo_documento" describiendo qué tipo de documento es (ej: "Factura", "Recibo", "Cheque", "Carta", "Otro").

Responde ÚNICAMENTE con un objeto JSON plano (sin markdown, sin texto adicional, sin backticks) donde cada clave es el nombre del campo (snake_case, minúsculas) y cada valor es el texto/número extraído como string. Si un campo no aplica o no se puede leer, omítelo. Ejemplo de formato de respuesta (no copies estos valores, son solo ejemplo de forma):
{"tipo_documento": "Factura", "fecha": "12/05/2026", "monto": "1500.00", "proveedor": "Ferreteria XYZ"}`;

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{
          role: "user",
          content: [
            { type: "image", source: { type: "base64", media_type: mediaType, data: base64 } },
            { type: "text", text: prompt }
          ]
        }]
      })
    });

    if (!response.ok) throw new Error('Error de red al contactar la IA (' + response.status + ')');
    const data = await response.json();
    const textBlock = (data.content || []).find(b => b.type === 'text');
    if (!textBlock) throw new Error('La IA no devolvió texto.');

    let clean = textBlock.text.trim().replace(/^```json\s*/i, '').replace(/^```\s*/, '').replace(/```\s*$/, '');
    let fields;
    try {
      fields = JSON.parse(clean);
    } catch (parseErr) {
      throw new Error('No se pudo interpretar la respuesta de la IA.');
    }

    agregarDocumento(thumb, fields);
    setStatus('Documento agregado ✓', false);
    setTimeout(() => setStatus('', false), 2000);

  } catch (err) {
    console.error(err);
    setStatus('⚠ ' + (err.message || 'Error al procesar el documento'), false);
  } finally {
    btnCapture.disabled = false;
  }
}

function agregarDocumento(thumb, fields) {
  // Asegura que tipo_documento vaya primero si existe
  const orderedKeys = Object.keys(fields);
  if (orderedKeys.includes('tipo_documento')) {
    orderedKeys.splice(orderedKeys.indexOf('tipo_documento'), 1);
    orderedKeys.unshift('tipo_documento');
  }

  // Agregar nuevas columnas detectadas al final del set de columnas existente
  orderedKeys.forEach(key => {
    if (!columnas.includes(key)) columnas.push(key);
  });

  documentos.push({ id: idCounter++, thumb, fields });
  renderTabla();
}

function eliminarDocumento(id) {
  documentos = documentos.filter(d => d.id !== id);
  renderTabla();
}

function renderTabla() {
  // Header
  let headHtml = '<tr><th style="width:46px"></th><th>No.</th>';
  columnas.forEach(col => {
    headHtml += `<th>${escapeHtml(col.replace(/_/g, ' '))}</th>`;
  });
  headHtml += '<th style="width:50px"></th></tr>';
  tableHead.innerHTML = headHtml;

  if (documentos.length === 0) {
    tableBody.innerHTML = `<tr class="empty-row"><td colspan="${columnas.length + 3}">Aún no hay documentos escaneados. Toca "Escanear documento" para empezar.</td></tr>`;
  } else {
    let bodyHtml = '';
    documentos.forEach((doc, idx) => {
      bodyHtml += `<tr data-id="${doc.id}">`;
      bodyHtml += `<td class="thumb-cell"><img src="${doc.thumb}" alt="doc"></td>`;
      bodyHtml += `<td>${idx + 1}</td>`;
      columnas.forEach(col => {
        const val = doc.fields[col] !== undefined ? doc.fields[col] : '';
        bodyHtml += `<td contenteditable="true" data-id="${doc.id}" data-col="${escapeHtml(col)}">${escapeHtml(val)}</td>`;
      });
      bodyHtml += `<td><button class="del-btn" data-id="${doc.id}">✕</button></td>`;
      bodyHtml += '</tr>';
    });
    tableBody.innerHTML = bodyHtml;
  }

  // Listeners de edición
  tableBody.querySelectorAll('td[contenteditable="true"]').forEach(td => {
    td.addEventListener('blur', (e) => {
      const id = parseInt(e.target.dataset.id);
      const col = e.target.dataset.col;
      const doc = documentos.find(d => d.id === id);
      if (doc) doc.fields[col] = e.target.textContent;
    });
  });

  tableBody.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      eliminarDocumento(parseInt(e.target.dataset.id));
    });
  });

  const hayDocs = documentos.length > 0;
  btnExport.disabled = !hayDocs;
  btnClear.disabled = !hayDocs;
  countLabel.textContent = hayDocs ? `${documentos.length} documento${documentos.length === 1 ? '' : 's'}` : '';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

btnClear.addEventListener('click', () => {
  if (!confirm('¿Borrar todos los documentos escaneados? Esta acción no se puede deshacer.')) return;
  documentos = [];
  columnas = [];
  renderTabla();
  setStatus('', false);
});

btnExport.addEventListener('click', () => {
  const headers = ['No.', ...columnas.map(c => c.replace(/_/g, ' '))];
  const rows = documentos.map((doc, idx) => {
    const row = [idx + 1];
    columnas.forEach(col => row.push(doc.fields[col] || ''));
    return row;
  });

  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  // Ancho de columnas aproximado
  ws['!cols'] = headers.map(h => ({ wch: Math.max(12, h.length + 4) }));

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Documentos');

  const fecha = new Date().toISOString().slice(0, 10);
  XLSX.writeFile(wb, `documentos_escaneados_${fecha}.xlsx`);
});

renderTabla();
</script>

</body>
</html>
