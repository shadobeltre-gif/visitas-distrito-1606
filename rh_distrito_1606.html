<script>
/* ====================== CONFIG SUPABASE ====================== */
const SUPABASE_URL = 'https://ejkvehnzjkxbymuvejoh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVqa3ZlaG56amt4YnltdXZlam9oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNjc4MDIsImV4cCI6MjA5NTk0MzgwMn0.FI0Z_Mx1FQ4hpA6JYkYJ4X9CoVDHgK_bDq_qiak3WOU';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Supabase limita cada consulta a un máximo de filas configurado en el servidor
// (normalmente 1000), sin importar el .range() que se pida. Esta función trae
// TODAS las filas de una tabla paginando en bloques, para tablas que puedan
// superar ese límite (ej. personal_rh con miles de empleados).
async function fetchTodasLasFilas(nombreTabla, columnas, construirQuery){
  let todas = [];
  let desde = 0;
  const tam = 1000;
  while(true){
    let q = sb.from(nombreTabla).select(columnas).range(desde, desde+tam-1);
    if(construirQuery) q = construirQuery(q);
    const { data, error } = await q;
    if(error) throw error;
    if(!data || !data.length) break;
    todas = todas.concat(data);
    if(data.length < tam) break;
    desde += tam;
  }
  return todas;
}

let sesion = { tipo:null, usuario:null }; // tipo: 'admin' | 'tecnico'
// Usuario administrativo autorizado a ver el botón "Compartir sistema" (en minúsculas).
const USUARIO_CREADOR = 'admin';

/* ====================== TOAST ====================== */
function toast(msg, tipo=''){
  const cont = document.getElementById('toast-cont');
  const el = document.createElement('div');
  el.className = 'toast ' + tipo;
  el.textContent = msg;
  cont.appendChild(el);
  setTimeout(()=>el.remove(), 4000);
}

/* ====================== LOGIN ====================== */
function cambiarTabLogin(tipo){
  document.getElementById('tab-admin').classList.toggle('activo', tipo==='admin');
  document.getElementById('tab-tecnico').classList.toggle('activo', tipo==='tecnico');
  document.getElementById('form-admin').style.display = tipo==='admin' ? 'block' : 'none';
  document.getElementById('form-tecnico').style.display = tipo==='tecnico' ? 'block' : 'none';
  document.getElementById('error-login').style.display = 'none';
}

async function iniciarSesion(){
  const esAdmin = document.getElementById('tab-admin').classList.contains('activo');
  const errEl = document.getElementById('error-login');
  errEl.style.display = 'none';
  const btn = document.getElementById('btn-login');
  btn.disabled = true;
  const textoOriginal = btn.textContent;
  btn.innerHTML = '<span class="spinner"></span> Verificando...';

  try{
    if(esAdmin){
      const usuario = document.getElementById('admin-usuario').value.trim().toLowerCase();
      const clave = document.getElementById('admin-clave').value;
      if(!usuario || !clave){ throw new Error('Completa usuario y contraseña.'); }

      const { data, error } = await sb.from('usuarios_fin')
        .select('*');

      if(error) throw error;
      const encontrado = (data||[]).find(u => (u.usuario||'').toLowerCase() === usuario && u.pass === clave);
      if(!encontrado) throw new Error('Usuario o contraseña incorrectos.');

      sesion = { tipo:'admin', usuario:encontrado };
    } else {
      const cedula = document.getElementById('tecnico-cedula').value.trim();
      if(!cedula){ throw new Error('Ingresa tu número de cédula.'); }

      const { data, error } = await sb.from('personal_rh')
        .select('*, centros_rh(nombre_centro)')
        .eq('cedula', cedula)
        .maybeSingle();

      if(error) throw error;
      if(!data) throw new Error('No se encontró personal con esa cédula.');

      sesion = { tipo:'tecnico', usuario:data };
    }

    document.getElementById('pantalla-login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    construirMenu();
    irAVista('panel');

  }catch(err){
    errEl.textContent = err.message || 'Error al iniciar sesión.';
    errEl.style.display = 'block';
  }finally{
    btn.disabled = false;
    btn.textContent = textoOriginal;
  }
}

function cerrarSesion(){
  sesion = { tipo:null, usuario:null };
  document.getElementById('app').style.display = 'none';
  document.getElementById('pantalla-login').style.display = 'flex';
  document.getElementById('admin-clave').value = '';
}

/* ====================== COMPARTIR SISTEMA (solo usuario creador) ====================== */
function abrirModalCompartir(){
  document.getElementById('compartir-link').value = window.location.href;
  abrirModal('modal-compartir');
}

function compartirPor(medio){
  const url = window.location.href;
  const mensaje = 'Sistema de Recursos Humanos — Distrito Educativo 16-06, Bonao Nordeste';

async function irAVista(id){

/* ---- Exportación genérica reutilizable en todos los módulos ----
   columnas: [{ key:'campo', label:'Encabezado', get:(fila)=>valor (opcional) }]
   filas: array de objetos (ya filtrados, lo que se ve en pantalla) */
function obtenerValorColumna(fila, col){
  if(col.get) return col.get(fila);
  return fila[col.key];
}

function exportarDatosCSV(filas, columnas, nombreArchivo){
  if(!filas || !filas.length){ toast('No hay datos para exportar.','error'); return; }
  const encabezado = columnas.map(c=>c.label);
  const lineas = filas.map(f=>columnas.map(c=>{
    const v = obtenerValorColumna(f, c);
    return `"${String(v??'').replace(/"/g,'""')}"`;
  }).join(','));
  const csv = [encabezado.join(','), ...lineas].join('\n');
  const blob = new Blob(['\uFEFF'+csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${nombreArchivo}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function exportarDatosExcel(filas, columnas, nombreArchivo){
  if(!filas || !filas.length){ toast('No hay datos para exportar.','error'); return; }
  if(typeof XLSX === 'undefined'){ toast('No se pudo cargar el generador de Excel.','error'); return; }
  const datos = filas.map(f=>{
    const obj = {};
    columnas.forEach(c=>{ obj[c.label] = obtenerValorColumna(f, c) ?? ''; });
    return obj;
  });
  const ws = XLSX.utils.json_to_sheet(datos);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Datos');
  XLSX.writeFile(wb, `${nombreArchivo}.xlsx`);
}

function exportarDatosPDF(filas, columnas, nombreArchivo, titulo){
  if(!filas || !filas.length){ toast('No hay datos para exportar.','error'); return; }
  const filasHtml = filas.map(f=>`<tr>${columnas.map(c=>`<td>${escapeHtml(obtenerValorColumna(f,c)??'—')}</td>`).join('')}</tr>`).join('');
  const w = window.open('', '_blank');
  w.document.write(`<html><head><meta charset="UTF-8"><title>${escapeHtml(titulo||nombreArchivo)}</title>
    <style>
      body{font-family:Arial,sans-serif;font-size:11px;padding:24px;}
      h2{font-size:14px;margin-bottom:14px;}
      table{width:100%;border-collapse:collapse;}
      th,td{border:1px solid #999;padding:4px 7px;text-align:left;}
      th{background:#eef2f7;}
    </style></head><body>
    <h2>${escapeHtml(titulo||nombreArchivo)}</h2>
    <table><thead><tr>${columnas.map(c=>`<th>${escapeHtml(c.label)}</th>`).join('')}</tr></thead>
    <tbody>${filasHtml}</tbody></table>
    </body></html>`);
  w.document.close();
  setTimeout(()=>w.print(), 400);
}

/* ---- Importación genérica con UPSERT (reutilizable en módulos con tabla simple) ----
   Lee el archivo, detecta columnas por patrones regex, y hace upsert por una
   clave única (ej. cédula, código). Reutiliza leerArchivoNomina ya existente. */
async function importarConUpsert({ archivo, tabla, patrones, claveUnica, transformarFila }){
  const filas = await leerArchivoNomina(archivo);
  if(!filas.length) throw new Error('El archivo no contiene filas de datos.');
  const headers = filas[0];

  const norm = h => h.toString().toLowerCase().trim()
    .replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u');
  const mapa = {};
  headers.forEach((h,i)=>{
    const n = norm(h);
    for(const [campo, regex] of Object.entries(patrones)){
      if(regex.test(n) && mapa[campo]===undefined) mapa[campo] = i;
    }
  });
  if(mapa[claveUnica] === undefined) throw new Error(`No se pudo detectar la columna "${claveUnica}" en el archivo.`);

  const registros = filas.slice(1)
    .filter(f=>f[mapa[claveUnica]] && String(f[mapa[claveUnica]]).trim())
    .map(f=>{
      const base = {};
      Object.keys(mapa).forEach(campo=>{ base[campo] = String(f[mapa[campo]]??'').trim() || null; });
      return transformarFila ? transformarFila(base, f) : base;
    });

  if(!registros.length) throw new Error('No se encontraron filas válidas.');

  const { data: existentes } = await sb.from(tabla).select(`id,${claveUnica}`);
  const mapaExistente = {};
  (existentes||[]).forEach(e=>{ if(e[claveUnica]) mapaExistente[e[claveUnica]] = e.id; });

  let creados = 0, actualizados = 0;
  for(const r of registros){
    const clave = r[claveUnica];
    if(clave && mapaExistente[clave]){
      const { error } = await sb.from(tabla).update(r).eq('id', mapaExistente[clave]);
      if(error) throw error;
      actualizados++;
    } else {
      const { data: nuevo, error } = await sb.from(tabla).insert(r).select(`id,${claveUnica}`).single();
      if(error) throw error;
      if(nuevo[claveUnica]) mapaExistente[nuevo[claveUnica]] = nuevo.id;
      creados++;
    }
  }
  return { total: registros.length, creados, actualizados };
}

function escapeHtml(str){
  if(str===null||str===undefined) return '';
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

}

// ====================== AUTOCOMPLETAR GENÉRICO ======================
// Convierte un <input> de texto en un buscador con sugerencias, mientras
// mantiene un <input type="hidden"> paralelo con el id real seleccionado
// (mismo id+'-id' que ya usaba el .value de los <select> anteriores), así
// el resto del código que lee getElementById('xxx').value sigue funcionando
// sin cambios, siempre que se actualicen esas lecturas a 'xxx-id' (ver abajo).
window._autocompleteData = window._autocompleteData || {};

function inicializarAutocompletar(inputId, datos, formatoTexto, formatoSubtexto, valorInicial){
  window._autocompleteData[inputId] = datos;
  const input = document.getElementById(inputId);
  const hidden = document.getElementById(inputId+'-id');
  const lista = document.getElementById(inputId+'-lista');
  if(!input || !hidden || !lista) return;

  function render(filtro){
    const f = (filtro||'').toLowerCase().trim();
    const items = !f ? datos.slice(0,30) : datos.filter(d=>{
      const texto = (formatoTexto(d)+' '+(formatoSubtexto?formatoSubtexto(d):'')).toLowerCase();
      return texto.includes(f);
    }).slice(0,30);
    if(!items.length){
      lista.innerHTML = `<div class="autocomplete-vacio">Sin resultados</div>`;
    } else {
      lista.innerHTML = items.map(d=>`
        <div class="autocomplete-item" data-id="${d.id}">
          <strong>${escapeHtml(formatoTexto(d))}</strong>
          ${formatoSubtexto ? `<span class="autocomplete-sub">${escapeHtml(formatoSubtexto(d))}</span>` : ''}
        </div>
      `).join('');
    }
    lista.style.display = 'block';
  }

  input.oninput = ()=>{ hidden.value=''; render(input.value); };
  input.onfocus = ()=>render(input.value);
  input.onblur = ()=>setTimeout(()=>{ lista.style.display='none'; }, 150);
  lista.onmousedown = lista.ontouchstart = (e)=>{
    const item = e.target.closest('.autocomplete-item');
    if(!item) return;
    const id = item.dataset.id;
    const d = datos.find(x=>String(x.id)===String(id));
    if(d){
      hidden.value = d.id;
      input.value = formatoTexto(d);
      lista.style.display = 'none';
      input.dispatchEvent(new Event('autocomplete-change'));
    }
  };

  if(valorInicial){
    const d = datos.find(x=>String(x.id)===String(valorInicial));
    if(d){ hidden.value = d.id; input.value = formatoTexto(d); }
  } else {
    hidden.value = ''; input.value = '';
  }
}

// Genera el HTML de un campo autocompletar (input + hidden + lista), para
// usar en cualquier plantilla en lugar de un <select>.
function htmlAutocompletar(inputId, placeholder){
  return `
    <div class="autocomplete-wrap">
      <input type="text" id="${inputId}" class="autocomplete-input" placeholder="${escapeHtml(placeholder)}" autocomplete="off">
      <input type="hidden" id="${inputId}-id">
      <div class="autocomplete-lista" id="${inputId}-lista"></div>
    </div>
  `;
}

// Mantiene referencias a las instancias de Chart.js para destruirlas antes de
// volver a dibujar (evita fugas de memoria al re-entrar al panel general).
window._chartsPanel = window._chartsPanel || {};

function renderGraficosPanel({ labelsPersonal, valoresPersonal, labelsAP, valoresAP, movNuevos, movReingresos, movCancelados }){
  if(typeof Chart === 'undefined') return;

  Object.values(window._chartsPanel).forEach(c=>{ if(c) c.destroy(); });
  window._chartsPanel = {};

  const coloresEstatus = {
    Activo:'#1f7a4d', Inactivo:'#6b7280', Sustituido:'#a8730a', Renunciado:'#b3242c', Fallecido:'#3d4450', Cancelado:'#7c2d12',
  };
  const ctxPersonal = document.getElementById('chart-personal-estatus');
  if(ctxPersonal && labelsPersonal.length){
    window._chartsPanel.personal = new Chart(ctxPersonal, {
      type: 'pie',
      data: {
        labels: labelsPersonal,
        datasets: [{ data: valoresPersonal, backgroundColor: labelsPersonal.map(l=>coloresEstatus[l]||'#94a3b8') }],
      },
      options: {
        responsive: true,
        plugins: { legend: { position: 'bottom', labels: { font: { size: 11 } } } },
      },
    });
  }

  const ctxAP = document.getElementById('chart-ap-estado');
  if(ctxAP && labelsAP.length){
    window._chartsPanel.ap = new Chart(ctxAP, {
      type: 'bar',
      data: {
        labels: labelsAP,
        datasets: [{ label: 'Solicitudes AP', data: valoresAP, backgroundColor: '#1d4f93', borderRadius: 4 }],
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true, ticks: { precision: 0 } }, x: { ticks: { font: { size: 10 } } } },
      },
    });
  }

  const ctxMov = document.getElementById('chart-movimientos-nomina');
  if(ctxMov && (movNuevos+movReingresos+movCancelados) > 0){
    window._chartsPanel.movimientos = new Chart(ctxMov, {
      type: 'doughnut',
      data: {
        labels: ['Nuevos','Reingresos','Cancelados'],
        datasets: [{ data: [movNuevos, movReingresos, movCancelados], backgroundColor: ['#1f7a4d','#1d4f93','#b3242c'] }],
      },
      options: {
        responsive: true,
        plugins: { legend: { position: 'bottom', labels: { font: { size: 11 } } } },
      },
    });
  }
}

async function eliminarSeleccionCentros(){
  const ids = [...document.querySelectorAll('.chk-centros:checked')].map(c=>c.value);
  if(!ids.length){ toast('Selecciona al menos un registro.','error'); return; }
  if(!confirm(`¿Eliminar ${ids.length} centro(s) seleccionado(s)? Si hay personal o solicitudes vinculadas a estos centros, podría fallar o dejarlas sin centro asignado.`)) return;
  const { error } = await sb.from('centros_rh').delete().in('id', ids);
  if(error){ toast(error.message,'error'); return; }
  toast('Registros eliminados.','exito');
  renderCentros();
}

// Detecta encabezados típicos de un Excel de centros educativos, tolerando
// variaciones de nombre de columna (mismo patrón usado en Nóminas).
function detectarColumnasCentros(headers){
  const norm = h => h.toString().toLowerCase().trim()
    .replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u');
  const mapa = {};
  headers.forEach((h,i)=>{
    const n = norm(h);
    if(/sigerd|codigo/.test(n)) mapa.sigerd = i;
    else if(/matricula/.test(n)) mapa.matricula = i;
    else if(/nivel/.test(n)) mapa.nivel = i;
    else if(/tanda|jornada/.test(n)) mapa.tanda = i;
    else if(/dependencia/.test(n)) mapa.dependencia = i;
    else if(/director.*sexo|sexo.*director/.test(n)) mapa.directorSexo = i;
    else if(/director/.test(n)) mapa.director = i;
    else if(/centro|nombre/.test(n)) mapa.nombre = i;
  });
  return mapa;
}

async function procesarImportacionCentros(){
  const archivo = document.getElementById('centros-archivo').files[0];
  if(!archivo){ toast('Selecciona el archivo de centros.','error'); return; }

  const btn = document.getElementById('btn-importar-centros');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Procesando…';

  try{
    const filas = await leerArchivoNomina(archivo); // reutiliza el lector genérico CSV/Excel/PDF
    if(!filas.length) throw new Error('El archivo no contiene filas de datos.');

    // Detecta automáticamente la fila de encabezados reales (por si el archivo trae
    // un título y/o filas en blanco antes de los nombres de columna)
    const normCentros = h => h.toString().toLowerCase().trim()
      .replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u');
    const patronesEncabezadoCentros = [/sigerd|codigo/, /matricula/, /nivel/, /tanda|jornada/, /dependencia/,
      /director/, /centro|nombre/, /telefono/, /zona/];
    let headerRowIdxCentros = 0, mejorCoincidenciasCentros = -1;
    for(let i=0; i<Math.min(filas.length,10); i++){
      const coincidencias = filas[i].filter(c=>{ const n=normCentros(c); return n && patronesEncabezadoCentros.some(p=>p.test(n)); }).length;
      if(coincidencias > mejorCoincidenciasCentros){ mejorCoincidenciasCentros = coincidencias; headerRowIdxCentros = i; }
    }
    const headers = filas[headerRowIdxCentros];
    const mapa = detectarColumnasCentros(headers);
    if(mapa.nombre === undefined) throw new Error('No se pudo detectar la columna con el nombre del centro.');

    const registros = filas.slice(headerRowIdxCentros+1)
      .filter(f=>f[mapa.nombre] && String(f[mapa.nombre]).trim())
      .map(f=>({
        nombre_centro: String(f[mapa.nombre]).trim(),
        codigo_sigerd: mapa.sigerd!==undefined ? (String(f[mapa.sigerd]||'').trim() || null) : null,
        matricula: mapa.matricula!==undefined ? (parseInt(f[mapa.matricula])||null) : null,
        nivel: mapa.nivel!==undefined ? (String(f[mapa.nivel]||'').trim() || null) : null,
        tanda: mapa.tanda!==undefined ? (String(f[mapa.tanda]||'').trim() || null) : null,
        numero_dependencia_nomina: mapa.dependencia!==undefined ? (String(f[mapa.dependencia]||'').trim() || null) : null,
        director_nombre: mapa.director!==undefined ? (String(f[mapa.director]||'').trim() || null) : null,
        director_sexo: mapa.directorSexo!==undefined ? (String(f[mapa.directorSexo]||'').trim().toUpperCase().startsWith('F') ? 'F' : (String(f[mapa.directorSexo]||'').trim() ? 'M' : null)) : null,
      }));

    if(!registros.length) throw new Error('No se encontraron filas válidas con nombre de centro.');

    // UPSERT por código SIGERD: si existe, actualiza; si no, crea nuevo.
    const { data: existentes } = await sb.from('centros_rh').select('id,codigo_sigerd');
    const mapaExistente = {};
    (existentes||[]).forEach(c=>{ if(c.codigo_sigerd) mapaExistente[c.codigo_sigerd] = c.id; });

    let creados = 0, actualizados = 0, sinSigerd = 0;
    for(const r of registros){
      if(r.codigo_sigerd && mapaExistente[r.codigo_sigerd]){
        const { error } = await sb.from('centros_rh').update(r).eq('id', mapaExistente[r.codigo_sigerd]);
        if(error) throw error;
        actualizados++;
      } else {
        const { data: nuevo, error } = await sb.from('centros_rh').insert(r).select('id,codigo_sigerd').single();
        if(error) throw error;
        if(nuevo.codigo_sigerd) mapaExistente[nuevo.codigo_sigerd] = nuevo.id;
        creados++;
        if(!r.codigo_sigerd) sinSigerd++;
      }
    }

    document.getElementById('centros-resumen-preview').innerHTML = `
      <div class="texto-ayuda" style="margin-top:10px;">
        <strong>${registros.length}</strong> filas procesadas ·
        <span style="color:var(--verde-600);font-weight:600;">${creados} creados</span> ·
        <span style="color:var(--azul-600);font-weight:600;">${actualizados} actualizados</span>
        ${sinSigerd ? `<br><span style="color:var(--amarillo-600);">${sinSigerd} sin código SIGERD: revisar para evitar duplicados en próximas importaciones.</span>` : ''}
      </div>`;

    toast('Centros importados correctamente.','exito');
    renderCentros();
  }catch(err){
    toast(err.message,'error');
  }finally{
    btn.disabled = false;
    btn.textContent = 'Importar centros';
  }
}

async function procesarImportacionPersonal(){
  const archivo = document.getElementById('personal-archivo').files[0];
  if(!archivo){ toast('Selecciona el archivo.','error'); return; }

  const btn = document.getElementById('btn-importar-personal');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Procesando…';

  try{
    const resultado = await importarConUpsert({
      archivo, tabla:'personal_rh', claveUnica:'cedula',
      patrones: {
        cedula: /cedula/,
        nombres: /^nombres?$/,
        apellidos: /apellido/,
        sexo: /^sexo$/,
        cargo_actual: /cargo/,
        telefono: /telefono/,
        direccion: /direccion/,
        nivel_academico: /nivel/,
        numero_dependencia_nomina: /dependencia/,
        estatus: /estatus|estado/,
      },
      transformarFila: (base)=>{
        if(base.sexo) base.sexo = base.sexo.toUpperCase().startsWith('F') ? 'F' : 'M';
        if(base.estatus) base.estatus = base.estatus.toLowerCase();
        if(!base.estatus) base.estatus = 'activo';
        if(!base.sexo) base.sexo = 'M';
        if(!base.nombres) base.nombres = 'Sin nombre';
        if(!base.apellidos) base.apellidos = '';
        return base;
      },
    });
    document.getElementById('personal-resumen-preview').innerHTML = `
      <div class="texto-ayuda" style="margin-top:10px;">
        <strong>${resultado.total}</strong> filas procesadas ·
        <span style="color:var(--verde-600);font-weight:600;">${resultado.creados} creados</span> ·
        <span style="color:var(--azul-600);font-weight:600;">${resultado.actualizados} actualizados</span>
      </div>`;
    toast('Personal importado correctamente.','exito');
    renderPersonal();
  }catch(err){
    toast(err.message,'error');
  }finally{
    btn.disabled = false;
    btn.textContent = 'Importar';
  }
}

async function procesarImportacionAP(){
  const archivo = document.getElementById('ap-archivo').files[0];
  if(!archivo){ toast('Selecciona el archivo.','error'); return; }

  const btn = document.getElementById('btn-importar-ap');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Procesando…';

  try{
    const filas = await leerArchivoNomina(archivo);
    if(!filas.length) throw new Error('El archivo no contiene filas de datos.');
    const headers = filas[0];

    const norm = h => h.toString().toLowerCase().trim()
      .replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u');
    const mapa = {};
    headers.forEach((h,i)=>{
      const n = norm(h);
      if(/solicitud|no\.?\s*ap/.test(n) && mapa.no_solicitud===undefined) mapa.no_solicitud = i;
      else if(/fecha/.test(n) && mapa.fecha===undefined) mapa.fecha = i;
      else if(/motivo/.test(n) && mapa.motivo===undefined) mapa.motivo = i;
      else if(/sigerd|codigo.*centro/.test(n) && mapa.sigerd===undefined) mapa.sigerd = i;
      else if(/centro/.test(n) && mapa.centro===undefined) mapa.centro = i;
      else if(/nombres?\b.*candidato|^nombres?$/.test(n) && mapa.nombres===undefined) mapa.nombres = i;
      else if(/apellidos?\b.*candidato|^apellidos?$/.test(n) && mapa.apellidos===undefined) mapa.apellidos = i;
      else if(/cedula/.test(n) && mapa.cedula===undefined) mapa.cedula = i;
      else if(/sexo/.test(n) && mapa.sexo===undefined) mapa.sexo = i;
      else if(/cargo/.test(n) && mapa.cargo===undefined) mapa.cargo = i;
      else if(/observ/.test(n) && mapa.observaciones===undefined) mapa.observaciones = i;
      else if(/estado/.test(n) && mapa.estado===undefined) mapa.estado = i;
    });
    if(mapa.nombres===undefined || mapa.apellidos===undefined){
      throw new Error('No se pudo detectar las columnas de nombres/apellidos del candidato.');
    }

    const registros = filas.slice(1).filter(f=>f[mapa.nombres] && String(f[mapa.nombres]).trim());
    if(!registros.length) throw new Error('No se encontraron filas válidas con nombres de candidato.');

    let creados = 0, actualizados = 0, errores = 0;
    const detalleErrores = [];
    const motivosValidos = ['SUSTITUCION_FALLECIMIENTO','SUSTITUCION_DECISION_ADMINISTRATIVA','SUSTITUCION_ABANDONO',
                             'SUSTITUCION_RENUNCIA','CAMBIO_DESIGNACION','COMPLETACION_TANDA','PLAZA_VACANTE'];
    const estadosValidos = ['borrador','enviado','expediente_incompleto','incidencias','aprobado','nombrado','rechazado'];

    for(const f of registros){
      try{
        const nombreCentro = mapa.centro!==undefined ? String(f[mapa.centro]||'').trim() : '';
        const sigerd = mapa.sigerd!==undefined ? String(f[mapa.sigerd]||'').trim() : '';
        const nombreCentroFinal = nombreCentro || 'Centro no especificado (importación histórica)';

        let centroId;
        {
          let centroExistente = null;
          if(sigerd){
            const { data } = await sb.from('centros_rh').select('id').eq('codigo_sigerd', sigerd).maybeSingle();
            centroExistente = data;
          }
          if(!centroExistente){
            const { data } = await sb.from('centros_rh').select('id').eq('nombre_centro', nombreCentroFinal).maybeSingle();
            centroExistente = data;
          }
          if(centroExistente){
            centroId = centroExistente.id;
          } else {
            const { data: nuevoCentro, error: errCentro } = await sb.from('centros_rh')
              .insert({ nombre_centro: nombreCentroFinal, codigo_sigerd: sigerd || null }).select('id').single();
            if(errCentro) throw errCentro;
            centroId = nuevoCentro.id;
          }
        }

        let motivo = mapa.motivo!==undefined ? String(f[mapa.motivo]||'').trim().toUpperCase().replace(/\s+/g,'_') : '';
        if(!motivosValidos.includes(motivo)) motivo = 'PLAZA_VACANTE';
        let estado = mapa.estado!==undefined ? String(f[mapa.estado]||'').trim().toLowerCase().replace(/\s+/g,'_') : '';
        if(!estadosValidos.includes(estado)) estado = 'enviado';
        const fecha = mapa.fecha!==undefined ? (String(f[mapa.fecha]||'').trim() || new Date().toISOString().slice(0,10)) : new Date().toISOString().slice(0,10);
        const noSolicitud = mapa.no_solicitud!==undefined ? (String(f[mapa.no_solicitud]||'').trim() || null) : null;

        const payloadSolicitud = {
          centro_id: centroId,
          fecha_solicitud: fecha,
          motivo_solicitud: motivo,
          observaciones: mapa.observaciones!==undefined ? (String(f[mapa.observaciones]||'').trim() || null) : null,
          estado,
        };
        if(noSolicitud) payloadSolicitud.no_solicitud = noSolicitud;

        let solicitudId;
        if(noSolicitud){
          const { data: existente } = await sb.from('solicitudes_ap').select('id').eq('no_solicitud', noSolicitud).maybeSingle();
          if(existente){
            const { error: errUpd } = await sb.from('solicitudes_ap').update(payloadSolicitud).eq('id', existente.id);
            if(errUpd) throw errUpd;
            solicitudId = existente.id;
            actualizados++;
          }
        }
        if(!solicitudId){
          const { data: nuevaSolicitud, error: errSol } = await sb.from('solicitudes_ap').insert(payloadSolicitud).select('id').single();
          if(errSol) throw errSol;
          solicitudId = nuevaSolicitud.id;
          creados++;
        }

        // Candidato vinculado a la solicitud (uno por fila importada).
        const sexo = mapa.sexo!==undefined ? (String(f[mapa.sexo]||'').trim().toUpperCase().startsWith('F') ? 'F' : 'M') : 'M';
        const cedulaCandidato = mapa.cedula!==undefined ? String(f[mapa.cedula]||'').trim() : '';
        const cargoCandidato = mapa.cargo!==undefined ? String(f[mapa.cargo]||'').trim() : '';
        const { error: errCand } = await sb.from('candidatos_ap').insert({
          solicitud_ap_id: solicitudId,
          nombres: String(f[mapa.nombres]||'').trim(),
          apellidos: String(f[mapa.apellidos]||'').trim(),
          cedula: cedulaCandidato || '000-0000000-0',
          sexo,
          cargo_propuesto: cargoCandidato || 'No especificado',
          estado: estado === 'nombrado' ? 'nombrado' : 'pendiente',
        });
        if(errCand) throw errCand;
      }catch(errFila){
        errores++;
        detalleErrores.push(`Fila con candidato "${f[mapa.nombres]||'?'}": ${errFila.message}`);
      }
    }

    document.getElementById('ap-resumen-preview').innerHTML = `
      <div class="texto-ayuda" style="margin-top:10px;">
        <strong>${registros.length}</strong> filas procesadas ·
        <span style="color:var(--verde-600);font-weight:600;">${creados} creadas</span> ·
        <span style="color:var(--azul-600);font-weight:600;">${actualizados} actualizadas</span>
        ${errores ? `· <span style="color:var(--rojo-600);font-weight:600;">${errores} con error</span>` : ''}
        ${detalleErrores.length ? `<br><span style="color:var(--rojo-600);">${detalleErrores.slice(0,5).join('<br>')}</span>` : ''}
      </div>`;

    if(creados || actualizados){
      toast('Solicitudes AP importadas correctamente.','exito');
      renderSolicitudes();
    } else {
      toast('No se pudo importar ninguna solicitud. Revisa los errores.','error');
    }
  }catch(err){
    toast(err.message,'error');
  }finally{
    btn.disabled = false;
    btn.textContent = 'Importar';
  }
}

async function guardarSolicitud(){
  const id = document.getElementById('sol-id').value;
  const payload = {
    no_solicitud: document.getElementById('sol-numero').value.trim() || null,
    fecha_solicitud: document.getElementById('sol-fecha').value || new Date().toISOString().slice(0,10),
    estado: document.getElementById('sol-estado').value,
    centro_id: document.getElementById('sol-centro-id').value,
    motivo_solicitud: document.getElementById('sol-motivo').value,
    observaciones: document.getElementById('sol-observaciones').value.trim() || null,
  };
  if(!payload.centro_id){ toast('Selecciona el centro educativo.','error'); return; }

  const candidatos = leerCandidatosDelForm();
  if(!candidatos.length || !candidatos[0].nombres){ toast('Agrega al menos un candidato con nombre.','error'); return; }

  let solicitudId = id;
  if(id){
    const { error } = await sb.from('solicitudes_ap').update(payload).eq('id', id);
    if(error){ toast(error.message,'error'); return; }
    // Reemplazar candidatos: borrar y reinsertar (simple y robusto para este volumen)
    await sb.from('candidatos_ap').delete().eq('solicitud_ap_id', id);
  } else {
    const { data, error } = await sb.from('solicitudes_ap').insert(payload).select('id').single();
    if(error){ toast(error.message,'error'); return; }
    solicitudId = data.id;
  }

  const filasCandidatos = candidatos.map(c=>({ ...c, solicitud_ap_id: solicitudId }));
  const { error: errCand } = await sb.from('candidatos_ap').insert(filasCandidatos);
  if(errCand){ toast(errCand.message,'error'); return; }

  toast('Solicitud AP guardada correctamente.','exito');
  cerrarModal('modal-solicitud');
  renderSolicitudes();
}

// Genera el texto del telegrama con concordancia de género automática,
// replicando el formato real usado por el Distrito 16-06.
function generarTextoTelegrama({ destinatarioNombre, centroNombre, candidatoNombre, candidatoCedula,
                                   candidatoSexo, cargoDesignado, jornada, fecha }){
  const F = candidatoSexo === 'F';
  const elLa = F ? 'la' : 'el';
  const senorA = F ? 'señora' : 'señor';
  const portadorA = F ? 'portadora' : 'portador';
  const designadoA = F ? 'Designada' : 'Designado';
  const poneloLa = F ? 'ponerla' : 'ponerlo';

  const fechaTexto = new Date(fecha+'T00:00:00').toLocaleDateString('es-DO',{day:'2-digit',month:'long',year:'numeric'});

  return `Bonao, Rep. Dom.\nDISTRITO EDUCATIVO 16-06\n${fechaTexto}\n\n`+
`Señor/a: ${destinatarioNombre}\nDirector/a\nCentro Educativo: ${centroNombre}\n\n`+
`Por este medio se le comunica que ${elLa}/la ${senorA} ${candidatoNombre} ${portadorA} de Cédula de identidad `+
`electoral No. ${candidatoCedula}, ha sido ${designadoA} como ${cargoDesignado}, en este centro educativo de `+
`Jornada Escolar ${jornada}, sírvase ${poneloLa} en la posición.\n\n`+
`Atentamente,\n\nEmeterio Beltré Tineo M.A.\nDirector Distrito Educativo 16-06, Bonao`;
}

async function eliminarSeleccionTelegramas(){
  const ids = [...document.querySelectorAll('.chk-telegramas:checked')].map(c=>c.value);

    document.getElementById('tel-notas').value = t.notas || '';
    document.getElementById('tel-cargo').value = t.cargo_designado || '';

// Calcula el siguiente número consecutivo simple, basado en el mayor
// número puramente numérico ya registrado (ignora formatos como
// "TEL-2026-001" para el cálculo, pero el campo sigue siendo editable
// manualmente para cualquier formato que se necesite).
async function calcularProximoNumeroTelegrama(){
  const { data, error } = await sb.from('telegramas_rh').select('no_telegrama');
  if(error || !data){ return ''; }
  let maximo = 0;
  data.forEach(t=>{
    const n = parseInt(String(t.no_telegrama||'').replace(/\D/g,''), 10);
    if(!isNaN(n) && /^\d+$/.test(String(t.no_telegrama||'').trim()) && n > maximo) maximo = n;
  });
  return maximo > 0 ? String(maximo + 1) : '1';
}

function precargarTelegrama(){
  const id = document.getElementById('tel-candidato').value;
  const c = (window._candidatosNombrables||[]).find(x=>String(x.id)===String(id));
  if(!c) return;
  document.getElementById('tel-cargo').value = c.cargo_propuesto || '';
  document.getElementById('tel-destinatario').value = c.solicitudes_ap?.centros_rh?.director_nombre || '';
  document.getElementById('tel-jornada').value = c.solicitudes_ap?.centros_rh?.tanda || 'Extendida';
  // Precarga el centro de la solicitud del candidato, pero queda en un campo
  // visible y editable: si el usuario lo cambia, el telegrama imprimirá ese
  // centro nuevo, no el de la solicitud original.
  const centroId = c.solicitudes_ap?.centro_id || '';
  const centroNombre = c.solicitudes_ap?.centros_rh?.nombre_centro || '';
  document.getElementById('tel-centro-id').value = centroId;
  document.getElementById('tel-centro').value = centroNombre;
  actualizarPreviewTelegrama();
}

async function procesarImportacionTelegramas(){
  const archivo = document.getElementById('tel-import-archivo').files[0];
  if(!archivo){ toast('Selecciona el archivo.','error'); return; }

  const btn = document.getElementById('btn-importar-telegramas');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Procesando…';

  try{
    const filas = await leerArchivoNomina(archivo);
    if(!filas.length) throw new Error('El archivo no contiene filas de datos.');

    const norm = h => h.toString().toLowerCase().trim()
      .replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u');

    // Detecta automáticamente la fila de encabezados reales (por si el archivo trae
    // un título y/o filas en blanco antes de los nombres de columna, como "REGISTRO
    // GENERAL DE TELEGRAMAS (141 REGISTROS COMPLETOS)")
    const patronesEncabezado = [/telegrama|no\.?\s*tel/, /fecha/, /nombres?\b.*candidato|^nombres?$/,
      /apellidos?\b.*candidato|^apellidos?$/, /(nombre|designado|designad[ao])\b/, /cedula/, /sexo/, /cargo/,
      /sigerd|codigo.*centro/, /centro.*educ|centro/, /jornada/, /destinatario|director/, /telefono/,
      /notas|contacto|observ/, /estado/];
    let headerRowIdx = 0, mejorCoincidencias = -1;
    for(let i=0; i<Math.min(filas.length,10); i++){
      const coincidencias = filas[i].filter(c=>{ const n=norm(c); return n && patronesEncabezado.some(p=>p.test(n)); }).length;
      if(coincidencias > mejorCoincidencias){ mejorCoincidencias = coincidencias; headerRowIdx = i; }
    }
    const headers = filas[headerRowIdx];

    const mapa = {};
    headers.forEach((h,i)=>{
      const n = norm(h);
      if(/telegrama|no\.?\s*tel/.test(n) && mapa.numero===undefined) mapa.numero = i;
      else if(/fecha/.test(n) && mapa.fecha===undefined) mapa.fecha = i;
      // Acepta tanto columnas separadas (nombres/apellidos) como nombre completo en una sola columna
      else if(/nombres?\b.*candidato|^nombres?$/.test(n) && mapa.nombres===undefined) mapa.nombres = i;
      else if(/apellidos?\b.*candidato|^apellidos?$/.test(n) && mapa.apellidos===undefined) mapa.apellidos = i;
      else if(/(nombre|designado|designad[ao])\b/.test(n) && mapa.nombreCompleto===undefined) mapa.nombreCompleto = i;
      else if(/cedula/.test(n) && mapa.cedula===undefined) mapa.cedula = i;
      else if(/sexo/.test(n) && mapa.sexo===undefined) mapa.sexo = i;
      else if(/cargo/.test(n) && mapa.cargo===undefined) mapa.cargo = i;
      else if(/sigerd|codigo.*centro/.test(n) && mapa.sigerd===undefined) mapa.sigerd = i;
      else if(/centro.*educ|centro/.test(n) && mapa.centro===undefined) mapa.centro = i;
      else if(/jornada/.test(n) && mapa.jornada===undefined) mapa.jornada = i;
      else if(/destinatario|director/.test(n) && mapa.destinatario===undefined) mapa.destinatario = i;
      else if(/telefono/.test(n) && mapa.telefono===undefined) mapa.telefono = i;
      else if(/notas|contacto|observ/.test(n) && mapa.notas===undefined) mapa.notas = i;
      else if(/estado/.test(n) && mapa.estado===undefined) mapa.estado = i;
    });
    // Acepta nombre completo en una columna (formato de tu planilla) O nombres/apellidos separados
    const tieneNombreCompleto = mapa.nombreCompleto !== undefined;
    const tieneNombresSeparados = mapa.nombres !== undefined || mapa.apellidos !== undefined;
    if(!tieneNombreCompleto && !tieneNombresSeparados){
      throw new Error('No se pudo detectar la columna de nombre del candidato (acepta: "Nombre del Designado", "Nombres", "Apellidos").');
    }

    // Para formato con nombre completo: determinar qué columna tiene datos válidos
    const colNombreCheck = tieneNombreCompleto ? mapa.nombreCompleto : (mapa.nombres ?? mapa.apellidos);
    const registros = filas.slice(headerRowIdx+1).filter(f=>f[colNombreCheck] && String(f[colNombreCheck]).trim());

    // Función para extraer teléfono del campo de notas (ej: "Tel: 829-387-8120.")
    function extraerTelDeNotas(notas){
      if(!notas) return null;
      const m = String(notas).match(/Tel[eé]?[fono]*[.:]\s*([\d\-\s]+)/i);
      return m ? m[1].trim() : null;
    }
    // Función para separar nombre completo en nombres y apellidos
    function separarNombre(nombreCompleto){
      const partes = String(nombreCompleto).trim().split(/\s+/);
      if(partes.length >= 4) return [partes.slice(0,2).join(' '), partes.slice(2).join(' ')];
      if(partes.length === 3) return [partes[0], partes.slice(1).join(' ')];
      return [nombreCompleto.trim(), 'Sin apellido'];
    }

    let creados = 0, errores = 0;
    const detalleErrores = [];

    // Siguiente número consecutivo disponible, para las filas que no traigan
    // número de telegrama propio en el Excel (se sigue incrementando por cada
    // una de esas filas, en el orden en que aparecen)
    let siguienteNumeroAuto = parseInt(await calcularProximoNumeroTelegrama(), 10);
    if(isNaN(siguienteNumeroAuto)) siguienteNumeroAuto = 1;

    for(const f of registros){
      try{
        const nombreCentro = mapa.centro!==undefined ? String(f[mapa.centro]||'').trim() : '';
        const sigerd = mapa.sigerd!==undefined ? String(f[mapa.sigerd]||'').trim() : '';
        let centroId = null;
        const nombreCentroFinal = nombreCentro || 'Centro no especificado (importación histórica)';

        {
          let centroExistente = null;
          if(sigerd){
            const { data } = await sb.from('centros_rh').select('id').eq('codigo_sigerd', sigerd).maybeSingle();
            centroExistente = data;
          }
          if(!centroExistente){
            const { data } = await sb.from('centros_rh').select('id').eq('nombre_centro', nombreCentroFinal).maybeSingle();
            centroExistente = data;
          }
          if(centroExistente){
            centroId = centroExistente.id;
          } else {
            const { data: nuevoCentro, error: errCentro } = await sb.from('centros_rh')
              .insert({ nombre_centro: nombreCentroFinal, codigo_sigerd: sigerd || null }).select('id').single();
            if(errCentro) throw errCentro;
            centroId = nuevoCentro.id;
          }
        }

        // Crear Solicitud AP básica (cada importación genera la suya, ya que
        // representa el trámite histórico real de ese telegrama en papel).
        const { data: nuevaSolicitud, error: errSol } = await sb.from('solicitudes_ap')
          .insert({ centro_id: centroId, motivo_solicitud:'PLAZA_VACANTE', estado:'nombrado',
                    observaciones:'Importado desde Excel — telegrama histórico en papel.' })
          .select('id').single();
        if(errSol) throw errSol;

        // Crear Candidato básico vinculado a esa solicitud.
        const sexo = mapa.sexo!==undefined ? (String(f[mapa.sexo]||'').trim().toUpperCase().startsWith('F') ? 'F' : 'M') : 'M';
        const cedulaCandidato = mapa.cedula!==undefined ? String(f[mapa.cedula]||'').trim() : '';
        const cargoCandidato = mapa.cargo!==undefined ? String(f[mapa.cargo]||'').trim() : '';
        // Soporte para nombre completo en una sola columna ("Nombre del Designado")
        let nombresIns, apellidosIns, nombreCompletoParaTexto;
        if(tieneNombreCompleto){
          const nc = String(f[mapa.nombreCompleto]||'').trim();
          [nombresIns, apellidosIns] = separarNombre(nc);
          nombreCompletoParaTexto = nc;
        } else {
          nombresIns = String(f[mapa.nombres]||'').trim();
          apellidosIns = String(f[mapa.apellidos]||'').trim();
          nombreCompletoParaTexto = (nombresIns+' '+apellidosIns).trim();
        }
        const { data: nuevoCandidato, error: errCand } = await sb.from('candidatos_ap')
          .insert({
            solicitud_ap_id: nuevaSolicitud.id,
            nombres: nombresIns,
            apellidos: apellidosIns || 'Sin apellido',
            cedula: cedulaCandidato || '000-0000000-0',
            sexo,
            cargo_propuesto: cargoCandidato || 'No especificado',
            estado: 'nombrado',
          }).select('id').single();
        if(errCand) throw errCand;

        const fecha = mapa.fecha!==undefined ? (String(f[mapa.fecha]||'').trim() || new Date().toISOString().slice(0,10)) : new Date().toISOString().slice(0,10);
        const cargoDesignado = mapa.cargo!==undefined ? (String(f[mapa.cargo]||'').trim() || '________') : '________';
        const destinatario = mapa.destinatario!==undefined ? (String(f[mapa.destinatario]||'').trim() || '________') : '________';
        const jornada = mapa.jornada!==undefined ? (String(f[mapa.jornada]||'').trim() || 'Extendida') : 'Extendida';
        // Teléfono: del campo directo o extraído de notas
        let telFinal = mapa.telefono!==undefined ? (String(f[mapa.telefono]||'').trim() || null) : null;
        if(!telFinal && mapa.notas!==undefined) telFinal = extraerTelDeNotas(f[mapa.notas]);
        // Notas / Contacto: se guarda el texto completo tal cual venía en el Excel,
        // aparte del teléfono ya extraído por separado
        const notasFinal = mapa.notas!==undefined ? (String(f[mapa.notas]||'').trim() || null) : null;

        const texto = generarTextoTelegrama({
          destinatarioNombre: destinatario,
          centroNombre: nombreCentroFinal,
          candidatoNombre: nombreCompletoParaTexto,
          candidatoCedula: cedulaCandidato,
          candidatoSexo: sexo,
          cargoDesignado,
          jornada,
          fecha,
        });

        // Número de telegrama: si la fila trae uno propio en el Excel, se respeta tal cual;
        // si no, se asigna el siguiente consecutivo automático de la secuencia del sistema.
        let numeroFinal = mapa.numero!==undefined ? (String(f[mapa.numero]||'').trim() || null) : null;
        if(!numeroFinal){ numeroFinal = String(siguienteNumeroAuto); siguienteNumeroAuto++; }
        else if(/^\d+$/.test(numeroFinal)){
          const n = parseInt(numeroFinal,10);
          if(n >= siguienteNumeroAuto) siguienteNumeroAuto = n + 1;
        }

        const { error: errTel } = await sb.from('telegramas_rh').insert({
          candidato_ap_id: nuevoCandidato.id,
          centro_id: centroId,
          no_telegrama: numeroFinal,
          fecha_telegrama: fecha,
          destinatario_nombre: destinatario,
          destinatario_telefono: telFinal,
          notas: notasFinal,
          cargo_designado: cargoDesignado,
          jornada,
          texto_generado: texto,
          estado_envio: mapa.estado!==undefined ? (String(f[mapa.estado]||'').trim().toLowerCase() || 'generado') : 'generado',
        });
        if(errTel) throw errTel;

        creados++;
      }catch(errFila){
        errores++;
        detalleErrores.push(`Fila con candidato "${f[mapa.nombres]||'?'}": ${errFila.message}`);
      }
    }

    document.getElementById('tel-import-resumen-preview').innerHTML = `
      <div class="texto-ayuda" style="margin-top:10px;">
        <strong>${registros.length}</strong> filas procesadas ·
        <span style="color:var(--verde-600);font-weight:600;">${creados} telegramas creados</span>
        ${errores ? `· <span style="color:var(--rojo-600);font-weight:600;">${errores} con error</span>` : ''}
        ${detalleErrores.length ? `<br><span style="color:var(--rojo-600);">${detalleErrores.slice(0,5).join('<br>')}</span>` : ''}
      </div>`;

    if(creados){
      toast(`${creados} telegrama(s) importado(s) correctamente.`,'exito');
      renderTelegramas();
    } else {
      toast('No se pudo importar ningún telegrama. Revisa los errores.','error');
    }
  }catch(err){
    toast(err.message,'error');
  }finally{
    btn.disabled = false;
    btn.textContent = 'Importar telegramas';
  }
}

function pintarTablaPuestasDisp(lista){

    tbody.innerHTML = `<tr><td colspan="8"><div class="vacio"><div class="icono-vacio">📤</div>No hay oficios registrados.</div></td></tr>`;
    return;
  }
  tbody.innerHTML = lista.map(p=>`
    <tr>
      <td><input type="checkbox" class="chk-pd" value="${p.id}"></td>
      <td>${fechaCorta(p.fecha_oficio)}</td>

function filtrarPuestasDisp(){
  const texto = document.getElementById('filtro-pd-texto').value.toLowerCase();
  const estado = document.getElementById('filtro-pd-estado').value;
  const distrito = document.getElementById('filtro-pd-distrito').value.toLowerCase();
  const filtrado = (window._puestasDisposicionData||[]).filter(p=>{
    const nombre = ((p.personal_rh?.nombres||'')+' '+(p.personal_rh?.apellidos||'')+' '+(p.personal_rh?.cedula||'')).toLowerCase();
    if(texto && !nombre.includes(texto)) return false;
    if(estado && p.estado !== estado) return false;
    if(distrito && !(p.distrito_destino||'').toLowerCase().includes(distrito)) return false;
    return true;
  });
  pintarTablaPuestasDisp(filtrado);
}

async function procesarImportacionPD(){
  const archivo = document.getElementById('pd-import-archivo').files[0];
  if(!archivo){ toast('Selecciona el archivo.','error'); return; }

  const btn = document.getElementById('btn-importar-pd');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Procesando…';

  try{
    const filas = await leerArchivoNomina(archivo);
    if(!filas.length) throw new Error('El archivo no contiene filas de datos.');
    const headers = filas[0];

    const norm = h => h.toString().toLowerCase().trim()
      .replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u');
    const mapa = {};
    headers.forEach((h,i)=>{
      const n = norm(h);
      if(/cedula/.test(n) && mapa.cedula===undefined) mapa.cedula = i;
      else if(/nombres?\b.*emplea|^nombres?\b/.test(n) && mapa.nombres===undefined) mapa.nombres = i;
      else if(/apellidos?\b.*emplea|^apellidos?\b/.test(n) && mapa.apellidos===undefined) mapa.apellidos = i;
      else if(/fecha/.test(n) && mapa.fecha===undefined) mapa.fecha = i;
      else if(/destinatario\b.*cargo|cargo\b.*destinatario/.test(n) && mapa.destinatarioCargo===undefined) mapa.destinatarioCargo = i;
      else if(/destinatario/.test(n) && mapa.destinatario===undefined) mapa.destinatario = i;
      else if(/distrito/.test(n) && mapa.distrito===undefined) mapa.distrito = i;
      else if(/analista|via/.test(n) && mapa.analista===undefined) mapa.analista = i;
      else if(/cargo.*design|design.*cargo/.test(n) && mapa.cargoDesignado===undefined) mapa.cargoDesignado = i;
      else if(/motivo/.test(n) && mapa.motivo===undefined) mapa.motivo = i;
      else if(/estado/.test(n) && mapa.estado===undefined) mapa.estado = i;
    });
    if(mapa.cedula===undefined){ throw new Error('No se pudo detectar la columna de cédula del empleado.'); }

    const registros = filas.slice(1).filter(f=>f[mapa.cedula] && String(f[mapa.cedula]).trim());
    if(!registros.length) throw new Error('No se encontraron filas válidas con cédula.');

    let creados = 0, errores = 0;
    const detalleErrores = [];
    const estadosValidos = ['borrador','enviado','aceptado','rechazado'];

    for(const f of registros){
      try{
        const cedula = String(f[mapa.cedula]).trim();
        let { data: persona } = await sb.from('personal_rh').select('id,nombres,apellidos,sexo,cargo_actual').eq('cedula', cedula).maybeSingle();

        if(!persona){
          const nombres = mapa.nombres!==undefined ? String(f[mapa.nombres]||'').trim() : '';
          const apellidos = mapa.apellidos!==undefined ? String(f[mapa.apellidos]||'').trim() : '';
          if(!nombres){ throw new Error('Empleado no encontrado por cédula y faltan nombres para crearlo.'); }
          const { data: nuevaPersona, error: errPer } = await sb.from('personal_rh')
            .insert({ cedula, nombres, apellidos: apellidos || 'Sin apellido', sexo:'M', estatus:'activo' })
            .select('id,nombres,apellidos,sexo,cargo_actual').single();
          if(errPer) throw errPer;
          persona = nuevaPersona;
        }

        let estado = mapa.estado!==undefined ? String(f[mapa.estado]||'').trim().toLowerCase() : '';
        if(!estadosValidos.includes(estado)) estado = 'borrador';
        const fecha = mapa.fecha!==undefined ? (String(f[mapa.fecha]||'').trim() || new Date().toISOString().slice(0,10)) : new Date().toISOString().slice(0,10);
        const destinatario = mapa.destinatario!==undefined ? (String(f[mapa.destinatario]||'').trim() || '________') : '________';
        const destinatarioCargo = mapa.destinatarioCargo!==undefined ? (String(f[mapa.destinatarioCargo]||'').trim() || 'Director/a Distrital') : 'Director/a Distrital';
        const analista = mapa.analista!==undefined ? String(f[mapa.analista]||'').trim() : '';
        const cargoDesignado = mapa.cargoDesignado!==undefined ? (String(f[mapa.cargoDesignado]||'').trim() || persona.cargo_actual || '________') : (persona.cargo_actual || '________');
        const motivo = mapa.motivo!==undefined ? (String(f[mapa.motivo]||'').trim() || null) : null;

        const texto = generarTextoPuestaDisposicion({
          fecha, destinatarioNombre: destinatario, destinatarioCargo,
          analistaNombre: analista, analistaCargo: 'Analista Recursos Humanos Distrito 16-06',
          asunto: 'Puesta A Disposición',
          candidatoNombre: persona.nombres+' '+persona.apellidos,
          candidatoCedula: cedula, candidatoSexo: persona.sexo, cargoDesignado,
        });

        const { error: errPD } = await sb.from('puestas_disposicion_rh').insert({
          personal_id: persona.id, fecha_oficio: fecha,
          destinatario_nombre: destinatario, destinatario_cargo: destinatarioCargo,
          distrito_destino: mapa.distrito!==undefined ? (String(f[mapa.distrito]||'').trim() || null) : null,
          analista_nombre: analista || null, cargo_designado: cargoDesignado, motivo, estado,
          texto_generado: texto,
        });
        if(errPD) throw errPD;
        creados++;
      }catch(errFila){
        errores++;
        detalleErrores.push(`Fila con cédula "${f[mapa.cedula]||'?'}": ${errFila.message}`);
      }
    }

    document.getElementById('pd-import-resumen-preview').innerHTML = `
      <div class="texto-ayuda" style="margin-top:10px;">
        <strong>${registros.length}</strong> filas procesadas ·
        <span style="color:var(--verde-600);font-weight:600;">${creados} creados</span>
        ${errores ? `· <span style="color:var(--rojo-600);font-weight:600;">${errores} con error</span>` : ''}
        ${detalleErrores.length ? `<br><span style="color:var(--rojo-600);">${detalleErrores.slice(0,5).join('<br>')}</span>` : ''}
      </div>`;

    if(creados){
      toast(`${creados} oficio(s) importado(s) correctamente.`,'exito');
      renderPuestasDisposicion();
    } else {
      toast('No se pudo importar ningún oficio. Revisa los errores.','error');
    }
  }catch(err){
    toast(err.message,'error');
  }finally{
    btn.disabled = false;
    btn.textContent = 'Importar';
  }
}

`la aceptación en nuestro Distrito a ${laSenora} ${candidatoNombre}, ${cargoDesignado}, ${portadorA} de la `+
`cedula de identidad y electoral No. ${candidatoCedula}, ${ubicacion}.\n\n`+

`Muy atentamente,\n\n\nEmeterio Beltre Tineo M.A.\nDirector Distrital 16-06, Bonao Nordeste`;

function filtrarCA(){

async function procesarImportacionCA(){
  const archivo = document.getElementById('ca-import-archivo').files[0];
  if(!archivo){ toast('Selecciona el archivo.','error'); return; }

  const btn = document.getElementById('btn-importar-ca');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Procesando…';

  try{
    const filas = await leerArchivoNomina(archivo);
    if(!filas.length) throw new Error('El archivo no contiene filas de datos.');
    const headers = filas[0];

    const norm = h => h.toString().toLowerCase().trim()
      .replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u');
    const mapa = {};
    headers.forEach((h,i)=>{
      const n = norm(h);
      if(/cedula/.test(n) && mapa.cedula===undefined) mapa.cedula = i;
      else if(/nombres?\b.*emplea|^nombres?\b/.test(n) && mapa.nombres===undefined) mapa.nombres = i;
      else if(/apellidos?\b.*emplea|^apellidos?\b/.test(n) && mapa.apellidos===undefined) mapa.apellidos = i;
      else if(/fecha/.test(n) && mapa.fecha===undefined) mapa.fecha = i;
      else if(/cargo\b.*destinatario|destinatario\b.*cargo/.test(n) && mapa.destinatarioCargo===undefined) mapa.destinatarioCargo = i;
      else if(/procedencia|destinatario/.test(n) && mapa.destinatario===undefined) mapa.destinatario = i;
      else if(/analista|via/.test(n) && mapa.analista===undefined) mapa.analista = i;
      else if(/cargo.*design|design.*cargo/.test(n) && mapa.cargoDesignado===undefined) mapa.cargoDesignado = i;
      else if(/centro/.test(n) && mapa.centro===undefined) mapa.centro = i;
      else if(/estado/.test(n) && mapa.estado===undefined) mapa.estado = i;
    });
    if(mapa.cedula===undefined){ throw new Error('No se pudo detectar la columna de cédula del empleado.'); }

    const registros = filas.slice(1).filter(f=>f[mapa.cedula] && String(f[mapa.cedula]).trim());
    if(!registros.length) throw new Error('No se encontraron filas válidas con cédula.');

    let creados = 0, errores = 0;
    const detalleErrores = [];
    const estadosValidos = ['borrador','enviado','confirmado','rechazado'];

    for(const f of registros){
      try{
        const cedula = String(f[mapa.cedula]).trim();
        let { data: persona } = await sb.from('personal_rh').select('id,nombres,apellidos,sexo,cargo_actual').eq('cedula', cedula).maybeSingle();

        if(!persona){
          const nombres = mapa.nombres!==undefined ? String(f[mapa.nombres]||'').trim() : '';
          const apellidos = mapa.apellidos!==undefined ? String(f[mapa.apellidos]||'').trim() : '';
          if(!nombres){ throw new Error('Empleado no encontrado por cédula y faltan nombres para crearlo.'); }
          const { data: nuevaPersona, error: errPer } = await sb.from('personal_rh')
            .insert({ cedula, nombres, apellidos: apellidos || 'Sin apellido', sexo:'M', estatus:'activo' })
            .select('id,nombres,apellidos,sexo,cargo_actual').single();
          if(errPer) throw errPer;
          persona = nuevaPersona;
        }

        let centroId = null;
        const nombreCentro = mapa.centro!==undefined ? String(f[mapa.centro]||'').trim() : '';
        if(nombreCentro){
          const { data: centroExistente } = await sb.from('centros_rh').select('id').eq('nombre_centro', nombreCentro).maybeSingle();
          if(centroExistente){
            centroId = centroExistente.id;
          } else {
            const { data: nuevoCentro, error: errCentro } = await sb.from('centros_rh')
              .insert({ nombre_centro: nombreCentro }).select('id').single();
            if(errCentro) throw errCentro;
            centroId = nuevoCentro.id;
          }
        }

        let estado = mapa.estado!==undefined ? String(f[mapa.estado]||'').trim().toLowerCase() : '';
        if(!estadosValidos.includes(estado)) estado = 'borrador';
        const fecha = mapa.fecha!==undefined ? (String(f[mapa.fecha]||'').trim() || new Date().toISOString().slice(0,10)) : new Date().toISOString().slice(0,10);
        const destinatario = mapa.destinatario!==undefined ? (String(f[mapa.destinatario]||'').trim() || '________') : '________';
        const destinatarioCargo = mapa.destinatarioCargo!==undefined ? (String(f[mapa.destinatarioCargo]||'').trim() || '________') : '________';
        const analista = mapa.analista!==undefined ? String(f[mapa.analista]||'').trim() : '';
        const cargoDesignado = mapa.cargoDesignado!==undefined ? (String(f[mapa.cargoDesignado]||'').trim() || persona.cargo_actual || '________') : (persona.cargo_actual || '________');

        const texto = generarTextoCartaAceptacion({
          fecha, destinatarioNombre: destinatario, destinatarioCargo,
          analistaNombre: analista, analistaCargo: 'Analista Recursos Humanos Distrito 16-06',
          asunto: 'Aceptación De Personal',
          candidatoNombre: persona.nombres+' '+persona.apellidos,
          candidatoCedula: cedula, candidatoSexo: persona.sexo, cargoDesignado,
          centroNombre: nombreCentro || null,
        });

        const { error: errCA } = await sb.from('cartas_aceptacion_rh').insert({
          personal_id: persona.id, fecha_oficio: fecha,
          destinatario_nombre: destinatario, destinatario_cargo: destinatarioCargo,
          analista_nombre: analista || null, cargo_designado: cargoDesignado,
          centro_id: centroId, estado, texto_generado: texto,
        });
        if(errCA) throw errCA;
        creados++;
      }catch(errFila){
        errores++;
        detalleErrores.push(`Fila con cédula "${f[mapa.cedula]||'?'}": ${errFila.message}`);
      }
    }

    document.getElementById('ca-import-resumen-preview').innerHTML = `
      <div class="texto-ayuda" style="margin-top:10px;">
        <strong>${registros.length}</strong> filas procesadas ·
        <span style="color:var(--verde-600);font-weight:600;">${creados} creadas</span>
        ${errores ? `· <span style="color:var(--rojo-600);font-weight:600;">${errores} con error</span>` : ''}
        ${detalleErrores.length ? `<br><span style="color:var(--rojo-600);">${detalleErrores.slice(0,5).join('<br>')}</span>` : ''}
      </div>`;

    if(creados){
      toast(`${creados} carta(s) importada(s) correctamente.`,'exito');
      renderCartasAceptacion();
    } else {
      toast('No se pudo importar ninguna carta. Revisa los errores.','error');
    }
  }catch(err){
    toast(err.message,'error');
  }finally{
    btn.disabled = false;
    btn.textContent = 'Importar';
  }
}

// Calcula los años de servicio completos desde la fecha de ingreso del
// empleado hasta la fecha de solicitud, y sugiere automáticamente los
// días de vacaciones según la tabla oficial (editable después).
function calcularAniosServicioVacaciones(){
  const id = document.getElementById('vac-personal-id').value;
  const p = (window._personalCache||[]).find(x=>String(x.id)===String(id));
  const fuenteEl = document.getElementById('vac-fuente-anios');
  if(!p || !p.fecha_ingreso){
    fuenteEl.textContent = p ? 'Este empleado no tiene fecha de ingreso registrada; ingresa los años manualmente.' : '';
    return;
  }
  const fechaSolicitud = document.getElementById('vac-fecha-solicitud').value || new Date().toISOString().slice(0,10);
  const anios = calcularAniosEntreFechas(p.fecha_ingreso, fechaSolicitud);
  document.getElementById('vac-anios-minerd').value = anios;
  fuenteEl.textContent = `Calculado automáticamente desde la fecha de ingreso (${fechaCorta(p.fecha_ingreso)}). Puedes ajustarlo manualmente.`;
  actualizarTotalAniosVacaciones();
  sugerirDiasPorAnios(anios);
}

function calcularAniosEntreFechas(fechaIngreso, fechaHasta){
  const ini = new Date(fechaIngreso+'T00:00:00');
  const fin = new Date(fechaHasta+'T00:00:00');
  let anios = fin.getFullYear() - ini.getFullYear();
  const aniversarioEsteAnio = new Date(fin.getFullYear(), ini.getMonth(), ini.getDate());
  if(fin < aniversarioEsteAnio) anios--;
  return Math.max(anios, 0);
}

function actualizarTotalAniosVacaciones(){
  const minerd = parseFloat(document.getElementById('vac-anios-minerd').value) || 0;
  const otra = parseFloat(document.getElementById('vac-anios-otra').value) || 0;
  document.getElementById('vac-anios-total').value = (minerd + otra) || '';
}

// Sugiere los días de la tabla oficial según los años de servicio del
// empleado, sin sobrescribir si el usuario ya seleccionó "Otro" manual.
function sugerirDiasPorAnios(anios){
  const select1 = document.getElementById('vac-dias1-select');
  if(select1.value === '__manual__') return; // respeta si ya está en modo manual
  let dias = 15;
  if(anios >= 15) dias = 30;
  else if(anios >= 10) dias = 25;
  else if(anios >= 5) dias = 20;
  else dias = 15;
  select1.value = String(dias);
  document.getElementById('vac-dias1').value = dias;
  calcularFechaFinVacaciones();
}

// Cambia entre el select de días predefinidos y el campo manual.
function aplicarDiasPredefinidos(numero){
  const select = document.getElementById(`vac-dias${numero}-select`);
  const input = document.getElementById(`vac-dias${numero}`);
  if(select.value === '__manual__'){
    input.style.display = 'block';
    input.focus();
  } else {
    input.style.display = 'none';
    input.value = select.value;
  }
  validarReglasVacaciones();
  if(numero === 1) calcularFechaFinVacaciones();
}

// Calcula la fecha de fin sugerida sumando los días laborables solicitados
// (excluyendo sábados y domingos) a partir de la fecha de inicio.
function calcularFechaFinVacaciones(){
  const inicio = document.getElementById('vac-fecha-inicio').value;
  const dias1 = parseInt(document.getElementById('vac-dias1').value) || 0;
  const dias2 = parseInt(document.getElementById('vac-dias2').value) || 0;
  const totalDias = dias1 + dias2;
  if(!inicio || !totalDias){ validarReglasVacaciones(); return; }

  let fecha = new Date(inicio+'T00:00:00');
  let diasContados = 1; // el propio día de inicio cuenta como el primer día laborable, si no es fin de semana
  if(fecha.getDay() === 0 || fecha.getDay() === 6) diasContados = 0;

  while(diasContados < totalDias){
    fecha.setDate(fecha.getDate() + 1);
    const diaSemana = fecha.getDay();
    if(diaSemana !== 0 && diaSemana !== 6) diasContados++;
  }

  document.getElementById('vac-fecha-fin').value = fecha.toISOString().slice(0,10);
  validarReglasVacaciones();
}

// Reglas de negocio del formulario oficial: acumulación máxima 2 años,
// fraccionamiento si supera 20 días, y obligatoriedad si está en pre/post natal.
function validarReglasVacaciones(){
  const dias1 = parseInt(document.getElementById('vac-dias1').value)||0;
  const dias2 = parseInt(document.getElementById('vac-dias2').value)||0;
  const totalDias = dias1+dias2;
  const ini = document.getElementById('vac-fecha-inicio').value;
  const fin = document.getElementById('vac-fecha-fin').value;
  const alertas = [];

  if(totalDias > 20){
    alertas.push('Más de 20 días solicitados: pueden fraccionarse en dos fechas calendario distintas.');
  }
  if(ini && fin){
    const rangoLaborable = diasLaborablesEntreFechas(ini, fin);
    if(rangoLaborable !== totalDias && totalDias > 0){
      alertas.push(`El rango de fechas (${rangoLaborable} día(s) laborable(s)) no coincide con el total de días solicitados (${totalDias}).`);
    }
  }
  if(document.getElementById('vac-pre-post-natal').checked){
    alertas.push('Empleada en licencia pre/post natal: la autorización de estas vacaciones es obligatoria según normativa.');
  }

  document.getElementById('vac-alertas').innerHTML = alertas.length ? alertas.map(a=>
    `<div class="badge badge-amarillo" style="display:block;margin-bottom:6px;white-space:normal;padding:8px 10px;">⚠ ${a}</div>`
  ).join('') : '';
}

// Cuenta días laborables (excluyendo sábados y domingos) entre dos fechas, ambas inclusive.
function diasLaborablesEntreFechas(ini, fin){
  if(!ini || !fin) return 0;
  let fecha = new Date(ini+'T00:00:00');
  const fechaFin = new Date(fin+'T00:00:00');
  if(fecha > fechaFin) return 0;
  let conteo = 0;
  while(fecha <= fechaFin){
    const diaSemana = fecha.getDay();
    if(diaSemana !== 0 && diaSemana !== 6) conteo++;
    fecha.setDate(fecha.getDate() + 1);
  }
  return conteo;
}

async function procesarImportacionVac(){
  const archivo = document.getElementById('vac-import-archivo').files[0];
  if(!archivo){ toast('Selecciona el archivo.','error'); return; }

  const btn = document.getElementById('btn-importar-vac');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Procesando…';

  try{
    const filas = await leerArchivoNomina(archivo);
    if(!filas.length) throw new Error('El archivo no contiene filas de datos.');
    const headers = filas[0];

    const norm = h => h.toString().toLowerCase().trim()
      .replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u');
    const mapa = {};
    headers.forEach((h,i)=>{
      const n = norm(h);
      if(/cedula/.test(n) && mapa.cedula===undefined) mapa.cedula = i;
      else if(/fecha.*solicitud/.test(n) && mapa.fechaSolicitud===undefined) mapa.fechaSolicitud = i;
      else if(/minerd/.test(n) && mapa.aniosMinerd===undefined) mapa.aniosMinerd = i;
      else if(/otra.*instituc/.test(n) && mapa.aniosOtra===undefined) mapa.aniosOtra = i;
      else if(/dias.*ano\s*1|dias.*a.o\s*1/.test(n) && mapa.dias1===undefined) mapa.dias1 = i;
      else if(/^ano\s*1$|^a.o\s*1$/.test(n) && mapa.anio1===undefined) mapa.anio1 = i;
      else if(/dias.*ano\s*2|dias.*a.o\s*2/.test(n) && mapa.dias2===undefined) mapa.dias2 = i;
      else if(/^ano\s*2$|^a.o\s*2$/.test(n) && mapa.anio2===undefined) mapa.anio2 = i;
      else if(/pendient/.test(n) && mapa.pendientes===undefined) mapa.pendientes = i;
      else if(/inicio/.test(n) && mapa.inicio===undefined) mapa.inicio = i;
      else if(/fin/.test(n) && mapa.fin===undefined) mapa.fin = i;
      else if(/comentario/.test(n) && mapa.comentario===undefined) mapa.comentario = i;
      else if(/natal/.test(n) && mapa.natal===undefined) mapa.natal = i;
      else if(/estado/.test(n) && mapa.estado===undefined) mapa.estado = i;
    });
    if(mapa.cedula===undefined){ throw new Error('No se pudo detectar la columna de cédula del empleado.'); }
    if(mapa.inicio===undefined || mapa.fin===undefined){ throw new Error('No se pudo detectar las columnas de fecha de inicio/fin del disfrute.'); }

    const registros = filas.slice(1).filter(f=>f[mapa.cedula] && String(f[mapa.cedula]).trim());
    if(!registros.length) throw new Error('No se encontraron filas válidas con cédula.');

    let creados = 0, errores = 0;
    const detalleErrores = [];
    const estadosValidos = ['solicitado','firmado_supervisor','autorizado_rrll','rechazado'];

    for(const f of registros){
      try{
        const cedula = String(f[mapa.cedula]).trim();
        const { data: persona } = await sb.from('personal_rh').select('id').eq('cedula', cedula).maybeSingle();
        if(!persona){ throw new Error('Empleado no encontrado en Personal. Impórtalo primero ahí.'); }

        const inicio = mapa.inicio!==undefined ? String(f[mapa.inicio]||'').trim() : '';
        const fin = mapa.fin!==undefined ? String(f[mapa.fin]||'').trim() : '';
        if(!inicio || !fin){ throw new Error('Faltan fechas de inicio/fin de disfrute.'); }

        let estado = mapa.estado!==undefined ? String(f[mapa.estado]||'').trim().toLowerCase() : '';
        if(!estadosValidos.includes(estado)) estado = 'solicitado';
        const natalTexto = mapa.natal!==undefined ? String(f[mapa.natal]||'').trim().toUpperCase() : '';

        const { error: errVac } = await sb.from('vacaciones_rh').insert({
          personal_id: persona.id,
          fecha_solicitud: mapa.fechaSolicitud!==undefined ? (String(f[mapa.fechaSolicitud]||'').trim() || new Date().toISOString().slice(0,10)) : new Date().toISOString().slice(0,10),
          anios_servicio_minerd: mapa.aniosMinerd!==undefined ? (parseFloat(f[mapa.aniosMinerd])||null) : null,
          anios_servicio_otra_institucion: mapa.aniosOtra!==undefined ? (parseFloat(f[mapa.aniosOtra])||0) : 0,
          dias_solicitados_anio1: mapa.dias1!==undefined ? (parseInt(f[mapa.dias1])||0) : 0,
          anio1: mapa.anio1!==undefined ? (parseInt(f[mapa.anio1])||null) : null,
          dias_solicitados_anio2: mapa.dias2!==undefined ? (parseInt(f[mapa.dias2])||0) : 0,
          anio2: mapa.anio2!==undefined ? (parseInt(f[mapa.anio2])||null) : null,
          dias_pendientes: mapa.pendientes!==undefined ? (parseInt(f[mapa.pendientes])||null) : null,
          fecha_inicio_disfrute: inicio, fecha_fin_disfrute: fin,
          comentario: mapa.comentario!==undefined ? (String(f[mapa.comentario]||'').trim() || null) : null,
          en_licencia_pre_post_natal: natalTexto==='SI'||natalTexto==='SÍ'||natalTexto==='YES'||natalTexto==='TRUE',
          estado,
        });
        if(errVac) throw errVac;
        creados++;
      }catch(errFila){
        errores++;
        detalleErrores.push(`Fila con cédula "${f[mapa.cedula]||'?'}": ${errFila.message}`);
      }
    }

    document.getElementById('vac-import-resumen-preview').innerHTML = `
      <div class="texto-ayuda" style="margin-top:10px;">
        <strong>${registros.length}</strong> filas procesadas ·
        <span style="color:var(--verde-600);font-weight:600;">${creados} creadas</span>
        ${errores ? `· <span style="color:var(--rojo-600);font-weight:600;">${errores} con error</span>` : ''}
        ${detalleErrores.length ? `<br><span style="color:var(--rojo-600);">${detalleErrores.slice(0,5).join('<br>')}</span>` : ''}
      </div>`;

    if(creados){
      toast(`${creados} solicitud(es) de vacaciones importada(s) correctamente.`,'exito');
      renderVacaciones();
    } else {
      toast('No se pudo importar ninguna solicitud. Revisa los errores.','error');
    }
  }catch(err){
    toast(err.message,'error');
  }finally{
    btn.disabled = false;
    btn.textContent = 'Importar';
  }
}

async function cambiarEstadoVacacion(id){
  const v = (window._vacacionesData||[]).find(x=>x.id===id);
  if(!v) return;
  const opciones = ['solicitado','firmado_supervisor','autorizado_rrll','rechazado'];
  const etiquetas = {solicitado:'Solicitado',firmado_supervisor:'Firmado supervisor',autorizado_rrll:'Autorizado RRLL',rechazado:'Rechazado'};
  const idxActual = opciones.indexOf(v.estado);
  const elegido = prompt('Nuevo estado:\n'+opciones.map((o,i)=>`${i+1}. ${etiquetas[o]}`).join('\n'), String(idxActual+1));
  const idx = parseInt(elegido)-1;
  if(isNaN(idx) || !opciones[idx]) return;
  const { error } = await sb.from('vacaciones_rh').update({ estado: opciones[idx] }).eq('id', id);
  if(error){ toast(error.message,'error'); return; }
  toast('Estado actualizado.','exito');
  renderVacaciones();
}

    tbody.innerHTML = `<tr><td colspan="10"><div class="vacio"><div class="icono-vacio">🗂</div>No hay licencias ni permisos registrados.</div></td></tr>`;
    return;
  }
  tbody.innerHTML = lista.map(x=>`
    <tr>
      <td><input type="checkbox" class="chk-lp" value="${x.id}"></td>
      <td>${escapeHtml((x.personal_rh?.nombres||'')+' '+(x.personal_rh?.apellidos||''))}</td>
      <td>${x.categoria==='licencia'?'Licencia':'Permiso'}</td>
      <td>${escapeHtml(labelSubtipoLP(x.subtipo))}${x.subtipo_detalle?': '+escapeHtml(x.subtipo_detalle):''}</td>
      <td>${x.duracion_dias||0}d ${x.duracion_meses||0}m ${x.duracion_anios||0}a</td>
      <td>${fechaCorta(x.fecha_inicio)}</td>
      <td>${fechaCorta(x.fecha_fin)}</td>
      <td>${x.evidencia_requerida ? (x.evidencia_presentada?'<span class="badge badge-verde">Presentada</span>':'<span class="badge badge-rojo">Pendiente</span>') : '<span class="badge badge-gris">N/A</span>'}</td>
      <td>${badgeEstado(x.estado)}</td>
      <td><button class="btn btn-secundario btn-chico" onclick="cambiarEstadoLP(${x.id})">Estado</button></td>
    </tr>
  `).join('');
}

function filtrarLP(){
  const texto = document.getElementById('filtro-lp-texto').value.toLowerCase();
  const categoria = document.getElementById('filtro-lp-categoria').value;
  const estado = document.getElementById('filtro-lp-estado').value;
  const filtrado = (window._licenciasPermisosData||[]).filter(x=>{
    const nombre = ((x.personal_rh?.nombres||'')+' '+(x.personal_rh?.apellidos||'')+' '+(x.personal_rh?.cedula||'')).toLowerCase();
    if(texto && !nombre.includes(texto)) return false;
    if(categoria && x.categoria !== categoria) return false;
    if(estado && x.estado !== estado) return false;
    return true;
  });
  pintarTablaLP(filtrado);
}

function toggleTodosCheckLP(master){ document.querySelectorAll('.chk-lp').forEach(c=>c.checked = master.checked); }

async function eliminarSeleccionLP(){

}

function actualizarSubtiposLP(){
  const cat = document.getElementById('lp-categoria').value;
  const lista = cat === 'licencia' ? SUBTIPOS_LICENCIA : SUBTIPOS_PERMISO;
  document.getElementById('lp-subtipo').innerHTML = lista.map(t=>`<option value="${t[0]}">${t[1]}</option>`).join('');
  actualizarDetalleLP();
}

function actualizarDetalleLP(){
  const cat = document.getElementById('lp-categoria').value;
  const subtipo = document.getElementById('lp-subtipo').value;
  const lista = cat === 'licencia' ? SUBTIPOS_LICENCIA : SUBTIPOS_PERMISO;
  const t = lista.find(x=>x[0]===subtipo);
  const esOtra = subtipo === 'LICENCIA_OTRA' || subtipo === 'PERMISO_OTROS';
  document.getElementById('lp-detalle-wrap').style.display = esOtra ? 'block' : 'none';

  const requiereEvidencia = t ? t[2] : false;
  const alertaEl = document.getElementById('lp-alerta-evidencia');
  if(requiereEvidencia){
    let texto = 'Este subtipo requiere evidencia de respaldo.';
    if(subtipo==='MATRIMONIO' || subtipo==='FALLECIMIENTO_FAMILIAR_DIRECTO') texto += ' Debe presentarse a más tardar 72 horas después.';
    if(subtipo==='POR_ENFERMEDAD' || subtipo==='PRE_POST_NATAL') texto += ' Se requiere original y copia.';
    if(subtipo==='PARA_ESTUDIOS') texto = 'Debe solicitarse con 60 días de anticipación; será evaluada por una comisión ad-hoc.';
    alertaEl.innerHTML = `<div class="badge badge-amarillo" style="display:block;white-space:normal;padding:8px 10px;margin-bottom:10px;">⚠ ${texto}</div>`;
  } else {
    alertaEl.innerHTML = '';
  }
}

async function guardarLP(){
  const personalId = document.getElementById('lp-personal-id').value;
  if(!personalId){ toast('Selecciona el empleado.','error'); return; }

  const categoria = document.getElementById('lp-categoria').value;
  const subtipo = document.getElementById('lp-subtipo').value;
  const lista = categoria === 'licencia' ? SUBTIPOS_LICENCIA : SUBTIPOS_PERMISO;
  const t = lista.find(x=>x[0]===subtipo);

  const payload = {
    personal_id: personalId,
    fecha_solicitud: document.getElementById('lp-fecha-solicitud').value || new Date().toISOString().slice(0,10),
    categoria, subtipo,
    subtipo_detalle: document.getElementById('lp-detalle').value.trim() || null,
    duracion_dias: parseInt(document.getElementById('lp-dias').value)||0,
    duracion_meses: parseInt(document.getElementById('lp-meses').value)||0,
    duracion_anios: parseInt(document.getElementById('lp-anios').value)||0,
    fecha_inicio: document.getElementById('lp-fecha-inicio').value || null,
    fecha_fin: document.getElementById('lp-fecha-fin').value || null,
    comentario: document.getElementById('lp-comentario').value.trim() || null,
    evidencia_requerida: t ? t[2] : false,
    evidencia_presentada: document.getElementById('lp-evidencia-presentada').checked,
  };
  const { error } = await sb.from('licencias_permisos_rh').insert(payload);
  if(error){ toast(error.message,'error'); return; }
  toast('Solicitud guardada correctamente.','exito');
  cerrarModal('modal-lp');
  renderLicenciasPermisos();
}
