// Detecta encabezados típicos del archivo de nómina del MINERD/Contraloría,
// tolerando variaciones de nombre de columna.
function formatearFechaCelda(valor){
  if(valor===null || valor===undefined || valor==='') return null;
  if(valor instanceof Date && !isNaN(valor)) return valor.toISOString().slice(0,10);
  if(typeof valor === 'number'){
    // Convierte número serial de Excel (días desde 1900, con el bug del año bisiesto) a fecha
    const ms = Math.round((valor - 25569) * 86400 * 1000);
    const d = new Date(ms);
    if(!isNaN(d)) return d.toISOString().slice(0,10);
  }
  return String(valor).trim() || null;
}

function normalizarNombreCentro(nombre){
  if(!nombre) return '';
  let n = String(nombre).toUpperCase()
    .replace(/[ÁÀÄ]/g,'A').replace(/[ÉÈË]/g,'E').replace(/[ÍÌÏ]/g,'I').replace(/[ÓÒÖ]/g,'O').replace(/[ÚÙÜ]/g,'U').replace(/Ñ/g,'N')
    .replace(/[.,()]/g,' ');
  // Quita prefijos típicos de nivel/tipo de centro
  n = n.replace(/^(ESC\s*PRIM|ESC\s*NOCT|ESCUELA\s*PRIMARIA|LIC\s*SEC\s*VESP|LIC\s*SEC|LICEO|LIC|CEB|CENTRO\s*EDUC(ATIVO)?|POLITECNICO|POLIT|ESC\b|PROF\s+)+/,'');
  // Quita sufijos típicos de jornada/matrícula/código de distrito
  n = n.replace(/\b(MAT|VESP|NOCT|ADULTOS|PREPARA|J\s*E\s*E|JEE|16-06|1606)\b/g,'');
  n = n.replace(/[^A-Z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
  return n;
}

function detectarColumnas(headers){
  const norm = h => h.toString().toLowerCase().trim()
    .replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u');
  const mapa = {};
  headers.forEach((h,i)=>{
    const n = norm(h);
    if(/cedula/.test(n)) mapa.cedula = i;
    else if(/nombres?\s*(y|\/)\s*apellidos?|nombre completo|nombre empleado/.test(n)) mapa.nombre = i;
    else if(/apellido/.test(n)) mapa.apellidos = i;
    else if(/^nombre|nombres?$/.test(n)) mapa.nombre = i;
    else if(/cargo|posicion|puesto/.test(n)) mapa.cargo = i;
    else if(/sigerd/.test(n)) mapa.sigerd = i;
    else if(/^dependencia$|numero.*dependencia|dependencia.*numero/.test(n)) mapa.dependencia = i;
    else if(/centro|descripcion/.test(n)) mapa.centro = i;
    else if(/bruto|sueldo\s*base/.test(n)) mapa.bruto = i;
    else if(/descuent/.test(n)) mapa.descuentos = i;
    else if(/neto/.test(n)) mapa.neto = i;
    else if(/fecha.*ingreso|ingreso.*fecha/.test(n)) mapa.fechaIngreso = i;
    else if(/personal.*carrera|carrera.*personal/.test(n)) mapa.personalCarrera = i;
    else if(/personal.*docente|docente/.test(n)) mapa.personalDocente = i;
    else if(/reg\s*\/?\s*dist/.test(n)) mapa.regDist = i;
    else if(/tiempo.*servicio/.test(n)) mapa.tiempoServicio = i;
    else if(/^edad$/.test(n)) mapa.edad = i;
    else if(/pension|jubilacion/.test(n)) mapa.personalPension = i;
    else if(/^dep$/.test(n)) mapa.dep = i;
    else if(/^tarj/.test(n)) mapa.tarjeta = i;
    else if(/total.*ingreso/.test(n)) mapa.totalIngreso = i;
  });
  return mapa;
}

async function procesarImportacionNomina(){
  const archivo = document.getElementById('nom-archivo').files[0];
  const mes = parseInt(document.getElementById('nom-mes').value);
  const anio = parseInt(document.getElementById('nom-anio').value);
  const fechaPago = document.getElementById('nom-fecha-pago').value || null;
  const compararHistorial = document.getElementById('nom-comparar').checked;

  if(!archivo){ toast('Selecciona el archivo de nómina.','error'); return; }
  if(!mes || !anio){ toast('Indica mes y año.','error'); return; }

  const btn = document.getElementById('btn-importar-nomina');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Procesando…';

  try{
    const filas = await leerArchivoNomina(archivo);
    if(!filas.length) throw new Error('El archivo no contiene filas de datos.');

    // Detecta automáticamente la fila de encabezados reales (por si el archivo trae
    // títulos como "DIRECCION DE RECURSOS HUMANOS" / "DEPARTAMENTO DE NOMINA" antes)
    const normNom = h => h.toString().toLowerCase().trim()
      .replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u');
    const patronesEncabezadoNom = [/cedula/, /nombres?|apellidos?/, /cargo|posicion|puesto/, /sigerd/,
      /dependencia/, /centro|descripcion/, /bruto|sueldo\s*base/, /descuent/, /neto/, /fecha/];
    let headerRowIdxNom = 0, mejorCoincidenciasNom = -1;
    for(let i=0; i<Math.min(filas.length,15); i++){
      const coincidencias = filas[i].filter(c=>{ const n=normNom(c); return n && patronesEncabezadoNom.some(p=>p.test(n)); }).length;
      if(coincidencias > mejorCoincidenciasNom){ mejorCoincidenciasNom = coincidencias; headerRowIdxNom = i; }
    }
    const headers = filas[headerRowIdxNom];
    const mapa = detectarColumnas(headers);
    if(mapa.cedula === undefined) throw new Error('No se pudo detectar la columna de cédula en el archivo.');

    const registros = filas.slice(headerRowIdxNom+1).filter(f=>f[mapa.cedula]).map(f=>{
      const nombreCol = mapa.nombre!==undefined ? String(f[mapa.nombre]||'').trim() : '';
      const apellidosCol = mapa.apellidos!==undefined ? String(f[mapa.apellidos]||'').trim() : '';
      const nombreCompleto = apellidosCol ? (nombreCol+' '+apellidosCol).trim() : nombreCol;
      return {
        cedula_archivo: String(f[mapa.cedula]).trim(),
        nombre_archivo: nombreCompleto || null,
        nombres_col: nombreCol || null,
        apellidos_col: apellidosCol || null,
        cargo_archivo: mapa.cargo!==undefined ? String(f[mapa.cargo]||'').trim() : null,
        sigerd_archivo: mapa.sigerd!==undefined ? String(f[mapa.sigerd]||'').trim() : null,
        dependencia_archivo: mapa.dependencia!==undefined ? String(f[mapa.dependencia]||'').trim() : null,
        centro_archivo: mapa.centro!==undefined ? String(f[mapa.centro]||'').trim() : null,
        salario_bruto: mapa.bruto!==undefined ? parseFloat(f[mapa.bruto])||null : null,
        descuentos: mapa.descuentos!==undefined ? parseFloat(f[mapa.descuentos])||null : null,
        salario_neto: mapa.neto!==undefined ? parseFloat(f[mapa.neto])||null : null,
        fecha_ingreso_archivo: mapa.fechaIngreso!==undefined ? formatearFechaCelda(f[mapa.fechaIngreso]) : null,
        personal_carrera: mapa.personalCarrera!==undefined ? String(f[mapa.personalCarrera]||'').trim()||null : null,
        personal_docente: mapa.personalDocente!==undefined ? String(f[mapa.personalDocente]||'').trim()||null : null,
        reg_dist: mapa.regDist!==undefined ? String(f[mapa.regDist]||'').trim()||null : null,
        tiempo_servicio: mapa.tiempoServicio!==undefined ? String(f[mapa.tiempoServicio]||'').trim()||null : null,
        edad: mapa.edad!==undefined ? parseInt(f[mapa.edad])||null : null,
        personal_pension: mapa.personalPension!==undefined ? String(f[mapa.personalPension]||'').trim()||null : null,
        dep_archivo: mapa.dep!==undefined ? String(f[mapa.dep]||'').trim()||null : null,
        tarjeta_archivo: mapa.tarjeta!==undefined ? String(f[mapa.tarjeta]||'').trim()||null : null,
        total_ingreso: mapa.totalIngreso!==undefined ? parseFloat(f[mapa.totalIngreso])||null : null,
      };
    });

    // Deduplicar por cédula dentro del mismo archivo (por si el PDF repite encabezados de página)
    const vistos = new Set();
    const registrosUnicos = registros.filter(r=>{
      const ced = r.cedula_archivo.replace(/[^0-9]/g,'');
      if(!ced || vistos.has(ced)) return false;
      vistos.add(ced);
      return true;
    });

    const { data: nomina, error: errNom } = await sb.from('nominas_rh')
      .insert({ mes, anio, fecha_pago: fechaPago, archivo_origen: archivo.name })
      .select('id').single();
    if(errNom) throw errNom;

    // ---- PASO 1: UPSERT de centros (por dependencia, o por SIGERD si no hay dependencia) ----
    const { data: centrosExistentes } = await sb.from('centros_rh').select('id,codigo_sigerd,numero_dependencia_nomina,nombre_centro');
    const mapaCentroPorDependencia = {};
    const mapaCentroPorSigerd = {};
    const mapaCentroPorNombre = {};
    (centrosExistentes||[]).forEach(c=>{
      if(c.numero_dependencia_nomina) mapaCentroPorDependencia[c.numero_dependencia_nomina] = c.id;
      if(c.codigo_sigerd) mapaCentroPorSigerd[c.codigo_sigerd] = c.id;
      if(c.nombre_centro){
        const clave = normalizarNombreCentro(c.nombre_centro);
        if(clave) mapaCentroPorNombre[clave] = c.id;
      }
    });

    const centrosNuevos = [];
    const vistosCentro = new Set();
    registrosUnicos.forEach(r=>{
      const dep = r.dependencia_archivo, sig = r.sigerd_archivo;
      if(!dep && !sig) return;
      const yaExiste = (dep && mapaCentroPorDependencia[dep]) || (sig && mapaCentroPorSigerd[sig]);
      const clave = dep || sig;
      if(yaExiste || vistosCentro.has(clave)) return;
      vistosCentro.add(clave);
      centrosNuevos.push({
        nombre_centro: r.centro_archivo || `Centro dependencia ${dep||sig}`,
        codigo_sigerd: sig || null,
        numero_dependencia_nomina: dep || null,
      });
    });

    if(centrosNuevos.length){
      const { data: insertados, error: errCentros } = await sb.from('centros_rh').insert(centrosNuevos).select('id,codigo_sigerd,numero_dependencia_nomina');
      if(errCentros) throw errCentros;
      (insertados||[]).forEach(c=>{
        if(c.numero_dependencia_nomina) mapaCentroPorDependencia[c.numero_dependencia_nomina] = c.id;
        if(c.codigo_sigerd) mapaCentroPorSigerd[c.codigo_sigerd] = c.id;
      });
    }

    function resolverCentroId(r){
      if(r.dependencia_archivo && mapaCentroPorDependencia[r.dependencia_archivo]) return mapaCentroPorDependencia[r.dependencia_archivo];
      if(r.sigerd_archivo && mapaCentroPorSigerd[r.sigerd_archivo]) return mapaCentroPorSigerd[r.sigerd_archivo];
      if(r.centro_archivo){
        const clave = normalizarNombreCentro(r.centro_archivo);
        if(clave && mapaCentroPorNombre[clave]) return mapaCentroPorNombre[clave];
        // Si no hay coincidencia exacta, busca el nombre de centro guardado que esté
        // contenido dentro del texto del archivo (o viceversa)
        for(const nombreClave in mapaCentroPorNombre){
          if(nombreClave.length>3 && (clave.includes(nombreClave) || nombreClave.includes(clave))) return mapaCentroPorNombre[nombreClave];
        }
      }
      return null;
    }

    // ---- PASO 2: UPSERT de personal (por cédula), actualizando cargo/centro si cambiaron ----
    // .range() amplía el límite de 1000 filas que Supabase aplica por defecto,
    // necesario porque el personal del distrito puede superar esa cifra.
    const personalExistente = await fetchTodasLasFilas('personal_rh', 'id,cedula,nombres,apellidos,sexo,cargo_actual,centro_id,fecha_ingreso', q=>q.order('id'));
    const mapaPersonal = {};
    (personalExistente||[]).forEach(p=>{ mapaPersonal[p.cedula.replace(/[^0-9]/g,'')] = p; });

    const personalNuevo = [];
    const personalActualizar = [];
    // Acumula, por centro, qué número de dependencia (columna DEP del archivo) aparece
    // más entre los empleados de ese centro — para completar el dato del centro si
    // le faltaba, sin depender de que el archivo de centros lo haya traído.
    const centrosSinDependencia = new Set((centrosExistentes||[]).filter(c=>!c.numero_dependencia_nomina).map(c=>c.id));
    const depPorCentro = {};

    registrosUnicos.forEach(r=>{
      const cedNorm = r.cedula_archivo.replace(/[^0-9]/g,'');
      const centroId = resolverCentroId(r);
      if(centroId && r.dep_archivo && centrosSinDependencia.has(centroId)){
        depPorCentro[centroId] = depPorCentro[centroId] || {};
        depPorCentro[centroId][r.dep_archivo] = (depPorCentro[centroId][r.dep_archivo]||0) + 1;
      }
      const existente = mapaPersonal[cedNorm];

      if(!existente){
        personalNuevo.push({
          cedula: r.cedula_archivo,
          nombres: r.nombres_col || r.nombre_archivo || 'Sin nombre',
          apellidos: r.apellidos_col || '',
          sexo: 'M', // dato no provisto por la nómina; se ajusta manualmente luego si aplica
          cargo_actual: r.cargo_archivo || null,
          centro_id: centroId,
          numero_dependencia_nomina: r.dependencia_archivo || null,
          fecha_ingreso: r.fecha_ingreso_archivo || null,
          estatus: 'activo',
        });
      } else {
        const necesitaActualizar = (r.cargo_archivo && r.cargo_archivo !== existente.cargo_actual)
          || (centroId && centroId !== existente.centro_id)
          || (r.fecha_ingreso_archivo && !existente.fecha_ingreso)
          || existente.estatus !== 'activo';
        if(necesitaActualizar){
          // Se manda la fila completa (no solo lo que cambia): el upsert de Supabase
          // arma un INSERT ... ON CONFLICT por debajo, y cualquier columna obligatoria
          // que falte en el payload rompe esa validación antes de llegar al UPDATE.
          personalActualizar.push({
            id: existente.id,
            cedula: existente.cedula,
            nombres: existente.nombres,
            apellidos: existente.apellidos,
            sexo: existente.sexo,
            cargo_actual: r.cargo_archivo || existente.cargo_actual,
            centro_id: centroId || existente.centro_id,
            // Solo llena la fecha de ingreso si el empleado no la tenía ya (no pisa
            // una fecha correcta ya registrada por otra vía)
            fecha_ingreso: existente.fecha_ingreso || r.fecha_ingreso_archivo || null,
            estatus: 'activo',
          });
        }
      }
    });

    // Completa el número de dependencia de los centros que no lo tenían, usando el
    // valor más frecuente visto en la nómina para ese centro.
    const centrosADependenciaActualizar = Object.entries(depPorCentro).map(([centroId, conteos])=>{
      const depMasFrecuente = Object.entries(conteos).sort((a,b)=>b[1]-a[1])[0][0];
      return { id: Number(centroId), numero_dependencia_nomina: depMasFrecuente };
    });
    if(centrosADependenciaActualizar.length){
      for(const c of centrosADependenciaActualizar){
        await sb.from('centros_rh').update({ numero_dependencia_nomina: c.numero_dependencia_nomina }).eq('id', c.id);
      }
    }

    if(personalNuevo.length){
      const sinCedula = personalNuevo.filter(p=>!p.cedula || !String(p.cedula).trim());
      if(sinCedula.length){
        throw new Error(`${sinCedula.length} registro(s) nuevo(s) sin cédula válida antes de guardar (ej: nombre "${sinCedula[0].nombres} ${sinCedula[0].apellidos}"). Revisa esas filas en el Excel.`);
      }
      for(let i=0; i<personalNuevo.length; i+=500){
        const lote = personalNuevo.slice(i, i+500);
        btn.innerHTML = `<span class="spinner"></span> Creando personal nuevo ${Math.min(i+500,personalNuevo.length)}/${personalNuevo.length}…`;
        const { data: insertadosP, error: errPersNuevo } = await sb.from('personal_rh').insert(lote).select('id,cedula');
        if(errPersNuevo) throw new Error(`Guardando personal nuevo (lote ${i+1}-${Math.min(i+500,personalNuevo.length)}): ${errPersNuevo.message}`);
        (insertadosP||[]).forEach(p=>{ mapaPersonal[p.cedula.replace(/[^0-9]/g,'')] = { id:p.id }; });
      }
    }
    // Actualiza en lotes de 500 (en vez de una solicitud por empleado, que con miles
    // de registros podía tardar varios minutos y parecer que la pantalla se congeló)
    for(let i=0; i<personalActualizar.length; i+=500){
      const lote = personalActualizar.slice(i, i+500);
      btn.innerHTML = `<span class="spinner"></span> Actualizando personal ${Math.min(i+500,personalActualizar.length)}/${personalActualizar.length}…`;
      const { error: errActualizar } = await sb.from('personal_rh').upsert(lote, { onConflict: 'id' });
      if(errActualizar) throw new Error(`Actualizando personal (lote ${i+1}-${Math.min(i+500,personalActualizar.length)}): ${errActualizar.message}`);
    }

    // Refrescar mapa completo de personal (incluye nuevos) para el cruce del detalle
    const personalFinal = await fetchTodasLasFilas('personal_rh', 'id,cedula', q=>q.order('id'));
    const mapaPersonalFinal = {};
    (personalFinal||[]).forEach(p=>{ mapaPersonalFinal[p.cedula.replace(/[^0-9]/g,'')] = p.id; });

    // ---- PASO 3: Guardar detalle de nómina con el cruce ya resuelto ----
    const detalle = registrosUnicos.map(r=>{
      const cedNorm = r.cedula_archivo.replace(/[^0-9]/g,'');
      const personalId = mapaPersonalFinal[cedNorm] || null;
      return {
        cedula_archivo: r.cedula_archivo,
        nombre_archivo: r.nombre_archivo,
        centro_archivo: r.centro_archivo,
        salario_bruto: r.salario_bruto,
        descuentos: r.descuentos,
        salario_neto: r.salario_neto,
        nomina_id: nomina.id,
        personal_id: personalId,
        match_estado: personalId ? 'encontrado' : 'no_encontrado',
        cargo_archivo: r.cargo_archivo,
        fecha_ingreso_archivo: r.fecha_ingreso_archivo,
        personal_carrera: r.personal_carrera,
        personal_docente: r.personal_docente,
        reg_dist: r.reg_dist,
        tiempo_servicio: r.tiempo_servicio,
        edad: r.edad,
        personal_pension: r.personal_pension,
        dep_archivo: r.dep_archivo,
        tarjeta_archivo: r.tarjeta_archivo,
        total_ingreso: r.total_ingreso,
      };
    });

    for(let i=0; i<detalle.length; i+=500){
      const lote = detalle.slice(i, i+500);
      btn.innerHTML = `<span class="spinner"></span> Guardando ${Math.min(i+500,detalle.length)}/${detalle.length}…`;
      const { error: errDet } = await sb.from('detalle_nomina_rh').insert(lote);
      if(errDet) throw new Error(`Guardando detalle (lote ${i+1}-${Math.min(i+500,detalle.length)}): ${errDet.message}`);
    }

    const encontrados = detalle.filter(d=>d.match_estado==='encontrado').length;
    const noEncontrados = detalle.length - encontrados;

    let resumenMovimientos = '';
    if(compararHistorial){
      const mov = await compararConHistorial(nomina.id, registrosUnicos, mapaPersonalFinal);
      resumenMovimientos = `<br><span style="color:var(--verde-600);font-weight:600;">${mov.nuevos}</span> nuevos ·
        <span style="color:var(--azul-600);font-weight:600;">${mov.reingresos}</span> reingresos ·
        <span style="color:var(--rojo-600);font-weight:600;">${mov.cancelados}</span> cancelados`;
    }

    const resumenMaestro = `<br><span class="texto-ayuda">Catálogo: ${centrosNuevos.length} centro(s) nuevo(s) ·
      ${personalNuevo.length} empleado(s) nuevo(s) en personal · ${personalActualizar.length} actualizado(s) (cargo/centro)</span>`;

    document.getElementById('nom-resumen-preview').innerHTML = `
      <div class="texto-ayuda" style="margin-top:10px;">
        <strong>${detalle.length}</strong> registros importados ·

// Compara la nómina recién importada contra TODO el historial acumulado
// (detalle_nomina_rh de nóminas anteriores) para detectar:
//  - nuevo: cédula nunca vista en ninguna nómina anterior
//  - reingreso: cédula vista antes, no estaba en la última nómina anterior, ahora sí
//  - cancelado: cédula estaba en la última nómina anterior y ya no aparece en esta
async function compararConHistorial(nominaNuevaId, registrosNuevos, mapaPersonal){
  // Nómina inmediatamente anterior a la actual (por fecha de creación, excluyendo la nueva)
  const { data: nominaAnterior } = await sb.from('nominas_rh')
    .select('id, mes, anio').neq('id', nominaNuevaId)
    .order('anio',{ascending:false}).order('mes',{ascending:false}).limit(1).maybeSingle();

  // Todo el historial de cédulas que han aparecido en CUALQUIER nómina anterior
  const historico = await fetchTodasLasFilas('detalle_nomina_rh', 'cedula_archivo, nomina_id', q=>q.neq('nomina_id', nominaNuevaId));

  const cedulasHistoricas = new Set((historico||[]).map(h=>h.cedula_archivo.replace(/[^0-9]/g,'')));

  let cedulasNominaAnterior = new Set();
  if(nominaAnterior){
    const detAnterior = await fetchTodasLasFilas('detalle_nomina_rh', 'cedula_archivo, nombre_archivo, personal_id', q=>q.eq('nomina_id', nominaAnterior.id));
    cedulasNominaAnterior = new Set((detAnterior||[]).map(d=>d.cedula_archivo.replace(/[^0-9]/g,'')));
    window._detAnteriorCache = detAnterior || [];
  }

  const cedulasNuevaNomina = new Set(registrosNuevos.map(r=>r.cedula_archivo.replace(/[^0-9]/g,'')));

  const movimientos = [];
  let nuevos = 0, reingresos = 0, cancelados = 0;

  // Nuevos y reingresos: presentes en la nómina nueva
  registrosNuevos.forEach(r=>{
    const ced = r.cedula_archivo.replace(/[^0-9]/g,'');
    if(!ced) return;
    const estabaEnAnterior = cedulasNominaAnterior.has(ced);
    const habiaAparecidoAntes = cedulasHistoricas.has(ced);

    if(!habiaAparecidoAntes){
      movimientos.push({
        nomina_id: nominaNuevaId, personal_id: mapaPersonal[ced]||null,
        cedula: r.cedula_archivo, nombre: r.nombre_archivo,
        tipo_movimiento: 'nuevo',
      });
      nuevos++;
    } else if(!estabaEnAnterior){
      movimientos.push({
        nomina_id: nominaNuevaId, personal_id: mapaPersonal[ced]||null,
        cedula: r.cedula_archivo, nombre: r.nombre_archivo,
        tipo_movimiento: 'reingreso',
      });
      reingresos++;
    }
  });

  // Cancelados: estaban en la nómina anterior pero no en la nueva
  if(nominaAnterior){
    (window._detAnteriorCache||[]).forEach(d=>{
      const ced = d.cedula_archivo.replace(/[^0-9]/g,'');
      if(ced && !cedulasNuevaNomina.has(ced)){
        movimientos.push({
          nomina_id: nominaNuevaId, personal_id: d.personal_id||null,
          cedula: d.cedula_archivo, nombre: d.nombre_archivo,
          tipo_movimiento: 'cancelado', ultima_nomina_presente_id: nominaAnterior.id,
        });
        cancelados++;
      }
    });
  }

  if(movimientos.length){
    for(let i=0; i<movimientos.length; i+=500){
      const lote = movimientos.slice(i, i+500);
      const { error } = await sb.from('movimientos_nomina_rh').insert(lote);
      if(error) console.error('Error guardando movimientos:', error.message);
    }

    // Marcar automáticamente como inactivo/cancelado en personal_rh a quienes
    // ya no aparecen en la nómina nueva
    const idsCancelados = movimientos.filter(m=>m.tipo_movimiento==='cancelado' && m.personal_id).map(m=>m.personal_id);
    if(idsCancelados.length){
      await sb.from('personal_rh').update({ estatus:'inactivo' }).in('id', idsCancelados);
    }
  }

  return { nuevos, reingresos, cancelados };
}

// Lee CSV, Excel o PDF y devuelve array de filas (incluyendo encabezado en fila 0)
function leerArchivoNomina(archivo){
  const nombre = archivo.name.toLowerCase();
  if(nombre.endsWith('.pdf')) return leerPDFNomina(archivo);
  return new Promise((resolve, reject)=>{
    if(nombre.endsWith('.csv')){
      const reader = new FileReader();
      reader.onload = e => {
        const lineas = e.target.result.split(/\r?\n/).filter(l=>l.trim().length);
        resolve(lineas.map(l=>l.split(',').map(c=>c.trim())));
      };
      reader.onerror = reject;
      reader.readAsText(archivo, 'UTF-8');
    } else {
      if(typeof XLSX === 'undefined'){
        reject(new Error('No se pudo cargar el lector de Excel. Verifica tu conexión a internet.'));
        return;
      }
      const reader = new FileReader();
      reader.onload = e => {
        try{
          const wb = XLSX.read(e.target.result, { type:'array' });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const filas = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
          resolve(filas.filter(f=>f.some(c=>String(c).trim().length)));
        }catch(err){ reject(err); }
      };
      reader.onerror = reject;
      reader.readAsArrayBuffer(archivo);
    }
  });
}

// Extrae texto de un PDF (debe tener texto seleccionable, no ser escaneo) y lo
// reconstruye en filas/columnas aproximando por posición X de cada palabra.
async function leerPDFNomina(archivo){
  if(typeof pdfjsLib === 'undefined'){
    throw new Error('No se pudo cargar el lector de PDF. Verifica tu conexión a internet.');
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const buffer = await archivo.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;

  const filas = [];
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const contenido = await page.getTextContent();

    // Agrupar items por línea (misma coordenada Y aproximada)
    const lineasMapa = {};
    contenido.items.forEach(item=>{
      const y = Math.round(item.transform[5]);
      if(!lineasMapa[y]) lineasMapa[y] = [];
      lineasMapa[y].push({ x: item.transform[4], texto: item.str });
    });

    Object.keys(lineasMapa).sort((a,b)=>b-a).forEach(y=>{
      const items = lineasMapa[y].sort((a,b)=>a.x-b.x);
      // Unir palabras cercanas en la misma "columna" usando saltos de espacio amplio como separador de celda
      const celdas = [];
      let celdaActual = '';
      let xAnterior = null;
      items.forEach(it=>{
        if(xAnterior !== null && (it.x - xAnterior) > 25){
          celdas.push(celdaActual.trim());
          celdaActual = '';
        }
        celdaActual += (celdaActual ? ' ' : '') + it.texto;
        xAnterior = it.x + it.texto.length*3;
      });
      if(celdaActual.trim()) celdas.push(celdaActual.trim());
      if(celdas.some(c=>c.length)) filas.push(celdas);
    });
  }
  return filas.filter(f=>f.some(c=>String(c).trim().length));
}

function filtrarDetalleNomina(){
  const q = (document.getElementById('detnom-buscar').value||'').toLowerCase().trim();
  const cruce = document.getElementById('detnom-filtro-cruce').value;
  const docente = document.getElementById('detnom-filtro-docente').value;
  const carrera = document.getElementById('detnom-filtro-carrera').value;
  const esSi = v => /^s[ií]?$/i.test(String(v||'').trim());

  const filtrado = (window._detalleNominaTodos||[]).filter(d=>{
    if(cruce && d.match_estado !== cruce) return false;
    if(docente){ const si = esSi(d.personal_docente); if(docente==='si' && !si) return false; if(docente==='no' && si) return false; }
    if(carrera){ const si = esSi(d.personal_carrera); if(carrera==='si' && !si) return false; if(carrera==='no' && si) return false; }
    if(q){
      const nombre = d.personal_rh ? d.personal_rh.nombres+' '+d.personal_rh.apellidos : (d.nombre_archivo||'');
      const cargo = (d.personal_rh && d.personal_rh.cargo_actual) || d.cargo_archivo || '';
      const texto = `${d.cedula_archivo||''} ${nombre} ${cargo} ${d.centro_archivo||''}`.toLowerCase();
      if(!texto.includes(q)) return false;
    }
    return true;
  });

  window._detalleNominaActual = filtrado;
  renderTablaDetalleNomina(filtrado);
}

function calcularEstadisticas(data){
  const totales = { empleados: data.length, bruto: 0, descuentos: 0, neto: 0 };
  const porCargo = {}, porCentro = {}, porDocente = {'Sí':0,'No':0}, porCarrera = {'Sí':0,'No':0}, porCruce = {'Encontrado':0,'No encontrado':0};
  const esSi = v => /^s[ií]?$/i.test(String(v||'').trim());

  data.forEach(d=>{
    totales.bruto += Number(d.salario_bruto)||0;
    totales.descuentos += Number(d.descuentos)||0;
    totales.neto += Number(d.salario_neto)||0;

    const cargo = (d.personal_rh && d.personal_rh.cargo_actual) || d.cargo_archivo || 'Sin cargo';
    if(!porCargo[cargo]) porCargo[cargo] = { count:0, bruto:0, neto:0 };
    porCargo[cargo].count++; porCargo[cargo].bruto += Number(d.salario_bruto)||0; porCargo[cargo].neto += Number(d.salario_neto)||0;

    const centro = d.centro_archivo || 'Sin centro';
    if(!porCentro[centro]) porCentro[centro] = { count:0, bruto:0, neto:0 };
    porCentro[centro].count++; porCentro[centro].bruto += Number(d.salario_bruto)||0; porCentro[centro].neto += Number(d.salario_neto)||0;

    porDocente[esSi(d.personal_docente) ? 'Sí' : 'No']++;
    porCarrera[esSi(d.personal_carrera) ? 'Sí' : 'No']++;
    porCruce[d.match_estado==='encontrado' ? 'Encontrado' : 'No encontrado']++;
  });

  return { totales, porCargo, porCentro, porDocente, porCarrera, porCruce };
}

// Lista plana de todos los módulos disponibles, derivada del menú real,
// para que los checkboxes de permisos siempre estén sincronizados con el menú.
function obtenerTodosLosModulos(){
  const lista = [];
  MENU_ADMIN.forEach(g=>{
    if(g.soloCreador) return; // la gestión de usuarios nunca es un permiso asignable
    g.items.forEach(it=>lista.push({ id: it.id, label: it.label, grupo: g.grupo }));
  });
  return lista;
}

function toggleAccesoTotal(){
  const total = document.getElementById('usuario-acceso-total').checked;
  document.querySelectorAll('.chk-permiso-modulo').forEach(c=>{ c.disabled = total; if(total) c.checked = false; });
}

function abrirModalUsuario(u){
  document.getElementById('titulo-modal-usuario').textContent = u ? 'Editar usuario' : 'Crear usuario';
  document.getElementById('usuario-id').value = u?.id || '';
  document.getElementById('usuario-usuario').value = u?.usuario || '';
  document.getElementById('usuario-usuario').disabled = !!u; // el nombre de usuario no se cambia una vez creado
  document.getElementById('usuario-pass').value = '';
  document.getElementById('usuario-pass').placeholder = u ? 'Dejar en blanco para no cambiarla' : 'Mínimo 4 caracteres';
  document.getElementById('usuario-nombre').value = u?.nombre || '';

  const rolesPredefinidos = ['Administrativo','Director Distrital','Analista RRHH','Secretaria','Contable','Supervisor'];
  const rolActual = u?.rol || 'Administrativo';
  const selectRol = document.getElementById('usuario-rol-select');
  if(rolesPredefinidos.includes(rolActual)){
    selectRol.value = rolActual;
    document.getElementById('usuario-rol').style.display = 'none';
    document.getElementById('usuario-rol').value = rolActual;
  } else {
    selectRol.value = '__otro__';
    document.getElementById('usuario-rol').style.display = 'block';
    document.getElementById('usuario-rol').value = rolActual;
  }

  const permisos = Array.isArray(u?.permisos_rh) ? u.permisos_rh : [];
  const accesoTotal = !u || permisos.length === 0;
  document.getElementById('usuario-acceso-total').checked = accesoTotal;
  document.querySelectorAll('.chk-permiso-modulo').forEach(c=>{
    c.disabled = accesoTotal;
    c.checked = permisos.includes(c.value);
  });

  abrirModal('modal-usuario');
}

function toggleRolPersonalizadoRH(){
  const esOtro = document.getElementById('usuario-rol-select').value === '__otro__';
  const input = document.getElementById('usuario-rol');
  input.style.display = esOtro ? 'block' : 'none';
  if(!esOtro) input.value = document.getElementById('usuario-rol-select').value;
  else input.value = '';
}

async function guardarUsuario(){
  const id = document.getElementById('usuario-id').value;
  const usuario = document.getElementById('usuario-usuario').value.trim().toLowerCase();
  const pass = document.getElementById('usuario-pass').value;
  const nombre = document.getElementById('usuario-nombre').value.trim();
  const rolSelect = document.getElementById('usuario-rol-select').value;
  const rol = (rolSelect === '__otro__' ? document.getElementById('usuario-rol').value.trim() : rolSelect) || 'Administrativo';

  if(!usuario || !nombre){ toast('Usuario y nombre son obligatorios.','error'); return; }
  if(rolSelect === '__otro__' && !document.getElementById('usuario-rol').value.trim()){
    toast('Escribe el rol personalizado.','error'); return;
  }
  if(!id && !pass){ toast('La contraseña es obligatoria para un usuario nuevo.','error'); return; }
  if(pass && pass.length < 4){ toast('La contraseña debe tener al menos 4 caracteres.','error'); return; }
  if(usuario === USUARIO_CREADOR){ toast('Ese nombre de usuario está reservado.','error'); return; }

  const accesoTotal = document.getElementById('usuario-acceso-total').checked;
  const permisos = accesoTotal ? null : [...document.querySelectorAll('.chk-permiso-modulo:checked')].map(c=>c.value);
  if(!accesoTotal && (!permisos || !permisos.length)){
    toast('Selecciona al menos un módulo, o marca "Acceso total".','error'); return;
  }

  const payload = { nombre, rol, permisos_rh: permisos };
  if(pass) payload.pass = pass;

  if(id){
    const { error } = await sb.from('usuarios_fin').update(payload).eq('id', id);
    if(error){ toast(error.message,'error'); return; }
  } else {
    const { data: existente } = await sb.from('usuarios_fin').select('id').eq('usuario', usuario).maybeSingle();
    if(existente){ toast('Ya existe un usuario con ese nombre.','error'); return; }
    const { error } = await sb.from('usuarios_fin').insert({ usuario, pass, ...payload });
    if(error){ toast(error.message,'error'); return; }
  }

  toast('Usuario guardado correctamente.','exito');
  cerrarModal('modal-usuario');
  renderUsuarios();
}

        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;">
          ${MANUAL_SECCIONES.map(s=>`<a href="#manual-${s.id}" class="badge badge-azul" style="text-decoration:none;cursor:pointer;">${escapeHtml(s.titulo)}</a>`).join('')}
        </div>
        <div id="manual-contenido">
          ${MANUAL_SECCIONES.map(s=>`
            <div id="manual-${s.id}" style="margin-bottom:28px;padding-bottom:18px;border-bottom:1px solid var(--gris-300);">
              <h3 style="color:var(--azul-900);margin-bottom:8px;">${escapeHtml(s.titulo)}</h3>
              <div style="font-size:13.5px;line-height:1.7;color:var(--gris-900);">${s.contenido}</div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function generarHTMLManualCompleto(){
  const cuerpo = MANUAL_SECCIONES.map(s=>`
    <h2 style="color:#0d2340;margin-top:26px;">${escapeHtml(s.titulo)}</h2>
    <div>${s.contenido}</div>
  `).join('');
  return `<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
    <title>Manual del Sistema de RH - Distrito 16-06</title>
    <style>
      body{font-family:Arial,sans-serif;font-size:13px;color:#1a1a1a;line-height:1.6;padding:40px;max-width:880px;margin:0 auto;}
      h1{color:#0d2340;font-size:22px;border-bottom:3px solid #b3242c;padding-bottom:10px;}
      h2{font-size:15px;border-top:1px solid #ccc;padding-top:14px;}
      p{margin:6px 0;}
      .portada-sub{color:#555;font-size:13px;margin-bottom:30px;}
      @media print{ h2{page-break-before:auto;} }
    </style></head><body>
    <div style="text-align:center;margin-bottom:16px;"><img src="${LOGO_ENCABEZADO_B64}" alt="Escudo" style="width:90px;height:90px;border-radius:50%;"></div>
    <h1 style="text-align:center;">Manual del Sistema de Recursos Humanos</h1>
    <div class="portada-sub" style="text-align:center;">Distrito Educativo 16-06, Bonao Nordeste · MINERD</div>
    ${cuerpo}
  </body></html>`;
}

function imprimirManual(){
  const w = window.open('', '_blank');
  w.document.write(generarHTMLManualCompleto());
  w.document.close();
  setTimeout(()=>w.print(), 400);
}

function exportarManualPDF(){
  // Reutiliza el mismo HTML imprimible; el usuario elige "Guardar como PDF" en el diálogo de impresión.
  imprimirManual();
}

// Exporta como documento .doc compatible con Word (HTML con cabecera de Word),
// ya que generar un .docx real requeriría una librería adicional no cargada en este sistema.
function exportarManualWord(){
  const html = generarHTMLManualCompleto();
  const htmlWord = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
    <head><meta charset="UTF-8"><!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View></w:WordDocument></xml><![endif]--></head>
    <body>${html.replace(/<!DOCTYPE.*?>/,'').replace(/<html.*?>|<\/html>/g,'').replace(/<head>.*?<\/head>/s,'')}</body></html>`;
  const blob = new Blob(['\ufeff', htmlWord], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'manual_sistema_rh_1606.doc';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
</script>
