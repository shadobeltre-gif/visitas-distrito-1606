function descargarPlantillaLP(){
  if(typeof XLSX === 'undefined'){ toast('No se pudo generar la plantilla.','error'); return; }
  const datos = [
    { 'Cédula del empleado':'001-1234567-8', 'Fecha de solicitud (AAAA-MM-DD)':'2024-03-01',
      'Categoría (licencia/permiso)':'licencia', 'Subtipo':'POR_ENFERMEDAD', 'Detalle (si subtipo es Otra/Otros)':'',
      'Días':10, 'Meses':0, 'Años':0, 'Fecha inicio (AAAA-MM-DD)':'2024-03-02', 'Fecha fin (AAAA-MM-DD)':'2024-03-11',
      'Comentario':'Reposo médico', 'Evidencia presentada (SI/NO)':'SI', 'Estado':'aprobado_supervisor' },
  ];
  const ws = XLSX.utils.json_to_sheet(datos);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Licencias y Permisos');

  const ws2 = wb.create_sheet('Valores válidos para Subtipo');
  ws2.column_dimensions['A'].width = 35; ws2.column_dimensions['B'].width = 35; ws2.column_dimensions['C'].width = 14;
  ws2.append(['Código a escribir en "Subtipo"', 'Significado', 'Categoría']);
  SUBTIPOS_LICENCIA.forEach(s=>ws2.append([s[0], s[1], 'licencia']));
  SUBTIPOS_PERMISO.forEach(s=>ws2.append([s[0], s[1], 'permiso']));

  XLSX.writeFile(wb, 'plantilla_licencias_permisos.xlsx');
}

async function procesarImportacionLP(){
  const archivo = document.getElementById('lp-import-archivo').files[0];
  if(!archivo){ toast('Selecciona el archivo.','error'); return; }

  const btn = document.getElementById('btn-importar-lp');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Procesando…';

  try{
    const filas = await leerArchivoNomina(archivo);
    if(!filas.length) throw new Error('El archivo no contiene filas de datos.');
    const headers = filas[0];

    const norm = h => h.toString().toLowerCase().trim()
      .replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u');
    const mapa = {};
    headers.forEach((h,i)=>{
      const n = norm(h);
      if(/cedula/.test(n) && mapa.cedula===undefined) mapa.cedula = i;
      else if(/fecha.*solicitud/.test(n) && mapa.fechaSolicitud===undefined) mapa.fechaSolicitud = i;
      else if(/categoria/.test(n) && mapa.categoria===undefined) mapa.categoria = i;
      else if(/subtipo$|^subtipo/.test(n) && !/detalle/.test(n) && mapa.subtipo===undefined) mapa.subtipo = i;
      else if(/detalle/.test(n) && mapa.detalle===undefined) mapa.detalle = i;
      else if(/^dias$/.test(n) && mapa.dias===undefined) mapa.dias = i;
      else if(/^meses$/.test(n) && mapa.meses===undefined) mapa.meses = i;
      else if(/^anos$|^a.os$/.test(n) && mapa.anios===undefined) mapa.anios = i;
      else if(/inicio/.test(n) && mapa.inicio===undefined) mapa.inicio = i;
      else if(/^fecha fin$|fin\)/.test(n) && mapa.fin===undefined) mapa.fin = i;
      else if(/comentario/.test(n) && mapa.comentario===undefined) mapa.comentario = i;
      else if(/evidencia/.test(n) && mapa.evidencia===undefined) mapa.evidencia = i;
      else if(/estado/.test(n) && mapa.estado===undefined) mapa.estado = i;
    });
    if(mapa.cedula===undefined){ throw new Error('No se pudo detectar la columna de cédula del empleado.'); }
    if(mapa.categoria===undefined || mapa.subtipo===undefined){ throw new Error('No se pudo detectar las columnas de categoría/subtipo.'); }

    const registros = filas.slice(1).filter(f=>f[mapa.cedula] && String(f[mapa.cedula]).trim());
    if(!registros.length) throw new Error('No se encontraron filas válidas con cédula.');

    let creados = 0, errores = 0;
    const detalleErrores = [];
    const estadosValidos = ['solicitado','aprobado_supervisor','rechazado'];
    const subtiposValidos = [...SUBTIPOS_LICENCIA, ...SUBTIPOS_PERMISO];

    for(const f of registros){
      try{
        const cedula = String(f[mapa.cedula]).trim();
        const { data: persona } = await sb.from('personal_rh').select('id').eq('cedula', cedula).maybeSingle();
        if(!persona){ throw new Error('Empleado no encontrado en Personal. Impórtalo primero ahí.'); }

        const categoria = String(f[mapa.categoria]||'').trim().toLowerCase();
        if(categoria !== 'licencia' && categoria !== 'permiso'){ throw new Error('Categoría debe ser "licencia" o "permiso".'); }

        const subtipo = String(f[mapa.subtipo]||'').trim().toUpperCase().replace(/\s+/g,'_');
        const subtipoRef = subtiposValidos.find(s=>s[0]===subtipo);
        if(!subtipoRef){ throw new Error(`Subtipo "${subtipo}" no es válido. Revisa la hoja "Valores válidos para Subtipo".`); }

        let estado = mapa.estado!==undefined ? String(f[mapa.estado]||'').trim().toLowerCase() : '';
        if(!estadosValidos.includes(estado)) estado = 'solicitado';
        const evidenciaTexto = mapa.evidencia!==undefined ? String(f[mapa.evidencia]||'').trim().toUpperCase() : '';

        const { error: errLP } = await sb.from('licencias_permisos_rh').insert({
          personal_id: persona.id,
          fecha_solicitud: mapa.fechaSolicitud!==undefined ? (String(f[mapa.fechaSolicitud]||'').trim() || new Date().toISOString().slice(0,10)) : new Date().toISOString().slice(0,10),
          categoria, subtipo,
          subtipo_detalle: mapa.detalle!==undefined ? (String(f[mapa.detalle]||'').trim() || null) : null,
          duracion_dias: mapa.dias!==undefined ? (parseInt(f[mapa.dias])||0) : 0,
          duracion_meses: mapa.meses!==undefined ? (parseInt(f[mapa.meses])||0) : 0,
          duracion_anios: mapa.anios!==undefined ? (parseInt(f[mapa.anios])||0) : 0,
          fecha_inicio: mapa.inicio!==undefined ? (String(f[mapa.inicio]||'').trim() || null) : null,
          fecha_fin: mapa.fin!==undefined ? (String(f[mapa.fin]||'').trim() || null) : null,
          comentario: mapa.comentario!==undefined ? (String(f[mapa.comentario]||'').trim() || null) : null,
          evidencia_requerida: subtipoRef[2],
          evidencia_presentada: evidenciaTexto==='SI'||evidenciaTexto==='SÍ'||evidenciaTexto==='YES'||evidenciaTexto==='TRUE',
          estado,
        });
        if(errLP) throw errLP;
        creados++;
      }catch(errFila){
        errores++;
        detalleErrores.push(`Fila con cédula "${f[mapa.cedula]||'?'}": ${errFila.message}`);
      }
    }

    document.getElementById('lp-import-resumen-preview').innerHTML = `
      <div class="texto-ayuda" style="margin-top:10px;">
        <strong>${registros.length}</strong> filas procesadas ·
        <span style="color:var(--verde-600);font-weight:600;">${creados} creadas</span>
        ${errores ? `· <span style="color:var(--rojo-600);font-weight:600;">${errores} con error</span>` : ''}
        ${detalleErrores.length ? `<br><span style="color:var(--rojo-600);">${detalleErrores.slice(0,5).join('<br>')}</span>` : ''}
      </div>`;

    if(creados){
      toast(`${creados} solicitud(es) importada(s) correctamente.`,'exito');
      renderLicenciasPermisos();
    } else {
      toast('No se pudo importar ninguna solicitud. Revisa los errores.','error');
    }
  }catch(err){
    toast(err.message,'error');
  }finally{
    btn.disabled = false;
    btn.textContent = 'Importar';
  }
}

async function cambiarEstadoLP(id){
  const opciones = ['solicitado','aprobado_supervisor','rechazado'];
  const etiquetas = {solicitado:'Solicitado',aprobado_supervisor:'Aprobado supervisor',rechazado:'Rechazado'};
  const x = (window._licenciasPermisosData||[]).find(r=>r.id===id);
  if(!x) return;
  const idxActual = opciones.indexOf(x.estado);
  const elegido = prompt('Nuevo estado:\n'+opciones.map((o,i)=>`${i+1}. ${etiquetas[o]}`).join('\n'), String(idxActual+1));
  const idx = parseInt(elegido)-1;
  if(isNaN(idx) || !opciones[idx]) return;
  const { error } = await sb.from('licencias_permisos_rh').update({ estado: opciones[idx] }).eq('id', id);
  if(error){ toast(error.message,'error'); return; }
  toast('Estado actualizado.','exito');
  renderLicenciasPermisos();
}

// Reporte: nombre de centro, director (nombre/cédula si se captura), teléfono y dirección.
// Usa centros_rh y cruza con personal_rh para sacar contacto del director cuando aplica.
async function renderRelacionCentros(){
  const main = document.getElementById('main-content');
  const { data: centros, error } = await sb.from('centros_rh').select('*').order('nombre_centro');
  if(error){ toast(error.message,'error'); }

  const { data: personal } = await sb.from('personal_rh')
    .select('nombres,apellidos,cedula,telefono,direccion,centro_id,cargo_actual')
    .ilike('cargo_actual', '%director%');

  const directorPorCentro = {};
  (personal||[]).forEach(p=>{ if(p.centro_id && !directorPorCentro[p.centro_id]) directorPorCentro[p.centro_id] = p; });

  window._relacionCentrosData = (centros||[]).map(c=>{
    const dir = directorPorCentro[c.id];
    return {
      centro: c.nombre_centro,
      sigerd: c.codigo_sigerd || '',
      nombre_contacto: dir ? (dir.nombres+' '+dir.apellidos) : (c.director_nombre || ''),
      cedula_contacto: dir ? dir.cedula : '',
      telefono: dir ? (dir.telefono||'') : '',
      direccion: dir ? (dir.direccion||'') : '',
    };
  });

  main.innerHTML = `
    <div class="tarjeta">
      <div class="tarjeta-header">
        <h3>Relación de centros educativos (${window._relacionCentrosData.length})</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          ${botonesExportar('rc')}
        </div>
      </div>
      <div class="tarjeta-body">
        <div class="campo" style="max-width:340px;margin-bottom:14px;">
          <label>Buscar centro o contacto</label>
          <input type="text" id="filtro-rc-texto" oninput="filtrarRelacionCentros()" placeholder="Nombre del centro, persona o cédula…">
        </div>
        <div class="tabla-wrap">
          <table>
            <thead><tr>
              <th>Nombre del centro</th><th>Nombre de contacto</th><th>Cédula</th><th>Teléfono</th><th>Dirección</th>
            </tr></thead>
            <tbody id="tbody-relacion-centros"></tbody>
          </table>
        </div>
        <div class="texto-ayuda" style="margin-top:10px;">
          El contacto se toma automáticamente del personal con cargo "Director" asignado al centro; si no hay ninguno registrado, se usa el director capturado directamente en la ficha del centro.
        </div>
      </div>
    </div>
  `;
  pintarTablaRelacionCentros(window._relacionCentrosData);

  registrarExportadores('rc', ()=>window._relacionCentrosFiltrado||window._relacionCentrosData||[], [
    { label:'Nombre del Centro', key:'centro' },
    { label:'SIGERD', key:'sigerd' },
    { label:'Cédula Contacto', key:'cedula_contacto' },
    { label:'Nombre de Contacto', key:'nombre_contacto' },
    { label:'Teléfono', key:'telefono' },
    { label:'Dirección', key:'direccion' },
  ], 'relacion_centros_1606', 'Relación de Centros Educativos - Distrito 16-06');
}

function pintarTablaRelacionCentros(lista){
  window._relacionCentrosFiltrado = lista;
  const tbody = document.getElementById('tbody-relacion-centros');
  if(!lista || !lista.length){
    tbody.innerHTML = `<tr><td colspan="5"><div class="vacio"><div class="icono-vacio">📊</div>No hay centros registrados.</div></td></tr>`;
    return;
  }
  tbody.innerHTML = lista.map(r=>`
    <tr>
      <td><strong>${escapeHtml(r.centro)}</strong>${r.sigerd?' <span class="texto-ayuda">(SIGERD '+escapeHtml(r.sigerd)+')</span>':''}</td>
      <td>${escapeHtml(r.nombre_contacto||'—')}</td>
      <td>${escapeHtml(r.cedula_contacto||'—')}</td>
      <td>${escapeHtml(r.telefono||'—')}</td>
      <td>${escapeHtml(r.direccion||'—')}</td>
    </tr>
  `).join('');
}

function filtrarRelacionCentros(){
  const texto = document.getElementById('filtro-rc-texto').value.toLowerCase();
  const filtrado = (window._relacionCentrosData||[]).filter(r=>{
    const todo = `${r.centro} ${r.nombre_contacto} ${r.cedula_contacto}`.toLowerCase();
    return !texto || todo.includes(texto);
  });
  pintarTablaRelacionCentros(filtrado);
}

function pintarTablaRiesgos(lista){
  window._riesgosFiltrado = lista;
  const tbody = document.getElementById('tbody-riesgos');
  if(!lista || !lista.length){
    tbody.innerHTML = `<tr><td colspan="8"><div class="vacio"><div class="icono-vacio">⚠</div>No hay avisos de riesgo laboral registrados.</div></td></tr>`;
    return;
  }
  tbody.innerHTML = lista.map(r=>{
    const horas = (new Date(r.fecha_aviso) - new Date(r.fecha_evento)) / 36e5;
    const dentroPlazo = horas <= 72;
    return `
    <tr>
      <td><input type="checkbox" class="chk-rl" value="${r.id}"></td>
      <td><span class="badge ${r.tipo_formulario==='ATR-2'?'badge-azul':'badge-amarillo'}">${r.tipo_formulario}</span></td>
      <td>${escapeHtml((r.personal_rh?.nombres||'')+' '+(r.personal_rh?.apellidos||''))}</td>
      <td>${fechaCorta(r.fecha_evento)}</td>
      <td>${fechaCorta(r.fecha_aviso)}</td>
      <td>${dentroPlazo?'<span class="badge badge-verde">Dentro</span>':'<span class="badge badge-rojo">Fuera</span>'}</td>
      <td>${badgeEstado(r.estado)}</td>
      <td><button class="btn btn-secundario btn-chico" onclick="cambiarEstadoRiesgo(${r.id})">Estado</button></td>
    </tr>`;
  }).join('');
}

function filtrarRiesgos(){
  const texto = document.getElementById('filtro-rl-texto').value.toLowerCase();
  const tipo = document.getElementById('filtro-rl-tipo').value;
  const estado = document.getElementById('filtro-rl-estado').value;
  const filtrado = (window._riesgosData||[]).filter(r=>{
    const nombre = ((r.personal_rh?.nombres||'')+' '+(r.personal_rh?.apellidos||'')+' '+(r.personal_rh?.cedula||'')).toLowerCase();
    if(texto && !nombre.includes(texto)) return false;
    if(tipo && r.tipo_formulario !== tipo) return false;
    if(estado && r.estado !== estado) return false;
    return true;
  });
  pintarTablaRiesgos(filtrado);
}

function toggleTodosCheckRL(master){ document.querySelectorAll('.chk-rl').forEach(c=>c.checked = master.checked); }

async function eliminarSeleccionRiesgos(){
  const ids = [...document.querySelectorAll('.chk-rl:checked')].map(c=>c.value);
  if(!ids.length){ toast('Selecciona al menos un registro.','error'); return; }
  if(!confirm(`¿Eliminar ${ids.length} registro(s) seleccionado(s)?`)) return;
  const { error } = await sb.from('riesgos_laborales_rh').delete().in('id', ids);
  if(error){ toast(error.message,'error'); return; }
  toast('Registros eliminados.','exito');
  renderRiesgosLaborales();
}

async function abrirModalRiesgo(){
  document.getElementById('rl-fecha-evento').value = '';

  document.getElementById('rl-lugar').value = '';
  document.getElementById('rl-descripcion').value = '';
  document.getElementById('rl-cert-medico').checked = false;
  document.getElementById('rl-acta-policial').checked = false;
  document.getElementById('rl-firmado-rrhh').checked = false;
  document.getElementById('rl-alerta-plazo').innerHTML = '';
  await cargarPersonalSelect('rl-personal');
  await cargarCentrosSelect('rl-centro');
  abrirModal('modal-riesgo');
}

function validarPlazoRiesgo(){
  const fEvento = document.getElementById('rl-fecha-evento').value;
  const fAviso = document.getElementById('rl-fecha-aviso').value;
  const alertaEl = document.getElementById('rl-alerta-plazo');
  if(!fEvento || !fAviso){ alertaEl.innerHTML=''; return; }
  const horas = (new Date(fAviso) - new Date(fEvento)) / 36e5;
  if(horas > 72){
    alertaEl.innerHTML = `<div class="badge badge-rojo" style="display:block;white-space:normal;padding:8px 10px;">⚠ El aviso se está registrando fuera del plazo de 72 horas posteriores al evento.</div>`;
  } else if(horas >= 0){
    alertaEl.innerHTML = `<div class="badge badge-verde" style="display:block;white-space:normal;padding:8px 10px;">✓ Dentro del plazo de 72 horas.</div>`;
  } else {
    alertaEl.innerHTML = '';
  }
}

async function guardarRiesgo(){
  const personalId = document.getElementById('rl-personal-id').value;
  const fEvento = document.getElementById('rl-fecha-evento').value;
  const descripcion = document.getElementById('rl-descripcion').value.trim();
  if(!personalId || !fEvento || !descripcion){ toast('Completa empleado, fecha del evento y descripción.','error'); return; }

  const payload = {
    personal_id: personalId,
    tipo_formulario: document.getElementById('rl-tipo').value,
    centro_id: document.getElementById('rl-centro-id').value || null,
    fecha_evento: fEvento,
    fecha_aviso: document.getElementById('rl-fecha-aviso').value || new Date().toISOString().slice(0,10),
    descripcion_evento: descripcion,
    lugar_evento: document.getElementById('rl-lugar').value.trim() || null,
    tiene_certificado_medico: document.getElementById('rl-cert-medico').checked,
    tiene_acta_policial: document.getElementById('rl-acta-policial').checked,
    formulario_firmado_rrhh: document.getElementById('rl-firmado-rrhh').checked,
  };
  const { error } = await sb.from('riesgos_laborales_rh').insert(payload);
  if(error){ toast(error.message,'error'); return; }
  toast('Aviso de riesgo laboral guardado.','exito');
  cerrarModal('modal-riesgo');
  renderRiesgosLaborales();
}

  const datos = [
    { 'Cédula del empleado':'001-1234567-8', 'Tipo (ATR-2/EPR-1)':'ATR-2', 'Fecha del evento (AAAA-MM-DD)':'2024-03-05',
      'Fecha del aviso (AAAA-MM-DD)':'2024-03-06', 'Descripción':'Caída en las escaleras del centro durante la jornada',

async function procesarImportacionRL(){
  const archivo = document.getElementById('rl-import-archivo').files[0];
  if(!archivo){ toast('Selecciona el archivo.','error'); return; }

  const btn = document.getElementById('btn-importar-rl');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Procesando…';

  try{
    const filas = await leerArchivoNomina(archivo);
    if(!filas.length) throw new Error('El archivo no contiene filas de datos.');
    const headers = filas[0];

    const norm = h => h.toString().toLowerCase().trim()
      .replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u');
    const mapa = {};
    headers.forEach((h,i)=>{
      const n = norm(h);
      if(/cedula/.test(n) && mapa.cedula===undefined) mapa.cedula = i;
      else if(/tipo/.test(n) && mapa.tipo===undefined) mapa.tipo = i;
      else if(/evento/.test(n) && mapa.fechaEvento===undefined) mapa.fechaEvento = i;
      else if(/aviso/.test(n) && mapa.fechaAviso===undefined) mapa.fechaAviso = i;
      else if(/descripcion/.test(n) && mapa.descripcion===undefined) mapa.descripcion = i;
      else if(/lugar/.test(n) && mapa.lugar===undefined) mapa.lugar = i;
      else if(/centro/.test(n) && mapa.centro===undefined) mapa.centro = i;
      else if(/certificado/.test(n) && mapa.certMedico===undefined) mapa.certMedico = i;
      else if(/policial/.test(n) && mapa.actaPolicial===undefined) mapa.actaPolicial = i;
      else if(/firmado/.test(n) && mapa.firmado===undefined) mapa.firmado = i;
      else if(/estado/.test(n) && mapa.estado===undefined) mapa.estado = i;
    });
    if(mapa.cedula===undefined){ throw new Error('No se pudo detectar la columna de cédula del empleado.'); }
    if(mapa.tipo===undefined || mapa.fechaEvento===undefined || mapa.descripcion===undefined){
      throw new Error('No se pudo detectar las columnas de tipo, fecha del evento o descripción.');
    }

    const registros = filas.slice(1).filter(f=>f[mapa.cedula] && String(f[mapa.cedula]).trim());
    if(!registros.length) throw new Error('No se encontraron filas válidas con cédula.');

    let creados = 0, errores = 0;
    const detalleErrores = [];
    const esSiNo = v => { const t = String(v||'').trim().toUpperCase(); return t==='SI'||t==='SÍ'||t==='YES'||t==='TRUE'; };
    const estadosValidos = ['notificado','enviado_sisalril','calificado_AT_EP','rechazado'];

    for(const f of registros){
      try{
        const cedula = String(f[mapa.cedula]).trim();
        const { data: persona } = await sb.from('personal_rh').select('id').eq('cedula', cedula).maybeSingle();
        if(!persona){ throw new Error('Empleado no encontrado en Personal. Impórtalo primero ahí.'); }

        const tipo = String(f[mapa.tipo]||'').trim().toUpperCase();
        if(tipo !== 'ATR-2' && tipo !== 'EPR-1'){ throw new Error('Tipo debe ser "ATR-2" o "EPR-1".'); }

        const fechaEvento = String(f[mapa.fechaEvento]||'').trim();
        const descripcion = String(f[mapa.descripcion]||'').trim();
        if(!fechaEvento || !descripcion){ throw new Error('Faltan fecha del evento o descripción.'); }

        let centroId = null;
        const nombreCentro = mapa.centro!==undefined ? String(f[mapa.centro]||'').trim() : '';
        if(nombreCentro){
          const { data: centroExistente } = await sb.from('centros_rh').select('id').eq('nombre_centro', nombreCentro).maybeSingle();
          centroId = centroExistente ? centroExistente.id : null;
        }

        let estado = mapa.estado!==undefined ? String(f[mapa.estado]||'').trim().toLowerCase() : '';
        if(!estadosValidos.includes(estado)) estado = 'notificado';

        const { error: errRL } = await sb.from('riesgos_laborales_rh').insert({
          personal_id: persona.id, tipo_formulario: tipo,
          centro_id: centroId,
          fecha_evento: fechaEvento,
          fecha_aviso: mapa.fechaAviso!==undefined ? (String(f[mapa.fechaAviso]||'').trim() || new Date().toISOString().slice(0,10)) : new Date().toISOString().slice(0,10),
          descripcion_evento: descripcion,
          lugar_evento: mapa.lugar!==undefined ? (String(f[mapa.lugar]||'').trim() || null) : null,
          tiene_certificado_medico: mapa.certMedico!==undefined ? esSiNo(f[mapa.certMedico]) : false,
          tiene_acta_policial: mapa.actaPolicial!==undefined ? esSiNo(f[mapa.actaPolicial]) : false,
          formulario_firmado_rrhh: mapa.firmado!==undefined ? esSiNo(f[mapa.firmado]) : false,
          estado,
        });
        if(errRL) throw errRL;
        creados++;
      }catch(errFila){
        errores++;
        detalleErrores.push(`Fila con cédula "${f[mapa.cedula]||'?'}": ${errFila.message}`);
      }
    }

    document.getElementById('rl-import-resumen-preview').innerHTML = `
      <div class="texto-ayuda" style="margin-top:10px;">
        <strong>${registros.length}</strong> filas procesadas ·
        <span style="color:var(--verde-600);font-weight:600;">${creados} creados</span>
        ${errores ? `· <span style="color:var(--rojo-600);font-weight:600;">${errores} con error</span>` : ''}
        ${detalleErrores.length ? `<br><span style="color:var(--rojo-600);">${detalleErrores.slice(0,5).join('<br>')}</span>` : ''}
      </div>`;

    if(creados){
      toast(`${creados} aviso(s) importado(s) correctamente.`,'exito');
      renderRiesgosLaborales();
    } else {
      toast('No se pudo importar ningún aviso. Revisa los errores.','error');
    }
  }catch(err){
    toast(err.message,'error');
  }finally{
    btn.disabled = false;
    btn.textContent = 'Importar';
  }
}

async function cambiarEstadoRiesgo(id){
  const opciones = ['notificado','enviado_sisalril','calificado_AT_EP','rechazado'];
  const etiquetas = {notificado:'Notificado',enviado_sisalril:'Enviado SISALRIL',calificado_AT_EP:'Calificado AT/EP',rechazado:'Rechazado'};
  const r = (window._riesgosData||[]).find(x=>x.id===id);
  if(!r) return;
  const idxActual = opciones.indexOf(r.estado);
  const elegido = prompt('Nuevo estado:\n'+opciones.map((o,i)=>`${i+1}. ${etiquetas[o]}`).join('\n'), String(idxActual+1));
  const idx = parseInt(elegido)-1;
  if(isNaN(idx) || !opciones[idx]) return;
  const { error } = await sb.from('riesgos_laborales_rh').update({ estado: opciones[idx] }).eq('id', id);
  if(error){ toast(error.message,'error'); return; }
  toast('Estado actualizado.','exito');
  renderRiesgosLaborales();
}

function pintarTablaPensiones(lista){
  window._pensionesFiltrado = lista;
  const tbody = document.getElementById('tbody-pensiones');
  if(!lista || !lista.length){
    tbody.innerHTML = `<tr><td colspan="8"><div class="vacio"><div class="icono-vacio">🎓</div>No hay expedientes de pensión registrados.</div></td></tr>`;
    return;
  }
  const labelTipoPension = {tiempo_servicio:'Tiempo de servicio',discapacidad:'Discapacidad',sobrevivencia:'Sobrevivencia',otra:'Otra'};
  tbody.innerHTML = lista.map(p=>{
    const items = [p.tiene_certificacion_trabajo,p.tiene_certificacion_contraloria,p.tiene_comunicacion_ministro,p.tiene_copia_cedula,p.tiene_fotos];
    const completos = items.filter(Boolean).length;
    return `
    <tr>
      <td><input type="checkbox" class="chk-pen" value="${p.id}"></td>
      <td>${escapeHtml((p.personal_rh?.nombres||'')+' '+(p.personal_rh?.apellidos||''))}</td>
      <td>${p.tipo_personal==='docente'?'Docente':'Administrativo'}</td>
      <td>${labelTipoPension[p.tipo_pension]||p.tipo_pension}</td>
      <td>${p.anios_servicio??'—'}</td>
      <td>${completos}/5 docs</td>
      <td>${badgeEstado(p.estado)}</td>
      <td><button class="btn btn-secundario btn-chico" onclick="cambiarEstadoPension(${p.id})">Estado</button></td>
    </tr>`;
  }).join('');
}

function filtrarPensiones(){
  const texto = document.getElementById('filtro-pen-texto').value.toLowerCase();
  const tipo = document.getElementById('filtro-pen-tipo').value;
  const estado = document.getElementById('filtro-pen-estado').value;
  const filtrado = (window._pensionesData||[]).filter(p=>{
    const nombre = ((p.personal_rh?.nombres||'')+' '+(p.personal_rh?.apellidos||'')+' '+(p.personal_rh?.cedula||'')).toLowerCase();
    if(texto && !nombre.includes(texto)) return false;
    if(tipo && p.tipo_personal !== tipo) return false;
    if(estado && p.estado !== estado) return false;
    return true;
  });
  pintarTablaPensiones(filtrado);
}

function toggleTodosCheckPen(master){ document.querySelectorAll('.chk-pen').forEach(c=>c.checked = master.checked); }

async function eliminarSeleccionPensiones(){
  const ids = [...document.querySelectorAll('.chk-pen:checked')].map(c=>c.value);
  if(!ids.length){ toast('Selecciona al menos un registro.','error'); return; }
  if(!confirm(`¿Eliminar ${ids.length} expediente(s) seleccionado(s)?`)) return;
  const { error } = await sb.from('pensiones_rh').delete().in('id', ids);
  if(error){ toast(error.message,'error'); return; }
  toast('Registros eliminados.','exito');
  renderPensiones();
}

async function guardarPension(){
  const personalId = document.getElementById('pen-personal-id').value;
  if(!personalId){ toast('Selecciona el empleado.','error'); return; }

  const payload = {
    personal_id: personalId,
    tipo_personal: document.getElementById('pen-tipo-personal').value,
    tipo_pension: document.getElementById('pen-tipo-pension').value,

async function procesarImportacionPen(){
  const archivo = document.getElementById('pen-import-archivo').files[0];
  if(!archivo){ toast('Selecciona el archivo.','error'); return; }

  const btn = document.getElementById('btn-importar-pen');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Procesando…';

  try{
    const filas = await leerArchivoNomina(archivo);
    if(!filas.length) throw new Error('El archivo no contiene filas de datos.');
    const headers = filas[0];

    const norm = h => h.toString().toLowerCase().trim()
      .replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u');
    const mapa = {};
    headers.forEach((h,i)=>{
      const n = norm(h);
      if(/cedula/.test(n) && mapa.cedula===undefined) mapa.cedula = i;
      else if(/tipo.*personal/.test(n) && mapa.tipoPersonal===undefined) mapa.tipoPersonal = i;
      else if(/tipo.*pension/.test(n) && mapa.tipoPension===undefined) mapa.tipoPension = i;
      else if(/fecha.*solicitud/.test(n) && mapa.fechaSolicitud===undefined) mapa.fechaSolicitud = i;
      else if(/anos.*servicio|a.os.*servicio/.test(n) && mapa.anios===undefined) mapa.anios = i;
      else if(/ingreso/.test(n) && mapa.fechaIngreso===undefined) mapa.fechaIngreso = i;
      else if(/certificacion.*trabajo/.test(n) && mapa.certTrabajo===undefined) mapa.certTrabajo = i;
      else if(/contraloria/.test(n) && mapa.certContraloria===undefined) mapa.certContraloria = i;
      else if(/ministro/.test(n) && mapa.comunicacionMin===undefined) mapa.comunicacionMin = i;
      else if(/cedula.*si.*no|copia.*cedula/.test(n) && mapa.copiaCedula===undefined) mapa.copiaCedula = i;
      else if(/foto/.test(n) && mapa.fotos===undefined) mapa.fotos = i;
      else if(/estado/.test(n) && mapa.estado===undefined) mapa.estado = i;
      else if(/observ/.test(n) && mapa.observaciones===undefined) mapa.observaciones = i;
    });
    if(mapa.cedula===undefined){ throw new Error('No se pudo detectar la columna de cédula del empleado.'); }
    if(mapa.tipoPersonal===undefined){ throw new Error('No se pudo detectar la columna de tipo de personal.'); }

    const registros = filas.slice(1).filter(f=>f[mapa.cedula] && String(f[mapa.cedula]).trim());
    if(!registros.length) throw new Error('No se encontraron filas válidas con cédula.');

    let creados = 0, errores = 0;
    const detalleErrores = [];
    const esSiNo = v => { const t = String(v||'').trim().toUpperCase(); return t==='SI'||t==='SÍ'||t==='YES'||t==='TRUE'; };
    const estadosValidos = ['armando_expediente','enviado_minerd','enviado_inabima','decreto_promulgado','rechazado'];
    const tiposPensionValidos = ['tiempo_servicio','discapacidad','sobrevivencia','otra'];

    for(const f of registros){
      try{
        const cedula = String(f[mapa.cedula]).trim();
        const { data: persona } = await sb.from('personal_rh').select('id').eq('cedula', cedula).maybeSingle();
        if(!persona){ throw new Error('Empleado no encontrado en Personal. Impórtalo primero ahí.'); }

        const tipoPersonal = String(f[mapa.tipoPersonal]||'').trim().toLowerCase();
        if(tipoPersonal !== 'docente' && tipoPersonal !== 'administrativo'){
          throw new Error('Tipo de personal debe ser "docente" o "administrativo".');
        }

        let tipoPension = mapa.tipoPension!==undefined ? String(f[mapa.tipoPension]||'').trim().toLowerCase() : 'tiempo_servicio';
        if(!tiposPensionValidos.includes(tipoPension)) tipoPension = 'tiempo_servicio';

        let estado = mapa.estado!==undefined ? String(f[mapa.estado]||'').trim().toLowerCase() : '';
        if(!estadosValidos.includes(estado)) estado = 'armando_expediente';

        const { error: errPen } = await sb.from('pensiones_rh').insert({
          personal_id: persona.id, tipo_personal: tipoPersonal, tipo_pension: tipoPension,
          fecha_solicitud: mapa.fechaSolicitud!==undefined ? (String(f[mapa.fechaSolicitud]||'').trim() || new Date().toISOString().slice(0,10)) : new Date().toISOString().slice(0,10),
          anios_servicio: mapa.anios!==undefined ? (parseFloat(f[mapa.anios])||null) : null,
          fecha_ingreso_minerd: mapa.fechaIngreso!==undefined ? (String(f[mapa.fechaIngreso]||'').trim() || null) : null,
          tiene_certificacion_trabajo: mapa.certTrabajo!==undefined ? esSiNo(f[mapa.certTrabajo]) : false,
          tiene_certificacion_contraloria: mapa.certContraloria!==undefined ? esSiNo(f[mapa.certContraloria]) : false,
          tiene_comunicacion_ministro: mapa.comunicacionMin!==undefined ? esSiNo(f[mapa.comunicacionMin]) : false,
          tiene_copia_cedula: mapa.copiaCedula!==undefined ? esSiNo(f[mapa.copiaCedula]) : false,
          tiene_fotos: mapa.fotos!==undefined ? esSiNo(f[mapa.fotos]) : false,
          estado,
          observaciones: mapa.observaciones!==undefined ? (String(f[mapa.observaciones]||'').trim() || null) : null,
        });
        if(errPen) throw errPen;
        creados++;
      }catch(errFila){
        errores++;
        detalleErrores.push(`Fila con cédula "${f[mapa.cedula]||'?'}": ${errFila.message}`);
      }
    }

    document.getElementById('pen-import-resumen-preview').innerHTML = `
      <div class="texto-ayuda" style="margin-top:10px;">
        <strong>${registros.length}</strong> filas procesadas ·
        <span style="color:var(--verde-600);font-weight:600;">${creados} creados</span>
        ${errores ? `· <span style="color:var(--rojo-600);font-weight:600;">${errores} con error</span>` : ''}
        ${detalleErrores.length ? `<br><span style="color:var(--rojo-600);">${detalleErrores.slice(0,5).join('<br>')}</span>` : ''}
      </div>`;

    if(creados){
      toast(`${creados} expediente(s) importado(s) correctamente.`,'exito');
      renderPensiones();
    } else {
      toast('No se pudo importar ningún expediente. Revisa los errores.','error');
    }
  }catch(err){
    toast(err.message,'error');
  }finally{
    btn.disabled = false;
    btn.textContent = 'Importar';
  }
}

async function cambiarEstadoPension(id){
  const opciones = ['armando_expediente','enviado_minerd','enviado_inabima','decreto_promulgado','rechazado'];
  const etiquetas = {armando_expediente:'Armando expediente',enviado_minerd:'Enviado MINERD',enviado_inabima:'Enviado INABIMA',decreto_promulgado:'Decreto promulgado',rechazado:'Rechazado'};
  const p = (window._pensionesData||[]).find(x=>x.id===id);
  if(!p) return;
  const idxActual = opciones.indexOf(p.estado);
  const elegido = prompt('Nuevo estado:\n'+opciones.map((o,i)=>`${i+1}. ${etiquetas[o]}`).join('\n'), String(idxActual+1));
  const idx = parseInt(elegido)-1;
  if(isNaN(idx) || !opciones[idx]) return;
  const { error } = await sb.from('pensiones_rh').update({ estado: opciones[idx] }).eq('id', id);
  if(error){ toast(error.message,'error'); return; }
  toast('Estado actualizado.','exito');
  renderPensiones();
}

function filtrarSeguros(){
  const texto = document.getElementById('filtro-seg-texto').value.toLowerCase();
  const tipo = document.getElementById('filtro-seg-tipo').value;
  const estado = document.getElementById('filtro-seg-estado').value;
  const filtrado = (window._segurosData||[]).filter(s=>{
    const nombre = ((s.personal_rh?.nombres||'')+' '+(s.personal_rh?.apellidos||'')+' '+(s.personal_rh?.cedula||'')).toLowerCase();
    if(texto && !nombre.includes(texto)) return false;
    if(tipo && s.tipo_formulario !== tipo) return false;
    if(estado && s.estado !== estado) return false;
    return true;
  });
  pintarTablaSeguros(filtrado);
}

}

async function procesarImportacionSeg(){
  const archivo = document.getElementById('seg-import-archivo').files[0];
  if(!archivo){ toast('Selecciona el archivo.','error'); return; }

  const btn = document.getElementById('btn-importar-seg');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Procesando…';

  try{
    const filas = await leerArchivoNomina(archivo);
    if(!filas.length) throw new Error('El archivo no contiene filas de datos.');
    const headers = filas[0];

    const norm = h => h.toString().toLowerCase().trim()
      .replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u');
    const mapa = {};
    headers.forEach((h,i)=>{
      const n = norm(h);
      if(/cedula.*titular|^cedula$/.test(n) && mapa.cedula===undefined) mapa.cedula = i;
      else if(/tipo/.test(n) && mapa.tipo===undefined) mapa.tipo = i;
      else if(/fecha/.test(n) && mapa.fecha===undefined) mapa.fecha = i;
      else if(/nombre.*dependiente/.test(n) && mapa.nombreDep===undefined) mapa.nombreDep = i;
      else if(/parentesco/.test(n) && mapa.parentesco===undefined) mapa.parentesco = i;
      else if(/cedula.*dependiente/.test(n) && mapa.cedulaDep===undefined) mapa.cedulaDep = i;
      else if(/copia.*cedula/.test(n) && mapa.copiaCedula===undefined) mapa.copiaCedula = i;
      else if(/acta/.test(n) && mapa.actaNac===undefined) mapa.actaNac = i;
      else if(/certificacion.*estudio/.test(n) && mapa.certEstudio===undefined) mapa.certEstudio = i;
      else if(/descuento/.test(n) && mapa.formDescuento===undefined) mapa.formDescuento = i;
      else if(/estado/.test(n) && mapa.estado===undefined) mapa.estado = i;
      else if(/observ/.test(n) && mapa.observaciones===undefined) mapa.observaciones = i;
    });
    if(mapa.cedula===undefined){ throw new Error('No se pudo detectar la columna de cédula del titular.'); }
    if(mapa.tipo===undefined){ throw new Error('No se pudo detectar la columna de tipo (F1/F2).'); }

    const registros = filas.slice(1).filter(f=>f[mapa.cedula] && String(f[mapa.cedula]).trim());
    if(!registros.length) throw new Error('No se encontraron filas válidas con cédula.');

    let creados = 0, errores = 0;
    const detalleErrores = [];
    const esSiNo = v => { const t = String(v||'').trim().toUpperCase(); return t==='SI'||t==='SÍ'||t==='YES'||t==='TRUE'; };
    const estadosValidos = ['solicitado','depositado_nomina','aprobado','rechazado'];
    const parentescosValidos = ['conyuge','hijo_a','hijastro_a','padre','madre','suegro_a'];

    for(const f of registros){
      try{
        const cedula = String(f[mapa.cedula]).trim();
        const { data: persona } = await sb.from('personal_rh').select('id').eq('cedula', cedula).maybeSingle();
        if(!persona){ throw new Error('Empleado titular no encontrado en Personal. Impórtalo primero ahí.'); }

        const tipo = String(f[mapa.tipo]||'').trim().toUpperCase();
        if(tipo !== 'F1' && tipo !== 'F2'){ throw new Error('Tipo debe ser "F1" o "F2".'); }

        let parentesco = mapa.parentesco!==undefined ? String(f[mapa.parentesco]||'').trim().toLowerCase() : '';
        if(parentesco && !parentescosValidos.includes(parentesco)) parentesco = null;

        let estado = mapa.estado!==undefined ? String(f[mapa.estado]||'').trim().toLowerCase() : '';
        if(!estadosValidos.includes(estado)) estado = 'solicitado';

        const { error: errSeg } = await sb.from('seguros_salud_rh').insert({
          personal_id: persona.id, tipo_formulario: tipo,
          fecha_solicitud: mapa.fecha!==undefined ? (String(f[mapa.fecha]||'').trim() || new Date().toISOString().slice(0,10)) : new Date().toISOString().slice(0,10),
          nombre_dependiente: mapa.nombreDep!==undefined ? (String(f[mapa.nombreDep]||'').trim() || null) : null,
          parentesco: parentesco || null,
          cedula_dependiente: mapa.cedulaDep!==undefined ? (String(f[mapa.cedulaDep]||'').trim() || null) : null,
          tiene_copia_cedula: mapa.copiaCedula!==undefined ? esSiNo(f[mapa.copiaCedula]) : false,
          tiene_acta_nacimiento: mapa.actaNac!==undefined ? esSiNo(f[mapa.actaNac]) : false,
          tiene_certificacion_estudio: mapa.certEstudio!==undefined ? esSiNo(f[mapa.certEstudio]) : false,
          tiene_formulario_descuento: mapa.formDescuento!==undefined ? esSiNo(f[mapa.formDescuento]) : false,
          estado,
          observaciones: mapa.observaciones!==undefined ? (String(f[mapa.observaciones]||'').trim() || null) : null,
        });
        if(errSeg) throw errSeg;
        creados++;
      }catch(errFila){
        errores++;
        detalleErrores.push(`Fila con cédula "${f[mapa.cedula]||'?'}": ${errFila.message}`);
      }
    }

    document.getElementById('seg-import-resumen-preview').innerHTML = `
      <div class="texto-ayuda" style="margin-top:10px;">
        <strong>${registros.length}</strong> filas procesadas ·
        <span style="color:var(--verde-600);font-weight:600;">${creados} creadas</span>
        ${errores ? `· <span style="color:var(--rojo-600);font-weight:600;">${errores} con error</span>` : ''}
        ${detalleErrores.length ? `<br><span style="color:var(--rojo-600);">${detalleErrores.slice(0,5).join('<br>')}</span>` : ''}
      </div>`;

    if(creados){
      toast(`${creados} solicitud(es) importada(s) correctamente.`,'exito');
      renderSegurosSalud();
    } else {
      toast('No se pudo importar ninguna solicitud. Revisa los errores.','error');
    }
  }catch(err){
    toast(err.message,'error');
  }finally{
    btn.disabled = false;
    btn.textContent = 'Importar';
  }
}

async function cambiarEstadoSeguro(id){
  const opciones = ['solicitado','depositado_nomina','aprobado','rechazado'];
  const etiquetas = {solicitado:'Solicitado',depositado_nomina:'Depositado en nómina',aprobado:'Aprobado',rechazado:'Rechazado'};
  const s = (window._segurosData||[]).find(x=>x.id===id);
  if(!s) return;
  const idxActual = opciones.indexOf(s.estado);
  const elegido = prompt('Nuevo estado:\n'+opciones.map((o,i)=>`${i+1}. ${etiquetas[o]}`).join('\n'), String(idxActual+1));
  const idx = parseInt(elegido)-1;
  if(isNaN(idx) || !opciones[idx]) return;
  const { error } = await sb.from('seguros_salud_rh').update({ estado: opciones[idx] }).eq('id', id);
  if(error){ toast(error.message,'error'); return; }
  toast('Estado actualizado.','exito');
  renderSegurosSalud();
}

function generarTextoCertificacionLaboral({ personalNombre, personalCedula, cargo, periodoDesde, periodoHasta, fechaEmision }){
  const fechaTexto = new Date(fechaEmision+'T00:00:00').toLocaleDateString('es-DO',{day:'2-digit',month:'long',year:'numeric'});
  const desde = periodoDesde ? new Date(periodoDesde+'T00:00:00').toLocaleDateString('es-DO',{day:'2-digit',month:'long',year:'numeric'}) : '________';
  const hasta = periodoHasta ? new Date(periodoHasta+'T00:00:00').toLocaleDateString('es-DO',{day:'2-digit',month:'long',year:'numeric'}) : 'la fecha';

  return `DISTRITO EDUCATIVO 16-06, BONAO NORDESTE.\nC. / 16 de Agosto, esq. Luperón, 809-296-2126.\n\n`+
`${fechaTexto}.\nBonao, R. D.\n\nA QUIEN PUEDA INTERESAR:\n\n`+
`Quien suscribe, Emeterio Beltré Tineo M.A., Director del Distrito Educativo 16-06, Bonao Nordeste, `+
`hace constar por medio de la presente que el/la señor(a) ${personalNombre}, portador(a) de la cédula de `+
`identidad y electoral No. ${personalCedula}, ha prestado/presta sus servicios en esta institución desde el ${desde} `+
`hasta ${hasta}, desempeñando el cargo de ${cargo}.\n\n`+
`La presente certificación se expide a solicitud de la parte interesada, para los fines que estime convenientes.\n\n`+
`Muy atentamente,\n\n\nEmeterio Beltré Tineo M.A.\nDirector Distrital 16-06, Bonao Nordeste`;
}

function filtrarCertLab(){
  const texto = document.getElementById('filtro-cl-texto').value.toLowerCase();
  const estado = document.getElementById('filtro-cl-estado').value;
  const terceros = document.getElementById('filtro-cl-terceros').value;
  const filtrado = (window._certLaboralData||[]).filter(c=>{
    const nombre = ((c.personal_rh?.nombres||'')+' '+(c.personal_rh?.apellidos||'')+' '+(c.personal_rh?.cedula||'')).toLowerCase();
    if(texto && !nombre.includes(texto)) return false;
    if(estado && c.estado !== estado) return false;
    if(terceros==='si' && !c.solicitado_por_terceros) return false;
    if(terceros==='no' && c.solicitado_por_terceros) return false;
    return true;
  });
  pintarTablaCertLab(filtrado);
}

async function guardarCertLab(){

  const { data: p, error: errP } = await sb.from('personal_rh').select('*').eq('id', personalId).single();
  if(errP){ toast(errP.message,'error'); return; }

  const fechaEmision = document.getElementById('cl-fecha-emision').value || new Date().toISOString().slice(0,10);
  const periodoDesde = document.getElementById('cl-periodo-desde').value || null;
  const periodoHasta = document.getElementById('cl-periodo-hasta').value || null;
  const cargo = document.getElementById('cl-cargo').value.trim() || p.cargo_actual || '';

  const texto = generarTextoCertificacionLaboral({
    personalNombre: p.nombres+' '+p.apellidos, personalCedula: p.cedula, cargo,
    periodoDesde, periodoHasta, fechaEmision,
  });

  const payload = {
    personal_id: personalId,
    fecha_emision: fechaEmision, periodo_desde: periodoDesde, periodo_hasta: periodoHasta,
    cargo_certificado: cargo,
    motivo: document.getElementById('cl-motivo').value.trim() || null,
    solicitado_por_terceros: document.getElementById('cl-terceros').checked,
    tiene_poder_notarial: document.getElementById('cl-poder-notarial').checked,
    texto_generado: texto,
  };
  const { error } = await sb.from('certificaciones_laborales_rh').insert(payload);
  if(error){ toast(error.message,'error'); return; }
  toast('Certificación laboral generada.','exito');
  cerrarModal('modal-cert-laboral');
  renderCertificacionesLaborales();
}

async function procesarImportacionCL(){
  const archivo = document.getElementById('cl-import-archivo').files[0];
  if(!archivo){ toast('Selecciona el archivo.','error'); return; }

  const btn = document.getElementById('btn-importar-cl');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Procesando…';

  try{
    const filas = await leerArchivoNomina(archivo);
    if(!filas.length) throw new Error('El archivo no contiene filas de datos.');
    const headers = filas[0];

    const norm = h => h.toString().toLowerCase().trim()
      .replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u');
    const mapa = {};
    headers.forEach((h,i)=>{
      const n = norm(h);
      if(/cedula/.test(n) && mapa.cedula===undefined) mapa.cedula = i;
      else if(/fecha.*solicitud/.test(n) && mapa.fechaSolicitud===undefined) mapa.fechaSolicitud = i;
      else if(/emision/.test(n) && mapa.fechaEmision===undefined) mapa.fechaEmision = i;
      else if(/periodo.*desde/.test(n) && mapa.periodoDesde===undefined) mapa.periodoDesde = i;
      else if(/periodo.*hasta/.test(n) && mapa.periodoHasta===undefined) mapa.periodoHasta = i;
      else if(/cargo/.test(n) && mapa.cargo===undefined) mapa.cargo = i;
      else if(/motivo/.test(n) && mapa.motivo===undefined) mapa.motivo = i;
      else if(/terceros/.test(n) && mapa.terceros===undefined) mapa.terceros = i;
      else if(/poder.*notarial/.test(n) && mapa.poder===undefined) mapa.poder = i;
      else if(/estado/.test(n) && mapa.estado===undefined) mapa.estado = i;
    });
    if(mapa.cedula===undefined){ throw new Error('No se pudo detectar la columna de cédula del empleado.'); }

    const registros = filas.slice(1).filter(f=>f[mapa.cedula] && String(f[mapa.cedula]).trim());
    if(!registros.length) throw new Error('No se encontraron filas válidas con cédula.');

    let creados = 0, errores = 0;
    const detalleErrores = [];
    const esSiNo = v => { const t = String(v||'').trim().toUpperCase(); return t==='SI'||t==='SÍ'||t==='YES'||t==='TRUE'; };
    const estadosValidos = ['solicitado','en_proceso','emitida','entregada','rechazada'];

    for(const f of registros){
      try{
        const cedula = String(f[mapa.cedula]).trim();
        const { data: persona } = await sb.from('personal_rh').select('id,nombres,apellidos,cedula,cargo_actual').eq('cedula', cedula).maybeSingle();
        if(!persona){ throw new Error('Empleado no encontrado en Personal. Impórtalo primero ahí.'); }

        let estado = mapa.estado!==undefined ? String(f[mapa.estado]||'').trim().toLowerCase() : '';
        if(!estadosValidos.includes(estado)) estado = 'solicitado';

        const fechaEmision = mapa.fechaEmision!==undefined ? (String(f[mapa.fechaEmision]||'').trim() || null) : null;
        const periodoDesde = mapa.periodoDesde!==undefined ? (String(f[mapa.periodoDesde]||'').trim() || null) : null;
        const periodoHasta = mapa.periodoHasta!==undefined ? (String(f[mapa.periodoHasta]||'').trim() || null) : null;
        const cargo = mapa.cargo!==undefined ? (String(f[mapa.cargo]||'').trim() || persona.cargo_actual || '') : (persona.cargo_actual || '');

        const texto = generarTextoCertificacionLaboral({
          personalNombre: persona.nombres+' '+persona.apellidos, personalCedula: persona.cedula, cargo,
          periodoDesde, periodoHasta, fechaEmision: fechaEmision || new Date().toISOString().slice(0,10),
        });

        const { error: errCL } = await sb.from('certificaciones_laborales_rh').insert({
          personal_id: persona.id,
          fecha_solicitud: mapa.fechaSolicitud!==undefined ? (String(f[mapa.fechaSolicitud]||'').trim() || new Date().toISOString().slice(0,10)) : new Date().toISOString().slice(0,10),
          fecha_emision: fechaEmision, periodo_desde: periodoDesde, periodo_hasta: periodoHasta,
          cargo_certificado: cargo,
          motivo: mapa.motivo!==undefined ? (String(f[mapa.motivo]||'').trim() || null) : null,
          solicitado_por_terceros: mapa.terceros!==undefined ? esSiNo(f[mapa.terceros]) : false,
          tiene_poder_notarial: mapa.poder!==undefined ? esSiNo(f[mapa.poder]) : false,
          estado, texto_generado: texto,
        });
        if(errCL) throw errCL;
        creados++;
      }catch(errFila){
        errores++;
        detalleErrores.push(`Fila con cédula "${f[mapa.cedula]||'?'}": ${errFila.message}`);
      }
    }

    document.getElementById('cl-import-resumen-preview').innerHTML = `
      <div class="texto-ayuda" style="margin-top:10px;">
        <strong>${registros.length}</strong> filas procesadas ·
        <span style="color:var(--verde-600);font-weight:600;">${creados} creadas</span>
        ${errores ? `· <span style="color:var(--rojo-600);font-weight:600;">${errores} con error</span>` : ''}
        ${detalleErrores.length ? `<br><span style="color:var(--rojo-600);">${detalleErrores.slice(0,5).join('<br>')}</span>` : ''}
      </div>`;

    if(creados){
      toast(`${creados} certificación(es) importada(s) correctamente.`,'exito');
      renderCertificacionesLaborales();
    } else {
      toast('No se pudo importar ninguna certificación. Revisa los errores.','error');
    }
  }catch(err){
    toast(err.message,'error');
  }finally{
    btn.disabled = false;
    btn.textContent = 'Importar';
  }
}

// Exportación dedicada del expediente: a diferencia de los demás módulos
// (una tabla con columnas fijas), aquí cada sección tiene columnas propias,
// así que CSV/Excel exportan una hoja/bloque por sección, y PDF/Imprimir
// generan un documento único con todas las secciones en su formato real.
function registrarExportadoresExpediente(p){
  const nombreArchivo = `expediente_${p.cedula.replace(/[^0-9]/g,'')}`;
  const titulo = `Expediente — ${p.nombres} ${p.apellidos} (${p.cedula})`;

  function construirHtmlCompleto(){
    const secciones = window._expedienteActual.secciones;
    const bloques = secciones.map(s=>{
      if(!s.datos.length) return '';
      const seccionDef = SECCIONES_EXPEDIENTE.find(sd=>sd.titulo===s.titulo);
      const filas = s.datos.map(r=>`<tr>${seccionDef.columnas.map(c=>`<td>${c.get(r).replace(/<[^>]+>/g,'')}</td>`).join('')}</tr>`).join('');
      return `<h3 style="margin-top:18px;">${seccionDef.icono} ${s.titulo}</h3>
        <table><thead><tr>${seccionDef.columnas.map(c=>`<th>${escapeHtml(c.label)}</th>`).join('')}</tr></thead>
        <tbody>${filas}</tbody></table>`;
    }).join('');
    return `<h2>${escapeHtml(titulo)}</h2>${bloques || '<p>Sin registros en ningún módulo.</p>'}`;
  }

  window._exportHandlers['exp'] = {
    csv: ()=>{
      const secciones = window._expedienteActual.secciones;
      let csv = `"Expediente","${p.nombres} ${p.apellidos}","${p.cedula}"\n\n`;
      secciones.forEach(s=>{
        if(!s.datos.length) return;
        const seccionDef = SECCIONES_EXPEDIENTE.find(sd=>sd.titulo===s.titulo);
        csv += `"${s.titulo}"\n`;
        csv += seccionDef.columnas.map(c=>`"${c.label}"`).join(',')+'\n';
        s.datos.forEach(r=>{
          csv += seccionDef.columnas.map(c=>`"${c.get(r).replace(/<[^>]+>/g,'').replace(/"/g,'""')}"`).join(',')+'\n';
        });
        csv += '\n';
      });
      const blob = new Blob(['\uFEFF'+csv], { type:'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = `${nombreArchivo}.csv`;
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    },
    xlsx: ()=>{
      if(typeof XLSX === 'undefined'){ toast('No se pudo generar el Excel.','error'); return; }
      const wb = XLSX.utils.book_new();
      const secciones = window._expedienteActual.secciones;
      let alMenosUna = false;
      secciones.forEach(s=>{
        if(!s.datos.length) return;
        alMenosUna = true;
        const seccionDef = SECCIONES_EXPEDIENTE.find(sd=>sd.titulo===s.titulo);
        const filas = s.datos.map(r=>{
          const obj = {};
          seccionDef.columnas.forEach(c=>{ obj[c.label] = c.get(r).replace(/<[^>]+>/g,''); });
          return obj;
        });
        const ws = XLSX.utils.json_to_sheet(filas);
        XLSX.utils.book_append_sheet(wb, ws, s.titulo.slice(0,31));
      });
      if(!alMenosUna){ toast('No hay datos para exportar.','error'); return; }
      XLSX.writeFile(wb, `${nombreArchivo}.xlsx`);
    },
    pdf: ()=>{
      const w = window.open('', '_blank');
      w.document.write(`<html><head><meta charset="UTF-8"><title>${escapeHtml(titulo)}</title>
        <style>body{font-family:Arial,sans-serif;font-size:12px;padding:24px;}
        h2{font-size:16px;}h3{font-size:13px;color:#1f3864;}
        table{width:100%;border-collapse:collapse;margin-bottom:10px;}
        th,td{border:1px solid #999;padding:4px 7px;text-align:left;}th{background:#eef2f7;}
        </style></head><body>${construirHtmlCompleto()}</body></html>`);
      w.document.close();
      setTimeout(()=>w.print(), 400);
    },
    imprimir: ()=>{
      const w = window.open('', '_blank');
      w.document.write(`<html><head><meta charset="UTF-8"><title>${escapeHtml(titulo)}</title>
        <style>body{font-family:Arial,sans-serif;font-size:12px;padding:24px;}
        h2{font-size:16px;}h3{font-size:13px;color:#1f3864;}
        table{width:100%;border-collapse:collapse;margin-bottom:10px;}
        th,td{border:1px solid #999;padding:4px 7px;text-align:left;}th{background:#eef2f7;}
        </style></head><body>${construirHtmlCompleto()}</body></html>`);
      w.document.close();
      setTimeout(()=>w.print(), 400);
    },
  };
}

// Detecta encabezados típicos del archivo de nómina del MINERD/Contraloría,
// tolerando variaciones de nombre de columna.
function detectarColumnas(headers){
  const norm = h => h.toString().toLowerCase().trim()
    .replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u');
  const mapa = {};
  headers.forEach((h,i)=>{
    const n = norm(h);
    if(/cedula/.test(n)) mapa.cedula = i;
    else if(/nombres?\s*(y|\/)\s*apellidos?|nombre completo|nombre empleado/.test(n)) mapa.nombre = i;
    else if(/apellido/.test(n)) mapa.apellidos = i;
    else if(/^nombre|nombres?$/.test(n)) mapa.nombre = i;
    else if(/cargo|posicion|puesto/.test(n)) mapa.cargo = i;
    else if(/sigerd/.test(n)) mapa.sigerd = i;
    else if(/dependencia/.test(n)) mapa.dependencia = i;
    else if(/centro|descripcion/.test(n)) mapa.centro = i;
    else if(/bruto|sueldo\s*base/.test(n)) mapa.bruto = i;
    else if(/descuent/.test(n)) mapa.descuentos = i;
    else if(/neto/.test(n)) mapa.neto = i;
  });
  return mapa;
}

async function procesarImportacionNomina(){
  const archivo = document.getElementById('nom-archivo').files[0];
  const mes = parseInt(document.getElementById('nom-mes').value);
  const anio = parseInt(document.getElementById('nom-anio').value);
  const fechaPago = document.getElementById('nom-fecha-pago').value || null;
  const compararHistorial = document.getElementById('nom-comparar').checked;

  if(!archivo){ toast('Selecciona el archivo de nómina.','error'); return; }
  if(!mes || !anio){ toast('Indica mes y año.','error'); return; }

  const btn = document.getElementById('btn-importar-nomina');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Procesando…';

  try{
    const filas = await leerArchivoNomina(archivo);
    if(!filas.length) throw new Error('El archivo no contiene filas de datos.');

    // Detecta automáticamente la fila de encabezados reales (por si el archivo trae
    // títulos como "DIRECCION DE RECURSOS HUMANOS" / "DEPARTAMENTO DE NOMINA" antes)
    const normNom = h => h.toString().toLowerCase().trim()
      .replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u');
    const patronesEncabezadoNom = [/cedula/, /nombres?|apellidos?/, /cargo|posicion|puesto/, /sigerd/,
      /dependencia/, /centro|descripcion/, /bruto|sueldo\s*base/, /descuent/, /neto/, /fecha/];
    let headerRowIdxNom = 0, mejorCoincidenciasNom = -1;
    for(let i=0; i<Math.min(filas.length,15); i++){
      const coincidencias = filas[i].filter(c=>{ const n=normNom(c); return n && patronesEncabezadoNom.some(p=>p.test(n)); }).length;
      if(coincidencias > mejorCoincidenciasNom){ mejorCoincidenciasNom = coincidencias; headerRowIdxNom = i; }
    }
    const headers = filas[headerRowIdxNom];
    const mapa = detectarColumnas(headers);
    if(mapa.cedula === undefined) throw new Error('No se pudo detectar la columna de cédula en el archivo.');

    const registros = filas.slice(headerRowIdxNom+1).filter(f=>f[mapa.cedula]).map(f=>{
      const nombreCol = mapa.nombre!==undefined ? String(f[mapa.nombre]||'').trim() : '';
      const apellidosCol = mapa.apellidos!==undefined ? String(f[mapa.apellidos]||'').trim() : '';
      const nombreCompleto = apellidosCol ? (nombreCol+' '+apellidosCol).trim() : nombreCol;
      return {
        cedula_archivo: String(f[mapa.cedula]).trim(),
        nombre_archivo: nombreCompleto || null,
        nombres_col: nombreCol || null,
        apellidos_col: apellidosCol || null,
        cargo_archivo: mapa.cargo!==undefined ? String(f[mapa.cargo]||'').trim() : null,
        sigerd_archivo: mapa.sigerd!==undefined ? String(f[mapa.sigerd]||'').trim() : null,
        dependencia_archivo: mapa.dependencia!==undefined ? String(f[mapa.dependencia]||'').trim() : null,
        centro_archivo: mapa.centro!==undefined ? String(f[mapa.centro]||'').trim() : null,
        salario_bruto: mapa.bruto!==undefined ? parseFloat(f[mapa.bruto])||null : null,
        descuentos: mapa.descuentos!==undefined ? parseFloat(f[mapa.descuentos])||null : null,
        salario_neto: mapa.neto!==undefined ? parseFloat(f[mapa.neto])||null : null,
      };
    });

    // Deduplicar por cédula dentro del mismo archivo (por si el PDF repite encabezados de página)
    const vistos = new Set();
    const registrosUnicos = registros.filter(r=>{
      const ced = r.cedula_archivo.replace(/[^0-9]/g,'');
      if(!ced || vistos.has(ced)) return false;
      vistos.add(ced);
      return true;
    });

    const { data: nomina, error: errNom } = await sb.from('nominas_rh')
      .insert({ mes, anio, fecha_pago: fechaPago, archivo_origen: archivo.name })
      .select('id').single();
    if(errNom) throw errNom;

    // ---- PASO 1: UPSERT de centros (por dependencia, o por SIGERD si no hay dependencia) ----
    const { data: centrosExistentes } = await sb.from('centros_rh').select('id,codigo_sigerd,numero_dependencia_nomina');
    const mapaCentroPorDependencia = {};
    const mapaCentroPorSigerd = {};
    (centrosExistentes||[]).forEach(c=>{
      if(c.numero_dependencia_nomina) mapaCentroPorDependencia[c.numero_dependencia_nomina] = c.id;
      if(c.codigo_sigerd) mapaCentroPorSigerd[c.codigo_sigerd] = c.id;
    });

    const centrosNuevos = [];
    const vistosCentro = new Set();
    registrosUnicos.forEach(r=>{
      const dep = r.dependencia_archivo, sig = r.sigerd_archivo;
      if(!dep && !sig) return;
      const yaExiste = (dep && mapaCentroPorDependencia[dep]) || (sig && mapaCentroPorSigerd[sig]);
      const clave = dep || sig;
      if(yaExiste || vistosCentro.has(clave)) return;
      vistosCentro.add(clave);
      centrosNuevos.push({
        nombre_centro: r.centro_archivo || `Centro dependencia ${dep||sig}`,
        codigo_sigerd: sig || null,
        numero_dependencia_nomina: dep || null,
      });
    });

    if(centrosNuevos.length){
      const { data: insertados, error: errCentros } = await sb.from('centros_rh').insert(centrosNuevos).select('id,codigo_sigerd,numero_dependencia_nomina');
      if(errCentros) throw errCentros;
      (insertados||[]).forEach(c=>{
        if(c.numero_dependencia_nomina) mapaCentroPorDependencia[c.numero_dependencia_nomina] = c.id;
        if(c.codigo_sigerd) mapaCentroPorSigerd[c.codigo_sigerd] = c.id;
      });
    }

    function resolverCentroId(r){
      if(r.dependencia_archivo && mapaCentroPorDependencia[r.dependencia_archivo]) return mapaCentroPorDependencia[r.dependencia_archivo];
      if(r.sigerd_archivo && mapaCentroPorSigerd[r.sigerd_archivo]) return mapaCentroPorSigerd[r.sigerd_archivo];
      return null;
    }

    // ---- PASO 2: UPSERT de personal (por cédula), actualizando cargo/centro si cambiaron ----
    // .range() amplía el límite de 1000 filas que Supabase aplica por defecto,
    // necesario porque el personal del distrito puede superar esa cifra.
    const personalExistente = await fetchTodasLasFilas('personal_rh', 'id,cedula,cargo_actual,centro_id', q=>q.order('id'));
    const mapaPersonal = {};
    (personalExistente||[]).forEach(p=>{ mapaPersonal[p.cedula.replace(/[^0-9]/g,'')] = p; });

    const personalNuevo = [];
    const personalActualizar = [];

    registrosUnicos.forEach(r=>{
      const cedNorm = r.cedula_archivo.replace(/[^0-9]/g,'');
      const centroId = resolverCentroId(r);
      const existente = mapaPersonal[cedNorm];

      if(!existente){
        personalNuevo.push({
          cedula: r.cedula_archivo,
          nombres: r.nombres_col || r.nombre_archivo || 'Sin nombre',
          apellidos: r.apellidos_col || '',
          sexo: 'M', // dato no provisto por la nómina; se ajusta manualmente luego si aplica
          cargo_actual: r.cargo_archivo || null,
          centro_id: centroId,
          numero_dependencia_nomina: r.dependencia_archivo || null,
          estatus: 'activo',
        });
      } else {
        const necesitaActualizar = (r.cargo_archivo && r.cargo_archivo !== existente.cargo_actual)
          || (centroId && centroId !== existente.centro_id)
          || existente.estatus !== 'activo';
        if(necesitaActualizar){
          personalActualizar.push({
            id: existente.id,
            cargo_actual: r.cargo_archivo || existente.cargo_actual,
            centro_id: centroId || existente.centro_id,
            estatus: 'activo',
          });
        }
      }
    });

    if(personalNuevo.length){
      const { data: insertadosP, error: errPersNuevo } = await sb.from('personal_rh').insert(personalNuevo).select('id,cedula');
      if(errPersNuevo) throw errPersNuevo;
      (insertadosP||[]).forEach(p=>{ mapaPersonal[p.cedula.replace(/[^0-9]/g,'')] = { id:p.id }; });
    }
    for(const upd of personalActualizar){
      const { id, ...campos } = upd;
      await sb.from('personal_rh').update(campos).eq('id', id);
    }

    // Refrescar mapa completo de personal (incluye nuevos) para el cruce del detalle
    const personalFinal = await fetchTodasLasFilas('personal_rh', 'id,cedula', q=>q.order('id'));
    const mapaPersonalFinal = {};
    (personalFinal||[]).forEach(p=>{ mapaPersonalFinal[p.cedula.replace(/[^0-9]/g,'')] = p.id; });

    // ---- PASO 3: Guardar detalle de nómina con el cruce ya resuelto ----
    const detalle = registrosUnicos.map(r=>{
      const cedNorm = r.cedula_archivo.replace(/[^0-9]/g,'');
      const personalId = mapaPersonalFinal[cedNorm] || null;
      return {
        cedula_archivo: r.cedula_archivo,
        nombre_archivo: r.nombre_archivo,
        centro_archivo: r.centro_archivo,
        salario_bruto: r.salario_bruto,
        descuentos: r.descuentos,
        salario_neto: r.salario_neto,
        nomina_id: nomina.id,
        personal_id: personalId,
        match_estado: personalId ? 'encontrado' : 'no_encontrado',
      };
    });

    const { error: errDet } = await sb.from('detalle_nomina_rh').insert(detalle);
    if(errDet) throw errDet;

    const encontrados = detalle.filter(d=>d.match_estado==='encontrado').length;
    const noEncontrados = detalle.length - encontrados;

    let resumenMovimientos = '';
    if(compararHistorial){
      const mov = await compararConHistorial(nomina.id, registrosUnicos, mapaPersonalFinal);
      resumenMovimientos = `<br><span style="color:var(--verde-600);font-weight:600;">${mov.nuevos}</span> nuevos ·
        <span style="color:var(--azul-600);font-weight:600;">${mov.reingresos}</span> reingresos ·
        <span style="color:var(--rojo-600);font-weight:600;">${mov.cancelados}</span> cancelados`;
    }

    const resumenMaestro = `<br><span class="texto-ayuda">Catálogo: ${centrosNuevos.length} centro(s) nuevo(s) ·
      ${personalNuevo.length} empleado(s) nuevo(s) en personal · ${personalActualizar.length} actualizado(s) (cargo/centro)</span>`;

    document.getElementById('nom-resumen-preview').innerHTML = `
      <div class="texto-ayuda" style="margin-top:10px;">
        <strong>${detalle.length}</strong> registros importados ·
        <span style="color:var(--verde-600);font-weight:600;">${encontrados} encontrados</span> en personal ·
        <span style="color:var(--rojo-600);font-weight:600;">${noEncontrados} sin coincidencia</span> (revisar manualmente)
        ${resumenMovimientos}
        ${resumenMaestro}
      </div>`;

    toast('Nómina importada y cruzada correctamente.','exito');
    renderNominas();
  }catch(err){
    toast(err.message,'error');
  }finally{
    btn.disabled = false;
    btn.textContent = 'Importar y cruzar con personal';
  }
}

// Compara la nómina recién importada contra TODO el historial acumulado
// (detalle_nomina_rh de nóminas anteriores) para detectar:
//  - nuevo: cédula nunca vista en ninguna nómina anterior
//  - reingreso: cédula vista antes, no estaba en la última nómina anterior, ahora sí
//  - cancelado: cédula estaba en la última nómina anterior y ya no aparece en esta
async function compararConHistorial(nominaNuevaId, registrosNuevos, mapaPersonal){
  // Nómina inmediatamente anterior a la actual (por fecha de creación, excluyendo la nueva)
  const { data: nominaAnterior } = await sb.from('nominas_rh')
    .select('id, mes, anio').neq('id', nominaNuevaId)
    .order('anio',{ascending:false}).order('mes',{ascending:false}).limit(1).maybeSingle();

  // Todo el historial de cédulas que han aparecido en CUALQUIER nómina anterior
  const { data: historico } = await sb.from('detalle_nomina_rh')
    .select('cedula_archivo, nomina_id').neq('nomina_id', nominaNuevaId);

  const cedulasHistoricas = new Set((historico||[]).map(h=>h.cedula_archivo.replace(/[^0-9]/g,'')));

  let cedulasNominaAnterior = new Set();
  if(nominaAnterior){
    const { data: detAnterior } = await sb.from('detalle_nomina_rh')
      .select('cedula_archivo, nombre_archivo, personal_id').eq('nomina_id', nominaAnterior.id);
    cedulasNominaAnterior = new Set((detAnterior||[]).map(d=>d.cedula_archivo.replace(/[^0-9]/g,'')));
    window._detAnteriorCache = detAnterior || [];
  }

  const cedulasNuevaNomina = new Set(registrosNuevos.map(r=>r.cedula_archivo.replace(/[^0-9]/g,'')));

  const movimientos = [];
  let nuevos = 0, reingresos = 0, cancelados = 0;

  // Nuevos y reingresos: presentes en la nómina nueva
  registrosNuevos.forEach(r=>{
    const ced = r.cedula_archivo.replace(/[^0-9]/g,'');
    if(!ced) return;
    const estabaEnAnterior = cedulasNominaAnterior.has(ced);
    const habiaAparecidoAntes = cedulasHistoricas.has(ced);

    if(!habiaAparecidoAntes){
      movimientos.push({
        nomina_id: nominaNuevaId, personal_id: mapaPersonal[ced]||null,
        cedula: r.cedula_archivo, nombre: r.nombre_archivo,
        tipo_movimiento: 'nuevo',
      });
      nuevos++;
    } else if(!estabaEnAnterior){
      movimientos.push({
        nomina_id: nominaNuevaId, personal_id: mapaPersonal[ced]||null,
        cedula: r.cedula_archivo, nombre: r.nombre_archivo,
        tipo_movimiento: 'reingreso',
      });
      reingresos++;
    }
  });

  // Cancelados: estaban en la nómina anterior pero no en la nueva
  if(nominaAnterior){
    (window._detAnteriorCache||[]).forEach(d=>{
      const ced = d.cedula_archivo.replace(/[^0-9]/g,'');
      if(ced && !cedulasNuevaNomina.has(ced)){
        movimientos.push({
          nomina_id: nominaNuevaId, personal_id: d.personal_id||null,
          cedula: d.cedula_archivo, nombre: d.nombre_archivo,
          tipo_movimiento: 'cancelado', ultima_nomina_presente_id: nominaAnterior.id,
        });
        cancelados++;
      }
    });
  }

  if(movimientos.length){
    const { error } = await sb.from('movimientos_nomina_rh').insert(movimientos);
    if(error) console.error('Error guardando movimientos:', error.message);

    // Marcar automáticamente como inactivo/cancelado en personal_rh a quienes
    // ya no aparecen en la nómina nueva
    const idsCancelados = movimientos.filter(m=>m.tipo_movimiento==='cancelado' && m.personal_id).map(m=>m.personal_id);
    if(idsCancelados.length){
      await sb.from('personal_rh').update({ estatus:'inactivo' }).in('id', idsCancelados);
    }
  }

  return { nuevos, reingresos, cancelados };
}

// Lee CSV, Excel o PDF y devuelve array de filas (incluyendo encabezado en fila 0)
function leerArchivoNomina(archivo){
  const nombre = archivo.name.toLowerCase();
  if(nombre.endsWith('.pdf')) return leerPDFNomina(archivo);
  return new Promise((resolve, reject)=>{
    if(nombre.endsWith('.csv')){
      const reader = new FileReader();
      reader.onload = e => {
        const lineas = e.target.result.split(/\r?\n/).filter(l=>l.trim().length);
        resolve(lineas.map(l=>l.split(',').map(c=>c.trim())));
      };
      reader.onerror = reject;
      reader.readAsText(archivo, 'UTF-8');
    } else {
      if(typeof XLSX === 'undefined'){
        reject(new Error('No se pudo cargar el lector de Excel. Verifica tu conexión a internet.'));
        return;
      }
      const reader = new FileReader();
      reader.onload = e => {
        try{
          const wb = XLSX.read(e.target.result, { type:'array' });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const filas = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
          resolve(filas.filter(f=>f.some(c=>String(c).trim().length)));
        }catch(err){ reject(err); }
      };
      reader.onerror = reject;
      reader.readAsArrayBuffer(archivo);
    }
  });
}

// Extrae texto de un PDF (debe tener texto seleccionable, no ser escaneo) y lo
// reconstruye en filas/columnas aproximando por posición X de cada palabra.
async function leerPDFNomina(archivo){
  if(typeof pdfjsLib === 'undefined'){
    throw new Error('No se pudo cargar el lector de PDF. Verifica tu conexión a internet.');
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const buffer = await archivo.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;

  const filas = [];
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const contenido = await page.getTextContent();

    // Agrupar items por línea (misma coordenada Y aproximada)
    const lineasMapa = {};
    contenido.items.forEach(item=>{
      const y = Math.round(item.transform[5]);
      if(!lineasMapa[y]) lineasMapa[y] = [];
      lineasMapa[y].push({ x: item.transform[4], texto: item.str });
    });

    Object.keys(lineasMapa).sort((a,b)=>b-a).forEach(y=>{
      const items = lineasMapa[y].sort((a,b)=>a.x-b.x);
      // Unir palabras cercanas en la misma "columna" usando saltos de espacio amplio como separador de celda
      const celdas = [];
      let celdaActual = '';
      let xAnterior = null;
      items.forEach(it=>{
        if(xAnterior !== null && (it.x - xAnterior) > 25){
          celdas.push(celdaActual.trim());
          celdaActual = '';
        }
        celdaActual += (celdaActual ? ' ' : '') + it.texto;
        xAnterior = it.x + it.texto.length*3;
      });
      if(celdaActual.trim()) celdas.push(celdaActual.trim());
      if(celdas.some(c=>c.length)) filas.push(celdas);
    });
  }
  return filas.filter(f=>f.some(c=>String(c).trim().length));
}

function toggleAccesoTotal(){
  const total = document.getElementById('usuario-acceso-total').checked;
  document.querySelectorAll('.chk-permiso-modulo').forEach(c=>{ c.disabled = total; if(total) c.checked = false; });
}

function abrirModalUsuario(u){
  document.getElementById('titulo-modal-usuario').textContent = u ? 'Editar usuario' : 'Crear usuario';
  document.getElementById('usuario-id').value = u?.id || '';
  document.getElementById('usuario-usuario').value = u?.usuario || '';
  document.getElementById('usuario-usuario').disabled = !!u; // el nombre de usuario no se cambia una vez creado
  document.getElementById('usuario-pass').value = '';
  document.getElementById('usuario-pass').placeholder = u ? 'Dejar en blanco para no cambiarla' : 'Mínimo 4 caracteres';
  document.getElementById('usuario-nombre').value = u?.nombre || '';

  const rolesPredefinidos = ['Administrativo','Director Distrital','Analista RRHH','Secretaria','Contable','Supervisor'];
  const rolActual = u?.rol || 'Administrativo';
  const selectRol = document.getElementById('usuario-rol-select');
  if(rolesPredefinidos.includes(rolActual)){
    selectRol.value = rolActual;
    document.getElementById('usuario-rol').style.display = 'none';
    document.getElementById('usuario-rol').value = rolActual;
  } else {
    selectRol.value = '__otro__';
    document.getElementById('usuario-rol').style.display = 'block';
    document.getElementById('usuario-rol').value = rolActual;
  }

  const permisos = Array.isArray(u?.permisos_rh) ? u.permisos_rh : [];
  const accesoTotal = !u || permisos.length === 0;
  document.getElementById('usuario-acceso-total').checked = accesoTotal;
  document.querySelectorAll('.chk-permiso-modulo').forEach(c=>{
    c.disabled = accesoTotal;
    c.checked = permisos.includes(c.value);
  });

  abrirModal('modal-usuario');
}

function toggleRolPersonalizadoRH(){
  const esOtro = document.getElementById('usuario-rol-select').value === '__otro__';
  const input = document.getElementById('usuario-rol');
  input.style.display = esOtro ? 'block' : 'none';
  if(!esOtro) input.value = document.getElementById('usuario-rol-select').value;
  else input.value = '';
}

async function guardarUsuario(){
  const id = document.getElementById('usuario-id').value;
  const usuario = document.getElementById('usuario-usuario').value.trim().toLowerCase();
  const pass = document.getElementById('usuario-pass').value;
  const nombre = document.getElementById('usuario-nombre').value.trim();
  const rolSelect = document.getElementById('usuario-rol-select').value;
  const rol = (rolSelect === '__otro__' ? document.getElementById('usuario-rol').value.trim() : rolSelect) || 'Administrativo';

  if(!usuario || !nombre){ toast('Usuario y nombre son obligatorios.','error'); return; }
  if(rolSelect === '__otro__' && !document.getElementById('usuario-rol').value.trim()){
    toast('Escribe el rol personalizado.','error'); return;
  }
  if(!id && !pass){ toast('La contraseña es obligatoria para un usuario nuevo.','error'); return; }
  if(pass && pass.length < 4){ toast('La contraseña debe tener al menos 4 caracteres.','error'); return; }
  if(usuario === USUARIO_CREADOR){ toast('Ese nombre de usuario está reservado.','error'); return; }

  const accesoTotal = document.getElementById('usuario-acceso-total').checked;
  const permisos = accesoTotal ? null : [...document.querySelectorAll('.chk-permiso-modulo:checked')].map(c=>c.value);
  if(!accesoTotal && (!permisos || !permisos.length)){
    toast('Selecciona al menos un módulo, o marca "Acceso total".','error'); return;
  }

  const payload = { nombre, rol, permisos_rh: permisos };
  if(pass) payload.pass = pass;

  if(id){
    const { error } = await sb.from('usuarios_fin').update(payload).eq('id', id);
    if(error){ toast(error.message,'error'); return; }
  } else {
    const { data: existente } = await sb.from('usuarios_fin').select('id').eq('usuario', usuario).maybeSingle();
    if(existente){ toast('Ya existe un usuario con ese nombre.','error'); return; }
    const { error } = await sb.from('usuarios_fin').insert({ usuario, pass, ...payload });
    if(error){ toast(error.message,'error'); return; }
  }

  toast('Usuario guardado correctamente.','exito');
  cerrarModal('modal-usuario');
  renderUsuarios();
}

  { id:'riesgo', titulo:'9. Riesgo laboral (ATR-2 / EPR-1)', contenido: `

    <p>Se indica el empleado, el tipo de formulario, la fecha del evento y la fecha en que se notifica, la descripción y lugar del suceso, y un checklist de documentación (certificado médico, acta policial si aplica, formulario firmado por RRHH).</p>

  { id:'certlab', titulo:'12. Certificación laboral', contenido: `
    <p>Genera la carta "A quien pueda interesar" que certifica el período y cargo en que un empleado ha prestado servicios en el distrito, para trámites como constancias laborales, préstamos o procesos migratorios.</p>
    <p>Si la certificación es solicitada por un tercero, el sistema marca la condición y exige confirmar si se cuenta con el poder notarial correspondiente, siguiendo la norma del MINERD de no entregar certificaciones a terceros sin ese respaldo.</p>

    <p>Los estatus disponibles son: Activo, Inactivo, Sustituido, Renunciado, Fallecido y Cancelado. El estatus puede cambiarse rápidamente desde el listado, sin necesidad de abrir el formulario completo de edición.</p>
    <p>Se puede buscar por nombre, cédula o cargo, filtrar por estatus, e importar personal en lote desde un archivo Excel/CSV (que actualiza automáticamente a quienes ya existan, identificándolos por cédula).</p>

async function renderManual(){
  const main = document.getElementById('main-content');
  main.innerHTML = `
    <div class="tarjeta">
      <div class="tarjeta-header">
        <h3>Manual del Sistema de Recursos Humanos</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-secundario btn-chico" onclick="exportarManualWord()">⬇ Word</button>
          <button class="btn btn-secundario btn-chico" onclick="exportarManualPDF()">⬇ PDF</button>
          <button class="btn btn-secundario btn-chico" onclick="imprimirManual()">🖨 Imprimir</button>
        </div>
      </div>
      <div class="tarjeta-body">
        <p class="texto-ayuda" style="margin-bottom:14px;">Distrito Educativo 16-06, Bonao Nordeste · Guía de uso completa, con todas las secciones del sistema.</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;">
          ${MANUAL_SECCIONES.map(s=>`<a href="#manual-${s.id}" class="badge badge-azul" style="text-decoration:none;cursor:pointer;">${escapeHtml(s.titulo)}</a>`).join('')}
        </div>
        <div id="manual-contenido">
          ${MANUAL_SECCIONES.map(s=>`
            <div id="manual-${s.id}" style="margin-bottom:28px;padding-bottom:18px;border-bottom:1px solid var(--gris-300);">
              <h3 style="color:var(--azul-900);margin-bottom:8px;">${escapeHtml(s.titulo)}</h3>
              <div style="font-size:13.5px;line-height:1.7;color:var(--gris-900);">${s.contenido}</div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function generarHTMLManualCompleto(){
  const cuerpo = MANUAL_SECCIONES.map(s=>`
    <h2 style="color:#0d2340;margin-top:26px;">${escapeHtml(s.titulo)}</h2>
    <div>${s.contenido}</div>
  `).join('');
  return `<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
    <title>Manual del Sistema de RH - Distrito 16-06</title>
    <style>
      body{font-family:Arial,sans-serif;font-size:13px;color:#1a1a1a;line-height:1.6;padding:40px;max-width:880px;margin:0 auto;}
      h1{color:#0d2340;font-size:22px;border-bottom:3px solid #b3242c;padding-bottom:10px;}
      h2{font-size:15px;border-top:1px solid #ccc;padding-top:14px;}
      p{margin:6px 0;}
      .portada-sub{color:#555;font-size:13px;margin-bottom:30px;}
      @media print{ h2{page-break-before:auto;} }
    </style></head><body>
    <h1>Manual del Sistema de Recursos Humanos</h1>
    <div class="portada-sub">Distrito Educativo 16-06, Bonao Nordeste · MINERD</div>
    ${cuerpo}
  </body></html>`;
}

function imprimirManual(){
  const w = window.open('', '_blank');
  w.document.write(generarHTMLManualCompleto());
  w.document.close();
  setTimeout(()=>w.print(), 400);
}

function exportarManualPDF(){
  // Reutiliza el mismo HTML imprimible; el usuario elige "Guardar como PDF" en el diálogo de impresión.
  imprimirManual();
}

// Exporta como documento .doc compatible con Word (HTML con cabecera de Word),
// ya que generar un .docx real requeriría una librería adicional no cargada en este sistema.
function exportarManualWord(){
  const html = generarHTMLManualCompleto();
  const htmlWord = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
    <head><meta charset="UTF-8"><!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View></w:WordDocument></xml><![endif]--></head>
    <body>${html.replace(/<!DOCTYPE.*?>/,'').replace(/<html.*?>|<\/html>/g,'').replace(/<head>.*?<\/head>/s,'')}</body></html>`;
  const blob = new Blob(['\ufeff', htmlWord], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'manual_sistema_rh_1606.doc';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
</script>
