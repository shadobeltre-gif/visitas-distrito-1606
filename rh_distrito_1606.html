<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RH 16-06 | Distrito Educativo 16-06 Bonao Nordeste</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --azul-900:#0d2340;
  --azul-800:#11315c;
  --azul-700:#163f78;
  --azul-600:#1d4f93;
  --azul-500:#2563ab;
  --azul-100:#e7eef8;
  --rojo-600:#b3242c;
  --gris-900:#1b1f24;
  --gris-700:#3d4450;
  --gris-500:#6b7280;
  --gris-300:#d6dae1;
  --gris-100:#f4f6f9;
  --blanco:#ffffff;
  --verde-600:#1f7a4d;
  --amarillo-600:#a8730a;
  --radio:8px;
  --sombra: 0 1px 3px rgba(13,35,64,.08), 0 1px 2px rgba(13,35,64,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Segoe UI',Arial,'Helvetica Neue',sans-serif;
  background:var(--gris-100);
  color:var(--gris-900);
  font-size:14px;
}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}

/* ============ LOGIN ============ */
#pantalla-login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(160deg,var(--azul-900) 0%,var(--azul-700) 55%,var(--azul-600) 100%);
  padding:20px;
}
.tarjeta-login{
  background:var(--blanco);
  border-radius:12px;
  width:100%;
  max-width:420px;
  box-shadow:0 20px 50px rgba(0,0,0,.35);
  overflow:hidden;
}
.encabezado-login{
  background:var(--azul-900);
  color:var(--blanco);
  padding:28px 28px 22px;
  text-align:center;
  border-bottom:4px solid var(--rojo-600);
}
.encabezado-login .escudo{
  width:54px;height:54px;
  margin:0 auto 10px;
  border-radius:50%;
  background:var(--blanco);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;color:var(--azul-900);font-size:20px;
}
.encabezado-login h1{
  font-size:15px;margin:0 0 4px;letter-spacing:.5px;font-weight:700;
  text-transform:uppercase;
}
.encabezado-login p{margin:0;font-size:13px;opacity:.85;}
.cuerpo-login{padding:26px 28px 30px;}
.tabs-login{display:flex;border:1px solid var(--gris-300);border-radius:var(--radio);overflow:hidden;margin-bottom:20px;}
.tab-login{flex:1;text-align:center;padding:10px;background:var(--gris-100);font-weight:600;font-size:13px;color:var(--gris-700);border:none;}
.tab-login.activo{background:var(--azul-700);color:var(--blanco);}
.campo{margin-bottom:14px;}
.campo label{display:block;font-size:12.5px;font-weight:600;color:var(--gris-700);margin-bottom:5px;}
.campo input,.campo select{
  width:100%;padding:10px 12px;border:1px solid var(--gris-300);border-radius:var(--radio);
  outline:none;transition:border .15s;
}
.campo input:focus,.campo select:focus{border-color:var(--azul-500);}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 16px;border-radius:var(--radio);border:none;font-weight:600;font-size:13.5px;
  transition:filter .15s, transform .05s;
}
.btn:active{transform:translateY(1px);}
.btn-primario{background:var(--azul-700);color:var(--blanco);width:100%;padding:11px;}
.btn-primario:hover{filter:brightness(1.08);}
.btn-secundario{background:var(--gris-100);color:var(--gris-700);border:1px solid var(--gris-300);}
.btn-secundario:hover{filter:brightness(.97);}
.btn-rojo{background:var(--rojo-600);color:var(--blanco);}
.btn-verde{background:var(--verde-600);color:var(--blanco);}
.btn-chico{padding:6px 10px;font-size:12.5px;}
.error-login{
  background:#fde9e9;color:var(--rojo-600);padding:10px 12px;border-radius:var(--radio);
  font-size:12.5px;margin-bottom:14px;display:none;
}
.pie-login{margin-top:18px;text-align:center;font-size:11.5px;color:var(--gris-500);}

/* ============ LAYOUT APP ============ */
#app{display:none;min-height:100vh;}
.layout{display:flex;min-height:100vh;}
.sidebar{
  width:250px;flex-shrink:0;background:var(--azul-900);color:var(--blanco);
  display:flex;flex-direction:column;
  min-height:0;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.sidebar-header{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.12);}
.sidebar-header .escudo-mini{
  width:36px;height:36px;border-radius:50%;background:var(--blanco);color:var(--azul-900);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;margin-bottom:8px;
}
.sidebar-header h2{font-size:13.5px;margin:0 0 2px;font-weight:700;line-height:1.3;}
.sidebar-header p{font-size:11px;margin:0;opacity:.7;}
.sidebar-nav{flex:1;padding:10px 0;}
.grupo-nav{margin-bottom:4px;}
.grupo-nav-titulo{
  padding:10px 18px 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;
  color:rgba(255,255,255,.5);font-weight:700;cursor:pointer;display:flex;justify-content:space-between;
  align-items:center;user-select:none;
}
.grupo-nav-titulo .flecha{transition:transform .15s;font-size:10px;}
.grupo-nav.colapsado .flecha{transform:rotate(-90deg);}
.grupo-nav.colapsado .items-nav{display:none;}
.item-nav{
  display:flex;align-items:center;gap:10px;padding:10px 18px;font-size:13px;color:rgba(255,255,255,.85);
  cursor:pointer;border-left:3px solid transparent;
}
.item-nav:hover{background:rgba(255,255,255,.06);}
.item-nav.activo{background:rgba(255,255,255,.1);border-left-color:var(--rojo-600);font-weight:600;color:var(--blanco);}
.item-nav .icono{width:18px;text-align:center;}
.sidebar-footer{padding:14px 18px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;}
.sidebar-footer .nombre-usuario{font-weight:600;margin-bottom:2px;}
.sidebar-footer .rol-usuario{opacity:.65;font-size:11px;margin-bottom:10px;}

.contenido{flex:1;min-height:0;display:flex;flex-direction:column;min-width:0;}
.topbar{
  background:var(--blanco);border-bottom:1px solid var(--gris-300);padding:14px 24px;
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;
}
.topbar h1{font-size:17px;margin:0;color:var(--azul-900);}
.topbar .subtitulo{font-size:12px;color:var(--gris-500);margin-top:2px;}
.main{padding:22px 24px;flex:1;}

.tarjeta{background:var(--blanco);border-radius:10px;box-shadow:var(--sombra);border:1px solid var(--gris-300);margin-bottom:18px;}
.tarjeta-header{padding:14px 18px;border-bottom:1px solid var(--gris-300);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.tarjeta-header h3{margin:0;font-size:14.5px;color:var(--azul-900);}
.tarjeta-body{padding:18px;}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
@media (max-width:760px){.grid-2,.grid-3{grid-template-columns:1fr;}}

table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{
  text-align:left;background:var(--azul-100);color:var(--azul-900);padding:9px 10px;
  font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;font-weight:700;
  position:sticky;top:0;
}
tbody td{padding:9px 10px;border-bottom:1px solid var(--gris-300);vertical-align:middle;}
tbody tr:hover{background:var(--gris-100);}
.tabla-wrap{overflow-x:auto;}

.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-azul{background:var(--azul-100);color:var(--azul-700);}
.badge-verde{background:#e3f4ea;color:var(--verde-600);}
.badge-rojo{background:#fde9e9;color:var(--rojo-600);}
.badge-amarillo{background:#fdf1de;color:var(--amarillo-600);}
.badge-gris{background:var(--gris-100);color:var(--gris-700);}

.kpi{display:flex;flex-direction:column;gap:4px;}
.kpi .valor{font-size:26px;font-weight:800;color:var(--azul-900);}
.kpi .etiqueta{font-size:12px;color:var(--gris-500);}

.modal-fondo{
  display:none;position:fixed;inset:0;background:rgba(13,35,64,.55);z-index:100;
  align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;
}
.modal-fondo.abierto{display:flex;}
.modal{background:var(--blanco);border-radius:10px;width:100%;max-width:640px;box-shadow:0 20px 50px rgba(0,0,0,.3);}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--gris-300);display:flex;justify-content:space-between;align-items:center;}
.modal-header h3{margin:0;font-size:15px;color:var(--azul-900);}
.modal-cerrar{background:none;border:none;font-size:20px;color:var(--gris-500);line-height:1;}
.modal-body{padding:18px 20px;max-height:70vh;overflow-y:auto;}
.modal-footer{padding:14px 20px;border-top:1px solid var(--gris-300);display:flex;justify-content:flex-end;gap:8px;}

.vacio{text-align:center;padding:40px 20px;color:var(--gris-500);}
.vacio .icono-vacio{font-size:34px;margin-bottom:10px;opacity:.5;}

.toast-cont{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--azul-900);color:var(--blanco);padding:12px 16px;border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.25);font-size:13px;max-width:320px;}
.toast.exito{background:var(--verde-600);}
.toast.error{background:var(--rojo-600);}

.fieldset-doc{border:1px dashed var(--gris-300);border-radius:8px;padding:14px;margin-bottom:14px;}
.fieldset-doc legend{font-size:12px;font-weight:700;color:var(--azul-700);padding:0 6px;}

.menu-hamburguesa{display:none;background:none;border:none;font-size:22px;color:var(--azul-900);}
@media (max-width:880px){
  .sidebar{position:fixed;left:-260px;top:0;height:100vh;z-index:60;transition:left .2s;}
  .sidebar.abierta{left:0;}
  .menu-hamburguesa{display:block;}
  .overlay-sidebar{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;}
  .overlay-sidebar.activo{display:block;}
}

.preview-telegrama{
  background:#fbfbf9;border:1px solid var(--gris-300);padding:30px;border-radius:6px;font-family:'Times New Roman',Times,serif;
  font-size:14px;line-height:1.7;color:#1a1a1a;
}
.preview-telegrama .firma-img{font-style:italic;font-size:22px;color:#163f78;margin:6px 0;}

.spinner{
  width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;
  display:inline-block;animation:girar .6s linear infinite;
}
@keyframes girar{to{transform:rotate(360deg);}}

.texto-ayuda{font-size:11.5px;color:var(--gris-500);margin-top:4px;}
.requerido{color:var(--rojo-600);}
</style>
</head>
<body>

<!-- ============ PANTALLA LOGIN ============ -->
<div id="pantalla-login">
  <div class="tarjeta-login">
    <div class="encabezado-login">
      <div class="escudo">16</div>
      <h1>Distrito Educativo 16-06</h1>
      <p>Sistema de Recursos Humanos · Bonao Nordeste</p>
    </div>
    <div class="cuerpo-login">
      <div class="tabs-login">
        <button class="tab-login activo" id="tab-admin" onclick="cambiarTabLogin('admin')">Administrativo</button>
        <button class="tab-login" id="tab-tecnico" onclick="cambiarTabLogin('tecnico')">Personal (Cédula)</button>
      </div>

      <div id="error-login" class="error-login"></div>

      <div id="form-admin">
        <div class="campo">
          <label>Usuario</label>
          <input type="text" id="admin-usuario" placeholder="Ej. admin.rh">
        </div>
        <div class="campo">
          <label>Contraseña</label>
          <input type="password" id="admin-clave" placeholder="••••••••">
        </div>
      </div>

      <div id="form-tecnico" style="display:none;">
        <div class="campo">
          <label>Cédula</label>
          <input type="text" id="tecnico-cedula" placeholder="000-0000000-0">
        </div>
      </div>

      <button class="btn btn-primario" id="btn-login" onclick="iniciarSesion()">Iniciar sesión</button>
      <div class="pie-login">MINERD · Regional 16 · Distrito 06</div>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="layout">
    <div class="overlay-sidebar" id="overlay-sidebar" onclick="toggleSidebar(false)"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="escudo-mini">16</div>
        <h2>RH Distrito 16-06</h2>
        <p>Bonao Nordeste</p>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="nombre-usuario" id="nombre-usuario-sidebar">—</div>
        <div class="rol-usuario" id="rol-usuario-sidebar">—</div>
        <button class="btn btn-secundario btn-chico" style="width:100%;" onclick="cerrarSesion()">Cerrar sesión</button>
      </div>
    </aside>

    <div class="contenido">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:12px;">
          <button class="menu-hamburguesa" onclick="toggleSidebar()">☰</button>
          <div>
            <h1 id="titulo-vista">Panel general</h1>
            <div class="subtitulo" id="subtitulo-vista">Resumen del módulo de Recursos Humanos</div>
          </div>
        </div>
      </div>
      <div class="main" id="main-content"></div>
    </div>
  </div>
</div>

<div class="toast-cont" id="toast-cont"></div>

<script>
/* ====================== CONFIG SUPABASE ====================== */
const SUPABASE_URL = 'https://ejkvehnzjkxbymuvejoh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVqa3ZlaG56amt4YnltdXZlam9oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNjc4MDIsImV4cCI6MjA5NTk0MzgwMn0.FI0Z_Mx1FQ4hpA6JYkYJ4X9CoVDHgK_bDq_qiak3WOU';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let sesion = { tipo:null, usuario:null }; // tipo: 'admin' | 'tecnico'
let vistaActual = 'panel';

/* ====================== TOAST ====================== */
function toast(msg, tipo=''){
  const cont = document.getElementById('toast-cont');
  const el = document.createElement('div');
  el.className = 'toast ' + tipo;
  el.textContent = msg;
  cont.appendChild(el);
  setTimeout(()=>el.remove(), 4000);
}

/* ====================== LOGIN ====================== */
function cambiarTabLogin(tipo){
  document.getElementById('tab-admin').classList.toggle('activo', tipo==='admin');
  document.getElementById('tab-tecnico').classList.toggle('activo', tipo==='tecnico');
  document.getElementById('form-admin').style.display = tipo==='admin' ? 'block' : 'none';
  document.getElementById('form-tecnico').style.display = tipo==='tecnico' ? 'block' : 'none';
  document.getElementById('error-login').style.display = 'none';
}

async function iniciarSesion(){
  const esAdmin = document.getElementById('tab-admin').classList.contains('activo');
  const errEl = document.getElementById('error-login');
  errEl.style.display = 'none';
  const btn = document.getElementById('btn-login');
  btn.disabled = true;
  const textoOriginal = btn.textContent;
  btn.innerHTML = '<span class="spinner"></span> Verificando...';

  try{
    if(esAdmin){
      const usuario = document.getElementById('admin-usuario').value.trim().toLowerCase();
      const clave = document.getElementById('admin-clave').value;
      if(!usuario || !clave){ throw new Error('Completa usuario y contraseña.'); }

      const { data, error } = await sb.from('usuarios_fin')
        .select('*');

      if(error) throw error;
      const encontrado = (data||[]).find(u => (u.usuario||'').toLowerCase() === usuario && u.pass === clave);
      if(!encontrado) throw new Error('Usuario o contraseña incorrectos.');

      sesion = { tipo:'admin', usuario:encontrado };
    } else {
      const cedula = document.getElementById('tecnico-cedula').value.trim();
      if(!cedula){ throw new Error('Ingresa tu número de cédula.'); }

      const { data, error } = await sb.from('personal_rh')
        .select('*, centros_rh(nombre_centro)')
        .eq('cedula', cedula)
        .maybeSingle();

      if(error) throw error;
      if(!data) throw new Error('No se encontró personal con esa cédula.');

      sesion = { tipo:'tecnico', usuario:data };
    }

    document.getElementById('pantalla-login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    construirMenu();
    irAVista('panel');

  }catch(err){
    errEl.textContent = err.message || 'Error al iniciar sesión.';
    errEl.style.display = 'block';
  }finally{
    btn.disabled = false;
    btn.textContent = textoOriginal;
  }
}

function cerrarSesion(){
  sesion = { tipo:null, usuario:null };
  document.getElementById('app').style.display = 'none';
  document.getElementById('pantalla-login').style.display = 'flex';
  document.getElementById('admin-clave').value = '';
}

/* ====================== SIDEBAR / MENU ====================== */
const MENU_ADMIN = [
  { grupo:'General', items:[
    { id:'panel', icono:'▦', label:'Panel general' },
  ]},
  { grupo:'Acciones de Personal', items:[
    { id:'solicitudes', icono:'📋', label:'Solicitudes AP' },
    { id:'telegramas', icono:'✉', label:'Telegramas' },
    { id:'puestasdisposicion', icono:'📤', label:'Puesta a disposición' },
    { id:'cartasaceptacion', icono:'📥', label:'Carta de aceptación' },
  ]},
  { grupo:'Ausencias', items:[
    { id:'vacaciones', icono:'🏖', label:'Vacaciones' },
    { id:'licenciaspermisos', icono:'🗂', label:'Licencias y permisos' },
  ]},
  { grupo:'Seguridad Social', items:[
    { id:'riesgoslaborales', icono:'⚠', label:'Riesgo laboral (ATR-2/EPR-1)' },
    { id:'pensiones', icono:'🎓', label:'Pensiones' },
    { id:'segurossalud', icono:'➕', label:'Seguro de salud' },
  ]},
  { grupo:'Certificaciones', items:[
    { id:'certificacioneslaborales', icono:'📜', label:'Certificación laboral' },
  ]},
  { grupo:'Personal y Centros', items:[
    { id:'personal', icono:'👤', label:'Personal' },
    { id:'centros', icono:'🏫', label:'Centros educativos' },
    { id:'relacioncentros', icono:'📊', label:'Relación de centros' },
  ]},
  { grupo:'Nómina MINERD', items:[
    { id:'nominas', icono:'💵', label:'Nóminas' },
  ]},
];

const MENU_TECNICO = [
  { grupo:'General', items:[
    { id:'panel', icono:'▦', label:'Mi panel' },
  ]},
];

function construirMenu(){
  const nav = document.getElementById('sidebar-nav');
  const menu = sesion.tipo === 'admin' ? MENU_ADMIN : MENU_TECNICO;
  nav.innerHTML = menu.map((g,gi)=>`
    <div class="grupo-nav" data-grupo="${gi}">
      <div class="grupo-nav-titulo" onclick="toggleGrupoNav(${gi})">
        <span>${g.grupo}</span><span class="flecha">▾</span>
      </div>
      <div class="items-nav">
        ${g.items.map(it=>`
          <div class="item-nav" data-vista="${it.id}" onclick="irAVista('${it.id}')">
            <span class="icono">${it.icono}</span><span>${it.label}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');

  if(sesion.tipo === 'admin'){
    document.getElementById('nombre-usuario-sidebar').textContent = sesion.usuario.nombre || sesion.usuario.usuario;
    document.getElementById('rol-usuario-sidebar').textContent = sesion.usuario.rol || 'Administrativo';
  } else {
    document.getElementById('nombre-usuario-sidebar').textContent = (sesion.usuario.nombres+' '+sesion.usuario.apellidos);
    document.getElementById('rol-usuario-sidebar').textContent = sesion.usuario.cargo_actual || 'Personal';
  }
}

function toggleGrupoNav(i){
  document.querySelector(`.grupo-nav[data-grupo="${i}"]`).classList.toggle('colapsado');
}

function toggleSidebar(forzar){
  const sb_ = document.getElementById('sidebar');
  const ov = document.getElementById('overlay-sidebar');
  const abrir = forzar !== undefined ? forzar : !sb_.classList.contains('abierta');
  sb_.classList.toggle('abierta', abrir);
  ov.classList.toggle('activo', abrir);
}

/* ====================== ROUTER DE VISTAS ====================== */
const TITULOS = {
  panel:['Panel general','Resumen del módulo de Recursos Humanos'],
  solicitudes:['Solicitudes AP','Requerimientos de Acción de Personal'],
  telegramas:['Telegramas','Notificaciones oficiales de nombramiento'],
  puestasdisposicion:['Puesta a disposición','Oficios de liberación de personal'],
  cartasaceptacion:['Carta de aceptación','Oficios de aceptación de personal recibido'],

async function irAVista(id){
  vistaActual = id;
  document.querySelectorAll('.item-nav').forEach(el=>{
    el.classList.toggle('activo', el.dataset.vista === id);
  });
  const [t,s] = TITULOS[id] || [id,''];
  document.getElementById('titulo-vista').textContent = t;
  document.getElementById('subtitulo-vista').textContent = s;
  toggleSidebar(false);

  const main = document.getElementById('main-content');
  main.innerHTML = '<div class="vacio">Cargando…</div>';

  try{
    if(id === 'panel') await renderPanel();
    else if(id === 'solicitudes') await renderSolicitudes();
    else if(id === 'telegramas') await renderTelegramas();
    else if(id === 'puestasdisposicion') await renderPuestasDisposicion();
    else if(id === 'cartasaceptacion') await renderCartasAceptacion();
    else if(id === 'vacaciones') await renderVacaciones();
    else if(id === 'licenciaspermisos') await renderLicenciasPermisos();
    else if(id === 'riesgoslaborales') await renderRiesgosLaborales();
    else if(id === 'pensiones') await renderPensiones();
    else if(id === 'segurossalud') await renderSegurosSalud();
    else if(id === 'certificacioneslaborales') await renderCertificacionesLaborales();
    else if(id === 'personal') await renderPersonal();
    else if(id === 'centros') await renderCentros();
    else if(id === 'relacioncentros') await renderRelacionCentros();
    else if(id === 'nominas') await renderNominas();
  }catch(err){
    console.error(err);
    main.innerHTML = `<div class="tarjeta"><div class="tarjeta-body"><div class="vacio">
      <div class="icono-vacio">⚠</div>Error al cargar: ${err.message}
    </div></div></div>`;
  }
}

/* ====================== UTILIDADES ====================== */
function escapeHtml(str){
  if(str===null||str===undefined) return '';
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fechaCorta(f){
  if(!f) return '—';
  const d = new Date(f);
  if(isNaN(d)) return f;
  return d.toLocaleDateString('es-DO',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function badgeEstado(estado){
  const mapa = {
    borrador:['gris','Borrador'], enviado:['azul','Enviado'],
    expediente_incompleto:['amarillo','Expediente incompleto'], incidencias:['rojo','Incidencias'],
    aprobado:['verde','Aprobado'], nombrado:['verde','Nombrado'], rechazado:['rojo','Rechazado'],
    pendiente:['gris','Pendiente'],
    generado:['gris','Generado'], enviado_tel:['azul','Enviado'], entregado:['verde','Entregado'],
    activo:['verde','Activo'], inactivo:['gris','Inactivo'], sustituido:['amarillo','Sustituido'],
    renunciado:['rojo','Renunciado'], fallecido:['rojo','Fallecido'],
    encontrado:['verde','Encontrado'], no_encontrado:['rojo','No encontrado'], revision_manual:['amarillo','Revisar'],
    aceptado:['verde','Aceptado'],
    solicitado:['azul','Solicitado'], firmado_supervisor:['amarillo','Firmado supervisor'],
    autorizado_rrll:['verde','Autorizado RRLL'], aprobado_supervisor:['verde','Aprobado supervisor'],
    confirmado:['verde','Confirmado'],
    notificado:['azul','Notificado'], enviado_sisalril:['amarillo','Enviado SISALRIL'],
    calificado_AT_EP:['verde','Calificado'],
    armando_expediente:['gris','Armando expediente'], enviado_minerd:['azul','Enviado MINERD'],
    enviado_inabima:['amarillo','Enviado INABIMA'], decreto_promulgado:['verde','Decreto promulgado'],
    en_proceso:['amarillo','En proceso'], emitida:['verde','Emitida'], entregada:['verde','Entregada'],
    rechazada:['rojo','Rechazada'],
    depositado_nomina:['amarillo','Depositado en nómina'],
  };
  const [color,texto] = mapa[estado] || ['gris', estado];

function abrirModalCentro(c){
  document.getElementById('titulo-modal-centro').textContent = c ? 'Editar centro' : 'Agregar centro';
  document.getElementById('centro-id').value = c?.id || '';
  document.getElementById('centro-nombre').value = c?.nombre_centro || '';
  document.getElementById('centro-sigerd').value = c?.codigo_sigerd || '';
  document.getElementById('centro-matricula').value = c?.matricula || '';
  document.getElementById('centro-nivel').value = c?.nivel || '';
  document.getElementById('centro-tanda').value = c?.tanda || '';
  document.getElementById('centro-dependencia').value = c?.numero_dependencia_nomina || '';
  document.getElementById('centro-director').value = c?.director_nombre || '';
  document.getElementById('centro-director-sexo').value = c?.director_sexo || '';
  abrirModal('modal-centro');
}

async function guardarCentro(){
  const id = document.getElementById('centro-id').value;
  const payload = {
    nombre_centro: document.getElementById('centro-nombre').value.trim(),
    codigo_sigerd: document.getElementById('centro-sigerd').value.trim() || null,
    matricula: document.getElementById('centro-matricula').value || null,
    nivel: document.getElementById('centro-nivel').value.trim() || null,
    tanda: document.getElementById('centro-tanda').value || null,
    numero_dependencia_nomina: document.getElementById('centro-dependencia').value.trim() || null,
    director_nombre: document.getElementById('centro-director').value.trim() || null,
    director_sexo: document.getElementById('centro-director-sexo').value || null,
  };
  if(!payload.nombre_centro){ toast('El nombre del centro es obligatorio.','error'); return; }

  const q = id ? sb.from('centros_rh').update(payload).eq('id', id) : sb.from('centros_rh').insert(payload);
  const { error } = await q;
  if(error){ toast(error.message,'error'); return; }
  toast('Centro guardado correctamente.','exito');
  cerrarModal('modal-centro');
  renderCentros();
}

function pintarTablaPersonal(lista){
  const tbody = document.getElementById('tbody-personal');
  if(!lista || !lista.length){
    tbody.innerHTML = `<tr><td colspan="6"><div class="vacio"><div class="icono-vacio">👤</div>No se encontró personal con ese criterio.</div></td></tr>`;
    return;
  }
  tbody.innerHTML = lista.map(p=>`
    <tr>
      <td><strong>${escapeHtml(p.nombres)} ${escapeHtml(p.apellidos)}</strong></td>
      <td>${escapeHtml(p.cedula)}</td>
      <td>${escapeHtml(p.cargo_actual||'—')}</td>
      <td>${escapeHtml(p.centros_rh?.nombre_centro||'—')}</td>
      <td>
        <select onchange="cambiarEstatusRapidoPersonal(${p.id}, this.value)" style="padding:4px 6px;border-radius:6px;border:1px solid var(--gris-300);font-size:12px;">
          <option value="activo" ${p.estatus==='activo'?'selected':''}>Activo</option>
          <option value="inactivo" ${p.estatus==='inactivo'?'selected':''}>Inactivo</option>
          <option value="sustituido" ${p.estatus==='sustituido'?'selected':''}>Sustituido</option>
          <option value="renunciado" ${p.estatus==='renunciado'?'selected':''}>Renunciado</option>
          <option value="fallecido" ${p.estatus==='fallecido'?'selected':''}>Fallecido</option>
        </select>

    </tr>
  `).join('');
}

function filtrarPersonal(){
  const texto = document.getElementById('filtro-personal-texto').value.toLowerCase().trim();
  const estatus = document.getElementById('filtro-personal-estatus').value;
  const filtrado = (window._personalTodos||[]).filter(p=>{
    if(estatus && p.estatus !== estatus) return false;
    if(!texto) return true;
    const campo = `${p.nombres} ${p.apellidos} ${p.cedula} ${p.cargo_actual||''}`.toLowerCase();
    return campo.includes(texto);
  });
  pintarTablaPersonal(filtrado);
}

async function cambiarEstatusRapidoPersonal(id, nuevoEstatus){
  const { error } = await sb.from('personal_rh').update({ estatus: nuevoEstatus }).eq('id', id);
  if(error){ toast(error.message,'error'); return; }
  const p = (window._personalTodos||[]).find(x=>x.id===id);
  if(p) p.estatus = nuevoEstatus;
  toast(`Estatus actualizado a "${nuevoEstatus}".`,'exito');
}

async function guardarPersonal(){
  const id = document.getElementById('personal-id').value;

    cedula: document.getElementById('personal-cedula').value.trim(),
    sexo: document.getElementById('personal-sexo').value,
    nombres: document.getElementById('personal-nombres').value.trim(),

    direccion: document.getElementById('personal-direccion').value.trim() || null,
    nivel_academico: document.getElementById('personal-nivel').value.trim() || null,
    cargo_actual: document.getElementById('personal-cargo').value.trim() || null,
    centro_id: document.getElementById('personal-centro').value || null,
    numero_dependencia_nomina: document.getElementById('personal-dependencia').value.trim() || null,
    fecha_ingreso: document.getElementById('personal-ingreso').value || null,
    estatus: document.getElementById('personal-estatus').value,

  if(!payload.cedula || !payload.sexo || !payload.nombres || !payload.apellidos){

  if(error){ toast(error.message,'error'); return; }

function leerCandidatosDelForm(){
  const bloques = document.querySelectorAll('#lista-candidatos [data-candidato]');
  const lista = [];
  bloques.forEach(b=>{
    const val = sel => b.querySelector(sel)?.value?.trim() || null;

      telefono: val('.cand-telefono'), cargo_propuesto: val('.cand-cargo'), nivel_academico: val('.cand-nivel'),
      direccion: val('.cand-direccion'),
      sustituido_cedula: val('.cand-sus-cedula'), sustituido_nombres: val('.cand-sus-nombres'),
      sustituido_apellidos: val('.cand-sus-apellidos'), sustituido_cargo: val('.cand-sus-cargo'),
      sustituido_nivel_academico: val('.cand-sus-nivel'), sustituido_fecha_ingreso: val('.cand-sus-ingreso'),

async function guardarSolicitud(){
  const id = document.getElementById('sol-id').value;
  const payload = {
    no_solicitud: document.getElementById('sol-numero').value.trim() || null,
    fecha_solicitud: document.getElementById('sol-fecha').value || new Date().toISOString().slice(0,10),
    estado: document.getElementById('sol-estado').value,
    centro_id: document.getElementById('sol-centro').value,
    motivo_solicitud: document.getElementById('sol-motivo').value,
    observaciones: document.getElementById('sol-observaciones').value.trim() || null,
  };
  if(!payload.centro_id){ toast('Selecciona el centro educativo.','error'); return; }

  const candidatos = leerCandidatosDelForm();
  if(!candidatos.length || !candidatos[0].nombres){ toast('Agrega al menos un candidato con nombre.','error'); return; }

  let solicitudId = id;
  if(id){
    const { error } = await sb.from('solicitudes_ap').update(payload).eq('id', id);
    if(error){ toast(error.message,'error'); return; }
    // Reemplazar candidatos: borrar y reinsertar (simple y robusto para este volumen)
    await sb.from('candidatos_ap').delete().eq('solicitud_ap_id', id);
  } else {
    const { data, error } = await sb.from('solicitudes_ap').insert(payload).select('id').single();
    if(error){ toast(error.message,'error'); return; }
    solicitudId = data.id;
  }

  const filasCandidatos = candidatos.map(c=>({ ...c, solicitud_ap_id: solicitudId }));
  const { error: errCand } = await sb.from('candidatos_ap').insert(filasCandidatos);
  if(errCand){ toast(errCand.message,'error'); return; }

  toast('Solicitud AP guardada correctamente.','exito');
  cerrarModal('modal-solicitud');
  renderSolicitudes();
}

// Genera el texto del telegrama con concordancia de género automática,
// replicando el formato real usado por el Distrito 16-06.
function generarTextoTelegrama({ destinatarioNombre, centroNombre, candidatoNombre, candidatoCedula,
                                   candidatoSexo, cargoDesignado, jornada, fecha }){
  const F = candidatoSexo === 'F';
  const elLa = F ? 'la' : 'el';
  const senorA = F ? 'señora' : 'señor';
  const portadorA = F ? 'portadora' : 'portador';
  const designadoA = F ? 'Designada' : 'Designado';
  const poneloLa = F ? 'ponerla' : 'ponerlo';

  const fechaTexto = new Date(fecha+'T00:00:00').toLocaleDateString('es-DO',{day:'2-digit',month:'long',year:'numeric'});

  return `Bonao, Rep. Dom.\nDISTRITO EDUCATIVO 16-06\n${fechaTexto}\n\n`+
`Señor/a: ${destinatarioNombre}\nDirector/a\nCentro Educativo: ${centroNombre}\n\n`+
`Por este medio se le comunica que ${elLa}/la ${senorA} ${candidatoNombre} ${portadorA} de Cédula de identidad `+
`electoral No. ${candidatoCedula}, ha sido ${designadoA} como ${cargoDesignado}, en este centro educativo de `+
`Jornada Escolar ${jornada}, sírvase ${poneloLa} en la posición.\n\n`+
`Atentamente,\n\nEmeterio Beltré Tineo M.A.\nDirector Distrito Educativo 16-06, Bonao`;
}

function abrirModalTelegrama(){
  document.getElementById('tel-numero').value = '';
  document.getElementById('tel-fecha').value = new Date().toISOString().slice(0,10);
  document.getElementById('tel-destinatario').value = '';
  document.getElementById('tel-cargo').value = '';
  document.getElementById('tel-jornada').value = 'Extendida';
  document.getElementById('tel-candidato').value = '';
  document.getElementById('preview-telegrama').textContent = '';
  abrirModal('modal-telegrama');
}

function precargarTelegrama(){
  const id = document.getElementById('tel-candidato').value;
  const c = (window._candidatosNombrables||[]).find(x=>String(x.id)===String(id));
  if(!c) return;
  document.getElementById('tel-cargo').value = c.cargo_propuesto || '';
  document.getElementById('tel-destinatario').value = c.solicitudes_ap?.centros_rh?.director_nombre || '';
  document.getElementById('tel-jornada').value = c.solicitudes_ap?.centros_rh?.tanda || 'Extendida';
  document.getElementById('tel-centro-id').value = c.solicitudes_ap?.centro_id || '';
  actualizarPreviewTelegrama();
}

function actualizarPreviewTelegrama(){
  const id = document.getElementById('tel-candidato').value;
  const c = (window._candidatosNombrables||[]).find(x=>String(x.id)===String(id));
  if(!c){ document.getElementById('preview-telegrama').textContent=''; return; }
  const texto = generarTextoTelegrama({
    destinatarioNombre: document.getElementById('tel-destinatario').value || '________',
    centroNombre: c.solicitudes_ap?.centros_rh?.nombre_centro || '________',
    candidatoNombre: c.nombres+' '+c.apellidos,
    candidatoCedula: c.cedula,
    candidatoSexo: c.sexo,
    cargoDesignado: document.getElementById('tel-cargo').value || '________',
    jornada: document.getElementById('tel-jornada').value,
    fecha: document.getElementById('tel-fecha').value || new Date().toISOString().slice(0,10),
  });
  document.getElementById('preview-telegrama').textContent = texto;
}
['tel-destinatario','tel-cargo','tel-jornada','tel-fecha'].forEach(id=>{
  document.addEventListener('input', e=>{ if(e.target && e.target.id===id) actualizarPreviewTelegrama(); });
  document.addEventListener('change', e=>{ if(e.target && e.target.id===id) actualizarPreviewTelegrama(); });
});

async function guardarTelegrama(){
  const candidatoId = document.getElementById('tel-candidato').value;
  const c = (window._candidatosNombrables||[]).find(x=>String(x.id)===String(candidatoId));
  const destinatario = document.getElementById('tel-destinatario').value.trim();
  const cargo = document.getElementById('tel-cargo').value.trim();
  const centroId = document.getElementById('tel-centro-id').value;

  if(!c || !destinatario || !cargo || !centroId){
    toast('Selecciona el candidato y completa destinatario y cargo.','error'); return;
  }

  const fecha = document.getElementById('tel-fecha').value || new Date().toISOString().slice(0,10);
  const texto = generarTextoTelegrama({
    destinatarioNombre: destinatario,
    centroNombre: c.solicitudes_ap?.centros_rh?.nombre_centro || '',
    candidatoNombre: c.nombres+' '+c.apellidos,
    candidatoCedula: c.cedula,
    candidatoSexo: c.sexo,
    cargoDesignado: cargo,
    jornada: document.getElementById('tel-jornada').value,
    fecha,
  });

  const payload = {
    candidato_ap_id: candidatoId,
    centro_id: centroId,
    no_telegrama: document.getElementById('tel-numero').value.trim() || null,
    fecha_telegrama: fecha,
    destinatario_nombre: destinatario,
    cargo_designado: cargo,
    jornada: document.getElementById('tel-jornada').value,
    texto_generado: texto,
  };

  const { error } = await sb.from('telegramas_rh').insert(payload);
  if(error){ toast(error.message,'error'); return; }

  // Marcar candidato como nombrado
  await sb.from('candidatos_ap').update({ estado:'nombrado' }).eq('id', candidatoId);

  toast('Telegrama generado correctamente.','exito');
  cerrarModal('modal-telegrama');
  renderTelegramas();
}

function verTelegrama(id){
  const t = (window._telegramasData||[]).find(x=>x.id===id);
  if(!t) return;
  document.getElementById('preview-ver-telegrama').textContent = t.texto_generado;
  window._telegramaActual = t;
  abrirModal('modal-ver-telegrama');
}

function imprimirTelegramaActual(){
  const t = window._telegramaActual;
  if(!t) return;
  const w = window.open('', '_blank');
  w.document.write(`<html><head><meta charset="UTF-8"><title>Telegrama</title>
    <style>body{font-family:'Times New Roman',serif;font-size:14px;padding:50px;white-space:pre-wrap;line-height:1.7;}</style>
    </head><body>${escapeHtml(t.texto_generado)}</body></html>`);
  w.document.close();
  setTimeout(()=>w.print(), 400);
}

function generarTextoCartaAceptacion({ fecha, destinatarioNombre, destinatarioCargo, analistaNombre,
                                         analistaCargo, asunto, candidatoNombre, candidatoCedula,
                                         candidatoSexo, cargoDesignado, centroNombre }){
  const F = candidatoSexo === 'F';
  const laSenora = F ? 'la señora' : 'al señor';
  const portadorA = F ? 'portadora' : 'portador';
  const fechaTexto = new Date(fecha+'T00:00:00').toLocaleDateString('es-DO',{day:'2-digit',month:'long',year:'numeric'});
  const ubicacion = centroNombre
    ? `la cual será ubicada en ${centroNombre}, centro educativo de nuestro Distrito Educativo 16-06, Bonao Nordeste`
    : `la cual será ubicada en un centro educativo de nuestro Distrito Educativo 16-06, Bonao Nordeste`;

  return `DISTRITO EDUCATIVO 16-06, BONAO NORDESTE.\nC. / 16 de Agosto, esq. Luperón, 809-296-2126.\n\n`+
`${fechaTexto}.\nBonao, R. D.\nHHRR\n\n`+
`A la\t\t\t: ${destinatarioNombre}\n\t\t\t  ${destinatarioCargo}\n\n`+
`De\t\t\t: Emeterio Beltre Tineo M.A.\n\t\t\t  Director del Distrito Educativo 16-06.\n\n`+
`Vía\t\t\t: ${analistaNombre || '________________'}\n\t\t\t  ${analistaCargo}\n\n`+
`Asunto\t\t\t: ${asunto}.\n\n`+
`Respetuosamente, nos dirigimos a ese superior despacho para saludarle y a la vez informarle sobre `+
`la aceptación en nuestro Distrito a ${laSenora} ${candidatoNombre}, ${cargoDesignado}, ${portadorA} de la `+
`cedula de identidad y electoral No. ${candidatoCedula}, ${ubicacion}.\n\n`+
`Esperando que esta solicitud sea atendida lo antes posible, sin más nada que agregar se despide de usted.\n\n`+
`Muy atentamente,\n\n\nEmeterio Beltre Tineo M.A.\nDirector Distrital 16-06, Bonao Nordeste`;
}

function diasEntreFechas(ini, fin){
  if(!ini || !fin) return 0;
  const d1 = new Date(ini+'T00:00:00'), d2 = new Date(fin+'T00:00:00');
  return Math.round((d2-d1)/(1000*60*60*24)) + 1;
}

function filtrarVacaciones(){
  const texto = document.getElementById('filtro-vac-texto').value.toLowerCase();
  const estado = document.getElementById('filtro-vac-estado').value;
  const anio = document.getElementById('filtro-vac-anio').value;
  const filtrado = (window._vacacionesData||[]).filter(v=>{
    const nombre = ((v.personal_rh?.nombres||'')+' '+(v.personal_rh?.apellidos||'')+' '+(v.personal_rh?.cedula||'')).toLowerCase();
    if(texto && !nombre.includes(texto)) return false;
    if(estado && v.estado !== estado) return false;
    if(anio && String(v.anio1)!==String(anio) && String(v.anio2)!==String(anio)) return false;
    return true;
  });
  pintarTablaVacaciones(filtrado);
}

// Reglas de negocio del formulario oficial: acumulación máxima 2 años,
// fraccionamiento si supera 20 días, y obligatoriedad si está en pre/post natal.
function validarReglasVacaciones(){
  const dias1 = parseInt(document.getElementById('vac-dias1').value)||0;
  const dias2 = parseInt(document.getElementById('vac-dias2').value)||0;
  const totalDias = dias1+dias2;
  const ini = document.getElementById('vac-fecha-inicio').value;
  const fin = document.getElementById('vac-fecha-fin').value;
  const alertas = [];

  if(totalDias > 20){
    alertas.push('Más de 20 días solicitados: pueden fraccionarse en dos fechas calendario distintas.');
  }
  if(ini && fin){
    const rango = diasEntreFechas(ini, fin);
    if(rango !== totalDias && totalDias > 0){
      alertas.push(`El rango de fechas (${rango} día(s)) no coincide con el total de días solicitados (${totalDias}).`);
    }
  }
  if(document.getElementById('vac-pre-post-natal').checked){
    alertas.push('Empleada en licencia pre/post natal: la autorización de estas vacaciones es obligatoria según normativa.');
  }

  document.getElementById('vac-alertas').innerHTML = alertas.length ? alertas.map(a=>
    `<div class="badge badge-amarillo" style="display:block;margin-bottom:6px;white-space:normal;padding:8px 10px;">⚠ ${a}</div>`
  ).join('') : '';
}

async function guardarVacacion(){
  const personalId = document.getElementById('vac-personal').value;
  const ini = document.getElementById('vac-fecha-inicio').value;
  const fin = document.getElementById('vac-fecha-fin').value;
  if(!personalId || !ini || !fin){ toast('Selecciona empleado y fechas de disfrute.','error'); return; }

  const payload = {
    personal_id: personalId,
    fecha_solicitud: document.getElementById('vac-fecha-solicitud').value || new Date().toISOString().slice(0,10),
    anios_servicio_minerd: parseFloat(document.getElementById('vac-anios-minerd').value)||null,
    anios_servicio_otra_institucion: parseFloat(document.getElementById('vac-anios-otra').value)||0,
    anios_servicio_total_estado: parseFloat(document.getElementById('vac-anios-total').value)||null,
    dias_solicitados_anio1: parseInt(document.getElementById('vac-dias1').value)||0,
    anio1: parseInt(document.getElementById('vac-anio1').value)||null,
    dias_solicitados_anio2: parseInt(document.getElementById('vac-dias2').value)||0,
    anio2: parseInt(document.getElementById('vac-anio2').value)||null,
    dias_pendientes: parseInt(document.getElementById('vac-dias-pendientes').value)||null,
    fecha_inicio_disfrute: ini, fecha_fin_disfrute: fin,
    comentario: document.getElementById('vac-comentario').value.trim() || null,
    en_licencia_pre_post_natal: document.getElementById('vac-pre-post-natal').checked,
  };
  const { error } = await sb.from('vacaciones_rh').insert(payload);
  if(error){ toast(error.message,'error'); return; }
  toast('Solicitud de vacaciones guardada.','exito');
  cerrarModal('modal-vacacion');
  renderVacaciones();
}

async function cambiarEstadoVacacion(id){
  const v = (window._vacacionesData||[]).find(x=>x.id===id);
  if(!v) return;
  const opciones = ['solicitado','firmado_supervisor','autorizado_rrll','rechazado'];
  const etiquetas = {solicitado:'Solicitado',firmado_supervisor:'Firmado supervisor',autorizado_rrll:'Autorizado RRLL',rechazado:'Rechazado'};
  const idxActual = opciones.indexOf(v.estado);
  const elegido = prompt('Nuevo estado:\n'+opciones.map((o,i)=>`${i+1}. ${etiquetas[o]}`).join('\n'), String(idxActual+1));
  const idx = parseInt(elegido)-1;
  if(isNaN(idx) || !opciones[idx]) return;
  const { error } = await sb.from('vacaciones_rh').update({ estado: opciones[idx] }).eq('id', id);
  if(error){ toast(error.message,'error'); return; }
  toast('Estado actualizado.','exito');
  renderVacaciones();
}

async function renderRelacionCentros(){

      </div>
    </div>
  `;
  pintarTablaRelacionCentros(window._relacionCentrosData);

function pintarTablaRelacionCentros(lista){
  const tbody = document.getElementById('tbody-relacion-centros');
  if(!lista || !lista.length){
    tbody.innerHTML = `<tr><td colspan="5"><div class="vacio"><div class="icono-vacio">📊</div>No hay centros registrados.</div></td></tr>`;

  }
  tbody.innerHTML = lista.map(r=>`
    <tr>
      <td><strong>${escapeHtml(r.centro)}</strong>${r.sigerd?' <span class="texto-ayuda">(SIGERD '+escapeHtml(r.sigerd)+')</span>':''}</td>
      <td>${escapeHtml(r.nombre_contacto||'—')}</td>
      <td>${escapeHtml(r.cedula_contacto||'—')}</td>
      <td>${escapeHtml(r.telefono||'—')}</td>

function filtrarRelacionCentros(){
  const texto = document.getElementById('filtro-rc-texto').value.toLowerCase();
  const filtrado = (window._relacionCentrosData||[]).filter(r=>{
    const todo = `${r.centro} ${r.nombre_contacto} ${r.cedula_contacto}`.toLowerCase();
    return !texto || todo.includes(texto);
  });
  pintarTablaRelacionCentros(filtrado);
}

function exportarRelacionCentrosCSV(){
  const lista = window._relacionCentrosData || [];
  if(!lista.length){ toast('No hay datos para exportar.','error'); return; }
  const encabezado = ['Nombre del Centro','Cédula Contacto','Nombre de Contacto','Teléfono','Dirección'];
  const filas = lista.map(r=>[r.centro, r.cedula_contacto, r.nombre_contacto, r.telefono, r.direccion]
    .map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(','));
  const csv = [encabezado.join(','), ...filas].join('\n');
  const blob = new Blob(['\uFEFF'+csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'relacion_centros_1606.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function filtrarRiesgos(){
  const texto = document.getElementById('filtro-rl-texto').value.toLowerCase();
  const tipo = document.getElementById('filtro-rl-tipo').value;
  const estado = document.getElementById('filtro-rl-estado').value;
  const filtrado = (window._riesgosData||[]).filter(r=>{
    const nombre = ((r.personal_rh?.nombres||'')+' '+(r.personal_rh?.apellidos||'')+' '+(r.personal_rh?.cedula||'')).toLowerCase();
    if(texto && !nombre.includes(texto)) return false;
    if(tipo && r.tipo_formulario !== tipo) return false;
    if(estado && r.estado !== estado) return false;
    return true;
  });
  pintarTablaRiesgos(filtrado);
}

function validarPlazoRiesgo(){
  const fEvento = document.getElementById('rl-fecha-evento').value;
  const fAviso = document.getElementById('rl-fecha-aviso').value;
  const alertaEl = document.getElementById('rl-alerta-plazo');
  if(!fEvento || !fAviso){ alertaEl.innerHTML=''; return; }
  const horas = (new Date(fAviso) - new Date(fEvento)) / 36e5;
  if(horas > 72){
    alertaEl.innerHTML = `<div class="badge badge-rojo" style="display:block;white-space:normal;padding:8px 10px;">⚠ El aviso se está registrando fuera del plazo de 72 horas posteriores al evento.</div>`;
  } else if(horas >= 0){
    alertaEl.innerHTML = `<div class="badge badge-verde" style="display:block;white-space:normal;padding:8px 10px;">✓ Dentro del plazo de 72 horas.</div>`;
  } else {
    alertaEl.innerHTML = '';
  }
}

  renderRiesgosLaborales();
}

function pintarTablaPensiones(lista){
  const tbody = document.getElementById('tbody-pensiones');
  if(!lista || !lista.length){
    tbody.innerHTML = `<tr><td colspan="8"><div class="vacio"><div class="icono-vacio">🎓</div>No hay expedientes de pensión registrados.</div></td></tr>`;
    return;
  }
  const labelTipoPension = {tiempo_servicio:'Tiempo de servicio',discapacidad:'Discapacidad',sobrevivencia:'Sobrevivencia',otra:'Otra'};
  tbody.innerHTML = lista.map(p=>{
    const items = [p.tiene_certificacion_trabajo,p.tiene_certificacion_contraloria,p.tiene_comunicacion_ministro,p.tiene_copia_cedula,p.tiene_fotos];
    const completos = items.filter(Boolean).length;
    return `
    <tr>
      <td><input type="checkbox" class="chk-pen" value="${p.id}"></td>
      <td>${escapeHtml((p.personal_rh?.nombres||'')+' '+(p.personal_rh?.apellidos||''))}</td>
      <td>${p.tipo_personal==='docente'?'Docente':'Administrativo'}</td>
      <td>${labelTipoPension[p.tipo_pension]||p.tipo_pension}</td>
      <td>${p.anios_servicio??'—'}</td>
      <td>${completos}/5 docs</td>
      <td>${badgeEstado(p.estado)}</td>
      <td><button class="btn btn-secundario btn-chico" onclick="cambiarEstadoPension(${p.id})">Estado</button></td>
    </tr>`;
  }).join('');
}

function filtrarPensiones(){
  const texto = document.getElementById('filtro-pen-texto').value.toLowerCase();
  const tipo = document.getElementById('filtro-pen-tipo').value;
  const estado = document.getElementById('filtro-pen-estado').value;
  const filtrado = (window._pensionesData||[]).filter(p=>{
    const nombre = ((p.personal_rh?.nombres||'')+' '+(p.personal_rh?.apellidos||'')+' '+(p.personal_rh?.cedula||'')).toLowerCase();
    if(texto && !nombre.includes(texto)) return false;
    if(tipo && p.tipo_personal !== tipo) return false;
    if(estado && p.estado !== estado) return false;
    return true;
  });
  pintarTablaPensiones(filtrado);
}

function toggleTodosCheckPen(master){ document.querySelectorAll('.chk-pen').forEach(c=>c.checked = master.checked); }

async function eliminarSeleccionPensiones(){

async function cambiarEstadoPension(id){
  const opciones = ['armando_expediente','enviado_minerd','enviado_inabima','decreto_promulgado','rechazado'];
  const etiquetas = {armando_expediente:'Armando expediente',enviado_minerd:'Enviado MINERD',enviado_inabima:'Enviado INABIMA',decreto_promulgado:'Decreto promulgado',rechazado:'Rechazado'};
  const p = (window._pensionesData||[]).find(x=>x.id===id);
  if(!p) return;
  const idxActual = opciones.indexOf(p.estado);
  const elegido = prompt('Nuevo estado:\n'+opciones.map((o,i)=>`${i+1}. ${etiquetas[o]}`).join('\n'), String(idxActual+1));
  const idx = parseInt(elegido)-1;
  if(isNaN(idx) || !opciones[idx]) return;
  const { error } = await sb.from('pensiones_rh').update({ estado: opciones[idx] }).eq('id', id);
  if(error){ toast(error.message,'error'); return; }
  toast('Estado actualizado.','exito');
  renderPensiones();
}

}

function filtrarCertLab(){
  const texto = document.getElementById('filtro-cl-texto').value.toLowerCase();
  const estado = document.getElementById('filtro-cl-estado').value;
  const terceros = document.getElementById('filtro-cl-terceros').value;
  const filtrado = (window._certLaboralData||[]).filter(c=>{
    const nombre = ((c.personal_rh?.nombres||'')+' '+(c.personal_rh?.apellidos||'')+' '+(c.personal_rh?.cedula||'')).toLowerCase();
    if(texto && !nombre.includes(texto)) return false;
    if(estado && c.estado !== estado) return false;
    if(terceros==='si' && !c.solicitado_por_terceros) return false;
    if(terceros==='no' && c.solicitado_por_terceros) return false;
    return true;
  });
  pintarTablaCertLab(filtrado);
}

  const texto = generarTextoCertificacionLaboral({
    personalNombre: p.nombres+' '+p.apellidos, personalCedula: p.cedula, cargo,
    periodoDesde, periodoHasta, fechaEmision,

    cargo_certificado: cargo,

// Detecta encabezados típicos del archivo de nómina del MINERD/Contraloría,
// tolerando variaciones de nombre de columna.
function detectarColumnas(headers){
  const norm = h => h.toString().toLowerCase().trim()
    .replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u');
  const mapa = {};
  headers.forEach((h,i)=>{
    const n = norm(h);
    if(/cedula/.test(n)) mapa.cedula = i;
    else if(/apellido/.test(n)) mapa.apellidos = i;
    else if(/^nombre|nombres?$|nombre completo|nombre empleado/.test(n)) mapa.nombre = i;
    else if(/cargo|posicion|puesto/.test(n)) mapa.cargo = i;
    else if(/sigerd/.test(n)) mapa.sigerd = i;
    else if(/dependencia/.test(n)) mapa.dependencia = i;
    else if(/centro/.test(n)) mapa.centro = i;
    else if(/bruto/.test(n)) mapa.bruto = i;
    else if(/descuent/.test(n)) mapa.descuentos = i;
    else if(/neto/.test(n)) mapa.neto = i;
  });
  return mapa;
}

async function procesarImportacionNomina(){
  const archivo = document.getElementById('nom-archivo').files[0];
  const mes = parseInt(document.getElementById('nom-mes').value);
  const anio = parseInt(document.getElementById('nom-anio').value);
  const fechaPago = document.getElementById('nom-fecha-pago').value || null;
  const compararHistorial = document.getElementById('nom-comparar').checked;

  if(!archivo){ toast('Selecciona el archivo de nómina.','error'); return; }
  if(!mes || !anio){ toast('Indica mes y año.','error'); return; }

  const btn = document.getElementById('btn-importar-nomina');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Procesando…';

  try{
    const filas = await leerArchivoNomina(archivo);
    if(!filas.length) throw new Error('El archivo no contiene filas de datos.');

    const headers = filas[0];
    const mapa = detectarColumnas(headers);
    if(mapa.cedula === undefined) throw new Error('No se pudo detectar la columna de cédula en el archivo.');

    const registros = filas.slice(1).filter(f=>f[mapa.cedula]).map(f=>{
      const nombreCol = mapa.nombre!==undefined ? String(f[mapa.nombre]||'').trim() : '';
      const apellidosCol = mapa.apellidos!==undefined ? String(f[mapa.apellidos]||'').trim() : '';
      const nombreCompleto = apellidosCol ? (nombreCol+' '+apellidosCol).trim() : nombreCol;
      return {
        cedula_archivo: String(f[mapa.cedula]).trim(),
        nombre_archivo: nombreCompleto || null,
        nombres_col: nombreCol || null,
        apellidos_col: apellidosCol || null,
        cargo_archivo: mapa.cargo!==undefined ? String(f[mapa.cargo]||'').trim() : null,
        sigerd_archivo: mapa.sigerd!==undefined ? String(f[mapa.sigerd]||'').trim() : null,
        dependencia_archivo: mapa.dependencia!==undefined ? String(f[mapa.dependencia]||'').trim() : null,
        centro_archivo: mapa.centro!==undefined ? String(f[mapa.centro]||'').trim() : null,
        salario_bruto: mapa.bruto!==undefined ? parseFloat(f[mapa.bruto])||null : null,
        descuentos: mapa.descuentos!==undefined ? parseFloat(f[mapa.descuentos])||null : null,
        salario_neto: mapa.neto!==undefined ? parseFloat(f[mapa.neto])||null : null,
      };
    });

    // Deduplicar por cédula dentro del mismo archivo (por si el PDF repite encabezados de página)
    const vistos = new Set();
    const registrosUnicos = registros.filter(r=>{
      const ced = r.cedula_archivo.replace(/[^0-9]/g,'');
      if(!ced || vistos.has(ced)) return false;
      vistos.add(ced);
      return true;
    });

    const { data: nomina, error: errNom } = await sb.from('nominas_rh')
      .insert({ mes, anio, fecha_pago: fechaPago, archivo_origen: archivo.name })
      .select('id').single();
    if(errNom) throw errNom;

    // ---- PASO 1: UPSERT de centros (por dependencia, o por SIGERD si no hay dependencia) ----
    const { data: centrosExistentes } = await sb.from('centros_rh').select('id,codigo_sigerd,numero_dependencia_nomina');
    const mapaCentroPorDependencia = {};
    const mapaCentroPorSigerd = {};
    (centrosExistentes||[]).forEach(c=>{
      if(c.numero_dependencia_nomina) mapaCentroPorDependencia[c.numero_dependencia_nomina] = c.id;
      if(c.codigo_sigerd) mapaCentroPorSigerd[c.codigo_sigerd] = c.id;
    });

    const centrosNuevos = [];
    const vistosCentro = new Set();
    registrosUnicos.forEach(r=>{
      const dep = r.dependencia_archivo, sig = r.sigerd_archivo;
      if(!dep && !sig) return;
      const yaExiste = (dep && mapaCentroPorDependencia[dep]) || (sig && mapaCentroPorSigerd[sig]);
      const clave = dep || sig;
      if(yaExiste || vistosCentro.has(clave)) return;
      vistosCentro.add(clave);
      centrosNuevos.push({
        nombre_centro: r.centro_archivo || `Centro dependencia ${dep||sig}`,
        codigo_sigerd: sig || null,
        numero_dependencia_nomina: dep || null,
      });
    });

    if(centrosNuevos.length){
      const { data: insertados, error: errCentros } = await sb.from('centros_rh').insert(centrosNuevos).select('id,codigo_sigerd,numero_dependencia_nomina');
      if(errCentros) throw errCentros;
      (insertados||[]).forEach(c=>{
        if(c.numero_dependencia_nomina) mapaCentroPorDependencia[c.numero_dependencia_nomina] = c.id;
        if(c.codigo_sigerd) mapaCentroPorSigerd[c.codigo_sigerd] = c.id;
      });
    }

    function resolverCentroId(r){
      if(r.dependencia_archivo && mapaCentroPorDependencia[r.dependencia_archivo]) return mapaCentroPorDependencia[r.dependencia_archivo];
      if(r.sigerd_archivo && mapaCentroPorSigerd[r.sigerd_archivo]) return mapaCentroPorSigerd[r.sigerd_archivo];
      return null;
    }

    // ---- PASO 2: UPSERT de personal (por cédula), actualizando cargo/centro si cambiaron ----
    const { data: personalExistente } = await sb.from('personal_rh').select('id,cedula,cargo_actual,centro_id');
    const mapaPersonal = {};
    (personalExistente||[]).forEach(p=>{ mapaPersonal[p.cedula.replace(/[^0-9]/g,'')] = p; });

    const personalNuevo = [];
    const personalActualizar = [];

    registrosUnicos.forEach(r=>{
      const cedNorm = r.cedula_archivo.replace(/[^0-9]/g,'');
      const centroId = resolverCentroId(r);
      const existente = mapaPersonal[cedNorm];

      if(!existente){
        personalNuevo.push({
          cedula: r.cedula_archivo,
          nombres: r.nombres_col || r.nombre_archivo || 'Sin nombre',
          apellidos: r.apellidos_col || '',
          sexo: 'M', // dato no provisto por la nómina; se ajusta manualmente luego si aplica
          cargo_actual: r.cargo_archivo || null,
          centro_id: centroId,
          numero_dependencia_nomina: r.dependencia_archivo || null,
          estatus: 'activo',
        });
      } else {
        const necesitaActualizar = (r.cargo_archivo && r.cargo_archivo !== existente.cargo_actual)
          || (centroId && centroId !== existente.centro_id)
          || existente.estatus !== 'activo';
        if(necesitaActualizar){
          personalActualizar.push({
            id: existente.id,
            cargo_actual: r.cargo_archivo || existente.cargo_actual,
            centro_id: centroId || existente.centro_id,
            estatus: 'activo',
          });
        }
      }
    });

    if(personalNuevo.length){
      const { data: insertadosP, error: errPersNuevo } = await sb.from('personal_rh').insert(personalNuevo).select('id,cedula');
      if(errPersNuevo) throw errPersNuevo;
      (insertadosP||[]).forEach(p=>{ mapaPersonal[p.cedula.replace(/[^0-9]/g,'')] = { id:p.id }; });
    }
    for(const upd of personalActualizar){
      const { id, ...campos } = upd;
      await sb.from('personal_rh').update(campos).eq('id', id);
    }

    // Refrescar mapa completo de personal (incluye nuevos) para el cruce del detalle
    const { data: personalFinal } = await sb.from('personal_rh').select('id,cedula');
    const mapaPersonalFinal = {};
    (personalFinal||[]).forEach(p=>{ mapaPersonalFinal[p.cedula.replace(/[^0-9]/g,'')] = p.id; });

    // ---- PASO 3: Guardar detalle de nómina con el cruce ya resuelto ----
    const detalle = registrosUnicos.map(r=>{
      const cedNorm = r.cedula_archivo.replace(/[^0-9]/g,'');
      const personalId = mapaPersonalFinal[cedNorm] || null;
      return {
        cedula_archivo: r.cedula_archivo,
        nombre_archivo: r.nombre_archivo,
        centro_archivo: r.centro_archivo,
        salario_bruto: r.salario_bruto,
        descuentos: r.descuentos,
        salario_neto: r.salario_neto,
        nomina_id: nomina.id,
        personal_id: personalId,
        match_estado: personalId ? 'encontrado' : 'no_encontrado',
      };
    });

    const { error: errDet } = await sb.from('detalle_nomina_rh').insert(detalle);
    if(errDet) throw errDet;

    const encontrados = detalle.filter(d=>d.match_estado==='encontrado').length;
    const noEncontrados = detalle.length - encontrados;

    let resumenMovimientos = '';
    if(compararHistorial){
      const mov = await compararConHistorial(nomina.id, registrosUnicos, mapaPersonalFinal);
      resumenMovimientos = `<br><span style="color:var(--verde-600);font-weight:600;">${mov.nuevos}</span> nuevos ·
        <span style="color:var(--azul-600);font-weight:600;">${mov.reingresos}</span> reingresos ·
        <span style="color:var(--rojo-600);font-weight:600;">${mov.cancelados}</span> cancelados`;
    }

    const resumenMaestro = `<br><span class="texto-ayuda">Catálogo: ${centrosNuevos.length} centro(s) nuevo(s) ·
      ${personalNuevo.length} empleado(s) nuevo(s) en personal · ${personalActualizar.length} actualizado(s) (cargo/centro)</span>`;

    document.getElementById('nom-resumen-preview').innerHTML = `
      <div class="texto-ayuda" style="margin-top:10px;">
        <strong>${detalle.length}</strong> registros importados ·
        <span style="color:var(--verde-600);font-weight:600;">${encontrados} encontrados</span> en personal ·
        <span style="color:var(--rojo-600);font-weight:600;">${noEncontrados} sin coincidencia</span> (revisar manualmente)
        ${resumenMovimientos}
        ${resumenMaestro}
      </div>`;

    toast('Nómina importada y cruzada correctamente.','exito');
    renderNominas();
  }catch(err){
    toast(err.message,'error');
  }finally{
    btn.disabled = false;
    btn.textContent = 'Importar y cruzar con personal';
  }
}

// Compara la nómina recién importada contra TODO el historial acumulado
// (detalle_nomina_rh de nóminas anteriores) para detectar:
//  - nuevo: cédula nunca vista en ninguna nómina anterior
//  - reingreso: cédula vista antes, no estaba en la última nómina anterior, ahora sí
//  - cancelado: cédula estaba en la última nómina anterior y ya no aparece en esta
async function compararConHistorial(nominaNuevaId, registrosNuevos, mapaPersonal){
  // Nómina inmediatamente anterior a la actual (por fecha de creación, excluyendo la nueva)
  const { data: nominaAnterior } = await sb.from('nominas_rh')
    .select('id, mes, anio').neq('id', nominaNuevaId)
    .order('anio',{ascending:false}).order('mes',{ascending:false}).limit(1).maybeSingle();

  // Todo el historial de cédulas que han aparecido en CUALQUIER nómina anterior
  const { data: historico } = await sb.from('detalle_nomina_rh')
    .select('cedula_archivo, nomina_id').neq('nomina_id', nominaNuevaId);

  const cedulasHistoricas = new Set((historico||[]).map(h=>h.cedula_archivo.replace(/[^0-9]/g,'')));

  let cedulasNominaAnterior = new Set();
  if(nominaAnterior){
    const { data: detAnterior } = await sb.from('detalle_nomina_rh')
      .select('cedula_archivo, nombre_archivo, personal_id').eq('nomina_id', nominaAnterior.id);
    cedulasNominaAnterior = new Set((detAnterior||[]).map(d=>d.cedula_archivo.replace(/[^0-9]/g,'')));
    window._detAnteriorCache = detAnterior || [];
  }

  const cedulasNuevaNomina = new Set(registrosNuevos.map(r=>r.cedula_archivo.replace(/[^0-9]/g,'')));

  const movimientos = [];
  let nuevos = 0, reingresos = 0, cancelados = 0;

  // Nuevos y reingresos: presentes en la nómina nueva
  registrosNuevos.forEach(r=>{
    const ced = r.cedula_archivo.replace(/[^0-9]/g,'');
    if(!ced) return;
    const estabaEnAnterior = cedulasNominaAnterior.has(ced);
    const habiaAparecidoAntes = cedulasHistoricas.has(ced);

    if(!habiaAparecidoAntes){
      movimientos.push({
        nomina_id: nominaNuevaId, personal_id: mapaPersonal[ced]||null,
        cedula: r.cedula_archivo, nombre: r.nombre_archivo,
        tipo_movimiento: 'nuevo',
      });
      nuevos++;
    } else if(!estabaEnAnterior){
      movimientos.push({
        nomina_id: nominaNuevaId, personal_id: mapaPersonal[ced]||null,
        cedula: r.cedula_archivo, nombre: r.nombre_archivo,
        tipo_movimiento: 'reingreso',
      });
      reingresos++;
    }
  });

  // Cancelados: estaban en la nómina anterior pero no en la nueva
  if(nominaAnterior){
    (window._detAnteriorCache||[]).forEach(d=>{
      const ced = d.cedula_archivo.replace(/[^0-9]/g,'');
      if(ced && !cedulasNuevaNomina.has(ced)){
        movimientos.push({
          nomina_id: nominaNuevaId, personal_id: d.personal_id||null,
          cedula: d.cedula_archivo, nombre: d.nombre_archivo,
          tipo_movimiento: 'cancelado', ultima_nomina_presente_id: nominaAnterior.id,
        });
        cancelados++;
      }
    });
  }

  if(movimientos.length){
    const { error } = await sb.from('movimientos_nomina_rh').insert(movimientos);
    if(error) console.error('Error guardando movimientos:', error.message);

    // Marcar automáticamente como inactivo/cancelado en personal_rh a quienes
    // ya no aparecen en la nómina nueva
    const idsCancelados = movimientos.filter(m=>m.tipo_movimiento==='cancelado' && m.personal_id).map(m=>m.personal_id);
    if(idsCancelados.length){
      await sb.from('personal_rh').update({ estatus:'inactivo' }).in('id', idsCancelados);
    }
  }

  return { nuevos, reingresos, cancelados };
}

// Lee CSV, Excel o PDF y devuelve array de filas (incluyendo encabezado en fila 0)
function leerArchivoNomina(archivo){
  const nombre = archivo.name.toLowerCase();
  if(nombre.endsWith('.pdf')) return leerPDFNomina(archivo);
  return new Promise((resolve, reject)=>{
    if(nombre.endsWith('.csv')){
      const reader = new FileReader();
      reader.onload = e => {
        const lineas = e.target.result.split(/\r?\n/).filter(l=>l.trim().length);
        resolve(lineas.map(l=>l.split(',').map(c=>c.trim())));
      };
      reader.onerror = reject;
      reader.readAsText(archivo, 'UTF-8');
    } else {
      if(typeof XLSX === 'undefined'){
        reject(new Error('No se pudo cargar el lector de Excel. Verifica tu conexión a internet.'));
        return;
      }
      const reader = new FileReader();
      reader.onload = e => {
        try{
          const wb = XLSX.read(e.target.result, { type:'array' });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const filas = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
          resolve(filas.filter(f=>f.some(c=>String(c).trim().length)));
        }catch(err){ reject(err); }
      };
      reader.onerror = reject;
      reader.readAsArrayBuffer(archivo);
    }
  });
}

// Extrae texto de un PDF (debe tener texto seleccionable, no ser escaneo) y lo
// reconstruye en filas/columnas aproximando por posición X de cada palabra.
async function leerPDFNomina(archivo){
  if(typeof pdfjsLib === 'undefined'){
    throw new Error('No se pudo cargar el lector de PDF. Verifica tu conexión a internet.');
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const buffer = await archivo.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;

  const filas = [];
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const contenido = await page.getTextContent();

    // Agrupar items por línea (misma coordenada Y aproximada)
    const lineasMapa = {};
    contenido.items.forEach(item=>{
      const y = Math.round(item.transform[5]);
      if(!lineasMapa[y]) lineasMapa[y] = [];
      lineasMapa[y].push({ x: item.transform[4], texto: item.str });
    });

    Object.keys(lineasMapa).sort((a,b)=>b-a).forEach(y=>{
      const items = lineasMapa[y].sort((a,b)=>a.x-b.x);
      // Unir palabras cercanas en la misma "columna" usando saltos de espacio amplio como separador de celda
      const celdas = [];
      let celdaActual = '';
      let xAnterior = null;
      items.forEach(it=>{
        if(xAnterior !== null && (it.x - xAnterior) > 25){
          celdas.push(celdaActual.trim());
          celdaActual = '';
        }
        celdaActual += (celdaActual ? ' ' : '') + it.texto;
        xAnterior = it.x + it.texto.length*3;
      });
      if(celdaActual.trim()) celdas.push(celdaActual.trim());
      if(celdas.some(c=>c.length)) filas.push(celdas);
    });
  }
  return filas.filter(f=>f.some(c=>String(c).trim().length));
}

async function verDetalleNomina(nominaId, periodo){
  document.getElementById('titulo-detalle-nomina').textContent = `Detalle de nómina — ${periodo}`;
  const { data, error } = await sb.from('detalle_nomina_rh')
    .select('*, personal_rh(nombres,apellidos)').eq('nomina_id', nominaId).order('cedula_archivo');
  if(error){ toast(error.message,'error'); return; }

  document.getElementById('cuerpo-detalle-nomina').innerHTML = (data && data.length) ? `
    <table>
      <thead><tr><th>Cédula</th><th>Nombre (archivo)</th><th>Centro (archivo)</th><th>Bruto</th><th>Descuentos</th><th>Neto</th><th>Cruce</th></tr></thead>
      <tbody>
        ${data.map(d=>`
          <tr>
            <td>${escapeHtml(d.cedula_archivo)}</td>
            <td>${escapeHtml(d.personal_rh ? d.personal_rh.nombres+' '+d.personal_rh.apellidos : (d.nombre_archivo||'—'))}</td>
            <td>${escapeHtml(d.centro_archivo||'—')}</td>
            <td>${d.salario_bruto!=null?Number(d.salario_bruto).toLocaleString('es-DO',{minimumFractionDigits:2}):'—'}</td>
            <td>${d.descuentos!=null?Number(d.descuentos).toLocaleString('es-DO',{minimumFractionDigits:2}):'—'}</td>
            <td>${d.salario_neto!=null?Number(d.salario_neto).toLocaleString('es-DO',{minimumFractionDigits:2}):'—'}</td>
            <td>${badgeEstado(d.match_estado)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  ` : `<div class="vacio">Sin registros en esta nómina.</div>`;
  abrirModal('modal-detalle-nomina');
}

/* ---- Reporte de movimientos (nuevos / reingresos / cancelados) ---- */
async function verMovimientosNomina(nominaId, periodo){
  document.getElementById('titulo-movimientos-nomina').textContent = `Movimientos de personal — ${periodo}`;
  const { data, error } = await sb.from('movimientos_nomina_rh')
    .select('*, personal_rh(nombres,apellidos,cargo_actual)').eq('nomina_id', nominaId)
    .order('tipo_movimiento');
  if(error){ toast(error.message,'error'); return; }

  window._movimientosActuales = data || [];

  document.getElementById('mov-kpi-nuevo').textContent = (data||[]).filter(m=>m.tipo_movimiento==='nuevo').length;
  document.getElementById('mov-kpi-reingreso').textContent = (data||[]).filter(m=>m.tipo_movimiento==='reingreso').length;
  document.getElementById('mov-kpi-cancelado').textContent = (data||[]).filter(m=>m.tipo_movimiento==='cancelado').length;

  const labelTipo = {nuevo:['verde','Nuevo nombramiento'],reingreso:['azul','Reingreso'],cancelado:['rojo','Cancelado/bloqueado']};

  document.getElementById('cuerpo-movimientos-nomina').innerHTML = (data && data.length) ? `
    <table>
      <thead><tr><th>Cédula</th><th>Nombre</th><th>Cargo</th><th>Movimiento</th><th>Revisado</th></tr></thead>
      <tbody>
        ${data.map(m=>{
          const [color,texto] = labelTipo[m.tipo_movimiento];
          return `
          <tr>
            <td>${escapeHtml(m.cedula)}</td>
            <td>${escapeHtml(m.personal_rh ? m.personal_rh.nombres+' '+m.personal_rh.apellidos : (m.nombre||'—'))}</td>
            <td>${escapeHtml(m.personal_rh?.cargo_actual||'—')}</td>
            <td><span class="badge badge-${color}">${texto}</span></td>
            <td><input type="checkbox" ${m.revisado?'checked':''} onchange="marcarMovimientoRevisado(${m.id}, this.checked)"></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  ` : `<div class="vacio"><div class="icono-vacio">📊</div>No hay movimientos detectados para esta nómina.<br><span class="texto-ayuda">Esto puede significar que no hubo cambios respecto a la nómina anterior, o que la comparación no estaba activada al importar.</span></div>`;
  abrirModal('modal-movimientos-nomina');
}

async function marcarMovimientoRevisado(id, valor){
  const { error } = await sb.from('movimientos_nomina_rh').update({ revisado: valor }).eq('id', id);
  if(error){ toast(error.message,'error'); }
}

function exportarMovimientosCSV(){
  const lista = window._movimientosActuales || [];
  if(!lista.length){ toast('No hay movimientos para exportar.','error'); return; }
  const labelTipo = {nuevo:'Nuevo nombramiento',reingreso:'Reingreso',cancelado:'Cancelado/bloqueado'};
  const encabezado = ['Cédula','Nombre','Cargo','Movimiento'];
  const filas = lista.map(m=>[
    m.cedula,
    m.personal_rh ? m.personal_rh.nombres+' '+m.personal_rh.apellidos : (m.nombre||''),
    m.personal_rh?.cargo_actual||'',
    labelTipo[m.tipo_movimiento],
  ].map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(','));
  const csv = [encabezado.join(','), ...filas].join('\n');
  const blob = new Blob(['\uFEFF'+csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'movimientos_nomina_1606.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
