<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RH 16-06 | Distrito Educativo 16-06 Bonao Nordeste</title>
<link rel="icon" type="image/jpeg" href="escudo.jpg"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --azul-900:#0d2340;
  --azul-800:#11315c;
  --azul-700:#163f78;
  --azul-600:#1d4f93;
  --azul-500:#2563ab;
  --azul-100:#e7eef8;
  --rojo-600:#b3242c;
  --gris-900:#1b1f24;
  --gris-700:#3d4450;
  --gris-500:#6b7280;
  --gris-300:#d6dae1;
  --gris-100:#f4f6f9;
  --blanco:#ffffff;
  --verde-600:#1f7a4d;
  --amarillo-600:#a8730a;
  --radio:8px;
  --sombra: 0 1px 3px rgba(13,35,64,.08), 0 1px 2px rgba(13,35,64,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Segoe UI',Arial,'Helvetica Neue',sans-serif;
  background:var(--gris-100);
  color:var(--gris-900);
  font-size:14px;
}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}

/* ============ LOGIN ============ */
#pantalla-login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(160deg,var(--azul-900) 0%,var(--azul-700) 55%,var(--azul-600) 100%);
  padding:20px;
}
.tarjeta-login{
  background:var(--blanco);
  border-radius:12px;
  width:100%;
  max-width:420px;
  box-shadow:0 20px 50px rgba(0,0,0,.35);
  overflow:hidden;
}
.encabezado-login{
  background:var(--azul-900);
  color:var(--blanco);
  padding:28px 28px 22px;
  text-align:center;
  border-bottom:4px solid var(--rojo-600);
}
.encabezado-login .escudo{
  width:54px;height:54px;
  margin:0 auto 10px;
  border-radius:50%;
  background:var(--blanco);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;color:var(--azul-900);font-size:20px;
  overflow:hidden;
}
.encabezado-login .escudo img{width:100%;height:100%;object-fit:cover;}
.encabezado-login h1{
  font-size:15px;margin:0 0 4px;letter-spacing:.5px;font-weight:700;
  text-transform:uppercase;
}
.encabezado-login p{margin:0;font-size:13px;opacity:.85;}
.cuerpo-login{padding:26px 28px 30px;}
.tabs-login{display:flex;border:1px solid var(--gris-300);border-radius:var(--radio);overflow:hidden;margin-bottom:20px;}
.tab-login{flex:1;text-align:center;padding:10px;background:var(--gris-100);font-weight:600;font-size:13px;color:var(--gris-700);border:none;}
.tab-login.activo{background:var(--azul-700);color:var(--blanco);}
.campo{margin-bottom:14px;}
.campo label{display:block;font-size:12.5px;font-weight:600;color:var(--gris-700);margin-bottom:5px;}
.campo input,.campo select{
  width:100%;padding:10px 12px;border:1px solid var(--gris-300);border-radius:var(--radio);
  outline:none;transition:border .15s;
}
.campo input:focus,.campo select:focus{border-color:var(--azul-500);}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 16px;border-radius:var(--radio);border:none;font-weight:600;font-size:13.5px;
  transition:filter .15s, transform .05s;
}
.btn:active{transform:translateY(1px);}
.btn-primario{background:var(--azul-700);color:var(--blanco);width:100%;padding:11px;}
.btn-primario:hover{filter:brightness(1.08);}
.btn-secundario{background:var(--gris-100);color:var(--gris-700);border:1px solid var(--gris-300);}
.btn-secundario:hover{filter:brightness(.97);}
.btn-rojo{background:var(--rojo-600);color:var(--blanco);}
.btn-chico{padding:6px 10px;font-size:12.5px;}
.error-login{
  background:#fde9e9;color:var(--rojo-600);padding:10px 12px;border-radius:var(--radio);
  font-size:12.5px;margin-bottom:14px;display:none;
}
.pie-login{margin-top:18px;text-align:center;font-size:11.5px;color:var(--gris-500);}

/* ============ LAYOUT APP ============ */
#app{display:none;min-height:100vh;}
.layout{display:flex;min-height:100vh;}
.sidebar{
  width:250px;flex-shrink:0;background:var(--azul-900);color:var(--blanco);
  display:flex;flex-direction:column;
  min-height:0;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.sidebar-header{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.12);}
.sidebar-header .escudo-mini{
  width:36px;height:36px;border-radius:50%;background:var(--blanco);color:var(--azul-900);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;margin-bottom:8px;
  overflow:hidden;
}
.sidebar-header .escudo-mini img{width:100%;height:100%;object-fit:cover;}
.sidebar-header h2{font-size:13.5px;margin:0 0 2px;font-weight:700;line-height:1.3;}
.sidebar-header p{font-size:11px;margin:0;opacity:.7;}
.sidebar-nav{flex:1;padding:10px 0;}
.grupo-nav{margin-bottom:4px;}
.grupo-nav-titulo{
  padding:10px 18px 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;
  color:rgba(255,255,255,.5);font-weight:700;cursor:pointer;display:flex;justify-content:space-between;
  align-items:center;user-select:none;
}
.grupo-nav-titulo .flecha{transition:transform .15s;font-size:10px;}
.grupo-nav.colapsado .flecha{transform:rotate(-90deg);}
.grupo-nav.colapsado .items-nav{display:none;}
.item-nav{
  display:flex;align-items:center;gap:10px;padding:10px 18px;font-size:13px;color:rgba(255,255,255,.85);
  cursor:pointer;border-left:3px solid transparent;
}
.item-nav:hover{background:rgba(255,255,255,.06);}
.item-nav.activo{background:rgba(255,255,255,.1);border-left-color:var(--rojo-600);font-weight:600;color:var(--blanco);}
.item-nav .icono{width:18px;text-align:center;}
.sidebar-footer{padding:14px 18px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;}
.sidebar-footer .nombre-usuario{font-weight:600;margin-bottom:2px;}
.sidebar-footer .rol-usuario{opacity:.65;font-size:11px;margin-bottom:10px;}

.contenido{flex:1;min-height:0;display:flex;flex-direction:column;min-width:0;}
.topbar{
  background:var(--blanco);border-bottom:1px solid var(--gris-300);padding:14px 24px;
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;
}
.topbar h1{font-size:17px;margin:0;color:var(--azul-900);}
.topbar .subtitulo{font-size:12px;color:var(--gris-500);margin-top:2px;}
.main{padding:22px 24px;flex:1;}

.tarjeta{background:var(--blanco);border-radius:10px;box-shadow:var(--sombra);border:1px solid var(--gris-300);margin-bottom:18px;}
.tarjeta-header{padding:14px 18px;border-bottom:1px solid var(--gris-300);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.tarjeta-header h3{margin:0;font-size:14.5px;color:var(--azul-900);}
.tarjeta-body{padding:18px;}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
@media (max-width:760px){.grid-2,.grid-3{grid-template-columns:1fr;}}

table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{
  text-align:left;background:var(--azul-100);color:var(--azul-900);padding:9px 10px;
  font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;font-weight:700;
  position:sticky;top:0;
}
tbody td{padding:9px 10px;border-bottom:1px solid var(--gris-300);vertical-align:middle;}
tbody tr:hover{background:var(--gris-100);}
.tabla-wrap{overflow-x:auto;}

.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-azul{background:var(--azul-100);color:var(--azul-700);}
.badge-verde{background:#e3f4ea;color:var(--verde-600);}
.badge-rojo{background:#fde9e9;color:var(--rojo-600);}
.badge-amarillo{background:#fdf1de;color:var(--amarillo-600);}
.badge-gris{background:var(--gris-100);color:var(--gris-700);}

.kpi{display:flex;flex-direction:column;gap:4px;}
.kpi .valor{font-size:26px;font-weight:800;color:var(--azul-900);}
.kpi .etiqueta{font-size:12px;color:var(--gris-500);}

.modal-fondo{
  display:none;position:fixed;inset:0;background:rgba(13,35,64,.55);z-index:100;
  align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;
}
.modal-fondo.abierto{display:flex;}
.modal{background:var(--blanco);border-radius:10px;width:100%;max-width:640px;box-shadow:0 20px 50px rgba(0,0,0,.3);}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--gris-300);display:flex;justify-content:space-between;align-items:center;}
.modal-header h3{margin:0;font-size:15px;color:var(--azul-900);}
.modal-cerrar{background:none;border:none;font-size:20px;color:var(--gris-500);line-height:1;}
.modal-body{padding:18px 20px;max-height:70vh;overflow-y:auto;}
.modal-footer{padding:14px 20px;border-top:1px solid var(--gris-300);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;}

.vacio{text-align:center;padding:40px 20px;color:var(--gris-500);}
.vacio .icono-vacio{font-size:34px;margin-bottom:10px;opacity:.5;}

.toast-cont{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--azul-900);color:var(--blanco);padding:12px 16px;border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.25);font-size:13px;max-width:320px;}
.toast.exito{background:var(--verde-600);}
.toast.error{background:var(--rojo-600);}

.fieldset-doc{border:1px dashed var(--gris-300);border-radius:8px;padding:14px;margin-bottom:14px;}

.autocomplete-wrap{position:relative;}
.autocomplete-input{width:100%;}
.autocomplete-lista{
  display:none;position:absolute;top:100%;left:0;right:0;z-index:50;
  background:var(--blanco);border:1px solid var(--gris-300);border-radius:8px;
  max-height:240px;overflow-y:auto;box-shadow:0 6px 16px rgba(0,0,0,.12);margin-top:4px;
}
.autocomplete-item{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--gris-100);font-size:13px;}
.autocomplete-item:last-child{border-bottom:none;}
.autocomplete-item:hover,.autocomplete-item:active{background:var(--gris-100);}
.autocomplete-item .autocomplete-sub{display:block;font-size:11.5px;color:var(--gris-500);margin-top:1px;}
.autocomplete-vacio{padding:10px 12px;font-size:12.5px;color:var(--gris-500);}
.fieldset-doc legend{font-size:12px;font-weight:700;color:var(--azul-700);padding:0 6px;}

.menu-hamburguesa{display:none;background:none;border:none;font-size:22px;color:var(--azul-900);}
@media (max-width:880px){
  .sidebar{position:fixed;left:-260px;top:0;height:100vh;z-index:60;transition:left .2s;}
  .sidebar.abierta{left:0;}
  .menu-hamburguesa{display:block;}
  .overlay-sidebar{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;}
  .overlay-sidebar.activo{display:block;}
}

.preview-telegrama{
  background:#fbfbf9;border:1px solid var(--gris-300);padding:30px;border-radius:6px;font-family:'Times New Roman',Times,serif;
  font-size:14px;line-height:1.7;color:#1a1a1a;
}

.spinner{
  width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;
  display:inline-block;animation:girar .6s linear infinite;
}
@keyframes girar{to{transform:rotate(360deg);}}

.texto-ayuda{font-size:11.5px;color:var(--gris-500);margin-top:4px;}
.requerido{color:var(--rojo-600);}
</style>
</head>
<body>

<!-- ============ PANTALLA LOGIN ============ -->
<div id="pantalla-login">
  <div class="tarjeta-login">
    <div class="encabezado-login">
      <div class="escudo"><img src="escudo.jpg" alt="Escudo Distrito 16-06"></div>
      <h1>Distrito Educativo 16-06</h1>
      <p>Sistema de Recursos Humanos · Bonao Nordeste</p>
    </div>
    <div class="cuerpo-login">
      <div class="tabs-login">
        <button class="tab-login activo" id="tab-admin" onclick="cambiarTabLogin('admin')">Administrativo</button>
        <button class="tab-login" id="tab-tecnico" onclick="cambiarTabLogin('tecnico')">Personal (Cédula)</button>
      </div>

      <div id="error-login" class="error-login"></div>

      <div id="form-admin">
        <div class="campo">
          <label>Usuario</label>
          <input type="text" id="admin-usuario" placeholder="Ej. admin.rh">
        </div>
        <div class="campo">
          <label>Contraseña</label>
          <input type="password" id="admin-clave" placeholder="••••••••">
        </div>
      </div>

      <div id="form-tecnico" style="display:none;">
        <div class="campo">
          <label>Cédula</label>
          <input type="text" id="tecnico-cedula" placeholder="000-0000000-0">
        </div>
      </div>

      <button class="btn btn-primario" id="btn-login" onclick="iniciarSesion()">Iniciar sesión</button>
      <div class="pie-login">MINERD · Regional 16 · Distrito 06</div>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="layout">
    <div class="overlay-sidebar" id="overlay-sidebar" onclick="toggleSidebar(false)"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="escudo-mini"><img src="escudo.jpg" alt="Escudo Distrito 16-06"></div>
        <h2>RH Distrito 16-06</h2>
        <p>Bonao Nordeste</p>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="nombre-usuario" id="nombre-usuario-sidebar">—</div>
        <div class="rol-usuario" id="rol-usuario-sidebar">—</div>
        <button class="btn btn-secundario btn-chico" id="btn-compartir-sistema" style="width:100%;margin-bottom:8px;display:none;" onclick="abrirModalCompartir()">📤 Compartir sistema</button>
        <button class="btn btn-secundario btn-chico" style="width:100%;" onclick="cerrarSesion()">Cerrar sesión</button>
      </div>
    </aside>

    <div class="contenido">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:12px;">
          <button class="menu-hamburguesa" onclick="toggleSidebar()">☰</button>
          <div>
            <h1 id="titulo-vista">Panel general</h1>
            <div class="subtitulo" id="subtitulo-vista">Resumen del módulo de Recursos Humanos</div>
          </div>
        </div>
      </div>
      <div class="main" id="main-content"></div>
    </div>
  </div>
</div>

<div class="toast-cont" id="toast-cont"></div>

<div class="modal-fondo" id="modal-compartir">
  <div class="modal" style="max-width:420px;">
    <div class="modal-header"><h3>Compartir sistema</h3>
      <button class="modal-cerrar" onclick="cerrarModal('modal-compartir')">×</button></div>
    <div class="modal-body">
      <p class="texto-ayuda" style="margin-bottom:14px;">Comparte el acceso al Sistema de Recursos Humanos del Distrito 16-06.</p>
      <div class="campo" style="margin-bottom:16px;">
        <label>Link del sistema</label>
        <input type="text" id="compartir-link" readonly style="background:var(--gris-100);">
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <button class="btn btn-secundario" style="justify-content:flex-start;gap:10px;" onclick="compartirPor('whatsapp')">💬 WhatsApp</button>
        <button class="btn btn-secundario" style="justify-content:flex-start;gap:10px;" onclick="compartirPor('facebook')">📘 Facebook</button>
        <button class="btn btn-secundario" style="justify-content:flex-start;gap:10px;" onclick="compartirPor('telegram')">✈ Telegram</button>
        <button class="btn btn-secundario" style="justify-content:flex-start;gap:10px;" onclick="compartirPor('email')">✉ Correo electrónico</button>
        <button class="btn btn-primario" style="justify-content:flex-start;gap:10px;" onclick="compartirPor('copiar')">🔗 Copiar link</button>
      </div>
    </div>
  </div>
</div>

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Supabase limita cada consulta a un máximo de filas configurado en el servidor
// (normalmente 1000), sin importar el .range() que se pida. Esta función trae
// TODAS las filas de una tabla paginando en bloques, para tablas que puedan
// superar ese límite (ej. personal_rh con miles de empleados).
async function fetchTodasLasFilas(nombreTabla, columnas, construirQuery){
  let todas = [];
  let desde = 0;
  const tam = 1000;
  while(true){
    let q = sb.from(nombreTabla).select(columnas).range(desde, desde+tam-1);
    if(construirQuery) q = construirQuery(q);
    const { data, error } = await q;
    if(error) throw error;
    if(!data || !data.length) break;
    todas = todas.concat(data);
    if(data.length < tam) break;
    desde += tam;
  }
  return todas;
}

function cambiarTabLogin(tipo){

  document.getElementById('tab-tecnico').classList.toggle('activo', tipo==='tecnico');
  document.getElementById('form-admin').style.display = tipo==='admin' ? 'block' : 'none';
  document.getElementById('form-tecnico').style.display = tipo==='tecnico' ? 'block' : 'none';

async function iniciarSesion(){
  const esAdmin = document.getElementById('tab-admin').classList.contains('activo');
  const errEl = document.getElementById('error-login');
  errEl.style.display = 'none';
  const btn = document.getElementById('btn-login');
  btn.disabled = true;
  const textoOriginal = btn.textContent;
  btn.innerHTML = '<span class="spinner"></span> Verificando...';

  try{
    if(esAdmin){
      const usuario = document.getElementById('admin-usuario').value.trim().toLowerCase();
      const clave = document.getElementById('admin-clave').value;
      if(!usuario || !clave){ throw new Error('Completa usuario y contraseña.'); }

      const { data, error } = await sb.from('usuarios_fin')
        .select('*');

      if(error) throw error;
      const encontrado = (data||[]).find(u => (u.usuario||'').toLowerCase() === usuario && u.pass === clave);
      if(!encontrado) throw new Error('Usuario o contraseña incorrectos.');

      sesion = { tipo:'admin', usuario:encontrado };
    } else {
      const cedula = document.getElementById('tecnico-cedula').value.trim();
      if(!cedula){ throw new Error('Ingresa tu número de cédula.'); }

      const { data, error } = await sb.from('personal_rh')
        .select('*, centros_rh(nombre_centro,codigo_sigerd)')
        .eq('cedula', cedula)
        .maybeSingle();

      if(error) throw error;
      if(!data) throw new Error('No se encontró personal con esa cédula.');

      sesion = { tipo:'tecnico', usuario:data };
    }

    document.getElementById('pantalla-login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    construirMenu();
    irAVista('panel');

  }catch(err){
    errEl.textContent = err.message || 'Error al iniciar sesión.';
    errEl.style.display = 'block';
  }finally{
    btn.disabled = false;
    btn.textContent = textoOriginal;
  }
}

function cerrarSesion(){
  sesion = { tipo:null, usuario:null };
  document.getElementById('app').style.display = 'none';
  document.getElementById('pantalla-login').style.display = 'flex';
  document.getElementById('admin-clave').value = '';
}

function compartirPor(medio){

  const mensaje = 'Sistema de Recursos Humanos — Distrito Educativo 16-06, Bonao Nordeste';
  const textoCompleto = `${mensaje}\n${url}`;

  } else if(medio === 'telegram'){

  } else if(medio === 'email'){
    window.location.href = `mailto:?subject=${encodeURIComponent(mensaje)}&body=${encodeURIComponent(textoCompleto)}`;

async function irAVista(id){

    else if(id === 'certificacioneslaborales') await renderCertificacionesLaborales();

    else if(id === 'centros') await renderCentros();
    else if(id === 'relacioncentros') await renderRelacionCentros();
    else if(id === 'expediente') await renderExpediente();

/* ---- Exportación genérica reutilizable en todos los módulos ----
   columnas: [{ key:'campo', label:'Encabezado', get:(fila)=>valor (opcional) }]
   filas: array de objetos (ya filtrados, lo que se ve en pantalla) */
function obtenerValorColumna(fila, col){
  if(col.get) return col.get(fila);
  return fila[col.key];
}

function exportarDatosCSV(filas, columnas, nombreArchivo){
  if(!filas || !filas.length){ toast('No hay datos para exportar.','error'); return; }
  const encabezado = columnas.map(c=>c.label);
  const lineas = filas.map(f=>columnas.map(c=>{
    const v = obtenerValorColumna(f, c);
    return `"${String(v??'').replace(/"/g,'""')}"`;
  }).join(','));
  const csv = [encabezado.join(','), ...lineas].join('\n');
  const blob = new Blob(['\uFEFF'+csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${nombreArchivo}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function exportarDatosExcel(filas, columnas, nombreArchivo){
  if(!filas || !filas.length){ toast('No hay datos para exportar.','error'); return; }
  if(typeof XLSX === 'undefined'){ toast('No se pudo cargar el generador de Excel.','error'); return; }
  const datos = filas.map(f=>{
    const obj = {};
    columnas.forEach(c=>{ obj[c.label] = obtenerValorColumna(f, c) ?? ''; });
    return obj;
  });
  const ws = XLSX.utils.json_to_sheet(datos);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Datos');
  XLSX.writeFile(wb, `${nombreArchivo}.xlsx`);
}

/* ---- Importación genérica con UPSERT (reutilizable en módulos con tabla simple) ----
   Lee el archivo, detecta columnas por patrones regex, y hace upsert por una
   clave única (ej. cédula, código). Reutiliza leerArchivoNomina ya existente. */
// Detecta automáticamente la fila real de encabezados de un archivo importado
// (por si trae título y/o filas en blanco antes de los nombres de columna),
// probando cuál de las primeras filas tiene más coincidencias con los patrones
// de columnas que se esperan.
// Evita que un guardado se dispare dos veces si el usuario toca el botón
// varias veces seguidas (por ejemplo por lentitud de la conexión).
const _guardandoLock = {};
function bloquearGuardado(clave){
  if(_guardandoLock[clave]) return false;
  _guardandoLock[clave] = true;
  return true;
}
function desbloquearGuardado(clave){ _guardandoLock[clave] = false; }

function detectarFilaEncabezados(filas, patrones, maxFilas){
  const norm = h => h.toString().toLowerCase().trim()
    .replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u');
  let mejorIdx = 0, mejorScore = -1;
  for(let i=0; i<Math.min(filas.length, maxFilas||15); i++){
    const score = filas[i].filter(c=>{ const n = norm(c); return n && patrones.some(p=>p.test(n)); }).length;
    if(score > mejorScore){ mejorScore = score; mejorIdx = i; }
  }
  return mejorIdx;
}

async function importarConUpsert({ archivo, tabla, patrones, claveUnica, transformarFila, onProgress }){
  const filas = await leerArchivoNomina(archivo);
  if(!filas.length) throw new Error('El archivo no contiene filas de datos.');

  const headerIdx = detectarFilaEncabezados(filas, Object.values(patrones));
  const headers = filas[headerIdx];

  const norm = h => h.toString().toLowerCase().trim()
    .replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u');
  const mapa = {};
  headers.forEach((h,i)=>{
    const n = norm(h);
    for(const [campo, regex] of Object.entries(patrones)){
      if(regex.test(n) && mapa[campo]===undefined) mapa[campo] = i;
    }
  });
  if(mapa[claveUnica] === undefined) throw new Error(`No se pudo detectar la columna "${claveUnica}" en el archivo.`);

  const registros = filas.slice(headerIdx+1)
    .filter(f=>f[mapa[claveUnica]] && String(f[mapa[claveUnica]]).trim())
    .map(f=>{
      const base = {};
      Object.keys(mapa).forEach(campo=>{ base[campo] = String(f[mapa[campo]]??'').trim() || null; });
      return transformarFila ? transformarFila(base, f) : base;
    });

  if(!registros.length) throw new Error('No se encontraron filas válidas.');

  const existentes = await fetchTodasLasFilas(tabla, `id,${claveUnica}`, q=>q.order('id'));
  const mapaExistente = {};
  (existentes||[]).forEach(e=>{ if(e[claveUnica]) mapaExistente[e[claveUnica]] = e.id; });

  let creados = 0, actualizados = 0;
  const TAM_LOTE = 20; // procesa varias filas a la vez en vez de una por una (mucho más rápido)
  for(let i=0; i<registros.length; i+=TAM_LOTE){
    const lote = registros.slice(i, i+TAM_LOTE);
    if(onProgress) onProgress(Math.min(i+TAM_LOTE, registros.length), registros.length);
    await Promise.all(lote.map(async r=>{
      const clave = r[claveUnica];
      if(clave && mapaExistente[clave]){
        const { error } = await sb.from(tabla).update(r).eq('id', mapaExistente[clave]);
        if(error) throw new Error(`Actualizando ${claveUnica}=${clave}: ${error.message}`);
        actualizados++;
      } else {
        const { data: nuevo, error } = await sb.from(tabla).insert(r).select(`id,${claveUnica}`).single();
        if(error) throw new Error(`Creando ${claveUnica}=${clave}: ${error.message}`);
        if(nuevo[claveUnica]) mapaExistente[nuevo[claveUnica]] = nuevo.id;
        creados++;
      }
    }));
  }
  return { total: registros.length, creados, actualizados };
}

function escapeHtml(str){
  if(str===null||str===undefined) return '';
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ====================== AUTOCOMPLETAR GENÉRICO ======================
// Convierte un <input> de texto en un buscador con sugerencias, mientras
// mantiene un <input type="hidden"> paralelo con el id real seleccionado
// (mismo id+'-id' que ya usaba el .value de los <select> anteriores), así
// el resto del código que lee getElementById('xxx').value sigue funcionando
// sin cambios, siempre que se actualicen esas lecturas a 'xxx-id' (ver abajo).
window._autocompleteData = window._autocompleteData || {};

function inicializarAutocompletar(inputId, datos, formatoTexto, formatoSubtexto, valorInicial){
  window._autocompleteData[inputId] = datos;
  const input = document.getElementById(inputId);
  const hidden = document.getElementById(inputId+'-id');
  const lista = document.getElementById(inputId+'-lista');
  if(!input || !hidden || !lista) return;

  function render(filtro){
    const f = (filtro||'').toLowerCase().trim();
    const items = !f ? datos.slice(0,30) : datos.filter(d=>{
      const texto = (formatoTexto(d)+' '+(formatoSubtexto?formatoSubtexto(d):'')).toLowerCase();
      return texto.includes(f);
    }).slice(0,30);
    if(!items.length){
      lista.innerHTML = `<div class="autocomplete-vacio">Sin resultados</div>`;
    } else {
      lista.innerHTML = items.map(d=>`
        <div class="autocomplete-item" data-id="${d.id}">
          <strong>${escapeHtml(formatoTexto(d))}</strong>
          ${formatoSubtexto ? `<span class="autocomplete-sub">${escapeHtml(formatoSubtexto(d))}</span>` : ''}
        </div>
      `).join('');
    }
    lista.style.display = 'block';
  }

  input.oninput = ()=>{ hidden.value=''; render(input.value); };
  input.onfocus = ()=>render(input.value);
  input.onblur = ()=>setTimeout(()=>{ lista.style.display='none'; }, 150);
  lista.onmousedown = lista.ontouchstart = (e)=>{
    const item = e.target.closest('.autocomplete-item');
    if(!item) return;
    const id = item.dataset.id;
    const d = datos.find(x=>String(x.id)===String(id));
    if(d){
      hidden.value = d.id;
      input.value = formatoTexto(d);
      lista.style.display = 'none';
      input.dispatchEvent(new Event('autocomplete-change'));
    }
  };

  if(valorInicial){
    const d = datos.find(x=>String(x.id)===String(valorInicial));
    if(d){ hidden.value = d.id; input.value = formatoTexto(d); }
  } else {
    hidden.value = ''; input.value = '';
  }
}

// Genera el HTML de un campo autocompletar (input + hidden + lista), para
// usar en cualquier plantilla en lugar de un <select>.
function htmlAutocompletar(inputId, placeholder){
  return `
    <div class="autocomplete-wrap">
      <input type="text" id="${inputId}" class="autocomplete-input" placeholder="${escapeHtml(placeholder)}" autocomplete="off">
      <input type="hidden" id="${inputId}-id">
      <div class="autocomplete-lista" id="${inputId}-lista"></div>
    </div>
  `;
}

// Mantiene referencias a las instancias de Chart.js para destruirlas antes de

function renderGraficosPanel({ labelsPersonal, valoresPersonal, labelsAP, valoresAP, movNuevos, movReingresos, movCancelados }){
  if(typeof Chart === 'undefined') return;

  Object.values(window._chartsPanel).forEach(c=>{ if(c) c.destroy(); });
  window._chartsPanel = {};

  const coloresEstatus = {
    Activo:'#1f7a4d', Inactivo:'#6b7280', Sustituido:'#a8730a', Renunciado:'#b3242c', Fallecido:'#3d4450', Cancelado:'#7c2d12',
  };
  const ctxPersonal = document.getElementById('chart-personal-estatus');
  if(ctxPersonal && labelsPersonal.length){
    window._chartsPanel.personal = new Chart(ctxPersonal, {
      type: 'pie',
      data: {
        labels: labelsPersonal,
        datasets: [{ data: valoresPersonal, backgroundColor: labelsPersonal.map(l=>coloresEstatus[l]||'#94a3b8') }],
      },
      options: {
        responsive: true,
        plugins: { legend: { position: 'bottom', labels: { font: { size: 11 } } } },
      },
    });
  }

  const ctxAP = document.getElementById('chart-ap-estado');
  if(ctxAP && labelsAP.length){
    window._chartsPanel.ap = new Chart(ctxAP, {
      type: 'bar',
      data: {
        labels: labelsAP,
        datasets: [{ label: 'Solicitudes AP', data: valoresAP, backgroundColor: '#1d4f93', borderRadius: 4 }],
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true, ticks: { precision: 0 } }, x: { ticks: { font: { size: 10 } } } },
      },
    });
  }

  const ctxMov = document.getElementById('chart-movimientos-nomina');
  if(ctxMov && (movNuevos+movReingresos+movCancelados) > 0){
    window._chartsPanel.movimientos = new Chart(ctxMov, {

      },
      options: {
        responsive: true,
        plugins: { legend: { position: 'bottom', labels: { font: { size: 11 } } } },
      },
    });
  }
}

// Detecta encabezados típicos de un Excel de centros educativos, tolerando
// variaciones de nombre de columna (mismo patrón usado en Nóminas).
function detectarColumnasCentros(headers){
  const norm = h => h.toString().toLowerCase().trim()
    .replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u');
  const mapa = {};
  headers.forEach((h,i)=>{
    const n = norm(h);
    if(/sigerd|codigo/.test(n)) mapa.sigerd = i;
    else if(/matricula/.test(n)) mapa.matricula = i;
    else if(/nivel/.test(n)) mapa.nivel = i;
    else if(/tanda|jornada/.test(n)) mapa.tanda = i;
    else if(/dependencia/.test(n)) mapa.dependencia = i;
    else if(/director.*sexo|sexo.*director/.test(n)) mapa.directorSexo = i;
    else if(/telefono/.test(n)) mapa.telefono = i;
    else if(/director/.test(n)) mapa.director = i;
    else if(/centro|nombre/.test(n)) mapa.nombre = i;
  });
  return mapa;
}

async function procesarImportacionCentros(){
  const archivo = document.getElementById('centros-archivo').files[0];
  if(!archivo){ toast('Selecciona el archivo de centros.','error'); return; }

  const btn = document.getElementById('btn-importar-centros');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Procesando…';

  try{
    const filas = await leerArchivoNomina(archivo); // reutiliza el lector genérico CSV/Excel/PDF
    if(!filas.length) throw new Error('El archivo no contiene filas de datos.');

    // Detecta automáticamente la fila de encabezados reales (por si el archivo trae
    // un título y/o filas en blanco antes de los nombres de columna)
    const normCentros = h => h.toString().toLowerCase().trim()
      .replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u');
    const patronesEncabezadoCentros = [/sigerd|codigo/, /matricula/, /nivel/, /tanda|jornada/, /dependencia/,
      /director/, /centro|nombre/, /telefono/, /zona/];
    let headerRowIdxCentros = 0, mejorCoincidenciasCentros = -1;
    for(let i=0; i<Math.min(filas.length,10); i++){
      const coincidencias = filas[i].filter(c=>{ const n=normCentros(c); return n && patronesEncabezadoCentros.some(p=>p.test(n)); }).length;
      if(coincidencias > mejorCoincidenciasCentros){ mejorCoincidenciasCentros = coincidencias; headerRowIdxCentros = i; }
    }
    const headers = filas[headerRowIdxCentros];
    const mapa = detectarColumnasCentros(headers);
    if(mapa.nombre === undefined) throw new Error('No se pudo detectar la columna con el nombre del centro.');

    const registros = filas.slice(headerRowIdxCentros+1)
      .filter(f=>f[mapa.nombre] && String(f[mapa.nombre]).trim())
      .map(f=>({
        nombre_centro: String(f[mapa.nombre]).trim(),
        codigo_sigerd: mapa.sigerd!==undefined ? (String(f[mapa.sigerd]||'').trim() || null) : null,
        matricula: mapa.matricula!==undefined ? (parseInt(f[mapa.matricula])||null) : null,
        nivel: mapa.nivel!==undefined ? (String(f[mapa.nivel]||'').trim() || null) : null,
        tanda: mapa.tanda!==undefined ? (String(f[mapa.tanda]||'').trim() || null) : null,
        numero_dependencia_nomina: mapa.dependencia!==undefined ? (String(f[mapa.dependencia]||'').trim() || null) : null,
        director_nombre: mapa.director!==undefined ? (String(f[mapa.director]||'').trim() || null) : null,
        director_telefono: mapa.telefono!==undefined ? (String(f[mapa.telefono]||'').trim() || null) : null,
        director_sexo: mapa.directorSexo!==undefined ? (String(f[mapa.directorSexo]||'').trim().toUpperCase().startsWith('F') ? 'F' : (String(f[mapa.directorSexo]||'').trim() ? 'M' : null)) : null,
      }));

    if(!registros.length) throw new Error('No se encontraron filas válidas con nombre de centro.');

    // UPSERT por código SIGERD: si existe, actualiza; si no, crea nuevo.
    const { data: existentes } = await sb.from('centros_rh').select('id,codigo_sigerd');
    const mapaExistente = {};
    (existentes||[]).forEach(c=>{ if(c.codigo_sigerd) mapaExistente[c.codigo_sigerd] = c.id; });

    let creados = 0, actualizados = 0, sinSigerd = 0;
    for(const r of registros){
      if(r.codigo_sigerd && mapaExistente[r.codigo_sigerd]){
        const { error } = await sb.from('centros_rh').update(r).eq('id', mapaExistente[r.codigo_sigerd]);
        if(error) throw error;
        actualizados++;
      } else {
        const { data: nuevo, error } = await sb.from('centros_rh').insert(r).select('id,codigo_sigerd').single();
        if(error) throw error;
        if(nuevo.codigo_sigerd) mapaExistente[nuevo.codigo_sigerd] = nuevo.id;
        creados++;
        if(!r.codigo_sigerd) sinSigerd++;
      }
    }

    document.getElementById('centros-resumen-preview').innerHTML = `
      <div class="texto-ayuda" style="margin-top:10px;">
        <strong>${registros.length}</strong> filas procesadas ·
        <span style="color:var(--verde-600);font-weight:600;">${creados} creados</span> ·
        <span style="color:var(--azul-600);font-weight:600;">${actualizados} actualizados</span>
        ${sinSigerd ? `<br><span style="color:var(--amarillo-600);">${sinSigerd} sin código SIGERD: revisar para evitar duplicados en próximas importaciones.</span>` : ''}
      </div>`;

    toast('Centros importados correctamente.','exito');
    renderCentros();
  }catch(err){
    toast(err.message,'error');
  }finally{
    btn.disabled = false;
    btn.textContent = 'Importar centros';
  }
}

  if(error){ toast(error.message,'error'); return; }

  cerrarModal('modal-centro');
  renderCentros();
}

  if(!ids.length){ toast('Selecciona al menos un registro.','error'); return; }
  if(!confirm(`¿Eliminar ${ids.length} empleado(s) seleccionado(s)? Esto puede afectar registros relacionados (AP, vacaciones, licencias, etc.).`)) return;
  const { error } = await sb.from('personal_rh').delete().in('id', ids);
  if(error){ toast(error.message,'error'); return; }
  toast('Registros eliminados.','exito');
  renderPersonal();
}

async function procesarImportacionPersonal(){
  const archivo = document.getElementById('personal-archivo').files[0];
  if(!archivo){ toast('Selecciona el archivo.','error'); return; }

  const btn = document.getElementById('btn-importar-personal');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Procesando…';

  try{
    const resultado = await importarConUpsert({
      archivo, tabla:'personal_rh', claveUnica:'cedula',
      patrones: {
        cedula: /cedula/,
        nombres: /^nombres?$/,
        apellidos: /apellido/,
        sexo: /^sexo$/,
        cargo_actual: /cargo/,
        telefono: /telefono/,
        direccion: /direccion/,
        nivel_academico: /nivel/,
        numero_dependencia_nomina: /dependencia/,
        estatus: /estatus|estado/,
      },
      transformarFila: (base)=>{
        if(base.sexo) base.sexo = base.sexo.toUpperCase().startsWith('F') ? 'F' : 'M';
        if(base.estatus) base.estatus = base.estatus.toLowerCase();
        if(!base.estatus) base.estatus = 'activo';
        if(!base.sexo) base.sexo = 'M';
        if(!base.nombres) base.nombres = 'Sin nombre';
        if(!base.apellidos) base.apellidos = '';
        return base;
      },
      onProgress: (hecho,total)=>{ btn.innerHTML = `<span class="spinner"></span> Procesando ${hecho}/${total}…`; },
    });
    document.getElementById('personal-resumen-preview').innerHTML = `
      <div class="texto-ayuda" style="margin-top:10px;">
        <strong>${resultado.total}</strong> filas procesadas ·
        <span style="color:var(--verde-600);font-weight:600;">${resultado.creados} creados</span> ·
        <span style="color:var(--azul-600);font-weight:600;">${resultado.actualizados} actualizados</span>
      </div>`;
    toast('Personal importado correctamente.','exito');
    renderPersonal();
  }catch(err){
    toast(err.message,'error');
  }finally{
    btn.disabled = false;
    btn.textContent = 'Importar';
  }
}

function filtrarPersonal(){
  const texto = document.getElementById('filtro-personal-texto').value.toLowerCase().trim();
  const estatus = document.getElementById('filtro-personal-estatus').value;
  const filtrado = (window._personalTodos||[]).filter(p=>{
    if(estatus && p.estatus !== estatus) return false;
    if(!texto) return true;
    const campo = `${p.nombres} ${p.apellidos} ${p.cedula} ${p.cargo_actual||''}`.toLowerCase();
    return campo.includes(texto);
  });
  pintarTablaPersonal(filtrado);
}

async function cambiarEstatusRapidoPersonal(id, nuevoEstatus){

async function guardarPersonal(){
  const id = document.getElementById('personal-id').value;
  const payload = {
    cedula: document.getElementById('personal-cedula').value.trim(),
    sexo: document.getElementById('personal-sexo').value,
    nombres: document.getElementById('personal-nombres').value.trim(),
    apellidos: document.getElementById('personal-apellidos').value.trim(),
    fecha_nacimiento: document.getElementById('personal-nacimiento').value || null,
    telefono: document.getElementById('personal-telefono').value.trim() || null,
    direccion: document.getElementById('personal-direccion').value.trim() || null,
    nivel_academico: document.getElementById('personal-nivel').value.trim() || null,
    cargo_actual: document.getElementById('personal-cargo').value.trim() || null,
    centro_id: document.getElementById('personal-centro-id').value || null,
    numero_dependencia_nomina: document.getElementById('personal-dependencia').value.trim() || null,
    fecha_ingreso: document.getElementById('personal-ingreso').value || null,
    estatus: document.getElementById('personal-estatus').value,
  };
  if(!payload.cedula || !payload.sexo || !payload.nombres || !payload.apellidos){
    toast('Cédula, sexo, nombres y apellidos son obligatorios.','error'); return;
  }
  const q = id ? sb.from('personal_rh').update(payload).eq('id', id) : sb.from('personal_rh').insert(payload);
  const { error } = await q;
  if(error){ toast(error.message,'error'); return; }
  toast('Empleado guardado correctamente.','exito');
  cerrarModal('modal-personal');
  renderPersonal();
}

async function procesarImportacionAP(){
  const archivo = document.getElementById('ap-archivo').files[0];
  if(!archivo){ toast('Selecciona el archivo.','error'); return; }

  const btn = document.getElementById('btn-importar-ap');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Procesando…';

  try{
    const filas = await leerArchivoNomina(archivo);
    if(!filas.length) throw new Error('El archivo no contiene filas de datos.');

    const patronesEncabezadoAP = [/solicitud|no\.?\s*ap/, /fecha/, /motivo/, /sigerd|codigo.*centro/, /centro/,
      /nombres?\b.*candidato|^nombres?$/, /apellidos?\b.*candidato|^apellidos?$/, /cedula/, /sexo/, /cargo/, /observ/, /estado/];
    const headerIdxAP = detectarFilaEncabezados(filas, patronesEncabezadoAP);
    const headers = filas[headerIdxAP];

    const norm = h => h.toString().toLowerCase().trim()
      .replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u');
    const mapa = {};
    headers.forEach((h,i)=>{
      const n = norm(h);
      if(/solicitud|no\.?\s*ap/.test(n) && mapa.no_solicitud===undefined) mapa.no_solicitud = i;
      else if(/fecha/.test(n) && mapa.fecha===undefined) mapa.fecha = i;
      else if(/motivo/.test(n) && mapa.motivo===undefined) mapa.motivo = i;
      else if(/sigerd|codigo.*centro/.test(n) && mapa.sigerd===undefined) mapa.sigerd = i;
      else if(/centro/.test(n) && mapa.centro===undefined) mapa.centro = i;
      else if(/nombres?\b.*candidato|^nombres?$/.test(n) && mapa.nombres===undefined) mapa.nombres = i;
      else if(/apellidos?\b.*candidato|^apellidos?$/.test(n) && mapa.apellidos===undefined) mapa.apellidos = i;
      else if(/cedula/.test(n) && mapa.cedula===undefined) mapa.cedula = i;
      else if(/sexo/.test(n) && mapa.sexo===undefined) mapa.sexo = i;
      else if(/cargo/.test(n) && mapa.cargo===undefined) mapa.cargo = i;
      else if(/observ/.test(n) && mapa.observaciones===undefined) mapa.observaciones = i;
      else if(/estado/.test(n) && mapa.estado===undefined) mapa.estado = i;
    });
    if(mapa.nombres===undefined || mapa.apellidos===undefined){
      throw new Error('No se pudo detectar las columnas de nombres/apellidos del candidato.');
    }

    const registros = filas.slice(headerIdxAP+1).filter(f=>f[mapa.nombres] && String(f[mapa.nombres]).trim());
    if(!registros.length) throw new Error('No se encontraron filas válidas con nombres de candidato.');

    let creados = 0, actualizados = 0, errores = 0;
    const detalleErrores = [];
    const motivosValidos = ['SUSTITUCION_FALLECIMIENTO','SUSTITUCION_DECISION_ADMINISTRATIVA','SUSTITUCION_ABANDONO',
                             'SUSTITUCION_RENUNCIA','CAMBIO_DESIGNACION','COMPLETACION_TANDA','PLAZA_VACANTE'];
    const estadosValidos = ['borrador','enviado','expediente_incompleto','incidencias','aprobado','nombrado','rechazado'];

    for(const f of registros){
      try{
        const nombreCentro = mapa.centro!==undefined ? String(f[mapa.centro]||'').trim() : '';
        const sigerd = mapa.sigerd!==undefined ? String(f[mapa.sigerd]||'').trim() : '';
        const nombreCentroFinal = nombreCentro || 'Centro no especificado (importación histórica)';

        let centroId;
        {
          let centroExistente = null;
          if(sigerd){
            const { data } = await sb.from('centros_rh').select('id').eq('codigo_sigerd', sigerd).maybeSingle();
            centroExistente = data;
          }
          if(!centroExistente){
            const { data } = await sb.from('centros_rh').select('id').eq('nombre_centro', nombreCentroFinal).maybeSingle();
            centroExistente = data;
          }
          if(centroExistente){
            centroId = centroExistente.id;
          } else {
            const { data: nuevoCentro, error: errCentro } = await sb.from('centros_rh')
              .insert({ nombre_centro: nombreCentroFinal, codigo_sigerd: sigerd || null }).select('id').single();
            if(errCentro) throw errCentro;
            centroId = nuevoCentro.id;
          }
        }

        let motivo = mapa.motivo!==undefined ? String(f[mapa.motivo]||'').trim().toUpperCase().replace(/\s+/g,'_') : '';
        if(!motivosValidos.includes(motivo)) motivo = 'PLAZA_VACANTE';
        let estado = mapa.estado!==undefined ? String(f[mapa.estado]||'').trim().toLowerCase().replace(/\s+/g,'_') : '';
        if(!estadosValidos.includes(estado)) estado = 'enviado';
        const fecha = mapa.fecha!==undefined ? (String(f[mapa.fecha]||'').trim() || new Date().toISOString().slice(0,10)) : new Date().toISOString().slice(0,10);
        const noSolicitud = mapa.no_solicitud!==undefined ? (String(f[mapa.no_solicitud]||'').trim() || null) : null;

        const payloadSolicitud = {
          centro_id: centroId,
          fecha_solicitud: fecha,
          motivo_solicitud: motivo,
          observaciones: mapa.observaciones!==undefined ? (String(f[mapa.observaciones]||'').trim() || null) : null,
          estado,
        };
        if(noSolicitud) payloadSolicitud.no_solicitud = noSolicitud;

        let solicitudId;
        if(noSolicitud){
          const { data: existente } = await sb.from('solicitudes_ap').select('id').eq('no_solicitud', noSolicitud).maybeSingle();
          if(existente){
            const { error: errUpd } = await sb.from('solicitudes_ap').update(payloadSolicitud).eq('id', existente.id);
            if(errUpd) throw errUpd;
            solicitudId = existente.id;
            actualizados++;
          }
        }
        if(!solicitudId){
          const { data: nuevaSolicitud, error: errSol } = await sb.from('solicitudes_ap').insert(payloadSolicitud).select('id').single();
          if(errSol) throw errSol;
          solicitudId = nuevaSolicitud.id;
          creados++;
        }

        // Candidato vinculado a la solicitud (uno por fila importada).
        const sexo = mapa.sexo!==undefined ? (String(f[mapa.sexo]||'').trim().toUpperCase().startsWith('F') ? 'F' : 'M') : 'M';
        const cedulaCandidato = mapa.cedula!==undefined ? String(f[mapa.cedula]||'').trim() : '';
        const cargoCandidato = mapa.cargo!==undefined ? String(f[mapa.cargo]||'').trim() : '';
        const { error: errCand } = await sb.from('candidatos_ap').insert({
          solicitud_ap_id: solicitudId,
          nombres: String(f[mapa.nombres]||'').trim(),
          apellidos: String(f[mapa.apellidos]||'').trim(),
          cedula: cedulaCandidato || '000-0000000-0',
          sexo,
          cargo_propuesto: cargoCandidato || 'No especificado',
          estado: estado === 'nombrado' ? 'nombrado' : 'pendiente',
        });
        if(errCand) throw errCand;
      }catch(errFila){
        errores++;
        detalleErrores.push(`Fila con candidato "${f[mapa.nombres]||'?'}": ${errFila.message}`);
      }
    }

// Si la cédula del candidato ya coincide con un empleado existente (ej. está siendo
// re-propuesto para otro cargo), rellena lo que ya se conoce de él/ella. También
// busca en telegramas anteriores si ya se registró un teléfono para esa persona.
async function autorellenarCandidatoAP(inputCedula){
  const cedula = inputCedula.value.trim();
  if(!cedula) return;
  const wrap = inputCedula.closest('[data-candidato]');
  if(!wrap) return;
  const setSiVacio = (cls, val) => { const el = wrap.querySelector('.'+cls); if(el && !el.value && val) el.value = val; };

  const { data: p } = await sb.from('personal_rh').select('nombres,apellidos,sexo,cargo_actual').eq('cedula', cedula).maybeSingle();
  if(p){
    setSiVacio('cand-nombres', p.nombres);
    setSiVacio('cand-apellidos', p.apellidos);
    setSiVacio('cand-cargo', p.cargo_actual);
    const sexoEl = wrap.querySelector('.cand-sexo');
    if(sexoEl && !sexoEl.dataset.tocado && p.sexo) sexoEl.value = p.sexo;
  }

  try{
    const { data: tel } = await sb.from('telegramas_rh')
      .select('candidato_telefono, candidatos_ap!inner(cedula)')
      .eq('candidatos_ap.cedula', cedula)
      .not('candidato_telefono', 'is', null)
      .order('creado_en', { ascending:false }).limit(1).maybeSingle();
    if(tel?.candidato_telefono) setSiVacio('cand-telefono', tel.candidato_telefono);
  }catch(e){ /* búsqueda de teléfono es opcional, no bloquea el resto */ }
}

// Si la cédula del empleado a sustituir coincide con personal existente, rellena
// sus datos conocidos (nombres, apellidos, cargo, fecha de ingreso).
async function autorellenarSustituidoAP(inputCedula){
  const cedula = inputCedula.value.trim();
  if(!cedula) return;
  const wrap = inputCedula.closest('.campo-sustituido');
  if(!wrap) return;
  const setSiVacio = (cls, val) => { const el = wrap.querySelector('.'+cls); if(el && !el.value && val) el.value = val; };
  const { data: p } = await sb.from('personal_rh').select('nombres,apellidos,cargo_actual,fecha_ingreso').eq('cedula', cedula).maybeSingle();
  if(p){
    setSiVacio('cand-sus-nombres', p.nombres);
    setSiVacio('cand-sus-apellidos', p.apellidos);
    setSiVacio('cand-sus-cargo', p.cargo_actual);
    const fechaEl = wrap.querySelector('.cand-sus-ingreso');
    if(fechaEl && !fechaEl.value && p.fecha_ingreso) fechaEl.value = p.fecha_ingreso;
  }
}

async function verSolicitud(id){

  if(error){ toast(error.message,'error'); return; }
  const { data: cands } = await sb.from('candidatos_ap').select('*').eq('solicitud_ap_id', id).order('id');

function leerCandidatosDelForm(){
  const bloques = document.querySelectorAll('#lista-candidatos [data-candidato]');
  const lista = [];
  bloques.forEach(b=>{
    const val = sel => b.querySelector(sel)?.value?.trim() || null;

      fecha_nacimiento: val('.cand-nacimiento'), nombres: val('.cand-nombres'), apellidos: val('.cand-apellidos'),

async function guardarSolicitud(){
  const id = document.getElementById('sol-id').value;
  const payload = {
    no_solicitud: document.getElementById('sol-numero').value.trim() || null,
    fecha_solicitud: document.getElementById('sol-fecha').value || new Date().toISOString().slice(0,10),
    estado: document.getElementById('sol-estado').value,
    centro_id: document.getElementById('sol-centro-id').value,
    motivo_solicitud: document.getElementById('sol-motivo').value,
    observaciones: document.getElementById('sol-observaciones').value.trim() || null,
  };
  if(!payload.centro_id){ toast('Selecciona el centro educativo.','error'); return; }

  const candidatos = leerCandidatosDelForm();
  if(!candidatos.length || !candidatos[0].nombres){ toast('Agrega al menos un candidato con nombre.','error'); return; }

  let solicitudId = id;
  if(id){
    const { error } = await sb.from('solicitudes_ap').update(payload).eq('id', id);
    if(error){ toast(error.message,'error'); return; }
    // Reemplazar candidatos: borrar y reinsertar (simple y robusto para este volumen)
    await sb.from('candidatos_ap').delete().eq('solicitud_ap_id', id);
  } else {
    const { data, error } = await sb.from('solicitudes_ap').insert(payload).select('id').single();
    if(error){ toast(error.message,'error'); return; }
    solicitudId = data.id;
  }

  const filasCandidatos = candidatos.map(c=>({ ...c, solicitud_ap_id: solicitudId }));
  const { error: errCand } = await sb.from('candidatos_ap').insert(filasCandidatos);
  if(errCand){ toast(errCand.message,'error'); return; }

  toast('Solicitud AP guardada correctamente.','exito');
  cerrarModal('modal-solicitud');
  renderSolicitudes();
}

                                   candidatoSexo, cargoDesignado, jornada, fecha, candidatoTelefono, destinatarioTelefono }){

`Señor/a: ${destinatarioNombre}\nDirector/a\nCentro Educativo: ${centroNombre}\n\n`+

}

// Calcula el siguiente número consecutivo simple, basado en el mayor
// número puramente numérico ya registrado (ignora formatos como
// "TEL-2026-001" para el cálculo, pero el campo sigue siendo editable
// manualmente para cualquier formato que se necesite).
async function calcularProximoNumeroTelegrama(){
  const { data, error } = await sb.from('telegramas_rh').select('no_telegrama');
  if(error || !data){ return ''; }
  let maximo = 0;
  data.forEach(t=>{
    const n = parseInt(String(t.no_telegrama||'').replace(/\D/g,''), 10);
    if(!isNaN(n) && /^\d+$/.test(String(t.no_telegrama||'').trim()) && n > maximo) maximo = n;
  });
  return maximo > 0 ? String(maximo + 1) : '1';
}

function precargarTelegrama(){
  const id = document.getElementById('tel-candidato-id').value;
  const c = (window._candidatosNombrables||[]).find(x=>String(x.id)===String(id));
  if(!c) return;
  document.getElementById('tel-cargo').value = c.cargo_actual || '';
  document.getElementById('tel-destinatario').value = c.centros_rh?.director_nombre || '';
  if(!document.getElementById('tel-destinatario-telefono').value){
    document.getElementById('tel-destinatario-telefono').value = c.centros_rh?.director_telefono || '';
  }
  document.getElementById('tel-jornada').value = c.centros_rh?.tanda || 'Extendida';
  // Precarga el centro actual del empleado, pero queda en un campo visible y
  // editable: si el usuario lo cambia, el telegrama imprimirá ese centro nuevo,
  // no el que tenía asignado hasta ahora.
  const centroId = c.centro_id || '';
  const centroNombre = c.centros_rh?.nombre_centro || '';
  document.getElementById('tel-centro-id').value = centroId;
  document.getElementById('tel-centro').value = centroNombre;
  actualizarPreviewTelegrama();
}

async function guardarTelegrama(imprimir){
  if(!bloquearGuardado('telegrama')) return;
  try{
  const telId = document.getElementById('tel-id').value;
  const candidatoId = document.getElementById('tel-candidato-id').value;
  const c = (window._candidatosNombrables||[]).find(x=>String(x.id)===String(candidatoId));
  const destinatario = document.getElementById('tel-destinatario').value.trim();
  const cargo = document.getElementById('tel-cargo').value.trim();
  const centroId = document.getElementById('tel-centro-id').value;
  const centroNombre = document.getElementById('tel-centro').value.trim();

  if(!c || !destinatario || !cargo || !centroId){
    toast('Selecciona el candidato, el centro educativo, y completa destinatario y cargo.','error'); return;
  }

  const fecha = document.getElementById('tel-fecha').value || new Date().toISOString().slice(0,10);
  const candidatoTelefono = document.getElementById('tel-candidato-telefono').value.trim();
  const destinatarioTelefono = document.getElementById('tel-destinatario-telefono').value.trim();

  // telegramas_rh sigue enlazando por diseño a candidatos_ap; como ahora el
  // empleado se elige directo de personal_rh (toda la nómina, no solo quienes
  // vienen de una Solicitud AP), se busca —o si no existe, se crea— el
  // candidato_ap correspondiente a esa cédula para mantener ese enlace.
  let candidatoApId;
  const { data: candidatoApExistente } = await sb.from('candidatos_ap')
    .select('id').eq('cedula', c.cedula).order('id',{ascending:false}).limit(1).maybeSingle();
  if(candidatoApExistente){
    candidatoApId = candidatoApExistente.id;
  } else {
    const { data: nuevaSolicitudAuto, error: errSolAuto } = await sb.from('solicitudes_ap')
      .insert({ centro_id: centroId, motivo_solicitud:'PLAZA_VACANTE', estado:'nombrado',
                observaciones:'Generado automáticamente al crear un telegrama desde Personal.' })
      .select('id').single();
    if(errSolAuto){ toast('No se pudo vincular el candidato: '+errSolAuto.message,'error'); return; }
    const { data: nuevoCandidatoAp, error: errCandAp } = await sb.from('candidatos_ap')
      .insert({ solicitud_ap_id: nuevaSolicitudAuto.id, nombres: c.nombres, apellidos: c.apellidos,
                cedula: c.cedula, sexo: c.sexo, cargo_propuesto: cargo, estado: 'nombrado' })
      .select('id').single();
    if(errCandAp){ toast('No se pudo vincular el candidato: '+errCandAp.message,'error'); return; }
    candidatoApId = nuevoCandidatoAp.id;
  }

  const texto = generarTextoTelegrama({
    destinatarioNombre: destinatario,
    centroNombre: centroNombre || '________',
    candidatoNombre: c.nombres+' '+c.apellidos,
    candidatoCedula: c.cedula,
    candidatoSexo: c.sexo,
    cargoDesignado: cargo,
    jornada: document.getElementById('tel-jornada').value,
    fecha,
    candidatoTelefono,
    destinatarioTelefono,
  });

  const payload = {
    candidato_ap_id: candidatoApId,
    centro_id: centroId,
    no_telegrama: document.getElementById('tel-numero').value.trim() || null,
    fecha_telegrama: fecha,
    destinatario_nombre: destinatario,
    destinatario_telefono: document.getElementById('tel-destinatario-telefono').value.trim() || null,
    candidato_telefono: candidatoTelefono || null,
    notas: document.getElementById('tel-notas').value.trim() || null,
    cargo_designado: cargo,
    jornada: document.getElementById('tel-jornada').value,
    texto_generado: texto,
  };

  if(telId){
    const { error } = await sb.from('telegramas_rh').update(payload).eq('id', telId);
    if(error){ toast(error.message,'error'); return; }
    toast('Telegrama actualizado correctamente.','exito');
  } else {
    const { error } = await sb.from('telegramas_rh').insert(payload);
    if(error){ toast(error.message,'error'); return; }
    // Marcar candidato como nombrado (solo al crear, no al editar)
    await sb.from('candidatos_ap').update({ estado:'nombrado' }).eq('id', candidatoId);
    toast('Telegrama generado correctamente.','exito');
  }

  cerrarModal('modal-telegrama');
  renderTelegramas();
  if(imprimir){
    window._telegramaActual = { texto_generado: texto };
    imprimirTelegramaActual();
  }
  }finally{ desbloquearGuardado('telegrama'); }
}

async function procesarImportacionTelegramas(){
  const archivo = document.getElementById('tel-import-archivo').files[0];
  if(!archivo){ toast('Selecciona el archivo.','error'); return; }

  const btn = document.getElementById('btn-importar-telegramas');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Procesando…';

  try{
    const filas = await leerArchivoNomina(archivo);
    if(!filas.length) throw new Error('El archivo no contiene filas de datos.');

    const norm = h => h.toString().toLowerCase().trim()
      .replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u');

    // Detecta automáticamente la fila de encabezados reales (por si el archivo trae
    // un título y/o filas en blanco antes de los nombres de columna, como "REGISTRO
    // GENERAL DE TELEGRAMAS (141 REGISTROS COMPLETOS)")
    const patronesEncabezado = [/telegrama|no\.?\s*tel/, /fecha/, /nombres?\b.*candidato|^nombres?$/,
      /apellidos?\b.*candidato|^apellidos?$/, /(nombre|designado|designad[ao])\b/, /cedula/, /sexo/, /cargo/,
      /sigerd|codigo.*centro/, /centro.*educ|centro/, /jornada/, /destinatario|director/, /telefono/,
      /notas|contacto|observ/, /estado/];
    let headerRowIdx = 0, mejorCoincidencias = -1;
    for(let i=0; i<Math.min(filas.length,10); i++){
      const coincidencias = filas[i].filter(c=>{ const n=norm(c); return n && patronesEncabezado.some(p=>p.test(n)); }).length;
      if(coincidencias > mejorCoincidencias){ mejorCoincidencias = coincidencias; headerRowIdx = i; }
    }
    const headers = filas[headerRowIdx];

    const mapa = {};
    headers.forEach((h,i)=>{
      const n = norm(h);
      if(/telegrama|no\.?\s*tel/.test(n) && mapa.numero===undefined) mapa.numero = i;
      else if(/fecha/.test(n) && mapa.fecha===undefined) mapa.fecha = i;
      // Acepta tanto columnas separadas (nombres/apellidos) como nombre completo en una sola columna
      else if(/nombres?\b.*candidato|^nombres?$/.test(n) && mapa.nombres===undefined) mapa.nombres = i;
      else if(/apellidos?\b.*candidato|^apellidos?$/.test(n) && mapa.apellidos===undefined) mapa.apellidos = i;
      else if(/(nombre|designado|designad[ao])\b/.test(n) && mapa.nombreCompleto===undefined) mapa.nombreCompleto = i;
      else if(/cedula/.test(n) && mapa.cedula===undefined) mapa.cedula = i;
      else if(/sexo/.test(n) && mapa.sexo===undefined) mapa.sexo = i;
      else if(/cargo/.test(n) && mapa.cargo===undefined) mapa.cargo = i;
      else if(/sigerd|codigo.*centro/.test(n) && mapa.sigerd===undefined) mapa.sigerd = i;
      else if(/centro.*educ|centro/.test(n) && mapa.centro===undefined) mapa.centro = i;
      else if(/jornada/.test(n) && mapa.jornada===undefined) mapa.jornada = i;
      else if(/destinatario|director/.test(n) && mapa.destinatario===undefined) mapa.destinatario = i;
      else if(/telefono/.test(n) && mapa.telefono===undefined) mapa.telefono = i;
      else if(/notas|contacto|observ/.test(n) && mapa.notas===undefined) mapa.notas = i;
      else if(/estado/.test(n) && mapa.estado===undefined) mapa.estado = i;
    });
    // Acepta nombre completo en una columna (formato de tu planilla) O nombres/apellidos separados
    const tieneNombreCompleto = mapa.nombreCompleto !== undefined;
    const tieneNombresSeparados = mapa.nombres !== undefined || mapa.apellidos !== undefined;
    if(!tieneNombreCompleto && !tieneNombresSeparados){
      throw new Error('No se pudo detectar la columna de nombre del candidato (acepta: "Nombre del Designado", "Nombres", "Apellidos").');
    }

    // Para formato con nombre completo: determinar qué columna tiene datos válidos
    const colNombreCheck = tieneNombreCompleto ? mapa.nombreCompleto : (mapa.nombres ?? mapa.apellidos);
    const registros = filas.slice(headerRowIdx+1).filter(f=>f[colNombreCheck] && String(f[colNombreCheck]).trim());

    // Función para extraer teléfono del campo de notas (ej: "Tel: 829-387-8120.")
    function extraerTelDeNotas(notas){
      if(!notas) return null;
      const m = String(notas).match(/Tel[eé]?[fono]*[.:]\s*([\d\-\s]+)/i);
      return m ? m[1].trim() : null;
    }
    // Función para separar nombre completo en nombres y apellidos
    function separarNombre(nombreCompleto){
      const partes = String(nombreCompleto).trim().split(/\s+/);
      if(partes.length >= 4) return [partes.slice(0,2).join(' '), partes.slice(2).join(' ')];
      if(partes.length === 3) return [partes[0], partes.slice(1).join(' ')];
      return [nombreCompleto.trim(), 'Sin apellido'];
    }

    let creados = 0, errores = 0;
    const detalleErrores = [];

    // Siguiente número consecutivo disponible, para las filas que no traigan
    // número de telegrama propio en el Excel (se sigue incrementando por cada
    // una de esas filas, en el orden en que aparecen)
    let siguienteNumeroAuto = parseInt(await calcularProximoNumeroTelegrama(), 10);
    if(isNaN(siguienteNumeroAuto)) siguienteNumeroAuto = 1;

    for(const f of registros){
      try{
        const nombreCentro = mapa.centro!==undefined ? String(f[mapa.centro]||'').trim() : '';
        const sigerd = mapa.sigerd!==undefined ? String(f[mapa.sigerd]||'').trim() : '';
        let centroId = null;
        const nombreCentroFinal = nombreCentro || 'Centro no especificado (importación histórica)';

        {
          let centroExistente = null;
          if(sigerd){
            const { data } = await sb.from('centros_rh').select('id').eq('codigo_sigerd', sigerd).maybeSingle();
            centroExistente = data;
          }
          if(!centroExistente){
            const { data } = await sb.from('centros_rh').select('id').eq('nombre_centro', nombreCentroFinal).maybeSingle();
            centroExistente = data;
          }
          if(centroExistente){
            centroId = centroExistente.id;
          } else {
            const { data: nuevoCentro, error: errCentro } = await sb.from('centros_rh')
              .insert({ nombre_centro: nombreCentroFinal, codigo_sigerd: sigerd || null }).select('id').single();
            if(errCentro) throw errCentro;
            centroId = nuevoCentro.id;
          }
        }

        // Crear Solicitud AP básica (cada importación genera la suya, ya que
        // representa el trámite histórico real de ese telegrama en papel).
        const { data: nuevaSolicitud, error: errSol } = await sb.from('solicitudes_ap')
          .insert({ centro_id: centroId, motivo_solicitud:'PLAZA_VACANTE', estado:'nombrado',
                    observaciones:'Importado desde Excel — telegrama histórico en papel.' })
          .select('id').single();
        if(errSol) throw errSol;

        // Crear Candidato básico vinculado a esa solicitud.
        const sexo = mapa.sexo!==undefined ? (String(f[mapa.sexo]||'').trim().toUpperCase().startsWith('F') ? 'F' : 'M') : 'M';
        const cedulaCandidato = mapa.cedula!==undefined ? String(f[mapa.cedula]||'').trim() : '';
        const cargoCandidato = mapa.cargo!==undefined ? String(f[mapa.cargo]||'').trim() : '';
        // Soporte para nombre completo en una sola columna ("Nombre del Designado")
        let nombresIns, apellidosIns, nombreCompletoParaTexto;
        if(tieneNombreCompleto){
          const nc = String(f[mapa.nombreCompleto]||'').trim();
          [nombresIns, apellidosIns] = separarNombre(nc);
          nombreCompletoParaTexto = nc;
        } else {
          nombresIns = String(f[mapa.nombres]||'').trim();
          apellidosIns = String(f[mapa.apellidos]||'').trim();
          nombreCompletoParaTexto = (nombresIns+' '+apellidosIns).trim();
        }
        const { data: nuevoCandidato, error: errCand } = await sb.from('candidatos_ap')
          .insert({
            solicitud_ap_id: nuevaSolicitud.id,
            nombres: nombresIns,
            apellidos: apellidosIns || 'Sin apellido',
            cedula: cedulaCandidato || '000-0000000-0',
            sexo,
            cargo_propuesto: cargoCandidato || 'No especificado',
            estado: 'nombrado',
          }).select('id').single();
        if(errCand) throw errCand;

        const fecha = mapa.fecha!==undefined ? (String(f[mapa.fecha]||'').trim() || new Date().toISOString().slice(0,10)) : new Date().toISOString().slice(0,10);
        const cargoDesignado = mapa.cargo!==undefined ? (String(f[mapa.cargo]||'').trim() || '________') : '________';
        const destinatario = mapa.destinatario!==undefined ? (String(f[mapa.destinatario]||'').trim() || '________') : '________';
        const jornada = mapa.jornada!==undefined ? (String(f[mapa.jornada]||'').trim() || 'Extendida') : 'Extendida';
        // Teléfono: del campo directo o extraído de notas
        let telFinal = mapa.telefono!==undefined ? (String(f[mapa.telefono]||'').trim() || null) : null;
        if(!telFinal && mapa.notas!==undefined) telFinal = extraerTelDeNotas(f[mapa.notas]);
        // Notas / Contacto: se guarda el texto completo tal cual venía en el Excel,
        // aparte del teléfono ya extraído por separado
        const notasFinal = mapa.notas!==undefined ? (String(f[mapa.notas]||'').trim() || null) : null;

        const texto = generarTextoTelegrama({
          destinatarioNombre: destinatario,
          centroNombre: nombreCentroFinal,
          candidatoNombre: nombreCompletoParaTexto,
          candidatoCedula: cedulaCandidato,
          candidatoSexo: sexo,
          cargoDesignado,
          jornada,
          fecha,
        });

        // Número de telegrama: si la fila trae uno propio en el Excel, se respeta tal cual;
        // si no, se asigna el siguiente consecutivo automático de la secuencia del sistema.
        let numeroFinal = mapa.numero!==undefined ? (String(f[mapa.numero]||'').trim() || null) : null;
        if(!numeroFinal){ numeroFinal = String(siguienteNumeroAuto); siguienteNumeroAuto++; }
        else if(/^\d+$/.test(numeroFinal)){
          const n = parseInt(numeroFinal,10);
          if(n >= siguienteNumeroAuto) siguienteNumeroAuto = n + 1;
        }

        const { error: errTel } = await sb.from('telegramas_rh').insert({
          candidato_ap_id: nuevoCandidato.id,
          centro_id: centroId,
          no_telegrama: numeroFinal,
          fecha_telegrama: fecha,
          destinatario_nombre: destinatario,
          destinatario_telefono: telFinal,
          notas: notasFinal,
          cargo_designado: cargoDesignado,
          jornada,
          texto_generado: texto,
          estado_envio: mapa.estado!==undefined ? (String(f[mapa.estado]||'').trim().toLowerCase() || 'generado') : 'generado',
        });
        if(errTel) throw errTel;

        creados++;
      }catch(errFila){
        errores++;
        detalleErrores.push(`Fila con candidato "${f[mapa.nombres]||'?'}": ${errFila.message}`);
      }
    }

    document.getElementById('tel-import-resumen-preview').innerHTML = `
      <div class="texto-ayuda" style="margin-top:10px;">
        <strong>${registros.length}</strong> filas procesadas ·
        <span style="color:var(--verde-600);font-weight:600;">${creados} telegramas creados</span>
        ${errores ? `· <span style="color:var(--rojo-600);font-weight:600;">${errores} con error</span>` : ''}
        ${detalleErrores.length ? `<br><span style="color:var(--rojo-600);">${detalleErrores.slice(0,5).join('<br>')}</span>` : ''}
      </div>`;

    if(creados){
      toast(`${creados} telegrama(s) importado(s) correctamente.`,'exito');
      renderTelegramas();
    } else {
      toast('No se pudo importar ningún telegrama. Revisa los errores.','error');
    }
  }catch(err){
    toast(err.message,'error');
  }finally{
    btn.disabled = false;
    btn.textContent = 'Importar telegramas';
  }
}

                                           candidatoSexo, cargoDesignado }){

  const designadoA = F ? 'designada' : 'designado';
  const fechaTexto = new Date(fecha+'T00:00:00').toLocaleDateString('es-DO',{day:'2-digit',month:'long',year:'numeric'});

  return `DISTRITO EDUCATIVO 16-06, BONAO NORDESTE.\nC. / 16 de Agosto, esq. Luperón, 809-296-2126.\n\n`+
`${fechaTexto}.\nBonao, R. D.\n\n`+
`Al\t\t\t: ${destinatarioNombre}\n\t\t\t  ${destinatarioCargo}\n\n`+
`De\t\t\t: Emeterio Beltré Tineo M.A.\n\t\t\t  Director Distrito Educativo 16-06, Bonao Nordeste.\n\n`+
`Vía\t\t\t: ${analistaNombre || '________________'}\n\t\t\t  ${analistaCargo}\n\n`+

`${candidatoNombre}, ${portadorA} de la Cédula de Identidad y electoral No. ${candidatoCedula}, `+
`${designadoA} como ${cargoDesignado}, para que sea reubicado en su jurisdicción.\n\n`+
`Agradeciendo de antemano su acogida.\n\nMuy atentamente,\n\n\nEmeterio Beltré Tineo M.A.\nDirector Distrital 16-06, Bonao Nordeste`;
}

function pintarTablaPuestasDisp(lista){
  window._puestasDispFiltrado = lista;
  const tbody = document.getElementById('tbody-puestas-disp');
  if(!lista || !lista.length){
    tbody.innerHTML = `<tr><td colspan="8"><div class="vacio"><div class="icono-vacio">📤</div>No hay oficios registrados.</div></td></tr>`;
    return;
  }
  tbody.innerHTML = lista.map(p=>`
    <tr>
      <td><input type="checkbox" class="chk-pd" value="${p.id}"></td>
      <td>${fechaCorta(p.fecha_oficio)}</td>
      <td>${escapeHtml((p.personal_rh?.nombres||'')+' '+(p.personal_rh?.apellidos||''))}</td>
      <td>${escapeHtml(p.cargo_designado)}</td>
      <td>${escapeHtml(p.destinatario_nombre)}</td>
      <td>${escapeHtml(p.distrito_destino||'—')}</td>
      <td>${badgeEstado(p.estado)}</td>
      <td><button class="btn btn-secundario btn-chico" onclick="verPuestaDisp(${p.id})">Ver</button></td>
    </tr>
  `).join('');
}

function filtrarPuestasDisp(){
  const texto = document.getElementById('filtro-pd-texto').value.toLowerCase();
  const estado = document.getElementById('filtro-pd-estado').value;
  const distrito = document.getElementById('filtro-pd-distrito').value.toLowerCase();
  const filtrado = (window._puestasDisposicionData||[]).filter(p=>{
    const nombre = ((p.personal_rh?.nombres||'')+' '+(p.personal_rh?.apellidos||'')+' '+(p.personal_rh?.cedula||'')).toLowerCase();
    if(texto && !nombre.includes(texto)) return false;
    if(estado && p.estado !== estado) return false;
    if(distrito && !(p.distrito_destino||'').toLowerCase().includes(distrito)) return false;
    return true;
  });
  pintarTablaPuestasDisp(filtrado);
}

function toggleTodosCheckPD(master){
  document.querySelectorAll('.chk-pd').forEach(c=>c.checked = master.checked);
}

async function eliminarSeleccionPuestasDisp(){
  const ids = [...document.querySelectorAll('.chk-pd:checked')].map(c=>c.value);
  if(!ids.length){ toast('Selecciona al menos un registro.','error'); return; }
  if(!confirm(`¿Eliminar ${ids.length} oficio(s) seleccionado(s)?`)) return;
  const { error } = await sb.from('puestas_disposicion_rh').delete().in('id', ids);
  if(error){ toast(error.message,'error'); return; }
  toast('Registros eliminados.','exito');
  renderPuestasDisposicion();
}

async function procesarImportacionPD(){
  const archivo = document.getElementById('pd-import-archivo').files[0];
  if(!archivo){ toast('Selecciona el archivo.','error'); return; }

  const btn = document.getElementById('btn-importar-pd');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Procesando…';

  try{
    const filas = await leerArchivoNomina(archivo);
    if(!filas.length) throw new Error('El archivo no contiene filas de datos.');

    const patronesEncabezadoPD = [/cedula/, /nombres?\b.*emplea|^nombres?\b/, /apellidos?\b.*emplea|^apellidos?\b/,
      /fecha/, /destinatario/, /distrito/, /analista|via/, /cargo.*design|design.*cargo/, /motivo/, /estado/];
    const headerIdxPD = detectarFilaEncabezados(filas, patronesEncabezadoPD);
    const headers = filas[headerIdxPD];

    const norm = h => h.toString().toLowerCase().trim()
      .replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u');
    const mapa = {};
    headers.forEach((h,i)=>{
      const n = norm(h);
      if(/cedula/.test(n) && mapa.cedula===undefined) mapa.cedula = i;
      else if(/nombres?\b.*emplea|^nombres?\b/.test(n) && mapa.nombres===undefined) mapa.nombres = i;
      else if(/apellidos?\b.*emplea|^apellidos?\b/.test(n) && mapa.apellidos===undefined) mapa.apellidos = i;
      else if(/fecha/.test(n) && mapa.fecha===undefined) mapa.fecha = i;
      else if(/destinatario\b.*cargo|cargo\b.*destinatario/.test(n) && mapa.destinatarioCargo===undefined) mapa.destinatarioCargo = i;
      else if(/destinatario/.test(n) && mapa.destinatario===undefined) mapa.destinatario = i;
      else if(/distrito/.test(n) && mapa.distrito===undefined) mapa.distrito = i;
      else if(/analista|via/.test(n) && mapa.analista===undefined) mapa.analista = i;
      else if(/cargo.*design|design.*cargo/.test(n) && mapa.cargoDesignado===undefined) mapa.cargoDesignado = i;
      else if(/motivo/.test(n) && mapa.motivo===undefined) mapa.motivo = i;
      else if(/estado/.test(n) && mapa.estado===undefined) mapa.estado = i;
    });
    if(mapa.cedula===undefined){ throw new Error('No se pudo detectar la columna de cédula del empleado.'); }

    const registros = filas.slice(headerIdxPD+1).filter(f=>f[mapa.cedula] && String(f[mapa.cedula]).trim());
    if(!registros.length) throw new Error('No se encontraron filas válidas con cédula.');

    let creados = 0, errores = 0;
    const detalleErrores = [];
    const estadosValidos = ['borrador','enviado','aceptado','rechazado'];

    for(const f of registros){
      try{
        const cedula = String(f[mapa.cedula]).trim();
        let { data: persona } = await sb.from('personal_rh').select('id,nombres,apellidos,sexo,cargo_actual').eq('cedula', cedula).maybeSingle();

        if(!persona){
          const nombres = mapa.nombres!==undefined ? String(f[mapa.nombres]||'').trim() : '';
          const apellidos = mapa.apellidos!==undefined ? String(f[mapa.apellidos]||'').trim() : '';
          if(!nombres){ throw new Error('Empleado no encontrado por cédula y faltan nombres para crearlo.'); }
          const { data: nuevaPersona, error: errPer } = await sb.from('personal_rh')
            .insert({ cedula, nombres, apellidos: apellidos || 'Sin apellido', sexo:'M', estatus:'activo' })
            .select('id,nombres,apellidos,sexo,cargo_actual').single();
          if(errPer) throw errPer;
          persona = nuevaPersona;
        }

        let estado = mapa.estado!==undefined ? String(f[mapa.estado]||'').trim().toLowerCase() : '';
        if(!estadosValidos.includes(estado)) estado = 'borrador';
        const fecha = mapa.fecha!==undefined ? (String(f[mapa.fecha]||'').trim() || new Date().toISOString().slice(0,10)) : new Date().toISOString().slice(0,10);
        const destinatario = mapa.destinatario!==undefined ? (String(f[mapa.destinatario]||'').trim() || '________') : '________';
        const destinatarioCargo = mapa.destinatarioCargo!==undefined ? (String(f[mapa.destinatarioCargo]||'').trim() || 'Director/a Distrital') : 'Director/a Distrital';
        const analista = mapa.analista!==undefined ? String(f[mapa.analista]||'').trim() : '';
        const cargoDesignado = mapa.cargoDesignado!==undefined ? (String(f[mapa.cargoDesignado]||'').trim() || persona.cargo_actual || '________') : (persona.cargo_actual || '________');
        const motivo = mapa.motivo!==undefined ? (String(f[mapa.motivo]||'').trim() || null) : null;

        const texto = generarTextoPuestaDisposicion({
          fecha, destinatarioNombre: destinatario, destinatarioCargo,
          analistaNombre: analista, analistaCargo: 'Analista Recursos Humanos Distrito 16-06',
          asunto: 'Puesta A Disposición',
          candidatoNombre: persona.nombres+' '+persona.apellidos,
          candidatoCedula: cedula, candidatoSexo: persona.sexo, cargoDesignado,
        });

        const { error: errPD } = await sb.from('puestas_disposicion_rh').insert({
          personal_id: persona.id, fecha_oficio: fecha,
          destinatario_nombre: destinatario, destinatario_cargo: destinatarioCargo,
          distrito_destino: mapa.distrito!==undefined ? (String(f[mapa.distrito]||'').trim() || null) : null,
          analista_nombre: analista || null, cargo_designado: cargoDesignado, motivo, estado,
          texto_generado: texto,
        });
        if(errPD) throw errPD;
        creados++;
      }catch(errFila){
        errores++;
        detalleErrores.push(`Fila con cédula "${f[mapa.cedula]||'?'}": ${errFila.message}`);
      }
    }

    document.getElementById('pd-import-resumen-preview').innerHTML = `
      <div class="texto-ayuda" style="margin-top:10px;">
        <strong>${registros.length}</strong> filas procesadas ·
        <span style="color:var(--verde-600);font-weight:600;">${creados} creados</span>
        ${errores ? `· <span style="color:var(--rojo-600);font-weight:600;">${errores} con error</span>` : ''}
        ${detalleErrores.length ? `<br><span style="color:var(--rojo-600);">${detalleErrores.slice(0,5).join('<br>')}</span>` : ''}
      </div>`;

    if(creados){
      toast(`${creados} oficio(s) importado(s) correctamente.`,'exito');
      renderPuestasDisposicion();
    } else {
      toast('No se pudo importar ningún oficio. Revisa los errores.','error');
    }
  }catch(err){
    toast(err.message,'error');
  }finally{
    btn.disabled = false;
    btn.textContent = 'Importar';
  }
}

  return `DISTRITO EDUCATIVO 16-06, BONAO NORDESTE.\nC. / 16 de Agosto, esq. Luperón, 809-296-2126.\n\n`+
`${fechaTexto}.\nBonao, R. D.\nHHRR\n\n`+

`Respetuosamente, nos dirigimos a ese superior despacho para saludarle y a la vez informarle sobre `+
`la aceptación en nuestro Distrito a ${laSenora} ${candidatoNombre}, ${cargoDesignado}, ${portadorA} de la `+

`Muy atentamente,\n\n\nEmeterio Beltre Tineo M.A.\nDirector Distrital 16-06, Bonao Nordeste`;

async function guardarCA(imprimir){
  if(!bloquearGuardado('ca')) return;
  try{
