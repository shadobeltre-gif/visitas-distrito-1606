  const destinatario = document.getElementById('ca-destinatario').value.trim();
  const destinatarioCargo = document.getElementById('ca-destinatario-cargo').value.trim();
  const destinatarioDistrito = document.getElementById('ca-destinatario-distrito').value.trim();
  const cargo = document.getElementById('ca-cargo').value.trim();
  if(!personalId || !destinatario || !destinatarioCargo || !cargo){
    toast('Completa empleado, destinatario, su cargo y el cargo designado.','error'); return;
  }

  const { data: p, error: errP } = await sb.from('personal_rh').select('*').eq('id', personalId).single();
  if(errP){ toast(errP.message,'error'); return; }

  const centroId = document.getElementById('ca-centro-id').value || null;
  const centroNombre = centroId ? document.getElementById('ca-centro').value : null;

  const fecha = document.getElementById('ca-fecha').value || new Date().toISOString().slice(0,10);
  const texto = generarTextoCartaAceptacion({
    fecha, destinatarioNombre: destinatario, destinatarioCargo, destinatarioDistrito,
    analistaNombre: document.getElementById('ca-analista').value,
    analistaCargo: 'Analista Recursos Humanos Distrito 16-06',
    asunto: document.getElementById('ca-asunto').value || 'Aceptación De Personal',
    candidatoNombre: p.nombres+' '+p.apellidos, candidatoCedula: p.cedula, candidatoSexo: p.sexo,
    cargoDesignado: cargo, centroNombre,
  });

  const payload = {
    personal_id: personalId, fecha_oficio: fecha,
    destinatario_nombre: destinatario, destinatario_cargo: destinatarioCargo,
    destinatario_distrito: destinatarioDistrito || null,
    analista_nombre: document.getElementById('ca-analista').value.trim() || null,
    asunto: document.getElementById('ca-asunto').value.trim() || 'Aceptación De Personal',
    cargo_designado: cargo, centro_id: centroId,

  };
  const { error } = await sb.from('cartas_aceptacion_rh').insert(payload);

async function procesarImportacionCA(){
  const archivo = document.getElementById('ca-import-archivo').files[0];
  if(!archivo){ toast('Selecciona el archivo.','error'); return; }

  const btn = document.getElementById('btn-importar-ca');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Procesando…';

  try{
    const filas = await leerArchivoNomina(archivo);
    if(!filas.length) throw new Error('El archivo no contiene filas de datos.');

    const patronesEncabezadoCA = [/cedula/, /nombres?\b.*emplea|^nombres?\b/, /apellidos?\b.*emplea|^apellidos?\b/,
      /fecha/, /procedencia|destinatario/, /analista|via/, /cargo.*design|design.*cargo/, /distrito.*destinatario|destinatario.*distrito/, /centro/, /estado/];
    const headerIdxCA = detectarFilaEncabezados(filas, patronesEncabezadoCA);
    const headers = filas[headerIdxCA];

    const norm = h => h.toString().toLowerCase().trim()
      .replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u');
    const mapa = {};
    headers.forEach((h,i)=>{
      const n = norm(h);
      if(/cedula/.test(n) && mapa.cedula===undefined) mapa.cedula = i;
      else if(/nombres?\b.*emplea|^nombres?\b/.test(n) && mapa.nombres===undefined) mapa.nombres = i;
      else if(/apellidos?\b.*emplea|^apellidos?\b/.test(n) && mapa.apellidos===undefined) mapa.apellidos = i;
      else if(/fecha/.test(n) && mapa.fecha===undefined) mapa.fecha = i;
      else if(/cargo\b.*destinatario|destinatario\b.*cargo/.test(n) && mapa.destinatarioCargo===undefined) mapa.destinatarioCargo = i;
      else if(/distrito.*destinatario|destinatario.*distrito/.test(n) && mapa.destinatarioDistrito===undefined) mapa.destinatarioDistrito = i;
      else if(/procedencia|destinatario/.test(n) && mapa.destinatario===undefined) mapa.destinatario = i;
      else if(/analista|via/.test(n) && mapa.analista===undefined) mapa.analista = i;
      else if(/cargo.*design|design.*cargo/.test(n) && mapa.cargoDesignado===undefined) mapa.cargoDesignado = i;
      else if(/centro/.test(n) && mapa.centro===undefined) mapa.centro = i;
      else if(/estado/.test(n) && mapa.estado===undefined) mapa.estado = i;
    });
    if(mapa.cedula===undefined){ throw new Error('No se pudo detectar la columna de cédula del empleado.'); }

    const registros = filas.slice(headerIdxCA+1).filter(f=>f[mapa.cedula] && String(f[mapa.cedula]).trim());
    if(!registros.length) throw new Error('No se encontraron filas válidas con cédula.');

    let creados = 0, errores = 0;
    const detalleErrores = [];
    const estadosValidos = ['borrador','enviado','confirmado','rechazado'];

    for(const f of registros){
      try{
        const cedula = String(f[mapa.cedula]).trim();
        let { data: persona } = await sb.from('personal_rh').select('id,nombres,apellidos,sexo,cargo_actual').eq('cedula', cedula).maybeSingle();

        if(!persona){
          const nombres = mapa.nombres!==undefined ? String(f[mapa.nombres]||'').trim() : '';
          const apellidos = mapa.apellidos!==undefined ? String(f[mapa.apellidos]||'').trim() : '';
          if(!nombres){ throw new Error('Empleado no encontrado por cédula y faltan nombres para crearlo.'); }
          const { data: nuevaPersona, error: errPer } = await sb.from('personal_rh')
            .insert({ cedula, nombres, apellidos: apellidos || 'Sin apellido', sexo:'M', estatus:'activo' })
            .select('id,nombres,apellidos,sexo,cargo_actual').single();
          if(errPer) throw errPer;
          persona = nuevaPersona;
        }

        let centroId = null;
        const nombreCentro = mapa.centro!==undefined ? String(f[mapa.centro]||'').trim() : '';
        if(nombreCentro){
          const { data: centroExistente } = await sb.from('centros_rh').select('id').eq('nombre_centro', nombreCentro).maybeSingle();
          if(centroExistente){
            centroId = centroExistente.id;
          } else {
            const { data: nuevoCentro, error: errCentro } = await sb.from('centros_rh')
              .insert({ nombre_centro: nombreCentro }).select('id').single();
            if(errCentro) throw errCentro;
            centroId = nuevoCentro.id;
          }
        }

        let estado = mapa.estado!==undefined ? String(f[mapa.estado]||'').trim().toLowerCase() : '';
        if(!estadosValidos.includes(estado)) estado = 'borrador';
        const fecha = mapa.fecha!==undefined ? (String(f[mapa.fecha]||'').trim() || new Date().toISOString().slice(0,10)) : new Date().toISOString().slice(0,10);
        const destinatario = mapa.destinatario!==undefined ? (String(f[mapa.destinatario]||'').trim() || '________') : '________';
        const destinatarioCargo = mapa.destinatarioCargo!==undefined ? (String(f[mapa.destinatarioCargo]||'').trim() || '________') : '________';
        const destinatarioDistrito = mapa.destinatarioDistrito!==undefined ? String(f[mapa.destinatarioDistrito]||'').trim() : '';
        const analista = mapa.analista!==undefined ? String(f[mapa.analista]||'').trim() : '';
        const cargoDesignado = mapa.cargoDesignado!==undefined ? (String(f[mapa.cargoDesignado]||'').trim() || persona.cargo_actual || '________') : (persona.cargo_actual || '________');

        const texto = generarTextoCartaAceptacion({
          fecha, destinatarioNombre: destinatario, destinatarioCargo, destinatarioDistrito,
          analistaNombre: analista, analistaCargo: 'Analista Recursos Humanos Distrito 16-06',
          asunto: 'Aceptación De Personal',
          candidatoNombre: persona.nombres+' '+persona.apellidos,
          candidatoCedula: cedula, candidatoSexo: persona.sexo, cargoDesignado,
          centroNombre: nombreCentro || null,
        });

        const { error: errCA } = await sb.from('cartas_aceptacion_rh').insert({
          personal_id: persona.id, fecha_oficio: fecha,
          destinatario_nombre: destinatario, destinatario_cargo: destinatarioCargo,
          destinatario_distrito: destinatarioDistrito || null,
          analista_nombre: analista || null, cargo_designado: cargoDesignado,
          centro_id: centroId, estado, texto_generado: texto,
        });
        if(errCA) throw errCA;
        creados++;
      }catch(errFila){
        errores++;
        detalleErrores.push(`Fila con cédula "${f[mapa.cedula]||'?'}": ${errFila.message}`);
      }
    }

    document.getElementById('ca-import-resumen-preview').innerHTML = `
      <div class="texto-ayuda" style="margin-top:10px;">
        <strong>${registros.length}</strong> filas procesadas ·
        <span style="color:var(--verde-600);font-weight:600;">${creados} creadas</span>
        ${errores ? `· <span style="color:var(--rojo-600);font-weight:600;">${errores} con error</span>` : ''}
        ${detalleErrores.length ? `<br><span style="color:var(--rojo-600);">${detalleErrores.slice(0,5).join('<br>')}</span>` : ''}
      </div>`;

    if(creados){
      toast(`${creados} carta(s) importada(s) correctamente.`,'exito');
      renderCartasAceptacion();
    } else {
      toast('No se pudo importar ninguna carta. Revisa los errores.','error');
    }
  }catch(err){
    toast(err.message,'error');
  }finally{
    btn.disabled = false;
    btn.textContent = 'Importar';
  }
}

function filtrarVacaciones(){
  const texto = document.getElementById('filtro-vac-texto').value.toLowerCase();
  const estado = document.getElementById('filtro-vac-estado').value;
  const anio = document.getElementById('filtro-vac-anio').value;
  const filtrado = (window._vacacionesData||[]).filter(v=>{
    const nombre = ((v.personal_rh?.nombres||'')+' '+(v.personal_rh?.apellidos||'')+' '+(v.personal_rh?.cedula||'')).toLowerCase();
    if(texto && !nombre.includes(texto)) return false;
    if(estado && v.estado !== estado) return false;
    if(anio && String(v.anio1)!==String(anio) && String(v.anio2)!==String(anio)) return false;
    return true;
  });
  pintarTablaVacaciones(filtrado);
}

// Calcula los años de servicio completos desde la fecha de ingreso del
// empleado hasta la fecha de solicitud, y sugiere automáticamente los
// días de vacaciones según la tabla oficial (editable después).
function calcularAniosServicioVacaciones(){
  const id = document.getElementById('vac-personal-id').value;
  const p = (window._personalCache||[]).find(x=>String(x.id)===String(id));
  const fuenteEl = document.getElementById('vac-fuente-anios');
  const inicioEl = document.getElementById('vac-fecha-inicio');
  if(!inicioEl.value){
    inicioEl.value = document.getElementById('vac-fecha-solicitud').value || new Date().toISOString().slice(0,10);
  }
  if(!p || !p.fecha_ingreso){
    fuenteEl.textContent = p ? 'Este empleado no tiene fecha de ingreso registrada; ingresa los años manualmente.' : '';
    return;
  }
  const fechaSolicitud = document.getElementById('vac-fecha-solicitud').value || new Date().toISOString().slice(0,10);
  const anios = calcularAniosEntreFechas(p.fecha_ingreso, fechaSolicitud);
  document.getElementById('vac-anios-minerd').value = anios;
  fuenteEl.textContent = `Calculado automáticamente desde la fecha de ingreso (${fechaCorta(p.fecha_ingreso)}). Puedes ajustarlo manualmente.`;
  actualizarTotalAniosVacaciones();
  sugerirDiasPorAnios(anios);
}

function calcularAniosEntreFechas(fechaIngreso, fechaHasta){
  const ini = new Date(fechaIngreso+'T00:00:00');
  const fin = new Date(fechaHasta+'T00:00:00');
  let anios = fin.getFullYear() - ini.getFullYear();
  const aniversarioEsteAnio = new Date(fin.getFullYear(), ini.getMonth(), ini.getDate());
  if(fin < aniversarioEsteAnio) anios--;
  return Math.max(anios, 0);
}

function actualizarTotalAniosVacaciones(){
  const minerd = parseFloat(document.getElementById('vac-anios-minerd').value) || 0;
  const otra = parseFloat(document.getElementById('vac-anios-otra').value) || 0;
  document.getElementById('vac-anios-total').value = (minerd + otra) || '';
}

// Sugiere los días de la tabla oficial según los años de servicio del
// empleado, sin sobrescribir si el usuario ya seleccionó "Otro" manual.
function sugerirDiasPorAnios(anios){
  const select1 = document.getElementById('vac-dias1-select');
  if(select1.value === '__manual__') return; // respeta si ya está en modo manual
  let dias = 15;
  if(anios >= 15) dias = 30;
  else if(anios >= 10) dias = 25;
  else if(anios >= 5) dias = 20;
  else dias = 15;
  select1.value = String(dias);
  document.getElementById('vac-dias1').value = dias;
  calcularFechaFinVacaciones();
}

}

// Calcula la fecha de fin sugerida sumando los días laborables solicitados
// (excluyendo sábados y domingos) a partir de la fecha de inicio.
// Calcula el Domingo de Pascua (algoritmo de Gauss) para ubicar los feriados móviles
function calcularPascua(anio){
  const a = anio % 19, b = Math.floor(anio/100), c = anio % 100;
  const d = Math.floor(b/4), e = b%4, f = Math.floor((b+8)/25);
  const g = Math.floor((b-f+1)/3), h = (19*a+b-d-g+15)%30;
  const i = Math.floor(c/4), k = c%4, l = (32+2*e+2*i-h-k)%7;
  const m = Math.floor((a+11*h+22*l)/451);
  const mes = Math.floor((h+l-7*m+114)/31), dia = ((h+l-7*m+114)%31)+1;
  return new Date(anio, mes-1, dia);
}

// Ley 139-97: si el feriado no cae lunes, se traslada al lunes siguiente
function moverALunesSiguiente(fecha){
  const dia = fecha.getDay();
  if(dia === 1) return fecha;
  const diff = (8 - dia) % 7;
  const f = new Date(fecha);
  f.setDate(f.getDate() + diff);
  return f;
}

// Devuelve un Set de fechas (AAAA-MM-DD) feriadas en República Dominicana para un año dado
function obtenerFeriadosRD(anio){
  const iso = f => f.toISOString().slice(0,10);
  const set = new Set();
  set.add(iso(new Date(anio,0,1)));   // Año Nuevo (fijo)
  set.add(iso(new Date(anio,0,6)));   // Día de Reyes (fijo)
  set.add(iso(new Date(anio,0,21)));  // Altagracia (fijo)
  set.add(iso(moverALunesSiguiente(new Date(anio,0,26)))); // Duarte (móvil)
  set.add(iso(new Date(anio,1,27)));  // Independencia (fijo)
  const pascua = calcularPascua(anio);
  const viernesSanto = new Date(pascua); viernesSanto.setDate(pascua.getDate()-2);
  set.add(iso(viernesSanto));         // Viernes Santo (fijo, siempre viernes)
  set.add(iso(moverALunesSiguiente(new Date(anio,4,1))));  // Día del Trabajo (móvil)
  const corpus = new Date(pascua); corpus.setDate(pascua.getDate()+60);
  set.add(iso(moverALunesSiguiente(corpus)));              // Corpus Christi (móvil)
  set.add(iso(moverALunesSiguiente(new Date(anio,7,16)))); // Restauración (móvil)
  set.add(iso(new Date(anio,8,24)));  // Las Mercedes (fijo)
  set.add(iso(moverALunesSiguiente(new Date(anio,10,6)))); // Constitución (móvil)
  set.add(iso(new Date(anio,11,25))); // Navidad (fijo)
  return set;
}

function calcularFechaFinVacaciones(){
  const inicio = document.getElementById('vac-fecha-inicio').value;
  const dias1 = parseInt(document.getElementById('vac-dias1').value) || 0;
  const dias2 = parseInt(document.getElementById('vac-dias2').value) || 0;
  const totalDias = dias1 + dias2;
  if(!inicio || !totalDias){ validarReglasVacaciones(); return; }

  let fecha = new Date(inicio+'T00:00:00');
  const feriadosCache = {};
  const esFeriado = f => {
    const anio = f.getFullYear();
    if(!feriadosCache[anio]) feriadosCache[anio] = obtenerFeriadosRD(anio);
    return feriadosCache[anio].has(f.toISOString().slice(0,10));
  };
  const esLaborable = f => f.getDay()!==0 && f.getDay()!==6 && !esFeriado(f);

  let diasContados = esLaborable(fecha) ? 1 : 0; // el propio día de inicio cuenta si es laborable

  while(diasContados < totalDias){
    fecha.setDate(fecha.getDate() + 1);
    if(esLaborable(fecha)) diasContados++;
  }

  document.getElementById('vac-fecha-fin').value = fecha.toISOString().slice(0,10);
  validarReglasVacaciones();
}

function validarReglasVacaciones(){
  const dias1 = parseInt(document.getElementById('vac-dias1').value)||0;
  const dias2 = parseInt(document.getElementById('vac-dias2').value)||0;
  const totalDias = dias1+dias2;
  actualizarDiasTotalGrande();
  const ini = document.getElementById('vac-fecha-inicio').value;
  const fin = document.getElementById('vac-fecha-fin').value;
  const alertas = [];

  if(totalDias > 20){
    alertas.push('Más de 20 días solicitados: pueden fraccionarse en dos fechas calendario distintas.');
  }
  if(ini && fin){
    const rangoLaborable = diasLaborablesEntreFechas(ini, fin);
    if(rangoLaborable !== totalDias && totalDias > 0){
      alertas.push(`El rango de fechas (${rangoLaborable} día(s) laborable(s)) no coincide con el total de días solicitados (${totalDias}).`);
    }
  }
  if(document.getElementById('vac-pre-post-natal').checked){
    alertas.push('Empleada en licencia pre/post natal: la autorización de estas vacaciones es obligatoria según normativa.');
  }

  document.getElementById('vac-alertas').innerHTML = alertas.length ? alertas.map(a=>
    `<div class="badge badge-amarillo" style="display:block;margin-bottom:6px;white-space:normal;padding:8px 10px;">⚠ ${a}</div>`
  ).join('') : '';
}

// Cuenta días laborables (excluyendo sábados y domingos) entre dos fechas, ambas inclusive.
function diasLaborablesEntreFechas(ini, fin){
  if(!ini || !fin) return 0;
  let fecha = new Date(ini+'T00:00:00');
  const fechaFin = new Date(fin+'T00:00:00');
  if(fecha > fechaFin) return 0;
  let conteo = 0;
  while(fecha <= fechaFin){
    const diaSemana = fecha.getDay();
    if(diaSemana !== 0 && diaSemana !== 6) conteo++;
    fecha.setDate(fecha.getDate() + 1);
  }
  return conteo;
}

async function guardarVacacion(){
  const personalId = document.getElementById('vac-personal-id').value;
  const ini = document.getElementById('vac-fecha-inicio').value;
  const fin = document.getElementById('vac-fecha-fin').value;
  if(!personalId || !ini || !fin){ toast('Selecciona empleado y fechas de disfrute.','error'); return; }

  const payload = {
    personal_id: personalId,
    fecha_solicitud: document.getElementById('vac-fecha-solicitud').value || new Date().toISOString().slice(0,10),
    anios_servicio_minerd: parseFloat(document.getElementById('vac-anios-minerd').value)||null,
    anios_servicio_otra_institucion: parseFloat(document.getElementById('vac-anios-otra').value)||0,
    anios_servicio_total_estado: parseFloat(document.getElementById('vac-anios-total').value)||null,
    dias_solicitados_anio1: parseInt(document.getElementById('vac-dias1').value)||0,
    anio1: parseInt(document.getElementById('vac-anio1').value)||null,
    dias_solicitados_anio2: parseInt(document.getElementById('vac-dias2').value)||0,
    anio2: parseInt(document.getElementById('vac-anio2').value)||null,
    dias_pendientes: parseInt(document.getElementById('vac-dias-pendientes').value)||null,
    fecha_inicio_disfrute: ini, fecha_fin_disfrute: fin,
    comentario: document.getElementById('vac-comentario').value.trim() || null,
    en_licencia_pre_post_natal: document.getElementById('vac-pre-post-natal').checked,
  };
  const { error } = await sb.from('vacaciones_rh').insert(payload);
  if(error){ toast(error.message,'error'); return; }
  toast('Solicitud de vacaciones guardada.','exito');
  cerrarModal('modal-vacacion');

}

function descargarPlantillaVac(){
  if(typeof XLSX === 'undefined'){ toast('No se pudo generar la plantilla.','error'); return; }
  const datos = [
    { 'Cédula del empleado':'001-1234567-8', 'Fecha de solicitud (AAAA-MM-DD)':'2024-04-01',
      'Años servicio MINERD':8, 'Años servicio otra institución':0, 'Días año 1':15, 'Año 1':2024,
      'Días año 2':5, 'Año 2':2025, 'Días pendientes':0, 'Fecha inicio disfrute (AAAA-MM-DD)':'2024-04-10',
      'Fecha fin disfrute (AAAA-MM-DD)':'2024-04-29', 'Comentario':'', 'Pre/post natal (SI/NO)':'NO', 'Estado':'autorizado_rrll' },
  ];
  const ws = XLSX.utils.json_to_sheet(datos);

  XLSX.utils.book_append_sheet(wb, ws, 'Vacaciones');
  XLSX.writeFile(wb, 'plantilla_vacaciones.xlsx');
}

async function procesarImportacionVac(){
  const archivo = document.getElementById('vac-import-archivo').files[0];
  if(!archivo){ toast('Selecciona el archivo.','error'); return; }

  const btn = document.getElementById('btn-importar-vac');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Procesando…';

  try{
    const filas = await leerArchivoNomina(archivo);
    if(!filas.length) throw new Error('El archivo no contiene filas de datos.');

    const patronesEncabezadoVac = [/cedula/, /fecha.*solicitud/, /minerd/, /otra.*instituc/, /dias.*ano\s*1|dias.*a.o\s*1/,
      /^ano\s*1$|^a.o\s*1$/, /dias.*ano\s*2|dias.*a.o\s*2/, /^ano\s*2$|^a.o\s*2$/, /pendient/, /inicio/, /fin/, /comentario/, /natal/, /estado/];
    const headerIdxVac = detectarFilaEncabezados(filas, patronesEncabezadoVac);
    const headers = filas[headerIdxVac];

    const norm = h => h.toString().toLowerCase().trim()
      .replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u');
    const mapa = {};
    headers.forEach((h,i)=>{
      const n = norm(h);
      if(/cedula/.test(n) && mapa.cedula===undefined) mapa.cedula = i;
      else if(/fecha.*solicitud/.test(n) && mapa.fechaSolicitud===undefined) mapa.fechaSolicitud = i;
      else if(/minerd/.test(n) && mapa.aniosMinerd===undefined) mapa.aniosMinerd = i;
      else if(/otra.*instituc/.test(n) && mapa.aniosOtra===undefined) mapa.aniosOtra = i;
      else if(/dias.*ano\s*1|dias.*a.o\s*1/.test(n) && mapa.dias1===undefined) mapa.dias1 = i;
      else if(/^ano\s*1$|^a.o\s*1$/.test(n) && mapa.anio1===undefined) mapa.anio1 = i;
      else if(/dias.*ano\s*2|dias.*a.o\s*2/.test(n) && mapa.dias2===undefined) mapa.dias2 = i;
      else if(/^ano\s*2$|^a.o\s*2$/.test(n) && mapa.anio2===undefined) mapa.anio2 = i;
      else if(/pendient/.test(n) && mapa.pendientes===undefined) mapa.pendientes = i;
      else if(/inicio/.test(n) && mapa.inicio===undefined) mapa.inicio = i;
      else if(/fin/.test(n) && mapa.fin===undefined) mapa.fin = i;
      else if(/comentario/.test(n) && mapa.comentario===undefined) mapa.comentario = i;
      else if(/natal/.test(n) && mapa.natal===undefined) mapa.natal = i;
      else if(/estado/.test(n) && mapa.estado===undefined) mapa.estado = i;
    });
    if(mapa.cedula===undefined){ throw new Error('No se pudo detectar la columna de cédula del empleado.'); }
    if(mapa.inicio===undefined || mapa.fin===undefined){ throw new Error('No se pudo detectar las columnas de fecha de inicio/fin del disfrute.'); }

    const registros = filas.slice(headerIdxVac+1).filter(f=>f[mapa.cedula] && String(f[mapa.cedula]).trim());
    if(!registros.length) throw new Error('No se encontraron filas válidas con cédula.');

    let creados = 0, errores = 0;
    const detalleErrores = [];
    const estadosValidos = ['solicitado','firmado_supervisor','autorizado_rrll','rechazado'];

    for(const f of registros){
      try{
        const cedula = String(f[mapa.cedula]).trim();
        const { data: persona } = await sb.from('personal_rh').select('id').eq('cedula', cedula).maybeSingle();
        if(!persona){ throw new Error('Empleado no encontrado en Personal. Impórtalo primero ahí.'); }

        const inicio = mapa.inicio!==undefined ? String(f[mapa.inicio]||'').trim() : '';
        const fin = mapa.fin!==undefined ? String(f[mapa.fin]||'').trim() : '';
        if(!inicio || !fin){ throw new Error('Faltan fechas de inicio/fin de disfrute.'); }

        let estado = mapa.estado!==undefined ? String(f[mapa.estado]||'').trim().toLowerCase() : '';
        if(!estadosValidos.includes(estado)) estado = 'solicitado';
        const natalTexto = mapa.natal!==undefined ? String(f[mapa.natal]||'').trim().toUpperCase() : '';

        const { error: errVac } = await sb.from('vacaciones_rh').insert({
          personal_id: persona.id,
          fecha_solicitud: mapa.fechaSolicitud!==undefined ? (String(f[mapa.fechaSolicitud]||'').trim() || new Date().toISOString().slice(0,10)) : new Date().toISOString().slice(0,10),
          anios_servicio_minerd: mapa.aniosMinerd!==undefined ? (parseFloat(f[mapa.aniosMinerd])||null) : null,
          anios_servicio_otra_institucion: mapa.aniosOtra!==undefined ? (parseFloat(f[mapa.aniosOtra])||0) : 0,
          dias_solicitados_anio1: mapa.dias1!==undefined ? (parseInt(f[mapa.dias1])||0) : 0,
          anio1: mapa.anio1!==undefined ? (parseInt(f[mapa.anio1])||null) : null,
          dias_solicitados_anio2: mapa.dias2!==undefined ? (parseInt(f[mapa.dias2])||0) : 0,
          anio2: mapa.anio2!==undefined ? (parseInt(f[mapa.anio2])||null) : null,
          dias_pendientes: mapa.pendientes!==undefined ? (parseInt(f[mapa.pendientes])||null) : null,
          fecha_inicio_disfrute: inicio, fecha_fin_disfrute: fin,
          comentario: mapa.comentario!==undefined ? (String(f[mapa.comentario]||'').trim() || null) : null,
          en_licencia_pre_post_natal: natalTexto==='SI'||natalTexto==='SÍ'||natalTexto==='YES'||natalTexto==='TRUE',
          estado,
        });
        if(errVac) throw errVac;
        creados++;
      }catch(errFila){
        errores++;
        detalleErrores.push(`Fila con cédula "${f[mapa.cedula]||'?'}": ${errFila.message}`);
      }
    }

    document.getElementById('vac-import-resumen-preview').innerHTML = `
      <div class="texto-ayuda" style="margin-top:10px;">
        <strong>${registros.length}</strong> filas procesadas ·
        <span style="color:var(--verde-600);font-weight:600;">${creados} creadas</span>
        ${errores ? `· <span style="color:var(--rojo-600);font-weight:600;">${errores} con error</span>` : ''}
        ${detalleErrores.length ? `<br><span style="color:var(--rojo-600);">${detalleErrores.slice(0,5).join('<br>')}</span>` : ''}
      </div>`;

    if(creados){
      toast(`${creados} solicitud(es) de vacaciones importada(s) correctamente.`,'exito');
      renderVacaciones();
    } else {
      toast('No se pudo importar ninguna solicitud. Revisa los errores.','error');
    }
  }catch(err){
    toast(err.message,'error');
  }finally{
    btn.disabled = false;
    btn.textContent = 'Importar';
  }
}

async function cambiarEstadoVacacion(id){
  const v = (window._vacacionesData||[]).find(x=>x.id===id);
  if(!v) return;
  const opciones = ['solicitado','firmado_supervisor','autorizado_rrll','rechazado'];
  const etiquetas = {solicitado:'Solicitado',firmado_supervisor:'Firmado supervisor',autorizado_rrll:'Autorizado RRLL',rechazado:'Rechazado'};
  const idxActual = opciones.indexOf(v.estado);
  const elegido = prompt('Nuevo estado:\n'+opciones.map((o,i)=>`${i+1}. ${etiquetas[o]}`).join('\n'), String(idxActual+1));
  const idx = parseInt(elegido)-1;
  if(isNaN(idx) || !opciones[idx]) return;
  const { error } = await sb.from('vacaciones_rh').update({ estado: opciones[idx] }).eq('id', id);
  if(error){ toast(error.message,'error'); return; }
  toast('Estado actualizado.','exito');
  renderVacaciones();
}

function pintarTablaLP(lista){
  window._lpFiltrado = lista;
  const tbody = document.getElementById('tbody-lp');
  if(!lista || !lista.length){
    tbody.innerHTML = `<tr><td colspan="10"><div class="vacio"><div class="icono-vacio">🗂</div>No hay licencias ni permisos registrados.</div></td></tr>`;
    return;
  }
  tbody.innerHTML = lista.map(x=>`
    <tr>
      <td><input type="checkbox" class="chk-lp" value="${x.id}"></td>
      <td>${escapeHtml((x.personal_rh?.nombres||'')+' '+(x.personal_rh?.apellidos||''))}</td>
      <td>${x.categoria==='licencia'?'Licencia':'Permiso'}</td>
      <td>${escapeHtml(labelSubtipoLP(x.subtipo))}${x.subtipo_detalle?': '+escapeHtml(x.subtipo_detalle):''}</td>

async function procesarImportacionLP(){
  const archivo = document.getElementById('lp-import-archivo').files[0];
  if(!archivo){ toast('Selecciona el archivo.','error'); return; }

  const btn = document.getElementById('btn-importar-lp');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Procesando…';

  try{
    const filas = await leerArchivoNomina(archivo);
    if(!filas.length) throw new Error('El archivo no contiene filas de datos.');

    const patronesEncabezadoLP = [/cedula/, /fecha.*solicitud/, /categoria/, /subtipo$|^subtipo/, /detalle/, /^dias$/,
      /^meses$/, /^anos$|^a.os$/, /inicio/, /^fecha fin$|fin\)/, /comentario/, /evidencia/, /estado/];
    const headerIdxLP = detectarFilaEncabezados(filas, patronesEncabezadoLP);
    const headers = filas[headerIdxLP];

    const norm = h => h.toString().toLowerCase().trim()
      .replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u');
    const mapa = {};
    headers.forEach((h,i)=>{
      const n = norm(h);
      if(/cedula/.test(n) && mapa.cedula===undefined) mapa.cedula = i;
      else if(/fecha.*solicitud/.test(n) && mapa.fechaSolicitud===undefined) mapa.fechaSolicitud = i;
      else if(/categoria/.test(n) && mapa.categoria===undefined) mapa.categoria = i;
      else if(/subtipo$|^subtipo/.test(n) && !/detalle/.test(n) && mapa.subtipo===undefined) mapa.subtipo = i;
      else if(/detalle/.test(n) && mapa.detalle===undefined) mapa.detalle = i;
      else if(/^dias$/.test(n) && mapa.dias===undefined) mapa.dias = i;
      else if(/^meses$/.test(n) && mapa.meses===undefined) mapa.meses = i;
      else if(/^anos$|^a.os$/.test(n) && mapa.anios===undefined) mapa.anios = i;
      else if(/inicio/.test(n) && mapa.inicio===undefined) mapa.inicio = i;
      else if(/^fecha fin$|fin\)/.test(n) && mapa.fin===undefined) mapa.fin = i;
      else if(/comentario/.test(n) && mapa.comentario===undefined) mapa.comentario = i;
      else if(/evidencia/.test(n) && mapa.evidencia===undefined) mapa.evidencia = i;
      else if(/estado/.test(n) && mapa.estado===undefined) mapa.estado = i;
    });
    if(mapa.cedula===undefined){ throw new Error('No se pudo detectar la columna de cédula del empleado.'); }
    if(mapa.categoria===undefined || mapa.subtipo===undefined){ throw new Error('No se pudo detectar las columnas de categoría/subtipo.'); }

    const registros = filas.slice(headerIdxLP+1).filter(f=>f[mapa.cedula] && String(f[mapa.cedula]).trim());
    if(!registros.length) throw new Error('No se encontraron filas válidas con cédula.');

    let creados = 0, errores = 0;
    const detalleErrores = [];
    const estadosValidos = ['solicitado','aprobado_supervisor','rechazado'];
    const subtiposValidos = [...SUBTIPOS_LICENCIA, ...SUBTIPOS_PERMISO];

    for(const f of registros){
      try{
        const cedula = String(f[mapa.cedula]).trim();
        const { data: persona } = await sb.from('personal_rh').select('id').eq('cedula', cedula).maybeSingle();
        if(!persona){ throw new Error('Empleado no encontrado en Personal. Impórtalo primero ahí.'); }

        const categoria = String(f[mapa.categoria]||'').trim().toLowerCase();
        if(categoria !== 'licencia' && categoria !== 'permiso'){ throw new Error('Categoría debe ser "licencia" o "permiso".'); }

        const subtipo = String(f[mapa.subtipo]||'').trim().toUpperCase().replace(/\s+/g,'_');
        const subtipoRef = subtiposValidos.find(s=>s[0]===subtipo);
        if(!subtipoRef){ throw new Error(`Subtipo "${subtipo}" no es válido. Revisa la hoja "Valores válidos para Subtipo".`); }

        let estado = mapa.estado!==undefined ? String(f[mapa.estado]||'').trim().toLowerCase() : '';
        if(!estadosValidos.includes(estado)) estado = 'solicitado';
        const evidenciaTexto = mapa.evidencia!==undefined ? String(f[mapa.evidencia]||'').trim().toUpperCase() : '';

        const { error: errLP } = await sb.from('licencias_permisos_rh').insert({
          personal_id: persona.id,
          fecha_solicitud: mapa.fechaSolicitud!==undefined ? (String(f[mapa.fechaSolicitud]||'').trim() || new Date().toISOString().slice(0,10)) : new Date().toISOString().slice(0,10),
          categoria, subtipo,
          subtipo_detalle: mapa.detalle!==undefined ? (String(f[mapa.detalle]||'').trim() || null) : null,
          duracion_dias: mapa.dias!==undefined ? (parseInt(f[mapa.dias])||0) : 0,
          duracion_meses: mapa.meses!==undefined ? (parseInt(f[mapa.meses])||0) : 0,
          duracion_anios: mapa.anios!==undefined ? (parseInt(f[mapa.anios])||0) : 0,
          fecha_inicio: mapa.inicio!==undefined ? (String(f[mapa.inicio]||'').trim() || null) : null,
          fecha_fin: mapa.fin!==undefined ? (String(f[mapa.fin]||'').trim() || null) : null,
          comentario: mapa.comentario!==undefined ? (String(f[mapa.comentario]||'').trim() || null) : null,
          evidencia_requerida: subtipoRef[2],
          evidencia_presentada: evidenciaTexto==='SI'||evidenciaTexto==='SÍ'||evidenciaTexto==='YES'||evidenciaTexto==='TRUE',
          estado,
        });
        if(errLP) throw errLP;
        creados++;
      }catch(errFila){
        errores++;
        detalleErrores.push(`Fila con cédula "${f[mapa.cedula]||'?'}": ${errFila.message}`);
      }
    }

    document.getElementById('lp-import-resumen-preview').innerHTML = `
      <div class="texto-ayuda" style="margin-top:10px;">
        <strong>${registros.length}</strong> filas procesadas ·
        <span style="color:var(--verde-600);font-weight:600;">${creados} creadas</span>
        ${errores ? `· <span style="color:var(--rojo-600);font-weight:600;">${errores} con error</span>` : ''}
        ${detalleErrores.length ? `<br><span style="color:var(--rojo-600);">${detalleErrores.slice(0,5).join('<br>')}</span>` : ''}
      </div>`;

    if(creados){
      toast(`${creados} solicitud(es) importada(s) correctamente.`,'exito');
      renderLicenciasPermisos();
    } else {
      toast('No se pudo importar ninguna solicitud. Revisa los errores.','error');
    }
  }catch(err){
    toast(err.message,'error');
  }finally{
    btn.disabled = false;
    btn.textContent = 'Importar';
  }
}

async function cambiarEstadoLP(id){
  const opciones = ['solicitado','aprobado_supervisor','rechazado'];
  const etiquetas = {solicitado:'Solicitado',aprobado_supervisor:'Aprobado supervisor',rechazado:'Rechazado'};
  const x = (window._licenciasPermisosData||[]).find(r=>r.id===id);
  if(!x) return;
  const idxActual = opciones.indexOf(x.estado);
  const elegido = prompt('Nuevo estado:\n'+opciones.map((o,i)=>`${i+1}. ${etiquetas[o]}`).join('\n'), String(idxActual+1));
  const idx = parseInt(elegido)-1;
  if(isNaN(idx) || !opciones[idx]) return;
  const { error } = await sb.from('licencias_permisos_rh').update({ estado: opciones[idx] }).eq('id', id);
  if(error){ toast(error.message,'error'); return; }
  toast('Estado actualizado.','exito');
  renderLicenciasPermisos();
}

function pintarTablaRiesgos(lista){
  window._riesgosFiltrado = lista;
  const tbody = document.getElementById('tbody-riesgos');
  if(!lista || !lista.length){
    tbody.innerHTML = `<tr><td colspan="8"><div class="vacio"><div class="icono-vacio">⚠</div>No hay avisos de riesgo laboral registrados.</div></td></tr>`;
    return;
  }
  tbody.innerHTML = lista.map(r=>{
    const horas = (new Date(r.fecha_aviso) - new Date(r.fecha_evento)) / 36e5;
    const dentroPlazo = horas <= 72;
    return `
    <tr>
      <td><input type="checkbox" class="chk-rl" value="${r.id}"></td>
      <td><span class="badge ${r.tipo_formulario==='ATR-2'?'badge-azul':'badge-amarillo'}">${r.tipo_formulario}</span></td>
      <td>${escapeHtml((r.personal_rh?.nombres||'')+' '+(r.personal_rh?.apellidos||''))}</td>
      <td>${fechaCorta(r.fecha_evento)}</td>
      <td>${fechaCorta(r.fecha_aviso)}</td>
      <td>${dentroPlazo?'<span class="badge badge-verde">Dentro</span>':'<span class="badge badge-rojo">Fuera</span>'}</td>
      <td>${badgeEstado(r.estado)}</td>
      <td><button class="btn btn-secundario btn-chico" onclick="cambiarEstadoRiesgo(${r.id})">Estado</button></td>
    </tr>`;
  }).join('');
}

function filtrarRiesgos(){
  const texto = document.getElementById('filtro-rl-texto').value.toLowerCase();
  const tipo = document.getElementById('filtro-rl-tipo').value;
  const estado = document.getElementById('filtro-rl-estado').value;
  const filtrado = (window._riesgosData||[]).filter(r=>{
    const nombre = ((r.personal_rh?.nombres||'')+' '+(r.personal_rh?.apellidos||'')+' '+(r.personal_rh?.cedula||'')).toLowerCase();
    if(texto && !nombre.includes(texto)) return false;
    if(tipo && r.tipo_formulario !== tipo) return false;
    if(estado && r.estado !== estado) return false;
    return true;
  });
  pintarTablaRiesgos(filtrado);
}

function validarPlazoRiesgo(){
  const fEvento = document.getElementById('rl-fecha-evento').value;
  const fAviso = document.getElementById('rl-fecha-aviso').value;
  const alertaEl = document.getElementById('rl-alerta-plazo');
  if(!fEvento || !fAviso){ alertaEl.innerHTML=''; return; }
  const horas = (new Date(fAviso) - new Date(fEvento)) / 36e5;
  if(horas > 72){
    alertaEl.innerHTML = `<div class="badge badge-rojo" style="display:block;white-space:normal;padding:8px 10px;">⚠ El aviso se está registrando fuera del plazo de 72 horas posteriores al evento.</div>`;
  } else if(horas >= 0){
    alertaEl.innerHTML = `<div class="badge badge-verde" style="display:block;white-space:normal;padding:8px 10px;">✓ Dentro del plazo de 72 horas.</div>`;
  } else {
    alertaEl.innerHTML = '';
  }
}

async function procesarImportacionRL(){
  const archivo = document.getElementById('rl-import-archivo').files[0];
  if(!archivo){ toast('Selecciona el archivo.','error'); return; }

  const btn = document.getElementById('btn-importar-rl');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Procesando…';

  try{
    const filas = await leerArchivoNomina(archivo);
    if(!filas.length) throw new Error('El archivo no contiene filas de datos.');

    const patronesEncabezadoRL = [/cedula/, /tipo/, /evento/, /aviso/, /descripcion/, /lugar/, /centro/,
      /certificado/, /policial/, /firmado/, /estado/];
    const headerIdxRL = detectarFilaEncabezados(filas, patronesEncabezadoRL);
    const headers = filas[headerIdxRL];

    const norm = h => h.toString().toLowerCase().trim()
      .replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u');
    const mapa = {};
    headers.forEach((h,i)=>{
      const n = norm(h);
      if(/cedula/.test(n) && mapa.cedula===undefined) mapa.cedula = i;
      else if(/tipo/.test(n) && mapa.tipo===undefined) mapa.tipo = i;
      else if(/evento/.test(n) && mapa.fechaEvento===undefined) mapa.fechaEvento = i;
      else if(/aviso/.test(n) && mapa.fechaAviso===undefined) mapa.fechaAviso = i;
      else if(/descripcion/.test(n) && mapa.descripcion===undefined) mapa.descripcion = i;
      else if(/lugar/.test(n) && mapa.lugar===undefined) mapa.lugar = i;
      else if(/centro/.test(n) && mapa.centro===undefined) mapa.centro = i;
      else if(/certificado/.test(n) && mapa.certMedico===undefined) mapa.certMedico = i;
      else if(/policial/.test(n) && mapa.actaPolicial===undefined) mapa.actaPolicial = i;
      else if(/firmado/.test(n) && mapa.firmado===undefined) mapa.firmado = i;
      else if(/estado/.test(n) && mapa.estado===undefined) mapa.estado = i;
    });
    if(mapa.cedula===undefined){ throw new Error('No se pudo detectar la columna de cédula del empleado.'); }
    if(mapa.tipo===undefined || mapa.fechaEvento===undefined || mapa.descripcion===undefined){
      throw new Error('No se pudo detectar las columnas de tipo, fecha del evento o descripción.');
    }

    const registros = filas.slice(headerIdxRL+1).filter(f=>f[mapa.cedula] && String(f[mapa.cedula]).trim());
    if(!registros.length) throw new Error('No se encontraron filas válidas con cédula.');

    let creados = 0, errores = 0;
    const detalleErrores = [];
    const esSiNo = v => { const t = String(v||'').trim().toUpperCase(); return t==='SI'||t==='SÍ'||t==='YES'||t==='TRUE'; };
    const estadosValidos = ['notificado','enviado_sisalril','calificado_AT_EP','rechazado'];

    for(const f of registros){
      try{
        const cedula = String(f[mapa.cedula]).trim();
        const { data: persona } = await sb.from('personal_rh').select('id').eq('cedula', cedula).maybeSingle();
        if(!persona){ throw new Error('Empleado no encontrado en Personal. Impórtalo primero ahí.'); }

        const tipo = String(f[mapa.tipo]||'').trim().toUpperCase();
        if(tipo !== 'ATR-2' && tipo !== 'EPR-1'){ throw new Error('Tipo debe ser "ATR-2" o "EPR-1".'); }

        const fechaEvento = String(f[mapa.fechaEvento]||'').trim();
        const descripcion = String(f[mapa.descripcion]||'').trim();
        if(!fechaEvento || !descripcion){ throw new Error('Faltan fecha del evento o descripción.'); }

        let centroId = null;
        const nombreCentro = mapa.centro!==undefined ? String(f[mapa.centro]||'').trim() : '';
        if(nombreCentro){
          const { data: centroExistente } = await sb.from('centros_rh').select('id').eq('nombre_centro', nombreCentro).maybeSingle();
          centroId = centroExistente ? centroExistente.id : null;
        }

        let estado = mapa.estado!==undefined ? String(f[mapa.estado]||'').trim().toLowerCase() : '';
        if(!estadosValidos.includes(estado)) estado = 'notificado';

        const { error: errRL } = await sb.from('riesgos_laborales_rh').insert({
          personal_id: persona.id, tipo_formulario: tipo,
          centro_id: centroId,
          fecha_evento: fechaEvento,
          fecha_aviso: mapa.fechaAviso!==undefined ? (String(f[mapa.fechaAviso]||'').trim() || new Date().toISOString().slice(0,10)) : new Date().toISOString().slice(0,10),
          descripcion_evento: descripcion,
          lugar_evento: mapa.lugar!==undefined ? (String(f[mapa.lugar]||'').trim() || null) : null,
          tiene_certificado_medico: mapa.certMedico!==undefined ? esSiNo(f[mapa.certMedico]) : false,
          tiene_acta_policial: mapa.actaPolicial!==undefined ? esSiNo(f[mapa.actaPolicial]) : false,
          formulario_firmado_rrhh: mapa.firmado!==undefined ? esSiNo(f[mapa.firmado]) : false,
          estado,
        });
        if(errRL) throw errRL;
        creados++;
      }catch(errFila){
        errores++;
        detalleErrores.push(`Fila con cédula "${f[mapa.cedula]||'?'}": ${errFila.message}`);
      }
    }

    document.getElementById('rl-import-resumen-preview').innerHTML = `
      <div class="texto-ayuda" style="margin-top:10px;">
        <strong>${registros.length}</strong> filas procesadas ·
        <span style="color:var(--verde-600);font-weight:600;">${creados} creados</span>
        ${errores ? `· <span style="color:var(--rojo-600);font-weight:600;">${errores} con error</span>` : ''}
        ${detalleErrores.length ? `<br><span style="color:var(--rojo-600);">${detalleErrores.slice(0,5).join('<br>')}</span>` : ''}
      </div>`;

    if(creados){
      toast(`${creados} aviso(s) importado(s) correctamente.`,'exito');
      renderRiesgosLaborales();
    } else {
      toast('No se pudo importar ningún aviso. Revisa los errores.','error');
    }
  }catch(err){
    toast(err.message,'error');
  }finally{
    btn.disabled = false;
    btn.textContent = 'Importar';
  }
}

async function cambiarEstadoRiesgo(id){
  const opciones = ['notificado','enviado_sisalril','calificado_AT_EP','rechazado'];
  const etiquetas = {notificado:'Notificado',enviado_sisalril:'Enviado SISALRIL',calificado_AT_EP:'Calificado AT/EP',rechazado:'Rechazado'};
  const r = (window._riesgosData||[]).find(x=>x.id===id);
  if(!r) return;
  const idxActual = opciones.indexOf(r.estado);
  const elegido = prompt('Nuevo estado:\n'+opciones.map((o,i)=>`${i+1}. ${etiquetas[o]}`).join('\n'), String(idxActual+1));
  const idx = parseInt(elegido)-1;
  if(isNaN(idx) || !opciones[idx]) return;
  const { error } = await sb.from('riesgos_laborales_rh').update({ estado: opciones[idx] }).eq('id', id);
  if(error){ toast(error.message,'error'); return; }
  toast('Estado actualizado.','exito');
  renderRiesgosLaborales();
}

function pintarTablaPensiones(lista){
  window._pensionesFiltrado = lista;
  const tbody = document.getElementById('tbody-pensiones');
  if(!lista || !lista.length){
    tbody.innerHTML = `<tr><td colspan="8"><div class="vacio"><div class="icono-vacio">🎓</div>No hay expedientes de pensión registrados.</div></td></tr>`;
    return;
  }
  const labelTipoPension = {tiempo_servicio:'Tiempo de servicio',discapacidad:'Discapacidad',sobrevivencia:'Sobrevivencia',otra:'Otra'};
  tbody.innerHTML = lista.map(p=>{
    const items = [p.tiene_certificacion_trabajo,p.tiene_certificacion_contraloria,p.tiene_comunicacion_ministro,p.tiene_copia_cedula,p.tiene_fotos];
    const completos = items.filter(Boolean).length;
    return `
    <tr>

      <td>${escapeHtml((p.personal_rh?.nombres||'')+' '+(p.personal_rh?.apellidos||''))}</td>
      <td>${p.tipo_personal==='docente'?'Docente':'Administrativo'}</td>
      <td>${labelTipoPension[p.tipo_pension]||p.tipo_pension}</td>
      <td>${p.anios_servicio??'—'}</td>

      <td>${badgeEstado(p.estado)}</td>
      <td><button class="btn btn-secundario btn-chico" onclick="cambiarEstadoPension(${p.id})">Estado</button></td>
    </tr>`;
  }).join('');
}

function filtrarPensiones(){
  const texto = document.getElementById('filtro-pen-texto').value.toLowerCase();
  const tipo = document.getElementById('filtro-pen-tipo').value;
  const estado = document.getElementById('filtro-pen-estado').value;
  const filtrado = (window._pensionesData||[]).filter(p=>{
    const nombre = ((p.personal_rh?.nombres||'')+' '+(p.personal_rh?.apellidos||'')+' '+(p.personal_rh?.cedula||'')).toLowerCase();
    if(texto && !nombre.includes(texto)) return false;
    if(tipo && p.tipo_personal !== tipo) return false;
    if(estado && p.estado !== estado) return false;
    return true;
  });
  pintarTablaPensiones(filtrado);
}

function calcularFechaFinLP(){
  const inicio = document.getElementById('lp-fecha-inicio').value;
  if(!inicio) return;
  const dias = parseInt(document.getElementById('lp-dias').value)||0;
  const meses = parseInt(document.getElementById('lp-meses').value)||0;
  const anios = parseInt(document.getElementById('lp-anios').value)||0;
  if(!dias && !meses && !anios) return;
  const f = new Date(inicio+'T00:00:00');
  f.setFullYear(f.getFullYear()+anios);
  f.setMonth(f.getMonth()+meses);
  f.setDate(f.getDate()+dias);
  document.getElementById('lp-fecha-fin').value = f.toISOString().slice(0,10);
}

async function procesarImportacionPen(){
  const archivo = document.getElementById('pen-import-archivo').files[0];
  if(!archivo){ toast('Selecciona el archivo.','error'); return; }

  const btn = document.getElementById('btn-importar-pen');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Procesando…';

  try{
    const filas = await leerArchivoNomina(archivo);
    if(!filas.length) throw new Error('El archivo no contiene filas de datos.');

    const patronesEncabezadoPen = [/cedula/, /tipo.*personal/, /tipo.*pension/, /fecha.*solicitud/, /anos.*servicio|a.os.*servicio/,
      /ingreso/, /certificacion.*trabajo/, /contraloria/, /ministro/, /cedula.*si.*no|copia.*cedula/, /foto/, /estado/, /observ/];
    const headerIdxPen = detectarFilaEncabezados(filas, patronesEncabezadoPen);
    const headers = filas[headerIdxPen];

    const norm = h => h.toString().toLowerCase().trim()
      .replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u');
    const mapa = {};
    headers.forEach((h,i)=>{
      const n = norm(h);
      if(/cedula/.test(n) && mapa.cedula===undefined) mapa.cedula = i;
      else if(/tipo.*personal/.test(n) && mapa.tipoPersonal===undefined) mapa.tipoPersonal = i;
      else if(/tipo.*pension/.test(n) && mapa.tipoPension===undefined) mapa.tipoPension = i;
      else if(/fecha.*solicitud/.test(n) && mapa.fechaSolicitud===undefined) mapa.fechaSolicitud = i;
      else if(/anos.*servicio|a.os.*servicio/.test(n) && mapa.anios===undefined) mapa.anios = i;
      else if(/ingreso/.test(n) && mapa.fechaIngreso===undefined) mapa.fechaIngreso = i;
      else if(/certificacion.*trabajo/.test(n) && mapa.certTrabajo===undefined) mapa.certTrabajo = i;
      else if(/contraloria/.test(n) && mapa.certContraloria===undefined) mapa.certContraloria = i;
      else if(/ministro/.test(n) && mapa.comunicacionMin===undefined) mapa.comunicacionMin = i;
      else if(/cedula.*si.*no|copia.*cedula/.test(n) && mapa.copiaCedula===undefined) mapa.copiaCedula = i;
      else if(/foto/.test(n) && mapa.fotos===undefined) mapa.fotos = i;
      else if(/estado/.test(n) && mapa.estado===undefined) mapa.estado = i;
      else if(/observ/.test(n) && mapa.observaciones===undefined) mapa.observaciones = i;
    });
    if(mapa.cedula===undefined){ throw new Error('No se pudo detectar la columna de cédula del empleado.'); }
    if(mapa.tipoPersonal===undefined){ throw new Error('No se pudo detectar la columna de tipo de personal.'); }

    const registros = filas.slice(headerIdxPen+1).filter(f=>f[mapa.cedula] && String(f[mapa.cedula]).trim());
    if(!registros.length) throw new Error('No se encontraron filas válidas con cédula.');

    let creados = 0, errores = 0;
    const detalleErrores = [];
    const esSiNo = v => { const t = String(v||'').trim().toUpperCase(); return t==='SI'||t==='SÍ'||t==='YES'||t==='TRUE'; };
    const estadosValidos = ['armando_expediente','enviado_minerd','enviado_inabima','decreto_promulgado','rechazado'];
    const tiposPensionValidos = ['tiempo_servicio','discapacidad','sobrevivencia','otra'];

    for(const f of registros){
      try{
        const cedula = String(f[mapa.cedula]).trim();
        const { data: persona } = await sb.from('personal_rh').select('id').eq('cedula', cedula).maybeSingle();
        if(!persona){ throw new Error('Empleado no encontrado en Personal. Impórtalo primero ahí.'); }

        const tipoPersonal = String(f[mapa.tipoPersonal]||'').trim().toLowerCase();
        if(tipoPersonal !== 'docente' && tipoPersonal !== 'administrativo'){
          throw new Error('Tipo de personal debe ser "docente" o "administrativo".');
        }

        let tipoPension = mapa.tipoPension!==undefined ? String(f[mapa.tipoPension]||'').trim().toLowerCase() : 'tiempo_servicio';
        if(!tiposPensionValidos.includes(tipoPension)) tipoPension = 'tiempo_servicio';

        let estado = mapa.estado!==undefined ? String(f[mapa.estado]||'').trim().toLowerCase() : '';
        if(!estadosValidos.includes(estado)) estado = 'armando_expediente';

        const { error: errPen } = await sb.from('pensiones_rh').insert({
          personal_id: persona.id, tipo_personal: tipoPersonal, tipo_pension: tipoPension,
          fecha_solicitud: mapa.fechaSolicitud!==undefined ? (String(f[mapa.fechaSolicitud]||'').trim() || new Date().toISOString().slice(0,10)) : new Date().toISOString().slice(0,10),
          anios_servicio: mapa.anios!==undefined ? (parseFloat(f[mapa.anios])||null) : null,
          fecha_ingreso_minerd: mapa.fechaIngreso!==undefined ? (String(f[mapa.fechaIngreso]||'').trim() || null) : null,
          tiene_certificacion_trabajo: mapa.certTrabajo!==undefined ? esSiNo(f[mapa.certTrabajo]) : false,
          tiene_certificacion_contraloria: mapa.certContraloria!==undefined ? esSiNo(f[mapa.certContraloria]) : false,
          tiene_comunicacion_ministro: mapa.comunicacionMin!==undefined ? esSiNo(f[mapa.comunicacionMin]) : false,
          tiene_copia_cedula: mapa.copiaCedula!==undefined ? esSiNo(f[mapa.copiaCedula]) : false,
          tiene_fotos: mapa.fotos!==undefined ? esSiNo(f[mapa.fotos]) : false,
          estado,
          observaciones: mapa.observaciones!==undefined ? (String(f[mapa.observaciones]||'').trim() || null) : null,
        });
        if(errPen) throw errPen;
        creados++;
      }catch(errFila){
        errores++;
        detalleErrores.push(`Fila con cédula "${f[mapa.cedula]||'?'}": ${errFila.message}`);
      }
    }

    document.getElementById('pen-import-resumen-preview').innerHTML = `
      <div class="texto-ayuda" style="margin-top:10px;">
        <strong>${registros.length}</strong> filas procesadas ·
        <span style="color:var(--verde-600);font-weight:600;">${creados} creados</span>
        ${errores ? `· <span style="color:var(--rojo-600);font-weight:600;">${errores} con error</span>` : ''}
        ${detalleErrores.length ? `<br><span style="color:var(--rojo-600);">${detalleErrores.slice(0,5).join('<br>')}</span>` : ''}
      </div>`;

    if(creados){
      toast(`${creados} expediente(s) importado(s) correctamente.`,'exito');
      renderPensiones();
    } else {
      toast('No se pudo importar ningún expediente. Revisa los errores.','error');
    }
  }catch(err){
    toast(err.message,'error');
  }finally{
    btn.disabled = false;
    btn.textContent = 'Importar';
  }
}

async function cambiarEstadoPension(id){
  const opciones = ['armando_expediente','enviado_minerd','enviado_inabima','decreto_promulgado','rechazado'];
  const etiquetas = {armando_expediente:'Armando expediente',enviado_minerd:'Enviado MINERD',enviado_inabima:'Enviado INABIMA',decreto_promulgado:'Decreto promulgado',rechazado:'Rechazado'};
  const p = (window._pensionesData||[]).find(x=>x.id===id);
  if(!p) return;
  const idxActual = opciones.indexOf(p.estado);
  const elegido = prompt('Nuevo estado:\n'+opciones.map((o,i)=>`${i+1}. ${etiquetas[o]}`).join('\n'), String(idxActual+1));
  const idx = parseInt(elegido)-1;
  if(isNaN(idx) || !opciones[idx]) return;
  const { error } = await sb.from('pensiones_rh').update({ estado: opciones[idx] }).eq('id', id);
  if(error){ toast(error.message,'error'); return; }
  toast('Estado actualizado.','exito');
  renderPensiones();
}

function filtrarSeguros(){
  const texto = document.getElementById('filtro-seg-texto').value.toLowerCase();
  const tipo = document.getElementById('filtro-seg-tipo').value;
  const estado = document.getElementById('filtro-seg-estado').value;
  const filtrado = (window._segurosData||[]).filter(s=>{
    const nombre = ((s.personal_rh?.nombres||'')+' '+(s.personal_rh?.apellidos||'')+' '+(s.personal_rh?.cedula||'')).toLowerCase();
    if(texto && !nombre.includes(texto)) return false;
    if(tipo && s.tipo_formulario !== tipo) return false;
    if(estado && s.estado !== estado) return false;
    return true;
  });
  pintarTablaSeguros(filtrado);
}

async function procesarImportacionSeg(){
  const archivo = document.getElementById('seg-import-archivo').files[0];
  if(!archivo){ toast('Selecciona el archivo.','error'); return; }

  const btn = document.getElementById('btn-importar-seg');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Procesando…';

  try{
    const filas = await leerArchivoNomina(archivo);
    if(!filas.length) throw new Error('El archivo no contiene filas de datos.');

    const patronesEncabezadoSeg = [/cedula.*titular|^cedula$/, /tipo/, /fecha/, /nombre.*dependiente/, /parentesco/,
      /cedula.*dependiente/, /copia.*cedula/, /acta/, /certificacion.*estudio/, /descuento/, /estado/, /observ/];
    const headerIdxSeg = detectarFilaEncabezados(filas, patronesEncabezadoSeg);
    const headers = filas[headerIdxSeg];

    const norm = h => h.toString().toLowerCase().trim()
      .replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u');
    const mapa = {};
    headers.forEach((h,i)=>{
      const n = norm(h);
      if(/cedula.*titular|^cedula$/.test(n) && mapa.cedula===undefined) mapa.cedula = i;
      else if(/tipo/.test(n) && mapa.tipo===undefined) mapa.tipo = i;
      else if(/fecha/.test(n) && mapa.fecha===undefined) mapa.fecha = i;
      else if(/nombre.*dependiente/.test(n) && mapa.nombreDep===undefined) mapa.nombreDep = i;
      else if(/parentesco/.test(n) && mapa.parentesco===undefined) mapa.parentesco = i;
      else if(/cedula.*dependiente/.test(n) && mapa.cedulaDep===undefined) mapa.cedulaDep = i;
      else if(/copia.*cedula/.test(n) && mapa.copiaCedula===undefined) mapa.copiaCedula = i;
      else if(/acta/.test(n) && mapa.actaNac===undefined) mapa.actaNac = i;
      else if(/certificacion.*estudio/.test(n) && mapa.certEstudio===undefined) mapa.certEstudio = i;
      else if(/descuento/.test(n) && mapa.formDescuento===undefined) mapa.formDescuento = i;
      else if(/estado/.test(n) && mapa.estado===undefined) mapa.estado = i;
      else if(/observ/.test(n) && mapa.observaciones===undefined) mapa.observaciones = i;
    });
    if(mapa.cedula===undefined){ throw new Error('No se pudo detectar la columna de cédula del titular.'); }
    if(mapa.tipo===undefined){ throw new Error('No se pudo detectar la columna de tipo (F1/F2).'); }

    const registros = filas.slice(headerIdxSeg+1).filter(f=>f[mapa.cedula] && String(f[mapa.cedula]).trim());
    if(!registros.length) throw new Error('No se encontraron filas válidas con cédula.');

    let creados = 0, errores = 0;
    const detalleErrores = [];
    const esSiNo = v => { const t = String(v||'').trim().toUpperCase(); return t==='SI'||t==='SÍ'||t==='YES'||t==='TRUE'; };
    const estadosValidos = ['solicitado','depositado_nomina','aprobado','rechazado'];
    const parentescosValidos = ['conyuge','hijo_a','hijastro_a','padre','madre','suegro_a'];

    for(const f of registros){
      try{
        const cedula = String(f[mapa.cedula]).trim();
        const { data: persona } = await sb.from('personal_rh').select('id').eq('cedula', cedula).maybeSingle();
        if(!persona){ throw new Error('Empleado titular no encontrado en Personal. Impórtalo primero ahí.'); }

        const tipo = String(f[mapa.tipo]||'').trim().toUpperCase();
        if(tipo !== 'F1' && tipo !== 'F2'){ throw new Error('Tipo debe ser "F1" o "F2".'); }

        let parentesco = mapa.parentesco!==undefined ? String(f[mapa.parentesco]||'').trim().toLowerCase() : '';
        if(parentesco && !parentescosValidos.includes(parentesco)) parentesco = null;

        let estado = mapa.estado!==undefined ? String(f[mapa.estado]||'').trim().toLowerCase() : '';
        if(!estadosValidos.includes(estado)) estado = 'solicitado';

        const { error: errSeg } = await sb.from('seguros_salud_rh').insert({
          personal_id: persona.id, tipo_formulario: tipo,
          fecha_solicitud: mapa.fecha!==undefined ? (String(f[mapa.fecha]||'').trim() || new Date().toISOString().slice(0,10)) : new Date().toISOString().slice(0,10),
          nombre_dependiente: mapa.nombreDep!==undefined ? (String(f[mapa.nombreDep]||'').trim() || null) : null,
          parentesco: parentesco || null,
          cedula_dependiente: mapa.cedulaDep!==undefined ? (String(f[mapa.cedulaDep]||'').trim() || null) : null,
          tiene_copia_cedula: mapa.copiaCedula!==undefined ? esSiNo(f[mapa.copiaCedula]) : false,
          tiene_acta_nacimiento: mapa.actaNac!==undefined ? esSiNo(f[mapa.actaNac]) : false,
          tiene_certificacion_estudio: mapa.certEstudio!==undefined ? esSiNo(f[mapa.certEstudio]) : false,
          tiene_formulario_descuento: mapa.formDescuento!==undefined ? esSiNo(f[mapa.formDescuento]) : false,
          estado,
          observaciones: mapa.observaciones!==undefined ? (String(f[mapa.observaciones]||'').trim() || null) : null,
        });
        if(errSeg) throw errSeg;
        creados++;
      }catch(errFila){
        errores++;
        detalleErrores.push(`Fila con cédula "${f[mapa.cedula]||'?'}": ${errFila.message}`);
      }
    }

    document.getElementById('seg-import-resumen-preview').innerHTML = `
      <div class="texto-ayuda" style="margin-top:10px;">
        <strong>${registros.length}</strong> filas procesadas ·
        <span style="color:var(--verde-600);font-weight:600;">${creados} creadas</span>
        ${errores ? `· <span style="color:var(--rojo-600);font-weight:600;">${errores} con error</span>` : ''}
        ${detalleErrores.length ? `<br><span style="color:var(--rojo-600);">${detalleErrores.slice(0,5).join('<br>')}</span>` : ''}
      </div>`;

    if(creados){
      toast(`${creados} solicitud(es) importada(s) correctamente.`,'exito');
      renderSegurosSalud();
    } else {
      toast('No se pudo importar ninguna solicitud. Revisa los errores.','error');
    }
  }catch(err){
    toast(err.message,'error');
  }finally{
    btn.disabled = false;
    btn.textContent = 'Importar';
  }
}

async function cambiarEstadoSeguro(id){
  const opciones = ['solicitado','depositado_nomina','aprobado','rechazado'];
  const etiquetas = {solicitado:'Solicitado',depositado_nomina:'Depositado en nómina',aprobado:'Aprobado',rechazado:'Rechazado'};
  const s = (window._segurosData||[]).find(x=>x.id===id);
  if(!s) return;
  const idxActual = opciones.indexOf(s.estado);
  const elegido = prompt('Nuevo estado:\n'+opciones.map((o,i)=>`${i+1}. ${etiquetas[o]}`).join('\n'), String(idxActual+1));
  const idx = parseInt(elegido)-1;
  if(isNaN(idx) || !opciones[idx]) return;
  const { error } = await sb.from('seguros_salud_rh').update({ estado: opciones[idx] }).eq('id', id);
  if(error){ toast(error.message,'error'); return; }
  toast('Estado actualizado.','exito');
  renderSegurosSalud();
}

function generarTextoCertificacionLaboral({ personalNombre, personalCedula, cargo, salario, periodoDesde, periodoHasta, fechaEmision }){
  const fechaTexto = new Date(fechaEmision+'T00:00:00').toLocaleDateString('es-DO',{day:'2-digit',month:'long',year:'numeric'});
  const desde = periodoDesde ? new Date(periodoDesde+'T00:00:00').toLocaleDateString('es-DO',{day:'2-digit',month:'long',year:'numeric'}) : '________';
  const hasta = periodoHasta ? new Date(periodoHasta+'T00:00:00').toLocaleDateString('es-DO',{day:'2-digit',month:'long',year:'numeric'}) : 'la fecha';
  const salarioTexto = salario ? `RD$${salario} mensuales` : '________________';

  let tiempoServicio = '';
  if(periodoDesde){
    const fechaHastaCalculo = periodoHasta || new Date().toISOString().slice(0,10);
    const ini = new Date(periodoDesde+'T00:00:00');
    const fin = new Date(fechaHastaCalculo+'T00:00:00');
    let anios = fin.getFullYear() - ini.getFullYear();
    let meses = fin.getMonth() - ini.getMonth();
    if(fin.getDate() < ini.getDate()) meses--;
    if(meses < 0){ anios--; meses += 12; }
    anios = Math.max(anios, 0); meses = Math.max(meses, 0);
    const partes = [];
    if(anios) partes.push(`${anios} año${anios===1?'':'s'}`);
    if(meses || !anios) partes.push(`${meses} mes${meses===1?'':'es'}`);
    tiempoServicio = ` (${partes.join(' y ')})`;
  }

  const fechaEmisionObj = new Date(fechaEmision+'T00:00:00');
  const diaEmision = fechaEmisionObj.getDate();
  const mesEmision = fechaEmisionObj.toLocaleDateString('es-DO',{month:'long'});
  const anioEmision = fechaEmisionObj.getFullYear();

  return `DISTRITO EDUCATIVO 16-06, BONAO NORDESTE.\nC. / 16 de Agosto, esq. Luperón, 809-296-2126.\n\n`+
`${fechaTexto}.\nBonao, R. D.\n\nA QUIEN PUEDA INTERESAR:\n\n`+
`Quien suscribe, Emeterio Beltré Tineo M.A., Director del Distrito Educativo 16-06, Bonao Nordeste, `+
`hace constar por medio de la presente que el/la señor(a) ${personalNombre}, portador(a) de la cédula de `+
`identidad y electoral No. ${personalCedula}, ha prestado/presta sus servicios en esta institución desde el ${desde} `+
`hasta ${hasta}${tiempoServicio}, desempeñando el cargo de ${cargo}, devengando un salario de ${salarioTexto}.\n\n`+
`La presente certificación se expide a solicitud de la parte interesada, para los fines que estime convenientes, `+
`a los ${diaEmision} días del mes de ${mesEmision} del año ${anioEmision}, en la Provincia Monseñor Nouel.\n\n`+
`Muy atentamente,\n\n\nEmeterio Beltré Tineo M.A.\nDirector Distrital 16-06, Bonao Nordeste`;
}

    <tr>
      <td><input type="checkbox" class="chk-cl" value="${c.id}"></td>
      <td>${escapeHtml((c.personal_rh?.nombres||'')+' '+(c.personal_rh?.apellidos||''))}</td>
      <td>${fechaCorta(c.periodo_desde)} – ${c.periodo_hasta?fechaCorta(c.periodo_hasta):'actual'}</td>

function filtrarCertLab(){
  const texto = document.getElementById('filtro-cl-texto').value.toLowerCase();
  const estado = document.getElementById('filtro-cl-estado').value;
  const terceros = document.getElementById('filtro-cl-terceros').value;
  const filtrado = (window._certLaboralData||[]).filter(c=>{
    const nombre = ((c.personal_rh?.nombres||'')+' '+(c.personal_rh?.apellidos||'')+' '+(c.personal_rh?.cedula||'')).toLowerCase();
    if(texto && !nombre.includes(texto)) return false;
    if(estado && c.estado !== estado) return false;
    if(terceros==='si' && !c.solicitado_por_terceros) return false;
    if(terceros==='no' && c.solicitado_por_terceros) return false;
    return true;
  });
  pintarTablaCertLab(filtrado);
}

function actualizarPreviewCL(){

async function guardarCertLab(imprimir){
  if(!bloquearGuardado('cl')) return;
  try{
  const personalId = document.getElementById('cl-personal-id').value;
  if(!personalId){ toast('Selecciona el empleado.','error'); return; }

  const { data: p, error: errP } = await sb.from('personal_rh').select('*').eq('id', personalId).single();
  if(errP){ toast(errP.message,'error'); return; }

  const fechaEmision = document.getElementById('cl-fecha-emision').value || new Date().toISOString().slice(0,10);
  const periodoDesde = document.getElementById('cl-periodo-desde').value || null;
  const periodoHasta = document.getElementById('cl-periodo-hasta').value || null;
  const cargo = document.getElementById('cl-cargo').value.trim() || p.cargo_actual || '';
  const salario = document.getElementById('cl-salario').value.trim();

  const texto = generarTextoCertificacionLaboral({
    personalNombre: p.nombres+' '+p.apellidos, personalCedula: p.cedula, cargo, salario,
    periodoDesde, periodoHasta, fechaEmision,
  });

  const payload = {
    personal_id: personalId,
    fecha_emision: fechaEmision, periodo_desde: periodoDesde, periodo_hasta: periodoHasta,
    cargo_certificado: cargo,
    salario_certificado: salario || null,
    motivo: document.getElementById('cl-motivo').value.trim() || null,
    solicitado_por_terceros: document.getElementById('cl-terceros').checked,
    tiene_poder_notarial: document.getElementById('cl-poder-notarial').checked,
    texto_generado: texto,
  };
  const { error } = await sb.from('certificaciones_laborales_rh').insert(payload);
  if(error){ toast(error.message,'error'); return; }
  toast('Certificación laboral generada.','exito');
  cerrarModal('modal-cert-laboral');
  renderCertificacionesLaborales();
  if(imprimir){
    window._clActual = { texto_generado: texto };
    imprimirCLActual();
  }
  }finally{ desbloquearGuardado('cl'); }
}

async function procesarImportacionCL(){
  const archivo = document.getElementById('cl-import-archivo').files[0];
  if(!archivo){ toast('Selecciona el archivo.','error'); return; }

  const btn = document.getElementById('btn-importar-cl');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Procesando…';

  try{
    const filas = await leerArchivoNomina(archivo);
    if(!filas.length) throw new Error('El archivo no contiene filas de datos.');

    const patronesEncabezadoCL = [/cedula/, /fecha.*solicitud/, /emision/, /periodo.*desde/, /periodo.*hasta/,
      /cargo/, /motivo/, /terceros/, /poder.*notarial/, /estado/];
    const headerIdxCL = detectarFilaEncabezados(filas, patronesEncabezadoCL);
    const headers = filas[headerIdxCL];

    const norm = h => h.toString().toLowerCase().trim()
      .replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u');
    const mapa = {};
    headers.forEach((h,i)=>{
      const n = norm(h);
      if(/cedula/.test(n) && mapa.cedula===undefined) mapa.cedula = i;
      else if(/fecha.*solicitud/.test(n) && mapa.fechaSolicitud===undefined) mapa.fechaSolicitud = i;
      else if(/emision/.test(n) && mapa.fechaEmision===undefined) mapa.fechaEmision = i;
      else if(/periodo.*desde/.test(n) && mapa.periodoDesde===undefined) mapa.periodoDesde = i;
      else if(/periodo.*hasta/.test(n) && mapa.periodoHasta===undefined) mapa.periodoHasta = i;
      else if(/cargo/.test(n) && mapa.cargo===undefined) mapa.cargo = i;
      else if(/motivo/.test(n) && mapa.motivo===undefined) mapa.motivo = i;
      else if(/terceros/.test(n) && mapa.terceros===undefined) mapa.terceros = i;
      else if(/poder.*notarial/.test(n) && mapa.poder===undefined) mapa.poder = i;
      else if(/estado/.test(n) && mapa.estado===undefined) mapa.estado = i;
    });
    if(mapa.cedula===undefined){ throw new Error('No se pudo detectar la columna de cédula del empleado.'); }

    const registros = filas.slice(headerIdxCL+1).filter(f=>f[mapa.cedula] && String(f[mapa.cedula]).trim());
    if(!registros.length) throw new Error('No se encontraron filas válidas con cédula.');

    let creados = 0, errores = 0;
    const detalleErrores = [];
    const esSiNo = v => { const t = String(v||'').trim().toUpperCase(); return t==='SI'||t==='SÍ'||t==='YES'||t==='TRUE'; };
    const estadosValidos = ['solicitado','en_proceso','emitida','entregada','rechazada'];

    for(const f of registros){
      try{
        const cedula = String(f[mapa.cedula]).trim();
        const { data: persona } = await sb.from('personal_rh').select('id,nombres,apellidos,cedula,cargo_actual').eq('cedula', cedula).maybeSingle();
        if(!persona){ throw new Error('Empleado no encontrado en Personal. Impórtalo primero ahí.'); }

        let estado = mapa.estado!==undefined ? String(f[mapa.estado]||'').trim().toLowerCase() : '';
        if(!estadosValidos.includes(estado)) estado = 'solicitado';

        const fechaEmision = mapa.fechaEmision!==undefined ? (String(f[mapa.fechaEmision]||'').trim() || null) : null;
        const periodoDesde = mapa.periodoDesde!==undefined ? (String(f[mapa.periodoDesde]||'').trim() || null) : null;
        const periodoHasta = mapa.periodoHasta!==undefined ? (String(f[mapa.periodoHasta]||'').trim() || null) : null;
        const cargo = mapa.cargo!==undefined ? (String(f[mapa.cargo]||'').trim() || persona.cargo_actual || '') : (persona.cargo_actual || '');

        const texto = generarTextoCertificacionLaboral({
          personalNombre: persona.nombres+' '+persona.apellidos, personalCedula: persona.cedula, cargo,
          periodoDesde, periodoHasta, fechaEmision: fechaEmision || new Date().toISOString().slice(0,10),
        });

        const { error: errCL } = await sb.from('certificaciones_laborales_rh').insert({
          personal_id: persona.id,
          fecha_solicitud: mapa.fechaSolicitud!==undefined ? (String(f[mapa.fechaSolicitud]||'').trim() || new Date().toISOString().slice(0,10)) : new Date().toISOString().slice(0,10),
          fecha_emision: fechaEmision, periodo_desde: periodoDesde, periodo_hasta: periodoHasta,
          cargo_certificado: cargo,
          motivo: mapa.motivo!==undefined ? (String(f[mapa.motivo]||'').trim() || null) : null,
          solicitado_por_terceros: mapa.terceros!==undefined ? esSiNo(f[mapa.terceros]) : false,
          tiene_poder_notarial: mapa.poder!==undefined ? esSiNo(f[mapa.poder]) : false,
          estado, texto_generado: texto,
        });
        if(errCL) throw errCL;
        creados++;
      }catch(errFila){
        errores++;
        detalleErrores.push(`Fila con cédula "${f[mapa.cedula]||'?'}": ${errFila.message}`);
      }
    }

    document.getElementById('cl-import-resumen-preview').innerHTML = `
      <div class="texto-ayuda" style="margin-top:10px;">
        <strong>${registros.length}</strong> filas procesadas ·
        <span style="color:var(--verde-600);font-weight:600;">${creados} creadas</span>
        ${errores ? `· <span style="color:var(--rojo-600);font-weight:600;">${errores} con error</span>` : ''}
        ${detalleErrores.length ? `<br><span style="color:var(--rojo-600);">${detalleErrores.slice(0,5).join('<br>')}</span>` : ''}
      </div>`;

    if(creados){
      toast(`${creados} certificación(es) importada(s) correctamente.`,'exito');
      renderCertificacionesLaborales();
    } else {
      toast('No se pudo importar ninguna certificación. Revisa los errores.','error');
    }
  }catch(err){
    toast(err.message,'error');
  }finally{
    btn.disabled = false;
    btn.textContent = 'Importar';
  }
}

function imprimirCLActual(){
  const c = window._clActual;
  if(!c) return;
  const texto = c.texto_generado;
  const partes = texto.split('\n\n');
  const tituloInstitucional = partes[0] || '';
  const resto = partes.slice(1).join('\n\n');

  const marcaTitulo = 'A QUIEN PUEDA INTERESAR:';
  const marcaCierre = 'Muy atentamente,';
  const idxTitulo = resto.indexOf(marcaTitulo);
  const idxCierre = resto.indexOf(marcaCierre);
  let previo = resto, cuerpo = '', cierre = '';

async function cargarExpediente(){
  const personalId = document.getElementById('exp-personal-id').value;
  const cont = document.getElementById('exp-contenido');
  if(!personalId){ cont.innerHTML = ''; return; }

  cont.innerHTML = '<div class="vacio">Cargando expediente…</div>';

  const { data: p, error: errP } = await sb.from('personal_rh')
    .select('*, centros_rh(nombre_centro,codigo_sigerd)').eq('id', personalId).single();
  if(errP){ toast(errP.message,'error'); cont.innerHTML = ''; return; }

  // Trae todas las secciones en paralelo, cada una ordenada por la fecha más reciente disponible.
  const resultados = await Promise.all(SECCIONES_EXPEDIENTE.map(s=>
    sb.from(s.tabla).select('*').eq('personal_id', personalId).order('id',{ascending:false})
  ));

  window._expedienteActual = { personal:p, secciones:[] };

  const fichaHtml = `
    <div class="tarjeta" style="margin-bottom:16px;">
      <div class="tarjeta-body">
        <div class="grid-3">
          <div><div class="texto-ayuda">Nombre completo</div><strong>${escapeHtml(p.nombres+' '+p.apellidos)}</strong></div>
          <div><div class="texto-ayuda">Cédula</div><strong>${escapeHtml(p.cedula)}</strong></div>
          <div><div class="texto-ayuda">Estatus</div>${badgeEstado(p.estatus)}</div>
          <div><div class="texto-ayuda">Cargo actual</div><strong>${escapeHtml(p.cargo_actual||'—')}</strong></div>
          <div><div class="texto-ayuda">Centro</div><strong>${escapeHtml(p.centros_rh?.nombre_centro||'—')}</strong></div>
          <div><div class="texto-ayuda">Fecha de ingreso</div><strong>${fechaCorta(p.fecha_ingreso)}</strong></div>
        </div>
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">
      ${botonesExportar('exp')}
      <button class="btn btn-secundario btn-chico" onclick="window.print()">🖨 Imprimir expediente completo</button>
    </div>
  `;

  const seccionesHtml = SECCIONES_EXPEDIENTE.map((s,i)=>{
    const { data, error } = resultados[i];
    if(error){ return ''; }
    window._expedienteActual.secciones.push({ titulo:s.titulo, datos: data||[] });
    return `
      <div class="tarjeta" style="margin-bottom:14px;">
        <div class="tarjeta-header"><h3>${s.icono} ${s.titulo} (${data?.length||0})</h3></div>
        <div class="tarjeta-body tabla-wrap">
          ${ (data && data.length) ? `
          <table>
            <thead><tr>${s.columnas.map(c=>`<th>${escapeHtml(c.label)}</th>`).join('')}</tr></thead>
            <tbody>${data.map(r=>`<tr>${s.columnas.map(c=>`<td>${c.get(r)}</td>`).join('')}</tr>`).join('')}</tbody>
          </table>` : `<div class="vacio" style="padding:14px;">Sin registros en este módulo.</div>` }
        </div>
      </div>
    `;
  }).join('');

  cont.innerHTML = fichaHtml + seccionesHtml;
  registrarExportadoresExpediente(p);
}

// Exportación dedicada del expediente: a diferencia de los demás módulos
// (una tabla con columnas fijas), aquí cada sección tiene columnas propias,
// así que CSV/Excel exportan una hoja/bloque por sección, y PDF/Imprimir
// generan un documento único con todas las secciones en su formato real.
function registrarExportadoresExpediente(p){
  const nombreArchivo = `expediente_${p.cedula.replace(/[^0-9]/g,'')}`;
  const titulo = `Expediente — ${p.nombres} ${p.apellidos} (${p.cedula})`;

  function construirHtmlCompleto(){
    const secciones = window._expedienteActual.secciones;
    const bloques = secciones.map(s=>{
      if(!s.datos.length) return '';
      const seccionDef = SECCIONES_EXPEDIENTE.find(sd=>sd.titulo===s.titulo);
      const filas = s.datos.map(r=>`<tr>${seccionDef.columnas.map(c=>`<td>${c.get(r).replace(/<[^>]+>/g,'')}</td>`).join('')}</tr>`).join('');
      return `<h3 style="margin-top:18px;">${seccionDef.icono} ${s.titulo}</h3>
        <table><thead><tr>${seccionDef.columnas.map(c=>`<th>${escapeHtml(c.label)}</th>`).join('')}</tr></thead>
        <tbody>${filas}</tbody></table>`;
    }).join('');
    return `<h2>${escapeHtml(titulo)}</h2>${bloques || '<p>Sin registros en ningún módulo.</p>'}`;
  }

  window._exportHandlers['exp'] = {
    csv: ()=>{
      const secciones = window._expedienteActual.secciones;
      let csv = `"Expediente","${p.nombres} ${p.apellidos}","${p.cedula}"\n\n`;
      secciones.forEach(s=>{
        if(!s.datos.length) return;
        const seccionDef = SECCIONES_EXPEDIENTE.find(sd=>sd.titulo===s.titulo);
        csv += `"${s.titulo}"\n`;
        csv += seccionDef.columnas.map(c=>`"${c.label}"`).join(',')+'\n';
        s.datos.forEach(r=>{
          csv += seccionDef.columnas.map(c=>`"${c.get(r).replace(/<[^>]+>/g,'').replace(/"/g,'""')}"`).join(',')+'\n';
        });
        csv += '\n';
      });
      const blob = new Blob(['\uFEFF'+csv], { type:'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = `${nombreArchivo}.csv`;
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    },
    xlsx: ()=>{
      if(typeof XLSX === 'undefined'){ toast('No se pudo generar el Excel.','error'); return; }
      const wb = XLSX.utils.book_new();
      const secciones = window._expedienteActual.secciones;
      let alMenosUna = false;
      secciones.forEach(s=>{
        if(!s.datos.length) return;
        alMenosUna = true;
        const seccionDef = SECCIONES_EXPEDIENTE.find(sd=>sd.titulo===s.titulo);
        const filas = s.datos.map(r=>{
          const obj = {};
          seccionDef.columnas.forEach(c=>{ obj[c.label] = c.get(r).replace(/<[^>]+>/g,''); });
          return obj;
        });
        const ws = XLSX.utils.json_to_sheet(filas);
        XLSX.utils.book_append_sheet(wb, ws, s.titulo.slice(0,31));
      });
      if(!alMenosUna){ toast('No hay datos para exportar.','error'); return; }
      XLSX.writeFile(wb, `${nombreArchivo}.xlsx`);
    },
    pdf: ()=>{
      const w = window.open('', '_blank');
      w.document.write(`<html><head><meta charset="UTF-8"><title>${escapeHtml(titulo)}</title>
        <style>body{font-family:Arial,sans-serif;font-size:12px;padding:24px;}
        h2{font-size:16px;}h3{font-size:13px;color:#1f3864;}
        table{width:100%;border-collapse:collapse;margin-bottom:10px;}
        th,td{border:1px solid #999;padding:4px 7px;text-align:left;}th{background:#eef2f7;}
        </style></head><body>${construirHtmlCompleto()}</body></html>`);
      w.document.close();
      setTimeout(()=>w.print(), 400);
    },
    imprimir: ()=>{
      const w = window.open('', '_blank');
      w.document.write(`<html><head><meta charset="UTF-8"><title>${escapeHtml(titulo)}</title>
        <style>body{font-family:Arial,sans-serif;font-size:12px;padding:24px;}
        h2{font-size:16px;}h3{font-size:13px;color:#1f3864;}
        table{width:100%;border-collapse:collapse;margin-bottom:10px;}
        th,td{border:1px solid #999;padding:4px 7px;text-align:left;}th{background:#eef2f7;}
        </style></head><body>${construirHtmlCompleto()}</body></html>`);
      w.document.close();
      setTimeout(()=>w.print(), 400);
    },
  };
}
